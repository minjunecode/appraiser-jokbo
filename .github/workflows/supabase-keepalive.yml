# Supabase 무료 플랜 자동 일시정지(7일 비활성) 방지용 keep-alive.
# 3일마다 두 프로젝트(감정평가사 + 대사내분비) REST 에 가벼운 쿼리를 보내 활동 타이머를 리셋한다.
# anon key 는 이미 공개 사이트(index.html)에 임베드된 공개키라 여기 노출돼도 동일.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # 3일마다 06:00 UTC (7일 한참 이내)
  workflow_dispatch: {}      # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping appraiser Supabase (정아라 감정평가사)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://arcpfgeqtvxsfgectacf.supabase.co/rest/v1/progress?select=uname&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyY3BmZ2VxdHZ4c2ZnZWN0YWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjI2MzAsImV4cCI6MjA5NjU5ODYzMH0.B7eQnflBBFMmgZ4-IVRWrJQStIf6l7NaEqjFMGY8Ork" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyY3BmZ2VxdHZ4c2ZnZWN0YWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjI2MzAsImV4cCI6MjA5NjU5ODYzMH0.B7eQnflBBFMmgZ4-IVRWrJQStIf6l7NaEqjFMGY8Ork")
          echo "appraiser progress -> HTTP $code"
          test "$code" = "200"
      - name: Ping endo Supabase (구민준 대사내분비)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://gmdlzrgobwtzycnhcsug.supabase.co/rest/v1/progress?select=uname&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZGx6cmdvYnd0enljbmhjc3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzcxNzgsImV4cCI6MjA5NjQ1MzE3OH0.PZg-PuRHYvQesRV-mDwGAvCCWqQeb2Ji2xrc2I_AXuc" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZGx6cmdvYnd0enljbmhjc3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzcxNzgsImV4cCI6MjA5NjQ1MzE3OH0.PZg-PuRHYvQesRV-mDwGAvCCWqQeb2Ji2xrc2I_AXuc")
          echo "endo progress -> HTTP $code"
          test "$code" = "200"
