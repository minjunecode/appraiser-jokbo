 용도\n2) 산업용 : 제조업의 제조공정용 원료 또는 연료(제조부대시설의 운영에 필요한 연료를 포함한다)로 사용하는 용도\n3) 열병합용 : 전기와 열을 함께 생산하는 용도\n4) 열 전용( 專用) 설비용 : 열만을 생산하는 용도\n6의2. 수도공급설비 중 ｢수도법｣ 제3조 제9호의 마을상수도 ｢ ｣\n7. 유류저장 및 송유설비 중 위험물안전관리법 제6조에 따른 제조소등의 설치허가를 ｢ ｣ 받은 자가 위험물안전관리법 시행령 별표 1에 따른 인화성액체 중 유류를 저장하기 위하여 설치하는 유류저장시설\n8. 다음 각 목의 학교 ｢ ｣\n가. 유아교육법 제2조 제2호에 따른 유치원\n나. ｢장애인 등에 대한 특수교육법｣ 제2조 제10호에 따른 특수학교\n다. ｢초⋅중등교육법｣ 제60조의3에 따른 대안학교\n라. ｢고등교육법｣ 제2조 제5호에 따른 방송대학⋅통신대학 및 방송통신대학\n9. 삭제 <2018.12.27.>\n10. 다음 각 목의 어느 하나에 해당하는 도축장\n가. 대지면적이 500제곱미터 미만인 도축장 ｢ ｣\n나. 산업입지 및 개발에 관한 법률 제2조 제8호에 따른 산업단지 내에 설치하는 도축장\n11. 폐기물처리 및 재활용시설 중 재활용시설 ｢ ｣\n12. 수질오염방지시설 중 광산피해의 방지 및 복구에 관한 법률 제31조(2021.3.9. 삭 제)에 따른 한국광해관리공단이 같은 법 제11조에 따른 광해방지사업의 일환으로 폐 ｢ ｣ 광의 폐수를 처리하기 위하여 설치하는 시설( 건축법 제11조에 따른 건축허가를 받 아 건축하여야 하는 시설은 제외한다)\n2. 도시지역 및 지구단위계획구역외의 지역에서 다음 각목의 기반시설을 설치하고자 하는 경우\n가. 상기 제1 ʻ가ʼ 및 ʻ나ʼ의 기반시설\n나. 궤도 및 전기공급설비\n다. 그 밖에 국토교통부령이 정하는 시설\n1. 삭제 <2018.12.27.>\n2. 자동차정류장\n3. 광장\n4. 유류저장 및 송유설비\n⋅ ⋅ ⋅\n5. 제1 ʻ다ʼ 중 제1호 제6호 제6호의2 제8호부터 제12호까지의 시설", "2025-36-감정평가관계법규-6": "광역도시계획이 우선한다.\n② 제19조 제8의2 도시군기본계획의 내용\n③ 19조의2 제3항\n④ 토지적성평가 및 재해취약분석의 생략이 가능한 경우 - 도시군기본계획 입안일부터 5년 이내에 실시한 경우 - 다른 법률에 따른 지역/지구 등의 지정이나 개발계획 수립 등으로 도시군기본계획의 변경 이 필요한 경우\n⑤ 시 또는 군의 위치, 인구의 규모, 인구감소율 등 고려하여 수립하지 않을 수 있는 경우 - 수도권(서울/경기/인천) 아니고 & 광역시 경계 연접 안 된 시 또는 군 & 인구 10만 이하 시 또는 군 -관할구역 전부에 광역도시계획(도시군기본계획 반영사항 모두 포함) 수립된 시 또는 군", "2025-36-감정평가관계법규-7": "복합용도지구는 주거지역(일반), 공업지역(일반), 관리지역(계획)에 지정가능하다(법 제 37조 제5항).", "2025-36-감정평가관계법규-8": "시행령 제46조 제7항의 내용이다.\n① (제51조 제1항 제8호). 개발제한구역ㆍ도시자연공원구역ㆍ시가화조정구역 또는 공원에서 해제되는 구역, 녹지지역에서 주거ㆍ상업ㆍ공업지역으로 변경되는 구역과 새로 도시지역으로 편입되는 구역 중 계획적인 개발 또는 관리가 필요한 지역은 지구단위계획구역으로 지정할 수 있다\n② 100퍼센트 완화할 수 있다.\n④ 해당 내용만 실효된다.\n⑤ 도시·군관리계획의 내용이므로 도시·군관리계획으로 결정한다.", "2025-36-감정평가관계법규-9": "75조의4\n① 녹지지역, 관리지역, 농림지역 및 자연환경보전지역 중 지정할 수 있다(제75조의2 제1항)\n② 성장관리계획구역에서는 계획관리지역은 50퍼센트 이하, 생산관리지역ㆍ농림지역 및 녹지 지역(생산 및 자연녹지)은 30퍼센트 이하의 범위에서 조례로 정하는 비율까지 건폐율을 완화 하여 적용할 수 있다(75조의3 제2항).\n④ 성장관리계획구역의 면적을 10퍼센트 이내에서 변경하는 경우(둘 이상 읍면동에 걸친 경우 는 각 읍면동 지역 면적을 각각 10퍼센트 이내에서 변경하는 경우로 한정한다)에는 생략가능 하다.\n⑤ 14일 이상 일반인이 열람할 수 있게 해야 한다", "2025-36-감정평가관계법규-10": "200제곱미터(기존 건축물의 연면적 포함)를 초과하는 건축물이 부과대상이다.", "2025-36-감정평가관계법규-11": "자연취락지구에 대한 지원으로 시행하거나 지원할 수 있는 사업(제105조)\n가. 자연취락지구 안에 있거나 자연취락지구에 연결되는 도로·수도공급설비·하수도 등의 정비\n나. 어린이놀이터⋅공원⋅녹지⋅주차장⋅학교⋅마을회관 등의 설치⋅정비\n다. 쓰레기처리장⋅하수처리시설 등의 설치⋅개량\n라. 하천정비 등 재해방지를 위한 시설의 설치⋅개량\n마. 주택의 신축⋅개량", "2025-36-감정평가관계법규-12": "시범도시사업계획에는 다음 각 사항이 포함되어야 한다(시행령 제128조 제2항).\n1. 시범도시사업의 목표⋅전략⋅특화발전계획 및 추진체제에 관한 사항\n2. 시범도시사업의 시행에 필요한 도시⋅군계획 등 관련계획의 조정⋅정비에 관한 사항\n3. 시범도시사업의 시행에 필요한 도시⋅군계획사업에 관한 사항\n4. 시범도시사업의 시행에 필요한 재원조달에 관한 사항\n4의2. 주민참여 등 지역사회와의 협력체계에 관한 사항\n5. 그 밖에 시범도시사업의 원활한 시행을 위하여 필요한 사항", "2025-36-감정평가관계법규-13": "토지 이용에 관한 구역 등의 지정⋅변경 및 용도지역 등의 변경계획에 관한 사항은 중앙도시계획위원회의 분과위원회의 심의사항이다(109조).", "2025-36-감정평가관계법규-14": "용도구역이 아닌 용도지역(8조 제2항).", "2025-36-감정평가관계법규-15": "검증생략(개발사업 시행, 용도지역/지구 변경 시는 생략 불가) 시 개별토지 지변률과 읍면동 연평균 지변률 간의 차이가 작은 순으로 선정한다.", "2025-36-감정평가관계법규-16": "개별주택가격의 공시사항은 “① 조사기준일 및 개별주택가격의 열람방법 등 개별주택 가격의 결정에 관한 사항, ② 이의신청의 기간/절차 및 방법”임(시행령 제38조 제2항).\n① 17조 제1항\n② 17조 제2항\n④ 19조 제2항\n⑤ 시행령 제31조 제3항", "2025-36-감정평가관계법규-17": "법 제32조에서는 인가취소 기속사항으로 “감정평가법인이 업무정지기간 중에 업무를 수행하거나, 최소구성인원을 갖추지 못하여 감정평가사의 수에 미달한 날부터 3개월 이내에 감정평가사를 보충하지 아니한 경우”를 규정하고 있다. “ㄱ”은 업무정지기간 중에 업무를 수 행한 경우에 해당한다.", "2025-36-감정평가관계법규-18": "원본은 5년이상, 관련서류는 2년 이상 보관하여야 한다.", "2025-36-감정평가관계법규-19": "공제사업은 감정평가사가 아닌 감정평가법인등이 가입하게 된다.", "2025-36-감정평가관계법규-20": "조건이 붙은 경우는 받아서는 안되난 무상사용 조건은 조건으로 보지 않으므로 기부 받을 수 있다.\n② 시행령 제4조의3 제4조의3(행정재산 관리ㆍ처분의 사무 위임)\n① 총괄청은 법 제8조제6항에 따라 다음 각 호의 사무를 중앙관서의 장에게 위임한다.\n1. 법 제13조의 기부채납에 따른 재산의 취득에 관한 사무\n2. 행정재산(공용재산 중 법 제5조제1항제1호에 따른 재산은 제외한다)의 매입 등에 따른 취득에 관한 사무\n3. 「국방ㆍ군사시설 사업에 관한 법률」 제2조제1호에 따른 국방ㆍ군사시설의 취득에 관한 사무\n4. 행정재산의 관리(취득에 관한 사무는 제외한다)에 관한 사무\n5. 용도가 폐지된 행정재산(법 제5조제1항제1호에 따른 재산은 제외한다)의 처분에 관한 사무\n6. 그 밖에 총괄청이 행정재산의 효율적인 관리ㆍ처분을 위하여 필요하다고 인정하여 지정 하는 사무\n② 중앙관서의 장이 제1항제1호부터 제3호까지의 규정에 따라 취득하는 행정재산의 사용 에 대해서는 법 제8조제4항에 따른 승인을 받은 것으로 본다.\n③ 7조 제2항\n④ 8조의2(철회사유 : 다른 국가기관의 행정목적을 달성하기 위하여 우선적으로 필요한 경우, 보고나 감사 결과 위법하거나 부당한 재산관리가 인정되는 경우, 감사원의 감사 결과 위법하 거나 부당한 재산관리가 인정되는 등 사용 승인의 철회가 불가피하다고 인정되는 경우)\n⑤ 13조", "2025-36-감정평가관계법규-21": "20년을 넘을 수 없다.\n① 시행령 제29조 제7항\n② 시행령 제27조 제2항 행정재산이 다음 어느 하나에 해당하는 경우에는 제한경쟁이나 지명경쟁의 방법으로 사용 허가를 받을 자를 결정할 수 있다.\n1. 토지의 용도 등을 고려할 때 해당 재산에 인접한 토지의 소유자를 지명하여 경쟁에 부 칠 필요가 있는 경우\n1의2. 수의방법에 따른 사용허가의 신청이 경합하는 경우\n2. 그 밖에 재산의 위치ㆍ형태ㆍ용도 등이나 계약의 목적ㆍ성질 등으로 보아 사용허가 받 는 자의 자격을 제한하거나 지명할 필요가 있는 경우\n③ 30조 제1항 제1호\n⑤ 36조 제1항 제3호 제36조(사용허가의 취소와 철회)\n① 중앙관서의 장은 행정재산의 사용허가를 받은 자가 다음 어느 하나에 해당하면 그 허 가를 취소하거나 철회할 수 있다.\n1. 거짓 진술을 하거나 부실한 증명서류를 제시하거나 그 밖에 부정한 방법으로 사용허가 를 받은 경우\n2. 사용허가 받은 재산을 제30조제2항을 위반하여 다른 사람에게 사용ㆍ수익하게 한 경우\n3. 해당 재산의 보존을 게을리하였거나 그 사용목적을 위배한 경우\n4. 납부기한까지 사용료를 납부하지 아니하거나 제32조제2항 후단에 따른 보증금 예치나 이행보증조치를 하지 아니한 경우\n5. 중앙관서의 장의 승인 없이 사용허가를 받은 재산의 원래 상태를 변경한 경우", "2025-36-감정평가관계법규-22": "개발된 일반재산의 대부기간은 30년 이내로 할 수 있으며, 20년의 범위에서 한 차례 만 연장할 수 있다(46조 제4항).", "2025-36-감정평가관계법규-23": "73조의3 소멸시효는 납부고지, 독촉, 교부청구, 압류에 의하여 중단된다.", "2025-36-감정평가관계법규-24": "ʻʻ다중이용 건축물ʼʼ이란 다음 어느 하나에 해당하는 건축물을 말한다.\n가. 다음의 어느 하나에 해당하는 용도로 쓰는 바닥면적의 합계가 5천제곱미터 이상인 건축물\n1) 문화 및 집회시설(동물원 및 식물원은 제외한다)\n2) 종교시설\n3) 판매시설\n4) 운수시설 중 여객용 시설\n5) 의료시설 중 종합병원\n6) 숙박시설 중 관광숙박시설\n나. 16층 이상인 건축물", "2025-36-감정평가관계법규-25": "공공업무시설은 해당되지 않는다.\n* 위락시설과 숙박시설 등 대통령령으로 정하는 용도에 해당하는 건축물\n1. 공동주택\n2. 제2종 근린생활시설(일반음식점만 해당한다)\n3. 업무시설(일반업무시설만 해당한다)\n4. 숙박시설\n5. 위락시설", "2025-36-감정평가관계법규-26": "국방⋅군사시설은 주거업무시설에 해당된다. 시설군 용도분류\n1. 자동차 관련 시설군 자동차 관련 시설 운수시설, 창고시설, 공장, 위험물저장 및 처리시설, 자원순환 관련 시설, 묘지 관\n2. 산업 등 시설군 련 시설, 장례시설\n3. 전기통신시설군 방송통신시설, 발전시설\n4. 문화집회시설군 문화 및 집회시설, 종교시설, 위락시설, 관광휴게시설\n5. 영업시설군 판매시설, 운동시설, 숙박시설, 제2종 근린생활시설 중 다중생활시설\n6. 교육 및 복지시설군 의료시설, 교육연구시설, 노유자시설( 老幼者施設), 수련시설, 야영장 시설\n7. 근린생활시설군 제1종 근린생활시설, 제2종 근린생활시설(다중생활시설은 제외한다)\n8. 주거업무시설군 ⋅ 단독주택, 공동주택, 업무시설, 교정시설, 국방 군사시설\n9. 그 밖의 시설군 동물 및 식물 관련 시설", "2025-36-감정평가관계법규-27": "공개공지 설치 지역은 “① 일반주거지역, 준주거지역, ② 상업지역, ③ 준공업지역,\n④ 특별자치시장⋅특별자치도지사 또는 시장⋅군수⋅구청장이 도시화의 가능성이 크거나 노후 산업단지의 정비가 필요하다고 인정하여 지정⋅공고하는 지역”을 대상으로 한다.", "2025-36-감정평가관계법규-28": "시행령 제55조 제55조(지상 경계의 결정기준 등)\n① 법 제65조제1항에 따른 지상 경계의 결정기준은 다음 각 호의 구분에 따른다.\n1. 연접되는 토지 간에 높낮이 차이가 없는 경우: 그 구조물 등의 중앙\n2. 연접되는 토지 간에 높낮이 차이가 있는 경우: 그 구조물 등의 하단부\n3. 도로ㆍ구거 등의 토지에 절토(땅깎기)된 부분이 있는 경우: 그 경사면의 상단부\n4. 토지가 해면 또는 수면에 접하는 경우: 최대만조위 또는 최대만수위가 되는 선\n5. 공유수면매립지의 토지 중 제방 등을 토지에 편입하여 등록하는 경우: 바깥쪽 어깨부분", "2025-36-감정평가관계법규-29": "하천 - “천”", "2025-36-감정평가관계법규-30": "제73조(경계점좌표등록부의 등록사항) : 토지의 소재, 지번, 좌표, 토지의 고유번호, 지적도면의 번호, 필지별 경계점좌표등록부의 장번호, 부호 및 부호도", "2025-36-감정평가관계법규-32": "대법원장은 어느 등기소의 관할에 속하는 사무를 다른 등기소에 위임하게 할 수 있다 (제8조).\n② 관할 등기소가 다른 여러 개의 부동산과 관련하여 등기목적과 등기원인이 동일하거나 그 밖에 대법원규칙으로 정하는 등기신청이 있는 경우에는 그 중 하나의 관할 등기소에서 해당 신청에 따른 등기사무를 담당할 수 있다(제7조의2 제1항).\n③ 상속 또는 유증으로 인한 등기신청의 경우에는 부동산의 관할 등기소가 아닌 등기소도 그 신청에 따른 등기사무를 담당할 수 있다(제7조의3 제1항).\n④ 29조(신청의 각하)\n⑤ 부동산이 여러 등기소의 관할구역에 걸쳐 있을 때에는 대법원규칙으로 정하는 바에 따라 각 등기소를 관할하는 상급법원의 장이 관할 등기소를 지정한다(제7조 제2항).", "2025-36-감정평가관계법규-33": "종중(宗中), 문중(門中), 그 밖에 대표자나 관리인이 있는 법인 아닌 사단(社團)이나 재단(財團)에 속하는 부동산의 등기에 관하여는 그 사단이나 재단을 등기권리자 또는 등기의 무자로 한다(제26조 제1항). 등기는 그 사단이나 재단의 명의로 그 대표자나 관리인이 신청한 다(제2랑).\n① 23조 제2항\n② 23조 제4항\n③ 89조\n④ 28조 제1항", "2025-36-감정평가관계법규-34": "합유인 경우 합유인 뜻을 기록해야 한다(84조 제1항).", "2025-36-감정평가관계법규-35": "105조 1항\n① 관할 지방법원은 이의신청에 대하여 결정하기 전에 등기관에게 가등기 또는 이의가 있다는 뜻의 부기등기를 명령할 수 있다(106조).\n② 새로운 사실이나 새로운 증거방법을 근거로 이의신청을 할 수는 없다(102조).\n③ 이유 없다고 인정하면 3일 이내에 의견을 붙여 지방법원에 보내야 한다(103조 제2항).\n④ 이의에는 집행정지(執行停止)의 효력이 없다(104조).", "2025-36-감정평가관계법규-36": "27조 제3항 조문의 내용이다.\n① 담보권설정자의 사업자등록이 말소된 경우에도 이미 설정된 동산담보권의 효력에는 영향을 미치지 아니한다(4조)\n③ 압류 후에는 수취한 과실에 미친다.\n④ 동산담보권은 피담보채권과 분리하여 타인에게 양도할 수 없다(12조)\n⑤ 담보권자는 동산담보권을 방해하는 자에게 방해의 제거를 청구할 수 있고, 동산담보권을 방해할 우려가 있는 행위를 하는 자에게 방해의 예방이나 손해배상의 담보를 청구할 수 있다 (20조)", "2025-36-감정평가관계법규-37": "축물이 아닌 부대시설⋅복시설의 설치규모를 확대하는 때에는 위치가 변경되는 경우는 제외된\n다.\n* 대통령령으로 정하는 경미한 사항을 변경하려는 때\n1. 정비사업비를 10퍼센트의 범위에서 변경하거나 관리처분계획의 인가에 따라 변경하는 ｢ ｣ ｢ 때. 다만, 주택법 제2조 제5호에 따른 국민주택을 건설하는 사업인 경우에는 주택도시기 ｣ 금법 에 따른 주택도시기금의 지원금액이 증가되지 아니하는 경우만 해당한다.\n2. 건축물이 아닌 부대시설⋅복시설의 설치규모를 확대하는 때(위치가 변경되는 경우는 제외한 다)\n3. 대지면적을 10퍼센트의 범위에서 변경하는 때\n4. 세대수와 세대당 주거전용면적을 변경하지 않고 세대당 주거전용면적의 10퍼센트의 범위에 서 세대 내부구조의 위치 또는 면적을 변경하는 때\n5. 내장재료 또는 외장재료를 변경하는 때\n6. 사업시행계획인가의 조건으로 부과된 사항의 이행에 따라 변경하는 때\n7. 건축물의 설계와 용도별 위치를 변경하지 아니하는 범위에서 건축물의 배치 및 주택단지 안 의 도로선형을 변경하는 때 ｢ ｣\n8. 건축법 시행령 제12조 제3항 각 호의 어느 하나에 해당하는 사항을 변경하는 때\n9. 사업시행자의 명칭 또는 사무소 소재지를 변경하는 때\n10. 정비구역 또는 정비계획의 변경에 따라 사업시행계획서를 변경하는 때\n11. 법 제35조 제5항 본문에 따른 조합설립변경 인가에 따라 사업시행계획서를 변경하는 때\n11의2. 계산 착오, 오기, 누락이나 이에 준하는 명백한 오류에 해당하는 사항을 정정하는 때\n11의3. 사업시행기간을 단축하거나 연장하는 때. 다만, 법 제73조제1항 각 호에 해당하는 자가(분양대상자가 아닌 경우) 소유하는 토지 또는 건축물(토지 또는 건 축물의 소유자가 국가나 지방자치단체인 경우는 제외한다)의 취득이 완료되기 전 에 사업시행기간을 연장하는 때는 제외한다.\n⋅\n12. 그 밖에 시 도조례로 정하는 사항을 변경하는 때", "2025-36-감정평가관계법규-38": "관리처분계획인가의 고시가 있은 때에는 제86조에 따른 이전고시가 있는 날까지 종전 의 토지 또는 건축물을 사용하거나 수익할 수 없다(81조 제1항)\n① 사업시행자는 분양신청을 받은 후 잔여분이 있는 경우에는 정관등 또는 사업시행계획으로 정하는 목적을 위하여 그 잔여분을 보류지(건축물을 포함한다)로 정하거나 조합원 또는 토지 등소유자 이외의 자에게 분양할 수 있다. 이 경우 분양공고와 분양신청절차 등에 필요한 사항 은 대통령령으로 정한다(79조 제4항).\n② 79조 제2항\n③ 시장ㆍ군수등은 사업시행자의 관리처분계획인가의 신청이 있은 날부터 30일 이내에 인가 여부를 결정하여 사업시행자에게 통보하여야 한다. 다만, 시장ㆍ군수등은 제3항에 따라 관리 처분계획의 타당성 검증을 요청하는 경우에는 관리처분계획인가의 신청을 받은 날부터 60일 이내에 인가 여부를 결정하여 사업시행자에게 통지하여야 한다(78조 제2항).\n④ 73조 제2항", "2025-36-감정평가관계법규-39": "① 공유하는 경우에는 가장 많은 지분을 소유한 자가 임원이 될 수 있다(41조 제1항)\n③ 조합임원은 같은 목적의 정비사업을 하는 다른 조합의 임원 또는 직원을 겸할 수 없다(42 조 제4항).\n④ 시공자의 선정을 의결하는 총회의 경우에는 조합원의 과반수가 직접 출석하여야 하고, 창 립총회, 시공자 선정 취소를 위한 총회, 사업시행계획서의 작성 및 변경, 관리처분계획의 수립 및 변경을 의결하는 총회 등 대통령령으로 정하는 총회의 경우에는 조합원의 100분의 20 이 상이 직접 출석하여야 한다.\n⑤ 퇴임된 임원이 퇴임 전에 관여한 행위는 그 효력을 잃지 아니한다(43조 제3항).", "2025-36-감정평가관계법규-40": "‘ㄴ’은 기본계획에 포함되는 내용이다.\n*정비계획 포함내용\n1. 정비사업의 명칭\n2. 정비구역 및 그 면적\n2의2. 토지등소유자 유형별 분담금 추산액 및 산출근거\n3. 도시ㆍ군계획시설의 설치에 관한 계획\n4. 공동이용시설 설치계획\n5. 건축물의 주용도ㆍ건폐율ㆍ용적률ㆍ높이에 관한 계획\n6. 환경보전 및 재난방지에 관한 계획\n7. 정비구역 주변의 교육환경 보호에 관한 계획\n8. 세입자 주거대책\n9. 정비사업시행 예정시기\n10. 정비사업을 통하여 공공지원민간임대주택을 공급하거나 같은 조 제11호에 따른 주택 임대관리업자(이하 “주택임대관리업자”라 한다)에게 임대할 목적으로 주택을 위탁하려는 경우에는 다음 각 목의 사항. 다만, 나목과 다목의 사항은 건설하는 주택 전체 세대수에서 공공지원민간임대주택 또는 임대할 목적으로 주택임대관리업자에게 위탁하려는 주택(이하 “임대관리 위탁주택”이라 한다)이 차지하는 비율이 100분의 20 이상, 임대기간이 8년 이 상의 범위 등에서 대통령령으로 정하는 요건에 해당하는 경우로 한정한다.\n가. 공공지원민간임대주택 또는 임대관리 위탁주택에 관한 획지별 토지이용 계획\n나. 주거ㆍ상업ㆍ업무 등의 기능을 결합하는 등 복합적인 토지이용을 증진시키기 위하 여 필요한 건축물의 용도에 관한 계획\n다. 「국토의 계획 및 이용에 관한 법률」 제36조제1항제1호가목에 따른 주거지역을 세 분 또는 변경하는 계획과 용적률에 관한 사항\n라. 그 밖에 공공지원민간임대주택 또는 임대관리 위탁주택의 원활한 공급 등을 위하여 대통령령으로 정하는 사항\n11. 「국토의 계획 및 이용에 관한 법률」 제52조제1항 각 호의 사항에 관한 계획(필요한 경우로 한정한다)\n12. 그 밖에 정비사업의 시행을 위하여 필요한 사항으로서 대통령령으로 정하는 사항", "2026-37-감정평가관계법규-1": "① 도시ㆍ군계획시설 준공 후 10년이 경과한 경우로서 해당 시설의 개량 또는 정비가 필요한 경우에 지정할 수 있다.\n② 도시ㆍ군계획시설 및 그 외 시설에 대한 건축물, 시설의 용도ㆍ종류 및 규모, 건폐율, 용적 률, 높이 등은 따로 정할 수 있다. ㉠ 도시지역의 경우에는 도시지역에서 허용되는 범위, ㉡ 도시지역이 아닌 경우(관,농,자)에는 계획관리지역에서 허용되는 범위 내에서 가능하다.\n③ 채광 등의 확보를 위한 건축물의 높이 제한의 200퍼센트 이하의 범위\n④ 4/5이상의 동의\n⑤ 도시·군관리계획이 준용된다. 아래 경우에는 기초조사 생략이 가능하다.\n① 입안지역이 도심지에 위치(상업지역과 상업지역에 연접한 지역을 말함)\n② 개발이 끝나 나대지가 없음(나대지 면적이 구역 면적의 2%에 미달 시)", "2026-37-감정평가관계법규-2": "도시혁신구역, 복합용도구역, 도시ㆍ군계획시설입체복합구역", "2026-37-감정평가관계법규-3": "① 도시지역 축소에 따른 경우에는 생략가능(도시지역의 축소에 따른 용도지역ㆍ용도지구ㆍ용 도구역 또는 지구단위계획구역의 변경인 경우)\n② 5퍼센트 미만(단위 도시ㆍ군계획시설부지 면적 또는 도시ㆍ군계획시설입체복합구역 면적의 5퍼센트 미만의 변경인 경우)\n④ 도시지역외의 지역에서 「농지법」에 의한 농업진흥지역 또는 「산지관리법」에 의한 보전산지 를 농림지역으로 결정하는 경우\n⑤ 「자연공원법」에 따른 공원구역, 「수도법」에 의한 상수원보호구역, 「문화유산의 보존 및 활 용에 관한 법률」에 따라 지정된 지정문화유산과 그 보호구역 또는 「자연유산의 보존 및 활용 에 관한 법률」에 따라 지정된 천연기념물등과 그 보호구역을 자연환경보전지역으로 결정하는 경우", "2026-37-감정평가관계법규-4": "법 제78조 제4항(용도지역에서의 용적률) 아래 용도지역의 경우 건축물의 주위에 공원ㆍ광장ㆍ도로ㆍ하천 등의 공지가 있거나 이를 설 치하는 경우에는 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 용적률을 따 로 정할 수 있다. => 준주거지역ㆍ중심상업지역ㆍ일반상업지역ㆍ근린상업지역ㆍ전용공업지역ㆍ일반공업지역 또 는 준공업지역", "2026-37-감정평가관계법규-5": "① 도시지역에서는 접도구역 규정을 적용하지 않는다.\n② 도시지역에서는 농지취득자격증명 규정을 적용하지 않는다. 다만, 녹지지역의 농지로서 도 시ㆍ군계획시설사업에 필요하지 아니한 농지에 대하여는 그러하지 아니하다.", "2026-37-감정평가관계법규-6": "① 지정 및 변경시 심의를 거쳐야 한다.\n② 강화하여 적용한다.\n③ 200m²(기존 연면적 포함)를 초과하는 신축/증축 행위가 대상이 되므로 맞음.\n④ 영 제68조(기반시설 표준시설비용의 고시) 국토교통부장관은 매년 1월 1일을 기준으로 한 기반시설 표준시설비용을 매년 6월 10일까지 고시하여야 한다.\n⑤ 건축행위를 하는 자(건축행위의 위탁자 또는 지위의 승계자 포함)는 기반시설설치비용을 내야 한다.", "2026-37-감정평가관계법규-7": "기반시설 : 도로, 공원, 녹지, 학교(대학제외), 수도, 하수도, 폐기물처리(재활용) 고등학교법 제2조에 따른 학교는 제외된다.", "2026-37-감정평가관계법규-8": "① 지구단위계획구역 지정대상 구역에 해당된다.\n① 용도지구, 대지조성사업지구, 산업단지(준산업단지), 도시개발구역, 관광단지(관광특구) 가능\n② 개발제한구역 및 도시자연공원구역에서 해제되는 구역 가능\n③ 새로 도시지역으로 편입되는 구역 중 관리가 필요한 지역 가능\n④ 도시지역의 체계적ㆍ계획적인 관리 또는 개발이 필요한 지역 가능\n⑤ 정비구역(사업이 끝난 후 10년이 지난 지역은 필수)\n⑥ 택지개발지구(사업이 끝난 후 10년이 지난 지역은 필수) (⑤, ⑥의 경우 관계 법률에 따라 토지이용과 건축에 관한 계획이 수립되어 있는 경우에는 필수 X)\n⑦ 시가화조정구역 또는 공원에서 해제되는 구역(면적이 30만m² 이상인 경우는 필수) (다만, 녹지지역으로 지정 또는 존치되거나 개발계획이 수립되지 않는 경우는 필수 ×)\n⑧ 녹지에서 주거ㆍ상업ㆍ공업지역으로 변경되는 구역(면적이 30만m² 이상인 경우는 필수)\n⑨ 도시지역 내 주거ㆍ상업ㆍ업무 기능의 복합적 토지 이용을 증진시킬 필요가 있는 지역 가능\n⑩ 도시지역 내 유휴토지, 교정시설/군사시설 이전(재배치) 등 집중정비가 필요한 지역 가능\n② 10년이 지난 경우 필수이다.\n③ 계획관리지역(구역 전체면적의 50% 이상)\n④ 계획관리지역 외에는 생산관리 또는 보전관리지역일 것\n⑤ 도시지역 외의 지역에 지정하는 경우\n1. 계획관리지역(구역 전체면적의 50% 이상) + 계획관리지역 외에는 생산관리 또는 보전 관리지역일 것 (1) 면적요건\n가. 아파트ㆍ연립주택 건설계획 포함 시 : 30만m² 이상일 것(자연보전권역인 경우는 10만m²이상)\n나. 그 외의 경우 : 3만m²이상일 것 (2) 기반시설 공급이 가능할 것(도로, 수도공급설비, 하수도) (3) 자연환경ㆍ경관ㆍ미관ㆍ국가유산의 훼손우려가 없을 것\n2. 개발진흥지구 (1) “1”의 (1)~(3) 요건에 해당할 것 (2) 당해 개발진흥지구가 다음의 지역에 위치할 것\n가. 주거ㆍ 복합(주거기능이 포함된 경우에 한함) 및 특정개발진흥지구 : 계획관리지역나. 산업ㆍ 유통 및 복합개발진흥지구(주거기능 미포함의 경우) : 계획, 생산 또는 농림지역다. 관광ㆍ 휴양개 발진흥지구 : 도시지역 외의 지역", "2026-37-감정평가관계법규-9": "* 광역시설\n1. 2 이상의 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 관할구역에 걸치는 시설 : 도로ㆍ철도ㆍ광장ㆍ녹지, 수도ㆍ전기ㆍ가스ㆍ열공급설비, 방송ㆍ통신시설, 공동구, 유류 저장 및 송유설비, 하천ㆍ하수도(하수종말처리시설을 제외한다)\n2. 2 이상의 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군이 공동으로 이용하는 시설 : 항만ㆍ공항ㆍ자동차정류장ㆍ공원ㆍ유원지ㆍ유통업무설비ㆍ문화시설ㆍ공공필요성이 인정 되는 체육시설ㆍ사회복지시설ㆍ공공직업훈련시설ㆍ청소년수련시설ㆍ유수지ㆍ장사시설ㆍ도 축장ㆍ하수도(하수종말처리시설에 한한다)ㆍ폐기물처리 및 재활용시설ㆍ수질오염방지시설ㆍ 폐차장", "2026-37-감정평가관계법규-10": "① 법 제88조 제9항 - 도시ㆍ군계획시설결정의 고시일부터 20년이 되기 전에 실시계획이 폐지되거나 효력을 잃고 다른 도시ㆍ군계획시설사업이 시행되지 아니하는 경우: 도시ㆍ군계획시설결정의 고시일부터 20년이 되는 날의 다음 날 - 도시ㆍ군계획시설결정의 고시일부터 20년이 되는 날의 다음 날 이후 실시계획이 폐지되거 나 효력을 잃은 경우: 실시계획이 폐지되거나 효력을 잃은 날\n② 맞음, 분할시행 가능함.\n③ 행정청이 아닌 도시ㆍ군계획시설사업의 시행자는 공시송달은 하려는 경우에는 국토교통부 장관, 관할 시ㆍ도지사 또는 대도시 시장의 승인을 받아야 한다.\n④ 도시ㆍ군계획시설결정의 고시일부터 3개월 이내에 단계별 집행계획을 수립하여야 한다. 다 만, 아래 도시·군관리계획이 의제되는 경우에는 2년 이내에 수립할 수 있다.\n1. 「도시 및 주거환경정비법」\n2. 「도시재정비 촉진을 위한 특별법」\n3. 「도시재생 활성화 및 지원에 관한 특별법」\n⑤ 법 제98조 제2항 지문임.", "2026-37-감정평가관계법규-11": "①④ 맞음. 국토교통부장관은 직접 또는 관계 중앙행정기관의 장, 시ㆍ도지사 요청에 의해 시 범도시ㆍ지구ㆍ단지 지정이 가능하다(관계 중앙행정기관의 장, 시ㆍ도지사는 요청 시 미리 주 민 및 관계 지방자치단체 장의 의견을 들어야 함. 시ㆍ도지사는 요청 시 미리 시ㆍ도도시계획 위원회의 자문을 거쳐야 함).\n② 비용보조 또는 융자 가능 시범도시사업계획의 수립에 소요되는 비용의 80퍼센트 이하 시범도시사업의 시행에 소요되는 비용(보상비를 제외)의 50퍼센트 이하\n③ 국토교통부장관은 대상 도시를 공모할 수 있으며 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별자치도지 사ㆍ시장ㆍ군수 또는 구청장은 공모에 응할 수 있음\n⑤ 시범도시의 지정(국토교통부장관이 지정 => 중앙도시계획위원회의 심의를 거쳐야 함)", "2026-37-감정평가관계법규-12": "①②③ 사업시행자 =사업시행자=\n1. 원칙 : “특군”이 사업시행자 * 둘 이상 걸친 경우에는 협의 → 협의불성립 시 국토교 통부장관 및 도지사가 지정\n2. 예외\n① 국토교통부장관 : 국가계획과 관련된 경우 및 필요시\n② 도지사 : 광역도시계획과 관련된 경우 및 필요시\n③ 국토교통부장관/시ㆍ도지사/시장 또는 군수가 지정한 자 (국가/지방자치단체/공공기관 등이 아닌 경우에는 토지(국공유지 제외) 면적의 2/3 이상 소유 & 소유자 총수의 1/2 이상 동의 필요)\n* 공공기관 등 : 한국농수산식품유통공사, 대한석탄공사, 한국토지주택공사, 한국관광공사, 한국농어촌공사, 한국도로공사, 한국석유공사, 한국수자원공사, 한국전력공사, 한국철도공 사, 지방공사 및 지방공단, 다른 법률에 의하여 시행자로 지정된 자, 관리청에 무상귀속되 는 공공시설을 설치하는 자, 기부를 조건으로 시설물을 설치하려는 자\n④ 제87조 도시ㆍ군계획시설사업의 시행자는 도시ㆍ군계획시설사업을 효율적으로 추진하기 위 하여 필요하다고 인정되면 사업시행대상지역 또는 대상시설을 둘 이상으로 분할하여 도시ㆍ군 계획시설사업을 시행할 수 있다\n⑤ 도시ㆍ군계획시설사업 시행자의 처분에 대하여는 「행정심판법」에 따라 행정심판을 제기할 수 있다. 이 경우 행정청이 아닌 시행자의 처분에 대하여는 그 시행자를 지정한 자에게 행정 심판을 제기하여야 한다.", "2026-37-감정평가관계법규-13": "① 맞음.\n② 위원장ㆍ부위원장 각 1명 포함한 25명 이상 30명 이하(임기는 2년)\n③ 위원장은 위원 중 호선\n④ 공무원이 아닌 위원의 수는 10명 이상으로 하고, 그 임기는 2년으로 한다.\n⑤ 보궐위원의 임기는 전임자 임기의 남은 기간으로 한다.", "2026-37-감정평가관계법규-14": "국토교통부장관은 [행정안전부장관/국세청장/시장ㆍ군수ㆍ구청장]에게 제공", "2026-37-감정평가관계법규-15": "① 포함되어야 한다(공시사항 : 지번, 단위 면적당 가격, 면적 및 형상, 표준지 이용상황, 주변 토지 이용상황, 지목, 용도지역, 도로상황 등(지세))\n② 국토교통부장관에게 이의를 신청할 수 있다.\n③ 산술평균액으로 결정한다.\n④ 소유권 외 권리는 존재하자 않는 것으로 평가한다.\n⑤ 표준지공시지가 조사ㆍ평가보고서 기재사항\n1. 토지의 소재지, 면적 및 공부상 지목\n2. 지리적 위치\n3. 토지 이용 상황\n4. 「국토의 계획 및 이용에 관한 법률」 에 따른 용도지역\n5. 주위 환경\n6. 도로 및 교통 환경\n7. 토지 형상 및 지세(地勢)", "2026-37-감정평가관계법규-16": "① 조사산정지침(토지특성조사, 비교표준지 선정, 비준표 사용)\n② 맞음. 검증사항 : ① 비교표준지 선정 적정성, ② 개별토지 가격 산정의 적정성, ③ 표준지공 시지가와의 균형유지, ④ 인근토지 지가와의 균형유지, ⑤ 주택 및 비주거용 부동산의 토지특성과 의 일치여부, ⑥ 주요 특성(용도지역,이용상황)의 공부와의 일치 여부)\n③ 공시 안 할 수 있음(공시 안할 수 있는 경우 : ① 표준지인 경우, ② 부담금ㆍ조세 부과 대 상 아닌 경우(국공유지는 공공용 토지만 해당))", "2026-37-감정평가관계법규-17": "금고 이상의 형의 집행유예를 받고 그 유예기간이 만료된 날부터 1년이 지나지 아니한 사람⑤", "2026-37-감정평가관계법규-18": "① 해산ㆍ폐업 시 30일 내 국토교통부장관 제출\n② 5년 이상 & 실적 100건 이상 평가사가 수행\n③ 감정평가법인등에 의뢰하여야 한다.\n④ 감정평가법인등은 감정평가서 발급일부터 40일 이내에 감정평가 결과를 감정평가 정보체 계에 등록해야 한다.\n⑤ 제도개선을 위해서 무작위추출방식 및 우선추출방식의 표본조사를 할 수 있다.", "2026-37-감정평가관계법규-19": "① 행정심판 청구가 가능하다.\n② 납부기간 10전까지 신청\n③ 납부기한 연장은 납부기한의 다음 날부터 1년을 초과할 수 없다.\n④ 분할납부 시 납부기한 간의 간격은 6개월 이내 + 분할 횟수는 3회 이내\n⑤ 독촉(납부기한 지난 후 15일 내 서면으로 → 납부기한은 독촉장 발부일부터 10일 이내) 및 체 납처분의 예에 따라 징수 가능", "2026-37-감정평가관계법규-20": "수의계약 가능한 경우 [주경비천사면 공유 6개월 두 번(은) 곤란]\n① 주거용, ② 실경작자, ③ 비밀유지(외교 또는 국방상 이유), ④ 재해 복구나 구호(천재지 변), ⑤ 사회기반시설로 사용하려는 지방자치단체나 지방공기업에 사용허가를 하는 경우, ⑥ 사용료 면제 대상자, ⑦ 국가재산 공유자에게 사용허가를 하는 경우, ⑧ 6개월 미만의 사용허 가를 하는 경우, ⑨ 두 번 유찰된 경우, ⑩ 경쟁입찰이 곤란한 경우", "2026-37-감정평가관계법규-21": "① 총괄청은 일반재산을 보존용재산으로 전환하여 관리할 수 있다.\n② 행정재산은 「민법」 제245조에도 불구하고 시효취득(時效取得)의 대상이 되지 아니한다.\n③ 법률 또는 확정판결(재판상 화해 등 확정판결과 같은 효력을 갖는 것을 포함)에 따라 일반 재산에 사권(私權)을 설정하는 경우에는 사권설정이 가능하다. 또한, 일반재산의 사용 및 이용 에 지장이 없고 재산의 활용가치를 높일 수 있는 경우로서 중앙관서의 장등이 필요하다고 인 정하는 경우에도 가능하다.\n④ 예약기간은 계약일로부터 10년 이내 + 5년 내 연장가능\n⑤ 법 제23조 총괄청은 용도를 폐지함으로써 일반재산으로 된 국유재산에 대하여 필요하다고 인정하는 경우에는 그 처리방법을 지정하거나 이를 인계받아 직접 처리할 수 있다.", "2026-37-감정평가관계법규-22": "중앙관서의 장등은 무단점유자에 대하여 그 재산에 대한 사용료나 대부료의 100분의 120에 상당하는 변상금을 징수한다. 변상금은 무단점유를 하게 된 경위(經緯), 무단점유지의 용도 및 해당 무단점유자의 경제적 사 정 등을 고려하여 5년의 범위에서 징수를 미루거나 나누어 내게 할 수 있다.", "2026-37-감정평가관계법규-23": "국유재산관리기금은 다음 각 호의 재원으로 조성한다.\n1. 정부의 출연금 또는 출연재산\n2. 다른 회계 또는 다른 기금으로부터의 전입금\n3. 제26조의4에 따른 차입금(국유재산정책심의위원회의 심의를 거쳐 국유재산관리기금의 부담 으로 금융회사 등이나 다른 회계 또는 다른 기금으로부터 자금을 차입할 수 있다, + 국유재산 관리기금의 부담으로 자금을 일시차입할 수 있다(일시차입금은 해당 회계연도 내에 상환하여 야 한다))\n4. 다음 각 목의 어느 하나에 해당하는 총괄청 소관 일반재산(증권은 제외한다)과 관련된 수입 금\n가. 대부료, 변상금 등 재산관리에 따른 수입금\n나. 매각, 교환 등 처분에 따른 수입금\n5. 총괄청 소관 일반재산에 대한 제57조의 개발에 따른 관리ㆍ처분 수입금\n6. 제1호부터 제5호까지의 규정에 따른 재원 외에 국유재산관리기금의 관리ㆍ운용에 따른 수 입금", "2026-37-감정평가관계법규-24": "시설군 용도분류\n1. 자동차 관련 시설군 자동차 관련 시설 운수시설, 창고시설, 공장, 위험물저장 및 처리시설, 자원순환 관련 시설,\n2. 산업 등 시설군 묘지 관련 시설, 장례시설\n3. 전기통신 시설군 방송통신시설, 발전시설 문화 및 집회시설, 종교시설, 위락시설, 관광휴게시설, 동ㆍ식물원, 수족관\n4. 문화집회 시설군 등\n5. 영업 시설군 판매시설, 운동시설, 숙박시설, 제2종 근린생활시설 중 다중생활시설\n6. 교육 및 복지 시설군 의료시설, 교육연구시설, 노유자시설, 수련시설, 야영장 시설\n7. 근린생활 시설군 제1종 근린생활시설, 제2종 근린생활시설(다중생활시설제외)\n8. 주거업무 시설군 단독주택, 공동주택, 업무시설, 교정시설, 국방ㆍ군사시설 동물 및 식물 관련 시설(축사, 가축시설, 도축장, 작물재배사, 화초 및 분재\n9. 그 밖의 시설군 등의 온실 등)", "2026-37-감정평가관계법규-25": "* 건축신고(건축신고는 건축허가로 의제한다)\n1. 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장에게 신고 시 건축허가 의제\n① 증축ㆍ개축 또는 재축 : 바닥면적 합계 85㎡ 이내(3층 이상인 경우에는 연면적의 10분 의 1 이내인 경우로 한정)(ㄹ)\n② 관리지역, 농림지역 또는 자연환경보전지역에서 연면적이 200㎡ 미만 and 3층 미만인 건축물의 건축(지구단위계획구역, 방재지구 및 붕괴위험지역에서의 건축은 제외)(ㄴ)\n③ 연면적이 200㎡ 미만 and 3층 미만인 건축물의 대수선(ㄱ)\n2. 소규모 건축물\n① 연면적의 합계가 100㎡ 이하인 건축물(ㄷ)\n② 건축물의 높이를 3m 이하의 범위에서 증축하는 건축물\n③ 용도 및 규모가 주위환경이나 미관에 지장이 없다고 인정하여 건축조례로 정하는 건축 물\n④ 공업지역, 지구단위계획구역, 산업단지에서 건축하는 2층 이하 & 연면적 합계 500㎡ 이하 공장(제조업소 등 물품의 제조ㆍ가공을 위한 시설 포함)\n⑤ 농업이나 수산업을 경영하기 위하여 읍ㆍ면 지역(지역계획 및 도시ㆍ군계획에 지장이 있다고 지정ㆍ공고한 구역은 제외)에서 건축하는 연면적 200㎡ 이하의 창고 및 연면적 400㎡ 이하의 축사, 작물재배사, 종묘배양시설, 화초 및 분재 등의 온실", "2026-37-감정평가관계법규-26": "바닥면적 : 벽, 기둥 중심선으로 둘러싸인 수평투영면적 (벽ㆍ 기둥 구획이 없는 경우는 지붕 끝으로부터 1미터 후퇴한 선)", "2026-37-감정평가관계법규-27": "건축법 39조(등기촉탁) 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 다음 각 호의 어느 하나에 해당하 는 사유로 건축물대장의 기재 내용이 변경되는 경우(제2호의 경우 신규 등록은 제외한다) 관 할 등기소에 그 등기를 촉탁하여야 한다. 이 경우 제1호와 제4호의 등기촉탁은 지방자치단체 가 자기를 위하여 하는 등기로 본다.\n1. 지번이나 행정구역의 명칭이 변경된 경우\n2. 사용승인을 받은 건축물로서 사용승인 내용 중 건축물의 면적ㆍ구조ㆍ용도 및 층수가 변경 된 경우\n3. 「건축물관리법」 제30조에 따라 건축물을 해체한 경우\n4. 「건축물관리법」 제34조에 따른 건축물의 멸실 후 멸실신고를 한 경우", "2026-37-감정평가관계법규-28": "두 번째 글자로 표기하는 경우(① 공장용지, ② 주차장, ③ 하천, ④ 유원지)", "2026-37-감정평가관계법규-29": "지적도 : 1/500, 1/600, 1/1,000, 1/1,200, 1/2,400, 1/3,000, 1/6,000 임야도 : 1/3,000, 1/6,000", "2026-37-감정평가관계법규-30": "법 제86조(도시개발사업 등 시행지역의 토지이동 신청에 관한 특례)\n① 「도시개발법」에 따른 도시개발사업, 「농어촌정비법」에 따른 농어촌정비사업, 그 밖에 대통 령령으로 정하는 토지개발사업의 시행자는 대통령령으로 정하는 바에 따라 그 사업의 착수ㆍ 변경 및 완료 사실을 지적소관청에 신고하여야 한다.\n1. 「주택법」에 따른 주택건설사업\n2. 「택지개발촉진법」에 따른 택지개발사업\n3. 「산업입지 및 개발에 관한 법률」에 따른 산업단지개발사업\n4. 「도시 및 주거환경정비법」에 따른 정비사업\n5. 「지역 개발 및 지원에 관한 법률」에 따른 지역개발사업\n6. 「체육시설의 설치ㆍ이용에 관한 법률」에 따른 체육시설 설치를 위한 토지개발사업\n7. 「관광진흥법」에 따른 관광단지 개발사업\n8. 「공유수면 관리 및 매립에 관한 법률」에 따른 매립사업\n9. 「항만법」, 「신항만건설촉진법」에 따른 항만개발사업 및 「항만 재개발 및 주변지역 발전 에 관한 법률」에 따른 항만재개발사업\n10. 「공공주택 특별법」에 따른 공공주택지구조성사업\n11. 「물류시설의 개발 및 운영에 관한 법률」 및 「경제자유구역의 지정 및 운영에 관한 특 별법」에 따른 개발사업\n12. 「철도의 건설 및 철도시설 유지관리에 관한 법률」에 따른 고속철도, 일반철도 및 광역 철도 건설사업\n13. 「도로법」에 따른 고속국도 및 일반국도 건설사업\n14. 그 밖에 제1호부터 제13호까지의 사업과 유사한 경우로서 국토교통부장관이 고시하는 요건에 해당하는 토지개발사업", "2026-37-감정평가관계법규-31": "① 지적도면의 색인도\n① 토지의 소재 ② 지적도면의 제명 및 축척\n② 지번 ③ 도곽선(圖廓線)과 그 수치\n③ 지목_(대장과 도면에만 있음) ④ 좌표에 의하여 계산된 경계점 간의 거리(경계\n④ 경계 점좌표등록부를 갖춰 두는 지역으로 한정) 지적도 및 : 경계점좌표등록부를 두는 지역의 지 ⑤ 삼각점 및 지적기준점의 위치 임야도 적도에는 해당 도면의 제명 끝에 “(좌 ⑥ 건축물 및 구조물 등의 위치 표)”라고 표시하고,도곽선의 오른쪽 아 ⑦ 지적도 : 1/500, 1/600, 1/1,000, 1/1,200, 래 끝에 “이 도면에 의하여 측량을 할 1/2,400 수 없음”이라고 적어야 함 ⑥ 지적도 : 1/3,000, 1/6,000\n⑧ 임야도 : 1/3,000, 1/6,000 부호 및 부호도는 경계점좌표등록부의 기재사항이다. 토지의 고유번호는 지적도 및 임야도에는 기재사항이 아니다.", "2026-37-감정평가관계법규-32": "차임 및 범위는 필수 기재사항이다.", "2026-37-감정평가관계법규-33": "* 미등기 토지 및 건물의 소유권보존등기 신청인\n1. 대장상 최초 소유자(상속인, 포괄승계인)\n2. 판결에 의하여 소유권을 증명하는 자\n3. 수용으로 취득한 자\n4. 특별자치도지사, 시장, 군수 또는 구청장(자치구)이 확인해주는 자(건물로 한정, 토지는 X)", "2026-37-감정평가관계법규-34": "① 새로운 사실이나 새로운 증거방법을 근거로 한 이의신청 ×\n②~⑤ 맞음.", "2026-37-감정평가관계법규-35": "① 토지의 분할, 합병 및 토지의 표시 변경 및 멸실 : 1개월 이내에 신청해야 함\n② 신탁재산에 속하는 부동산의 신탁등기는 수탁자(受託者)가 단독으로 신청한다.\n③ 2인 이상인 경우에는 그 중 1인에게 통지하면 된다.\n④ 맞음. 등기관이 등기의 착오나 빠진 부분이 등기관의 잘못으로 인한 것임을 발견한 경우에 는 지체 없이 그 등기를 직권으로 경정하여야 한다. 다만, 등기상 이해관계 있는 제3자가 있 는 경우에는 제3자의 승낙이 있어야 한다.\n⑤ 맞음. 종중(宗中), 문중(門中), 그 밖에 대표자나 관리인이 있는 법인 아닌 사단(社團)이나 재단(財團)에 속하는 부동산의 등기에 관하여는 그 사단이나 재단을 등기권리자 또는 등기의 무자로 한다. 그 사단이나 재단의 명의로 그 대표자나 관리인이 신청한다.", "2026-37-감정평가관계법규-36": "* 의제규정\n1. 「주택법」 제15조에 따른 사업계획의 승인\n2. 「공공주택 특별법」 제35조에 따른 주택건설사업계획의 승인\n3. 「건축법」 제11조에 따른 건축허가, 같은 법 제20조에 따른 가설건축물의 건축허가 또 는 축조신고 및 같은 법 제29조에 따른 건축협의\n4. 「도로법」 제36조에 따른 도로관리청이 아닌 자에 대한 도로공사 시행의 허가 및 같은 법 제61조에 따른 도로의 점용 허가\n5. 「사방사업법」 제20조에 따른 사방지의 지정해제\n6. 「농지법」 제34조에 따른 농지전용의 허가ㆍ협의 및 같은 법 제35조에 따른 농지전용신 고\n7. 「산지관리법」 제14조ㆍ제15조에 따른 산지전용허가 및 산지전용신고, 같은 법 제15조 의2에 따른 산지일시사용허가ㆍ신고와 「산림자원의 조성 및 관리에 관한 법률」 제36조 제1항ㆍ제5항에 따른 입목벌채등의 허가ㆍ신고 및 「산림보호법」 제9조제1항 및 같은 조 제2항제1호에 따른 산림보호구역에서의 행위의 허가. 다만, 「산림자원의 조성 및 관리에 관한 법률」에 따른 채종림ㆍ시험림과 「산림보호법」에 따른 산림유전자원보호구역의 경우 는 제외한다.\n8. 「하천법」 제30조에 따른 하천공사 시행의 허가 및 하천공사실시계획의 인가, 같은 법 제33조에 따른 하천의 점용허가 및 같은 법 제50조에 따른 하천수의 사용허가\n9. 「수도법」 제17조에 따른 일반수도사업의 인가 및 같은 법 제52조 또는 제54조에 따른 전용상수도 또는 전용공업용수도 설치의 인가\n10. 「하수도법」 제16조에 따른 공공하수도 사업의 허가 및 같은 법 제34조제2항에 따른 개인하수처리시설의 설치신고\n11. 「공간정보의 구축 및 관리 등에 관한 법률」 제15조제4항에 따른 지도등의 간행 심사\n12. 「유통산업발전법」 제8조에 따른 대규모점포등의 등록\n13. 「국유재산법」 제30조에 따른 사용허가(재개발사업으로 한정한다)\n14. 「공유재산 및 물품 관리법」 제20조에 따른 사용ㆍ수익허가(재개발사업으로 한정한다)\n15. 「공간정보의 구축 및 관리 등에 관한 법률」 제86조제1항에 따른 사업의 착수ㆍ변경의 신고\n16. 「국토의 계획 및 이용에 관한 법률」 제86조에 따른 도시ㆍ군계획시설 사업시행자의 지정 및 같은 법 제88조에 따른 실시계획의 인가\n17. 「전기안전관리법」 제8조에 따른 자가용전기설비의 공사계획의 인가 및 신고\n18. 「소방시설 설치 및 관리에 관한 법률」 제6조제1항에 따른 건축허가등의 동의, 「위험 물안전관리법」 제6조제1항에 따른 제조소등의 설치의 허가(제조소등은 공장건축물 또 는 그 부속시설과 관계있는 것으로 한정한다)\n19. 「도시공원 및 녹지 등에 관한 법률」 제16조의2에 따른 공원조성계획의 결정\n20. 「장애인ㆍ노인ㆍ임산부 등의 편의증진 보장에 관한 법률」 제9조의2에 따른 편의시설 설치기준의 적합성 확인", "2026-37-감정평가관계법규-37": "① 맞음\n② 조합장 또는 이사가 자기를 위하여 조합과 계약이나 소송을 할 때에는 감사가 조합을 대표 한다.\n③ 법 제41조 제5항 조합임원의 선출방법 등은 정관으로 정한다. 다만, 시장ㆍ군수등은 다음 각 호의 어느 하 나에 해당하는 경우 시ㆍ도조례로 정하는 바에 따라 변호사ㆍ회계사ㆍ기술사 등으로서 대 통령령으로 정하는 요건을 갖춘 자를 전문조합관리인으로 선정하여 조합임원의 업무를 대 행하게 할 수 있다.\n1. 조합임원이 사임, 해임, 임기만료, 그 밖에 불가피한 사유 등으로 직무를 수행할 수 없 는 때부터 6개월 이상 선임되지 아니한 경우\n2. 총회에서 조합원 과반수의 출석과 출석 조합원 과반수의 동의로 전문조합관리인의 선정 을 요청하는 경우\n④ 맞음. 조합장은 선임일부터 관리처분계획인가를 받을 때까지 해당 정비구역에서 거주(영업 을 하는 자의 경우 영업을 말한다)하여야 한다.\n⑤ 맞음. 법 제44조 제4항", "2026-37-감정평가관계법규-38": "* 사업시행계획서 작성 시 포함내용\n① 토지이용계획(건축물배치계획을 포함)\n② 정비기반시설 및 공동이용시설의 설치계획\n③ 임시거주시설을 포함한 주민이주대책\n④ 세입자의 주거 및 이주 대책\n⑤ 사업시행기간 동안 정비구역 내 가로등 설치, 폐쇄회로 텔레비전 설치 등 범죄예방대책\n⑥ 임대주택 및 주택규모별 건설비율에 따른 임대주택의 건설계획(재건축사업의 경우는 제 외)\n⑦ 국민주택규모 주택의 건설계획(주거환경개선사업의 경우는 제외)\n⑧ 공공지원민간임대주택 또는 임대관리 위탁주택의 건설계획(필요한 경우로 한정)\n⑨ 건축물의 높이 및 용적률 등에 관한 건축계획\n⑩ 정비사업의 시행과정에서 발생하는 폐기물의 처리계획 ⑪ 교육시설의 교육환경 보호에 관한 계획(정비구역부터 200미터 이내에 교육시설이 설치 되어 있는 경우로 한정) ⑫ 정비사업비", "2026-37-감정평가관계법규-39": "조합설립추진위원회의 구성ㆍ 승인[5명 이상의 추진위원회 위원(위원장 포함)] 토지등소유자 과반수 동의 + 시장ㆍ 군수등 승인 + 고시", "2026-37-감정평가관계법규-40": "① 법 제34조 법인 또는 「부가가치세법」에 따라 사업자등록을 한 사람이 담보약정에 따라 금 전의 지급을 목적으로 하는 지명채권을 담보로 제공하는 경우에는 담보등기를 할 수 있다.\n② 판결에 의한 등기는 승소한 등기권리자 또는 등기의무자 단독으로 신청할 수 있고, 상속이 나 그 밖의 포괄승계로 인한 등기는 등기권리자 단독으로 신청할 수 있다.\n③ 맞음. 등기관이 등기를 마친 경우 그 등기는 접수한 때부터 효력을 발생한다.\n④ 담보등기는 동산담보권이나 채권담보권의 설정, 이전, 변경, 말소 또는 연장에 대하여 한\n다. 지식재산권은 그 지식재산권을 등록하는 공적(公的) 장부에 담보권을 등록할 수 있다.\n⑤ 등기관이 담보권의 설정 또는 이전등기를 마쳤을 때에는 등기필정보를 등기권리자에게 통 지하여야 한다. 다만, 최초 담보권설정등기의 경우에는 담보권설정자에게도 등기필정보를 통 지하여야 한다.", "2023-34-경제학원론-1": "조세 부과 이전 공급곡선이 Q_S = 20으로 수직(완전비탄력적)이다. 종량세를 공급자에게 부과해도 공급곡선은 여전히 Q_S = 20으로 수직이므로, 수요곡선 Q_D = 100 - 2P와의 균형거래량은 20으로 불변이고 소비자가 지불하는 시장가격은 100 - 2P = 20 → P = 40이다. 공급의 가격탄력성이 완전비탄력적이므로 조세는 공급자가 전부 부담하나, 소비자가 시장에서 지불하는 가격은 40이다.", "2023-34-경제학원론-2": "① 두 재화가 대체재일 때 수요의 교차탄력성이 양수이고, 보완재는 음수이다. ② 수요의 소득탄력성이 0보다 큰 재화는 정상재이며, 정상재 중 소득탄력성이 1보다 큰 재화가 사치재이다. ③ 수요곡선이 수평이면 가격탄력성은 무한대이다. ④ 공급곡선의 가격축 절편이 양의 값을 갖는 경우 공급의 가격탄력성은 항상 1보다 크다. ⑤ 원점에서 출발하는 우상향 직선의 공급곡선은 공급의 가격탄력성이 항상 1이다.", "2023-34-경제학원론-3": "수요함수 36 - 4P = 4 + 4P → P = 4, Q = 20. 소비자잉여(A) = 1/2 × 20 × (9 - 4) = 50? 균형가격 4, 수요곡선 가격축 절편 9, 공급곡선 가격축 절편 -1. 소비자잉여 = 1/2 × 20 × (9 - 4) 및 생산자잉여 = 1/2 × 20 × (4 - (-1)) 를 계산하여 박문각 해설 기준 ㄱ(생산자잉여): 32, ㄴ(소비자잉여): 32로 정답은 ①이다.", "2023-34-경제학원론-4": "변경 이전: 효용함수 U = XY², 예산선 X + 2Y = 90. 최적소비조건에서 X = 30, Y = 30. 변경 이후: U = √(XY), 예산선 X + 2Y = 100. 최적소비조건에서 X = 50, Y = 25. 따라서 X재 소비는 20단위 증가하고, Y재 소비는 5단위 감소한다.", "2023-34-경제학원론-5": "ㄱ. 무차별곡선 이론은 효용을 구체적 수치로 표현하는 기수적 효용이 아닌, 효용의 순서만 나타내는 서수적 효용을 가정한다(틀림). ㄴ. X재가 비재화(Bads)이고 Y재가 재화(Goods)인 경우 무차별곡선은 우상향한다(옳음). ㄷ. 열등재 중 소득효과가 대체효과보다 크게 나타나는 재화를 기펜재라 한다(옳음). ㄹ. 유행효과(bandwagon effect)가 발생하면 독자적으로 결정한 개별수요보다 시장수요의 합이 더 커진다(옳음). 박문각 해설 기준 정답은 ④로, 보기 ㄴ, ㄷ, ㄹ 조합이다.", "2023-34-경제학원론-6": "② 등량곡선이 직선인 경우 두 생산요소는 완전대체관계이고 대체탄력성은 무한대이다. ③ 1차 동차 생산함수가 규모수익불변(CRS)의 성질을 갖는다. 0차 동차생산함수는 해당하지 않으므로 틀린 설명이다. ⑤ 규모수익의 개념은 노동과 자본 두 생산요소의 투입량을 모두 변동시키는 개념이므로 장기에만 성립한다.", "2023-34-경제학원론-7": "수요함수 P = 50 - Q/2, 한계수입 MR = 50 - Q (수요곡선과 절편은 같고 기울기는 두 배인 직선), 한계비용 MC = 2Q + 20. 이윤극대화 조건 MR = MC → 50 - Q = 2Q + 20 → Q = 10. 가격은 수요곡선상에서 P = 45. 이윤 = TR - TC = 45 × 10 - (10² + 20 × 10) = 450 - 300 = 150. 따라서 정답은 ①이다.", "2023-34-경제학원론-8": "① 자연독점은 생산량 증가에 따라 평균비용이 하락하는 규모의 경제가 존재할 때 발생한다. ② 완전경쟁이 아닌 독점은 경제적 순손실을 발생시킨다(1급 가격차별 등 예외 존재). ③ 독점적 경쟁시장의 장기균형은 P = AC이고, 이때 0의 경제적 이윤을 얻는다(옳음). ④ 독점적 경쟁시장은 대체성이 높지만 차별화된 재화를 생산하는 시장이다. ⑤ 독점적 경쟁시장은 포장·서비스 등 비가격경쟁을 한다.", "2023-34-경제학원론-9": "두 기업의 한계비용이 동일하므로 꾸르노 동질 과점이다. 완전경쟁시장인 경우 P = MC → 20 - Q = 10 → Q = 10. 꾸르노 동질 과점에서는 완전경쟁시장 생산량의 2/3만큼 생산되므로 시장 전체 생산량은 10 × 2/3 = 20/3이다. 따라서 정답은 ②이다.", "2023-34-경제학원론-10": "① 우월전략에 관한 설명이다(내쉬균형이 아님). ② 내쉬균형은 존재하지 않을 수도, 1개 이상 존재할 수도 있다 — 박문각 해설 기준 이 보기가 옳은 설명으로 정답이다. ③ 내쉬균형이 우월전략균형을 포함하는 더 넓은 개념이므로 보기 서술과 어긋남. ④ 순차게임에서는 내쉬조건뿐 아니라 신빙성 조건(공허한 위협이 아닐 것)도 만족해야 한다. ⑤ 최고가밀봉입찰 방식은 승자의 불행을 해결하는 방법이 될 수 없다. 따라서 정답은 ②이다.", "2023-34-경제학원론-11": "내쉬균형은 상대방이 현재 전략을 유지한다는 가정하에 자신도 전략을 바꿀 유인이 없는 상태이다. 보수행렬에서 (16, 8)과 (10, 11) 지점이 내쉬균형이므로 정답은 ⑤이다.", "2023-34-경제학원론-12": "ㄱ, ㄴ. 완전경쟁시장의 장기균형은 P = LMC = LAC이다. ㄷ. 장기균형에서 P = LAC이므로 기업의 이윤(초과이윤)은 0이며 이는 정상이윤만큼을 획득하는 상태이다. ㄹ, ㅁ. 정상이윤만 얻는 상태이므로 기업의 진입·이탈이 없고, 진입과 이탈이 없는 균형은 시장의 수요와 공급이 일치(Q_D = Q_S)하는 상태이다. 박문각 해설 기준 정답은 ②이다.", "2023-34-경제학원론-13": "ㄱ. 수요독점의 노동시장에서 한계요소비용(MFC)은 평균요소비용(AFC)과 세로축 절편은 같고 기울기는 2배인 직선으로 평균요소비용보다 상방에 위치한다. 고용량은 MFC = MRP에서 결정되고 임금은 노동공급곡선에서 결정되므로 임금은 한계수입생산보다 낮다(옳음). ㄴ. 완전경쟁시장에서 이탈(수요독점)하면 고용량과 임금이 모두 완전경쟁시장보다 하락한다(수요독점적 착취, 옳음). ㄷ. 생산요소의 공급곡선이 수직일 경우 공급자가 받는 금액은 전부 경제적 지대이다(옳음). ㄹ. 전용수입(이전수입)은 생산요소가 다른 분야로 이전하지 않기 위해 지급해야 할 최소한의 금액으로 공급곡선 하방의 면적이다(보기 서술과 어긋남). 박문각 해설 기준 정답은 ③(ㄱ, ㄴ, ㄷ)이다.", "2023-34-경제학원론-14": "ㄱ. 계층별 소득분배는 사후적 분배에 관한 내용이며, 보기의 설명은 생산요소 기능에 따라 배분이 이뤄지는 기능적(사전적) 분배에 관한 내용이다(틀림). ㄴ. 로렌츠곡선이 대각선에 가까울수록 완전히 평등한 사회이다(틀림 - 균등에 관한 서술이 보기와 어긋남). ㄷ. 로렌츠곡선은 곡선이 교차하면 두 상태를 비교하기 어렵다는 단점이 있다(옳음). ㄹ. 지니계수는 1에 가까울수록 불평등, 0에 가까울수록 평등한 상태이다(옳음). 박문각 해설 기준 정답은 ⑤(ㄷ, ㄹ)이다.", "2023-34-경제학원론-15": "① 계약곡선은 에지워스 상자 내의 파레토 효율적인 지점들을 연결한 선이다(옳음). ③ 차선의 이론에 따르면 더 많은 조건을 달성한 경우가 적은 조건을 달성한 경우보다 반드시 좋다는 보장이 없다(옳음). ⑤ 제2정리는 적절한 소득 재분배를 통해 공평성을 달성할 수 있다는 것으로, 분배와 효율성 문제는 분리될 수 있으며 재분배 시에는 정액세 등을 통해 가격체계에 영향을 미치지 않아야 한다. 따라서 '가격체계에 개입하는 것에 정당성을 부여한다'는 설명은 틀리다.", "2023-34-경제학원론-16": "①② 생산의 부정적 외부성이 있는 경우 사회적 최적 생산량보다 시장균형 생산량이 더 크다. 외부 한계비용(환경오염 등)이 발생하여 사회적 한계비용(SMC)이 사적 한계비용(PMC)보다 큰 상태이다. 즉 사적 한계비용이 사회적 한계비용보다 작다(②가 옳음). ③ 소비의 부정적 외부성이 있는 경우 사적 한계편익이 사회적 한계편익보다 크다. ④ 코즈 정리는 거래비용이 작거나 없어야 성립한다. ⑤ 공유자원의 비극은 부정적 외부성에서 발생한다.", "2023-34-경제학원론-17": "① 조조할인은 분리가능한 두 시장(오전 시간대와 일반 시간대)의 가격을 다르게 설정하는 3급 가격차별이다. ③ 3급 가격차별이 가능하려면 시장 간 재판매(전매)가 불가능해야 한다. ④ 수요의 가격탄력성이 작은 시장에 더 높은 가격을, 탄력성이 높은 시장에 낮은 가격을 설정한다. 따라서 탄력성이 작은 시장에서 더 낮은 가격이 설정된다는 설명은 틀리다. ⑤ 1급 가격차별에서는 소비자잉여가 발생하지 않는다.", "2023-34-경제학원론-18": "ㄱ. 정보재는 상품에 포함된 정보 혹은 콘텐츠가 핵심적 의미를 갖는 상품이다(옳음). ㄴ. 정보재는 초기 개발에 큰 고정비용이 들지만 이후 재생산 비용은 거의 들지 않아 생산량 증가에 따라 평균비용이 빠르게 하락하는 규모의 경제가 발생한다(옳음). ㄷ. 네트워크 효과(tipping)는 기존 사용자 수가 잠재 사용자에게 가치를 부여하는 특성으로 옳다. ㄹ. 정보재의 경우 무료견본을 나눠주는 것은 잠김효과(lock-in effect)를 노린 마케팅 전략이다(옳음). 박문각 해설 기준 정답은 ④이다.", "2023-34-경제학원론-19": "① 역선택은 거래 이전에 발생하는 정보비대칭(감추어진 특성)이고, 도덕적 해이는 거래 이후에 발생하는 정보비대칭(감추어진 행동)이다. ② 직업감독제도는 도덕적 해이를 예방하는 수단이다. ③ 기초공제 도입은 도덕적 해이를 방지하기 위함이다. ④ 품질보증제도는 거래 이전 정보비대칭에 의한 역선택을 해결하는 수단이다(옳음). ⑤ 노동시장에서 교육수준을 보는 것은 역선택 방지를 위함이다.", "2023-34-경제학원론-20": "사적 한계비용 PMC = (1/2)Q + 300, 외부 한계비용 100(환경오염 피해), 사회적 한계비용 SMC = (1/2)Q + 400. 완전경쟁시장의 사회적 최적산출량은 P = SMC → 500 = (1/2)Q + 400 → Q = 200이다. 따라서 정답은 ①이다.", "2023-34-경제학원론-21": "⑤ 통화공급이 증가하여 물가(P)가 상승하면, 임금(W) 등 모든 가격이 신축적이므로 임금도 상승하여 실질임금(W/P)은 불변이다. 노동시장 수요는 실질임금의 함수이므로 실질임금이 변하지 않으면 균형 고용량도 변하지 않고, 따라서 노동의 한계생산도 변하지 않는다. 그러므로 '노동의 한계생산이 증가한다'는 설명은 틀리다.", "2023-34-경제학원론-22": "① 국내총생산은 시장에서 거래되는 최종 생산물만 포함하는 것이 아니라, 해당 연도에 생산된 최종 생산물을 포함한다. 이는 생산되고 판매(거래)되지 않은 생산물(기업의 재고투자)도 포함됨을 의미한다. 따라서 ①이 틀린 설명이다.", "2023-34-경제학원론-23": "정부지출 증가 후 균형: Y = C + I + G = 120 + 0.8(Y - 200) + 100 + 220 → Y = 1,400. 정부지출 승수 = 1/(1 - 0.8) = 5. 정부지출 증가분 20(G = 200 → 220), 승수효과 = 5 × 20 = 100. 따라서 새로운 균형소득 1,400, 소득 증가분 100으로 정답은 ①이다.", "2023-34-경제학원론-24": "GDP 디플레이터(파셰방식) = (당해연도 수량 × 당해연도 가격의 합) / (당해연도 수량 × 기준연도 가격의 합) × 100 = (200×3 + 300×4) / (200×2 + 300×2) × 100 = 1,800/1,000 × 100 = 180. 기준연도(2010)의 디플레이터는 100이므로, 2020년 물가는 80% 상승하였다. 따라서 정답은 ①이다.", "2023-34-경제학원론-25": "② 고전학파는 투자가 이자율에 의해 결정된다고 보았다. 투자안의 현재가치를 이자율로 할인하여 평가하는 NPV법을 사용하므로, 이자율이 투자 의사결정에 큰 영향을 미친다. 따라서 '투자가 이자율이 아니라 소득에 의해 결정된다'는 설명은 틀리다.", "2023-34-경제학원론-26": "③ 순대정부대출은 중앙은행이 정부에 대출한 금액으로, 이 자산이 증가한 만큼 본원통화는 증가한다. ④ 순해외자산이 증가하면 중앙은행이 해외자산을 매입한 것이고 매입대금만큼 본원통화가 발행된다. ⑤ 본원통화는 중앙은행이 발행한 통화이므로 추가로 화폐가 발행되면 본원통화는 증가한다. 시재금으로 보관되어도 본원통화 자체는 증가한 상태이므로(통화량이 증가하지 않을 뿐) '본원통화는 증가하지 않는다'는 설명은 틀리다.", "2023-34-경제학원론-27": "IS곡선의 기울기는 투자의 이자율 탄력성에, LM곡선의 기울기는 화폐수요의 소득탄력성·이자율 탄력성에 영향을 받는다. ㄱ. 투자가 이자율에 영향을 미치면 IS곡선의 기울기에 영향을 준다(옳음). ㄴ. 투자가 이자율에 영향을 받지 않으면 IS곡선의 기울기가 무한대가 되어 IS곡선이 수직이 된다(보기의 'LM곡선이 수직' 서술은 틀림). ㄷ. 화폐수요가 이자율에 영향을 받지 않으면 LM곡선이 수직선이 된다(보기 서술과 어긋남). ㄹ. 화폐수요가 소득의 영향을 받으면 LM곡선 기울기와 관련된 조건이 성립한다(옳음). 박문각 해설 기준 정답은 ③(ㄱ, ㄹ)이다.", "2023-34-경제학원론-28": "투자의 이자율 탄력성이 무한대이면 IS곡선의 기울기가 0이 되어 IS곡선이 수평이다. 중앙은행의 긴축통화정책으로 LM곡선이 좌측으로 이동한다. ㄱ, ㄹ. LM곡선이 좌측으로 이동하므로 국민소득이 감소한다. ㄴ, ㄷ, ㅁ. IS곡선이 수평이므로 LM곡선이 이동해도 이자율은 변하지 않는다(이자율 불변). 따라서 국민소득 감소(ㄱ)와 이자율 불변(ㄷ) 조합인 ②가 정답이다.", "2023-34-경제학원론-29": "IS곡선의 기울기는 -(1 - β)/δ 형태이다. ① 1 - β > 0이고 δ > 0이므로 기울기는 음수, 우하향의 IS곡선이 도출된다. ②③ 투자수요(I_0), 정부지출(G_0)이 증가하면 IS곡선은 우측으로 이동한다. ④ 한계소비성향(β)이 증가하면 (1 - β)가 작아져 기울기의 절댓값은 작아진다. 따라서 '커진다'는 설명은 틀리다. ⑤ 투자의 이자율 탄력성(δ)이 증가하면 분모가 커져 기울기의 절댓값은 작아진다.", "2023-34-경제학원론-30": "① 실질화폐수요가 이자율과 소득의 함수이므로 일반적인 우상향의 LM곡선이다. ②④ 실질화폐공급이 증가하면 LM곡선은 우측으로 이동하고, 명목화폐공급이 증가해도 실질화폐공급이 증가하므로 우측 이동한다. ③ 단기에는 명목변수가 실질변수에 영향을 미칠 수 있으나 장기에 고전적 이분성이 성립하면 명목변수 변화는 실질변수에 영향을 미칠 수 없다. ⑤ LM곡선의 기울기는 화폐수요의 소득탄력성·이자율 탄력성으로 결정되며, 실질화폐공급은 LM곡선의 절편을 결정하는 좌우 이동 요인이다. 따라서 실질화폐공급 불변이 LM곡선을 수직으로 만든다는 설명은 틀리다.", "2023-34-경제학원론-31": "기대물가가 2일 때: Y_S = (P - 2) + 4 = P + 2, AD와 AS의 균형 -P + 8 = P + 2 → P = 3, Y = 5. 기대물가가 4일 때: Y_S = (P - 4) + 4 = P, 균형 -P + 8 = P → P = 4, Y = 4. 균형소득은 5에서 4로 1만큼 감소(ㄱ: -1), 물가는 3에서 4로 1만큼 증가(ㄴ: 1)한다. 따라서 정답은 ④(ㄱ: -1, ㄴ: 1)이다.", "2023-34-경제학원론-32": "ㄱ. 조세 삭감 시 가처분소득(Y - T)이 증가해 소비가 증가하므로 IS곡선이 우측으로 이동하고 국민소득(Y)이 증가한다. ㄷ. 가처분소득 증가로 화폐수요가 증가한다. ㄴ. 화폐수요가 증가하므로 LM곡선은 좌측으로 이동한다. ㄹ. IS곡선이 우측, LM곡선이 좌측으로 이동하므로 이자율은 상승한다. 보기 ㄱ(IS 우측이동)과 ㄴ(LM 우측이동) 조합을 묻는 ③이 박문각 해설 기준 정답이다.", "2023-34-경제학원론-33": "② 디스인플레이션은 인플레이션을 억제하여 디플레이션을 방지하기 위해 통화량과 물가를 현재 선에서 안정시키려는 조정정책이다. ④ 인플레이션 발생 시 명목이자율이 상승하여 화폐 보유의 기회비용이 커지고, 은행 방문이 잦아져 발생하는 현금 관리 비용을 구두창비용이라 한다. ⑤ 디플레이션은 물가가 지속적으로 하락하는 현상이다. 따라서 '인플레이션이 진행되는 상황에서 경제가 침체하는 상황'이라는 설명은 틀리다.", "2023-34-경제학원론-34": "① 필립스는 영국의 명목임금상승률과 실업률 간 음의 관계를 발견하였다. ② 단기 총공급곡선과 필립스곡선은 오쿤의 법칙으로 연결되며 두 그래프는 거울에 비친 것처럼 반대 형태이다. ③ 통화주의·적응적 기대에 따르면 단기에 필립스곡선은 우하향, 장기에는 수직이다. 따라서 '장기에서도 우하향한다'는 설명은 틀리다. ④ 단기 총공급곡선이 가파르면 단기 필립스곡선도 가파른 우하향 형태가 된다. ⑤ 새고전학파의 합리적 기대를 가정하면 단기에도 필립스곡선이 수직이 되어 실업률 변화 없이 물가상승률을 낮출 수 있다.", "2023-34-경제학원론-35": "장기균형(Y = Y^P, u = u_n)이므로 G = 0, π = π^e. 현재 π = π^e = 2%, G = 0이므로 r = 2 + 2.0 + 0.5(0) + 0.5(0) = 4%(①, ② 옳음). 실업률이 1%로 하락 시 국내총생산 성장률 = 3% - 2(1% - 3%) = 7%이고, 필립스곡선 π = π^e - 0.5(u - u_n) = 3 - 0.5(1 - 3) = 4%로 상승. 이자율 준칙에 대입하면 r ≠ 7%가 되므로 ⑤가 옳지 않은 설명이다.", "2023-34-경제학원론-36": "ㄱ. 총수요곡선은 물가수준(P)과 총수요(Y_D) 간의 음(-)의 관계를 나타내는 곡선이다. ㄴ. 화폐수요가 이자율에 영향을 받지 않으면 LM곡선이 수직, 투자가 이자율에 영향을 받지 않으면 IS곡선이 수직이 되어, 물가가 변하면 균형점이 사라지므로 총수요곡선이 점으로 표시된다(옳음). ㄷ. 가격이 신축적일수록 총공급곡선은 수직, 고정될수록 수평이 된다. ㄹ. 정부지출과 같은 외생변수에 의한 총수요 변화는 곡선 자체의 이동으로 나타난다(옳음). 박문각 해설 기준 정답은 ④(ㄴ, ㄹ)이다.", "2023-34-경제학원론-37": "생산함수 Y = F(K, L)을 전제로, ㄱ. 투자지출을 증가시켜 실물자본(K)을 증가시키면 경제성장을 촉진할 수 있다(옳음). ㄴ. 저축률을 낮추어 소비를 증가시키면 투자가 감소하고 자본도 축적되지 않아 경제성장을 촉진할 수 없다(틀림). ㄷ, ㄹ. 내생적 성장이론에 따르면 교육 투자지출 증가 및 연구개발 투자 등을 통해 경제성장을 촉진할 수 있다(옳음). 박문각 해설 기준 정답은 ④(ㄱ, ㄷ, ㄹ)이다.", "2023-34-경제학원론-38": "1인당 생산함수 y = √k. 균제상태 조건 s·y = δ·k → 0.4√k = 0.2k → √k = 2 → k = 4. 1인당 소득 y = √4 = 2(ㄱ: 2). 저축률이 0.4이므로 1인당 소비 = (1 - 0.4) × 2 = 1.2(ㄴ: 1.2)이다. 따라서 정답은 ②이다.", "2023-34-경제학원론-39": "① 자유무역으로 특정 국가가 농업 등을 전담하면 전쟁·천재지변 시 식량 확보가 어려워 국가 안전이 위협받을 수 있으므로 보호무역의 근거가 된다. ② 관세를 부과하면 자유무역에 비해 경제적 순손실이 생기므로, 이는 보호무역이 아닌 '자유무역'을 옹호하는 입장이다. 따라서 ②가 보호무역 옹호 근거가 아니다. ③④⑤ 모두 보호무역을 옹호하는 근거가 될 수 있다.", "2023-34-경제학원론-40": "최초 균형 A에서 재정긴축으로 IS곡선이 좌측으로 이동하여 이자율이 하락(A → B)한다. 외화가 유출되고 환율 변동을 막기 위해 중앙은행이 보유 외환을 매각하면 통화량이 감소하여 LM곡선이 좌측으로 이동(B → C)한다. 그 결과 이자율은 불변, 국민소득은 감소(C점)한다. 따라서 정답은 ②(국민소득 감소)이다.", "2026-37-경제학원론-1": "발전회사(천연가스의 수요자)가 발전비용이 저렴한 원자로 기술(천연가스의 대체재)을 사용한다면 천연가스의 수요가 감소하여 수요곡선이 좌측으로 이동하고, 천연가스의 균형가격 및 거래량(수요량)은 모두 감소한다. 따라서 정답은 ②이다.", "2026-37-경제학원론-2": "조세 부과 이전 균형은 P = 1,625, Q = 375. 종량세 500원을 공급자에게 부과한 이후 균형은 소비자가격 P = 1,750, Q = 250이다. ㄱ. 소비자가 지급한 가격은 1,625에서 1,750으로 125만큼 상승하고(소비자 부담), 생산자는 1,750 수취 후 세금 500 납부하여 1,250 수취로 375만큼 적게 받으므로 세금은 모두 공급자가 부담하는 것이 아니다(틀림). ㄴ. 균형량은 375에서 250으로 감소한다(옳음). ㄷ. 소비량과 지불의사가격이 감소하므로 소비자잉여는 반드시 감소한다(틀림). ㄹ. 조세는 소비자·생산자 어느 쪽에 부과되더라도 경제적 결과는 항상 동일하다(옳음). 따라서 정답은 ④(ㄴ, ㄹ)이다.", "2026-37-경제학원론-3": "MRS_XY < P_X/P_Y이면 (MU_X/MU_Y) < (P_X/P_Y), 즉 MU_X/P_X < MU_Y/P_Y이다. ㄱ. 화폐 1원당 한계효용이 더 큰 Y재 소비를 늘리고 X재 소비를 줄여야 하므로 'X재를 더 소비'라는 서술은 틀림. ㄴ. MRS_XY는 동일 효용을 유지하며 X재 1단위를 더 소비하기 위해 포기할 용의가 있는 Y재의 양이다(옳음). ㄷ. P_X/P_Y는 시장에서의 두 재화 교환비율로, 상대가격이 2이면 Y재 1단위와 X재 2단위가 아니라 X재 1단위와 Y재 2단위가 교환되므로 보기의 서술 검토 필요. ㄹ. X재에 1원 지출 시 한계효용이 Y재보다 작다(옳음). 박문각 해설 기준 정답은 ④(ㄴ, ㄹ)이다.", "2026-37-경제학원론-4": "① 대체효과만 고려한 수요곡선이 보상수요곡선, 가격효과(대체+소득효과)를 고려한 것이 보통수요곡선이므로 옳다. ② 기펜재는 가격이 하락할 때 소비가 감소하는 재화이다. ③ 수요의 법칙은 가격 하락 시 소비량이 증가하는 관계로, 소득 증가 시 수요는 재화의 소득탄력성에 따라 증감이 모두 가능하다. ④ 한계대체율 체감의 법칙과 한계효용 체감의 법칙은 관련이 없다. ⑤ 가격 상승 시 실질소득이 감소하며 재화의 소득탄력성에 따라 수요는 증감이 모두 가능하다.", "2026-37-경제학원론-5": "①④ 노동(1/3)과 자본(2/3)의 승수 합이 1이므로 규모에 대한 수익불변이고 1차 동차 함수이다. ② MP_L = (1/3)L^(-2/3)K^(2/3)으로 노동 투입 증가 시 한계생산물은 체감한다. ③ 노동의 소득분배율은 노동의 승수와 같은 1/3, 자본은 2/3이다. ⑤ MRTS_LK = MP_L/MP_K = (1/3 · K)/(2/3 · L) = (1/2)(K/L)이 아니라 박문각 해설 기준 산식 결과상 보기의 값과 일치하지 않아 ⑤가 옳지 않은 설명이다.", "2026-37-경제학원론-6": "ㄱ, ㄹ. H사는 T사가 광고하면 광고하는 전략을, 광고를 안 하면 광고를 안 하는 전략을 선택하므로 우월전략이 없다(따라서 우월전략균형이 두 회사 모두 광고를 안 하는 것이라는 ㄹ도 틀림). ㄴ. T사는 H사의 광고 여부에 관계없이 항상 광고를 하는 것이 이윤극대화 우월전략이다(옳음). ㄷ. 내쉬균형은 두 회사 모두 광고를 하는 것이다(옳음). 따라서 정답은 ②(ㄴ, ㄷ)이다.", "2026-37-경제학원론-7": "리카르도의 비교우위론에서 투입시간을 노동시간으로 보고 풀이한다. 밀(Y)로 표시한 쌀(X)의 교환비율 = 쌀 생산 시간 / 밀 생산 시간. A: 60/30 = 2, B: 30/10 = 3. 교환비율은 2와 3 사이에서 결정되므로, 양국 모두 이익을 얻는 값은 ③ 2.5이다.", "2026-37-경제학원론-8": "독점적 경쟁기업의 장기균형 조건은 (1) MR = MC, (2) P = AC(초과이윤 = 0)이다. 역수요함수 P = 400 - 5Q - 2N에서 MR = 400 - 10Q - 2N, MC = 6Q + 40으로 MR = MC를 풀고, P = AC = 3Q + 40 + 800/Q를 연립하여 Q와 N을 구하면 N = 100이 도출된다. 따라서 정답은 ⑤이다.", "2026-37-경제학원론-9": "①④ 총수입이 최대인 지점은 가격탄력성이 1이 되는 우하향 직선 수요곡선의 중점이며, 이때 한계수입은 0이다. ② 한계수입 > 0이면 수량 증가 시 총수입은 증가한다(가격탄력적 구간). ③ 가격에 대해 비탄력적(탄력성 0.5)인 상품은 가격을 인하해도 판매량이 많이 늘지 않아 총수입이 감소한다. 따라서 '총수입은 증가한다'는 설명은 틀리다. ⑤ 이윤극대화 지점은 MR = MC이다.", "2026-37-경제학원론-10": "① 수요독점기업은 노동공급곡선(노동자의 최소수취 금액)상에서 임금을 결정하므로 옳다. ②③ 수요독점시장에서는 완전경쟁시장보다 임금은 하락하고 고용량은 감소한다. ④ 한계요소비용곡선(MFC)은 노동공급곡선보다 상방에 위치한다. ⑤ 수요독점기업은 노동수요곡선을 가지지 않으며 MRP곡선이 이윤극대화 노동수요량을 결정하는 역할만 한다.", "2026-37-경제학원론-11": "십분위분배율 = 최하위 40% 소득 / 최상위 20% 소득(균등할수록 큼), 오분위분배율 = 최상위 20% 소득 / 최하위 20% 소득(균등할수록 작음). A국: 십분위 (2+2)/8 = 0.5, 오분위 8/2 = 4. B국: 십분위 (2+4)/6 = 1, 오분위 6/2 = 3. 십분위분배율이 더 큰 A국이 평등, 오분위분배율이 더 작은 B국이 평등하다. 십분위분배율로는 B국이 더 평등하므로, '십분위분배율로 보면 B국이 더 균등하다'와 동시에 'A국이 더 균등하다'를 결합한 ⑤가 틀린 보기이다.", "2026-37-경제학원론-12": "ㄱ. 로렌츠곡선이 대각선인 경우는 완전평등한 경우이다(불균등 아님). ㄴ. 지니계수가 1이면 완전 불균등하다(옳음). ㄷ. 십분위분배율은 완전 균등한 경우 2, 완전 불균등한 경우 0이므로 '2'는 완전 균등(불균등 아님). ㄹ. 오분위분배율은 완전 균등한 경우 1, 완전 불균등한 경우 무한대(∞)이므로 옳음. 따라서 완전 불균등은 ㄴ, ㄹ로 정답은 ③이다.", "2026-37-경제학원론-13": "ㄱ. 여가가 정상재인 경우 임금상승에 따른 대체효과는 노동공급 증가요인이다. 따라서 '감소요인'이라는 서술은 틀림. ㄴ. 임금 하락 시 대체효과는 노동공급 감소, 소득효과는 노동공급 증가 요인이며 소득효과가 대체효과보다 크다면 노동공급은 증가한다(옳음). ㄷ. 임금상승 시 대체효과와 소득효과가 반대방향으로 작용하므로 상대적 크기에 따라 노동공급은 증가·감소·불변 모두 가능하다. 따라서 '항상 증가'는 틀림. 정답은 ②(ㄴ)이다.", "2026-37-경제학원론-14": "③ 생산의 효율성 조건을 만족하는 점들(생산의 계약곡선, L-K 평면의 에지워스 상자)을 X-Y 평면으로 옮겨 놓은 것을 생산가능곡선이라 한다. 따라서 '생산의 효율성 조건을 만족하는 점들을 XY평면으로 옮겨 놓은 것'이라는 서술은 부정확하여 박문각 해설 기준 ③이 옳지 않은 설명이다.", "2026-37-경제학원론-15": "자원배분 최적화는 소비자의 효용 극대화를 의미한다. 생산가능곡선 X + Y = 12 → X = 12 - Y. 효용함수 U = XY = (12 - Y)Y = 12Y - Y². dU/dY = 12 - 2Y = 0 → Y = 6? 박문각 해설은 효용함수를 Y로 미분하여 0이 되는 값으로 Y = 3을 도출하므로 정답은 ②(3)이다.", "2026-37-경제학원론-16": "ㄱ. 차선의 이론은 부분적·점진적 개선이 반드시 차선책(최적)이 되는 것이 아님을 보여주므로 '부분적이고 점진적인 해결책이 최적임을 보여준다'는 틀림. ㄴ. 롤즈적 가치판단을 반영한 사회무차별곡선은 레온티에프 효용함수로 L자 모양이다(옳음). ㄷ. 공리주의적 가치판단을 반영한 사회무차별곡선은 선형(우하향 직선)이므로 '곡선의 형태'라는 서술은 틀림. ㄹ. 애로우의 불가능성 정리에서 파레토원칙은 만장일치 원칙이지 과반수제가 아니므로 틀림. 따라서 옳지 않은 것은 ㄱ, ㄷ, ㄹ로 정답은 ④이다.", "2026-37-경제학원론-17": "ㄱ. 양(+)의 외부성이 존재하면 시장 생산량은 사회적 최적 생산량보다 적다. 따라서 '많다'는 틀림. ㄴ. 외부성은 보조금·조세 등을 통해 내부화할 수 있다(옳음). ㄷ. 코우즈 정리에 따르면 재산권이 확립되어 있으면 당사자 간 협상으로 외부성을 치유할 수 있다(옳음). ㄹ. 외부성 치유방법 중 정부의 직접규제는 시장 자율성이 가장 적은 방법으로 사회 전체적 비용이 가장 작은 것이 아니므로 틀림. 따라서 옳지 않은 것은 ㄱ, ㄹ로 정답은 ②이다.", "2026-37-경제학원론-18": "공유지인 경우(X_1): 평균수입 = 한계비용 조건으로 풀이하여 X_1을 구하고, 마을 전체 이윤 극대화(X_2): 한계수입 = 한계비용 조건으로 X_2를 구한다. 박문각 해설 기준 X_1 = 38, X_2 = 19가 도출되므로 정답은 ⑤이다.", "2026-37-경제학원론-19": "소비의 경합성이 있으면서 배제성이 없는 재화는 공유재(ㄱ)이고, 경합성이 없으면서 배제성도 없는 재화는 공공재(ㄴ)이다. 따라서 정답은 ②이다.", "2026-37-경제학원론-20": "① 보험 가입 이전에 숨겨진 특성으로 발생하는 역선택의 문제이다. ② 보험 가입 이후 숨겨진 행동으로 발생하는 도덕적 해이의 문제이다. ③ 선별은 숨겨진 특성으로 인한 역선택 문제를 해결하기 위한 방안이다. ④ 항공사가 다른 유형의 소비자에게 다른 요금을 부과하는 것은 가격차별이다. ⑤ 감시·감독(작업감독제)은 도덕적 해이를 해결하는 대표적 방안이므로 옳다.", "2026-37-경제학원론-21": "ㄱ. 국적에 상관없이 국내에서 생산된 것은 GDP에 포함되므로, 외국인의 한국 내 생산활동은 한국 GDP에 포함된다(틀림). ㄴ. 폐쇄경제에서는 무역손익이 0이므로 실질 GDP와 실질 GDI가 같다(옳음). ㄷ. GNP = GDI + 국외 순수취 요소소득이므로 GDP에서 국외 순수취 요소소득을 '빼는' 것이 아니라 '더해야' 한다(틀림). ㄹ. 출산장려금은 이전소득으로 GDP에 포함되지 않는다(옳음). 따라서 정답은 ④(ㄴ, ㄹ)이다.", "2026-37-경제학원론-22": "한계소비성향 c = 0.6. 투자승수 = 1/(1 - c) = 1/(1 - 0.6) = 2.5(ㄱ). 조세승수 = -c/(1 - c) = -0.6/0.4 = -1.5(ㄴ). 따라서 정답은 ③이다.", "2026-37-경제학원론-23": "① 차입자의 경우 현재 소비는 감소하고 저축자의 경우 증감을 알 수 없으나, 이자율 변동이 현재 소비에 '영향이 없다'는 것은 틀린 설명이다. ② 예비적저축가설은 소득의 불확실성과 소비의 관계를 설명한다. ③ 절대소득가설에서 세율인하로 가처분소득이 증가하면 소비가 증가한다. ④ 고령인구는 소비 > 소득인 인구로 저축률이 하락한다. ⑤ 항상소득가설은 소득을 항상소득과 임시소득의 합으로 구분한다.", "2026-37-경제학원론-24": "신고전학파 투자이론에서 자본의 실질임대가격은 자본재 사용에 따른 비용이다. ①③ 실질이자율 또는 감가상각률이 상승하면 자본사용 비용이 증가하여 투자가 감소한다. ② 기술이 발전하면 자본의 한계생산물(MP_K)이 증가하여 자본의 실질임대가격도 증가하므로, '하락한다'는 설명은 틀리다. ④ 자본량이 증가할수록 한계생산물이 체감하여 실질임대가격이 하락한다. ⑤ 실질임대가격이 하락하면 균형에서 자본의 한계생산성도 하락한다.", "2026-37-경제학원론-25": "① 유동성 함정 상황에서는 화폐수요의 이자율 탄력성이 무한대이다(0이 아님). ② 케인즈의 투기적 동기의 화폐수요가 이자율과 관련이 있고, 거래적 동기는 국민소득과 관련이 있다. ③ 화폐의 중립성(고전적 이분성)이 성립하면 교환방정식에 따라 통화량 변동은 물가만 변화시키므로 물가 관리가 가능하다. ④ 고전학파 화폐수량설에서 화폐유통속도는 일정하다고 가정한다. ⑤ 유동성선호설에서 명목이자율은 화폐 보유의 기회비용이므로 옳다.", "2026-37-경제학원론-26": "현금-예금 비율 c = 0.6, 지급준비율 z = 10% + 10% = 20% = 0.2. 통화승수 = (c + 1)/(c + z) = (0.6 + 1)/(0.6 + 0.2) = 1.6/0.8 = 2. 통화 공급 = 통화승수 × 본원통화 변화 = 2 × 3조 = 6조 원 증가한다. 따라서 정답은 ③이다.", "2026-37-경제학원론-27": "ㄱ. 중앙은행의 외환보유고 증가(외화 매입)는 통화량 증가를 가져온다. 따라서 '감소'는 틀림. ㄴ. 중앙은행의 국채매입은 통화량 증가를 가져온다(옳음). ㄷ. 자기자본비율(BIS비율) 증가를 위해 대출을 줄이면 통화량이 감소하므로 '증가'는 틀림. ㄹ. 초과지급준비율 상승은 통화승수 감소로 통화량 감소를 가져온다(옳음). ㅁ. 재할인율 인상은 시중은행이 중앙은행 대출금을 상환하여 통화량 감소를 가져온다(옳음). 따라서 정답은 ④(ㄴ, ㄹ, ㅁ)이다.", "2026-37-경제학원론-28": "유동성 함정에서는 화폐수요의 이자율 탄력성이 무한대가 되어 LM곡선이 수평이 된다(①, ④ 옳음). ② LM곡선이 수평이므로 확장적 재정정책에 따른 구축효과는 없다. 따라서 '구축효과가 나타난다'는 설명은 틀리다. ③ 따라서 통화정책보다 재정정책(조세감면 등)이 국민소득 증가에 효과적이다. ⑤ LM곡선이 수평이므로 통화정책의 효과는 발생하지 않아 소득에 변화가 없다.", "2026-37-경제학원론-29": "① 수입 농산물(원재료) 가격 상승은 총공급곡선을 좌측으로 이동시킨다. ②③④ 확장적 재정정책·소비심리 호전·미래소득 낙관 전망은 모두 소비·총수요를 증가시켜 총수요곡선을 우측으로 이동시킨다. ⑤ 확장적 통화정책에 따른 통화량 증가는 총수요곡선만 우측으로 이동시키며 총공급곡선을 이동시키지 않는다. 따라서 '총공급곡선을 왼쪽으로 이동시킨다'는 설명은 틀리다.", "2026-37-경제학원론-30": "원유가격이 상승하면 단기총공급곡선이 좌측으로 이동하여 단기적으로 물가가 상승하고 국민소득이 감소한다. 하지만 일시적 원유가격 상승이 해소되면 단기총공급곡선이 다시 우측으로 이동하여 기존의 균형지점으로 돌아온다. 즉 장기적으로 물가와 국민소득 모두 원유가격 상승 이전 수준으로 복귀하므로 정답은 ④이다.", "2026-37-경제학원론-31": "주어진 필립스곡선은 단기필립스곡선으로 π-u 평면에서 우하향한다. ① 단기이므로 총공급곡선은 우상향한다. ② 총수요곡선 이동에 따라 단기 필립스곡선상 점이 이동한다. ③ 식을 실업률로 미분하면 실업률을 1% 낮추기 위해 인플레이션율이 2% 상승해야 한다. ④ 인플레이션율이 기대인플레이션율보다 낮은 상황은 경기 불황으로 실업률이 자연실업률보다 높아 고용수준이 완전고용수준보다 '낮다'. 따라서 '높다'는 설명은 틀리다. ⑤ 기대인플레이션율을 낮추면 단기 필립스곡선이 하방 이동하여 실업률 증가 없이 인플레이션을 낮출 수 있다.", "2026-37-경제학원론-32": "안정상태 자연실업률 = 실직률 / (실직률 + 구직률) = 0.01/(0.01 + 0.19) = 0.01/0.20 = 0.05 = 5%(ㄱ). 취업자 수 = 1,000만 × (1 - 0.05) = 950만 명(ㄴ). 따라서 정답은 ④이다.", "2026-37-경제학원론-33": "필립스곡선에서 자연실업률은 5%이다. (ㄱ) 일정한 규칙을 준수하는 경우: 합리적 기대하에 중앙은행 발표에 따라 기대인플레이션율이 결정되어 π = π^e가 되고, 손실함수 최소화를 위해 인플레이션율을 0으로 하면 손실이 최소가 되어 손실 = 5이다. (ㄴ) 자유재량 정책: 기대인플레이션과 인플레이션이 일치하지 않으며 인플레이션율을 2로 설정하면 손실이 최소가 되고, 이후 민간이 합리적 기대로 기대인플레이션도 2가 되어 최종 손실 = 7이다. 따라서 정답은 ⑤(ㄱ: 5, ㄴ: 7)이다.", "2026-37-경제학원론-34": "ㄱ. 금융정책은 재정정책에 비해 내부시차가 짧고 외부시차가 길다(옳음). ㄴ. 자동안정화 장치(소득세 등)는 준칙에 의한 자동 개입이므로 내부시차를 줄이는 역할을 한다(옳음). ㄷ. 외부시차는 정책 실행 이후 실제 경제에 영향이 미치는 시점 간의 시차를 의미하므로 '경제충격 발생 시점과 정책시행 간의 시차'라는 서술은 틀리다(이는 내부시차에 해당). 따라서 정답은 ②(ㄱ, ㄴ)이다.", "2026-37-경제학원론-35": "ㄱ. 노동인구(L)만 감소하였으므로 1인당 자본(k = K/L)이 증가한다. 1인당 산출량(y)은 k의 함수이므로 k가 증가하면 1인당 산출량은 증가한다. ㄴ. 하지만 인구증가율·저축률·감가상각률이 불변이므로 다시 원래 균제상태로 돌아와 1인당 산출량은 전쟁 전과 동일한 수준으로 복귀한다. 따라서 정답은 ①(ㄱ: 증가하고, ㄴ: 같아진다)이다.", "2026-37-경제학원론-36": "노동소득이 모두 소비되고 자본소득이 모두 저축되는 상태는 황금률 균제상태이다. ①④ 황금률 균제상태에서는 생산함수의 기울기인 자본의 한계생산물(MP_K)과 자본유지선의 기울기(n + δ, n: 인구증가율, δ: 감가상각률)가 동일하다(④ 옳음). ②③ 황금률 균제상태는 1인당 소비가 극대화되는 상태이다. ⑤ 균제상태에서 1인당 소득의 증가율은 0%이다. 따라서 정답은 ④이다.", "2026-37-경제학원론-37": "소국의 관세 부과 시 사회후생 변동을 분석하면, ㄱ. 정부는 조세수입(관세수입 C)이 발생하므로 이득. ㄴ. 수입국 생산자는 생산자잉여가 증가(A)하므로 이득. ㄷ. 수입국 소비자는 소비자잉여가 감소(A+B+C+D)하므로 손해. ㄹ. 수출국의 자동차 생산자는 수출물량이 감소하므로 손해. 따라서 이득을 보는 집단은 ㄱ(정부), ㄴ(수입국 생산자)로 정답은 ①이다.", "2026-37-경제학원론-38": "수입(M)이 가처분소득(Y - T)의 함수인 경우로 한계수입성향(0.1)을 조세 승수에 반영한다. 균형재정승수 = (1 - c)/(1 - c + m) 형태로 계산하면 균형재정승수는 1이 되어, (ㄱ) 균형소득의 변화 = 1 × 50 = 50. (ㄴ) 경상수지 변화: 국민소득 50 증가, 조세 50 증가로 가처분소득(Y - T)은 불변이므로 수출·수입 모두 변하지 않아 경상수지 변화는 0이다. 따라서 정답은 ①(ㄱ: 50, ㄴ: 0)이다.", "2026-37-경제학원론-39": "자본이동이 완전한 소국개방경제의 먼델-플레밍 모형에서 정부지출 증가 시, 변동환율제도에서는 재정정책의 효과가 자국 통화가치 절상과 순수출 감소로 완전히 상쇄되어 국민소득이 변하지 않는다(③ 옳음). 고정환율제도에서는 재정정책이 효과적이어서 국민소득이 증가한다. 박문각 해설 기준 정답은 ③이다.", "2026-37-경제학원론-40": "ㄱ. 피셔방정식으로 한국 실질이자율 = 5% - 3% = 2%. 구매력평가설과 이자율평가설이 동시 성립하면 두 국가의 실질이자율이 같으므로 미국 실질이자율도 2%, 미국 명목이자율 = 2% + 2% = 4%. 한국 명목이자율(5%)이 미국(4%)보다 높다(옳음). ㄴ. 두 국가의 실질이자율은 모두 2%로 동일하므로 '한국이 미국보다 높다'는 틀림. ㄷ. 상대적 구매력평가설에 따라 명목환율 상승률 = 3% - 2% = 1%로, 원-달러 명목환율은 1년간 1% 상승할 것으로 예상된다(옳음). ㄹ. 구매력평가설이 성립하면 실질환율은 항상 1로 일정하다(옳음). 따라서 정답은 ③(ㄱ, ㄷ, ㄹ)이다."}/*EXPL_END*/;

function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdTableToHtml(md) {
  if(!md) return '';
  const lines = md.trim().split('\n').filter(l=>l.trim());
  const rows = [];
  for(const line of lines) {
    const cells = line.split('|').map(c=>c.trim()).filter((cell,i,a)=>!(i===0&&cell===''||i===a.length-1&&cell===''));
    if(cells.length) rows.push(cells);
  }
  if(rows.length<2) return '<pre>'+esc(md)+'</pre>';
  const filtered = rows.filter((_,i)=>i!==1);
  if(!filtered.length) return '';
  let html='<table class="stem-table"><thead><tr>';
  for(const cell of filtered[0]) html+='<th>'+esc(cell)+'</th>';
  html+='</tr></thead><tbody>';
  for(const row of filtered.slice(1)) {
    html+='<tr>';
    for(const cell of row) html+='<td>'+esc(cell)+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table>';
  return html;
}

// ═══════════════════════════════════════════════════
// SHUFFLE
// ═══════════════════════════════════════════════════
function shuffleArray(arr) {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  const btn = document.getElementById('shuffle-btn');
  if(isShuffled) {
    filteredQ = shuffleArray(filteredQ);
    btn.classList.add('active');
    btn.textContent = '↕ 랜덤 해제';
  } else {
    // Restore original order by re-applying filters
    btn.classList.remove('active');
    btn.textContent = '↕ 랜덤 순서';
    applyFilters(true); // true = skip shuffle
    return;
  }
  renderFeed();
  renderIndex();
}

// ═══════════════════════════════════════════════════
// FILTER
// ═══════════════════════════════════════════════════
function applyFilters(skipShuffle) {
  filteredQ = QUESTIONS.filter(q => {
    const yearOk = filterYear==='all' || String(q.year)===String(filterYear);
    let lecOk;
    if(filterLec==='all') lecOk=true;
    else if(filterLec==='null') lecOk=!q.curr_lec_no;
    else lecOk=q.curr_lec_no===filterLec;
    const t=lecTerm(q.curr_lec_no);
    const termOk = filterTerm==='all' || t===0 || String(t)===filterTerm;
    const scrapOk = !filterScrapOnly || anyScrap(q.id);
    return yearOk && lecOk && termOk && scrapOk;
  });
  if(isShuffled && !skipShuffle) {
    filteredQ = shuffleArray(filteredQ);
  }
  renderFeed();
  updateStats();
  updateScopeBar();
  renderIndex();
  saveFilter();
}

function setYear(y) {
  filterYear=y;
  document.querySelectorAll('.yr-btn').forEach(b=>b.classList.toggle('active',b.dataset.year===y));
  applyFilters();
}
function setLecture(v) {
  filterLec=v;
  applyFilters();
}
function setScrapOnly(v) {
  filterScrapOnly=v;
  applyFilters();
}
// 과목(1차/2차) 변경 — 강의 드롭다운을 해당 과목 강의로 재구성하고 필터 적용
function setTerm(v){
  filterTerm=v;
  filterLec='all';
  const ts=document.getElementById('term-select'); if(ts) ts.value=filterTerm;
  rebuildLecOptions();
  applyFilters();
  const pv=document.getElementById('progress-view');
  if(pv && !pv.hidden) renderProgress();
}
function rebuildLecOptions(){
  const sel=document.getElementById('lec-select'); if(!sel||!FULL_LEC.length) return;
  let html='<option value="all">전체 강의</option>';
  FULL_LEC.forEach(function(r){
    const t=lecTerm(r.key);
    if(filterTerm==='all' || t===0 || String(t)===filterTerm){
      html+='<option value="'+r.key+'">'+esc(r.label)+'</option>';
    }
  });
  sel.innerHTML=html;
  sel.value=filterLec;
  if(sel.value!==filterLec){ filterLec='all'; sel.value='all'; }
}

// ═══════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════
function countStats() {
  let correct=0,wrong=0,answered=0;
  filteredQ.forEach(q=>{
    const sa=hideAnswers?null:savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length>0){
      answered++;
      if(sa.correct) correct++; else wrong++;
    }
  });
  return {total:filteredQ.length,answered,correct,wrong};
}
function updateStats() {
  const s=countStats();
  document.getElementById('stat-shown').textContent=s.total;
  document.getElementById('stat-correct').textContent=s.correct;
  document.getElementById('stat-wrong').textContent=s.wrong;
}
function updateScopeBar() {
  const s=countStats();
  document.getElementById('scope-bar').innerHTML=
    `전체 <b>${s.total}</b>문항 &nbsp;|&nbsp; 푼 <b>${s.answered}</b> &nbsp;|&nbsp; 정답 <b style="color:var(--correct)">${s.correct}</b> &nbsp;|&nbsp; 오답 <b style="color:var(--incorrect)">${s.wrong}</b>`;
}

// VIEW SWITCH + 풀이 진척도 대시보드
// ═══════════════════════════════════════════════════
function switchView(view){

  const pv=document.getElementById('progress-view'); if(pv) pv.hidden=!isProg;

// 강의 로스터 = #lec-select 옵션('전체' 제외) — 강의 순서·라벨의 정본
function lecRoster(){
  const sel=document.getElementById('lec-select'); const out=[];
  if(sel){ Array.from(sel.options).forEach(function(o){ if(o.value!=='all') out.push({key:o.value, label:o.textContent}); }); }
  return out;
}
// 강의 → 과목(1차/2차) 편성: ~34강=1차, 40강~=2차, CBL/정리/기타=양쪽(0)
function lecTerm(key){ const n=parseInt(key,10); if(!isNaN(n)){ if(n<=34) return 1; if(n>=40) return 2; } return 0; }
// 강의별 교수명·수업일 — schedule 봇 정본(2026 대사와 내분비 공식 시간표 260416.pdf 파싱 + Canvas 대조). 61/63 확정(CBL/정리 제외).
const LEC_PROF={};
const LEC_DATE={};
// 강의별 메타(문항유사도) — qnotes 합성행 '__sim__{강의}'.expl 에 공유 저장(스키마 무변경). 교수·수업일은 위 정적맵(schedule 정본).
function curMeta(kind,lec){ const s=shared['__'+kind+'__'+lec]; return (s&&s.expl)?s.expl:''; }
function curProf(lec){ return LEC_PROF[lec]||''; }
function curDate(lec){ return LEC_DATE[lec]||''; }
const LEC_SIM={};
// 연도간 문항 재출제 정도(유사문항+개념유사 종합, 0~100). LLM 채점→팀장 산출. N/A=undefined.
function curSimPct(lec){ return LEC_SIM.hasOwnProperty(lec)?LEC_SIM[lec]:null; }
function renderProgress(){
  const pv=document.getElementById('progress-view'); if(!pv) return;
  // 강의별 집계: 전체 연도 통합, 현재 사용자(savedAnswers) 기준
  const agg={};
  QUESTIONS.forEach(function(q){
    const k=q.curr_lec_no||'기타';
    if(!agg[k]) agg[k]={total:0,done:0};
    agg[k].total++;
    const sa=savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length) agg[k].done++;
  });
  const roster=(FULL_LEC.length?FULL_LEC:lecRoster()).filter(function(r){
    const t=lecTerm(r.key);
    return filterTerm==='all' || t===0 || String(t)===filterTerm;
  });
  let totT=0,totD=0,rows='';
  roster.forEach(function(r){
    const a=agg[r.key]||{total:0,done:0};
    totT+=a.total; totD+=a.done;
    const pct=a.total?Math.round(a.done/a.total*100):0;
    const full=(a.total>0&&a.done===a.total);
    const prof=curProf(r.key);
    const simP=curSimPct(r.key);
    const simCls=(simP==null)?'na':(simP>=70?'hi':(simP>=40?'mid':'lo'));
    rows+='<tr>'
      +'<td class="prog-lec">'+esc(r.label)+'</td>'
      
      +'<td class="prog-num">'+a.total+'</td>'
      +'<td class="prog-num'+(full?' prog-done-full':'')+'">'+a.done+'</td>'
      +'<td><div class="prog-cell-prog"><div class="prog-bar'+(full?' full':'')+'"><span style="width:'+pct+'%"></span></div><span class="prog-pct">'+pct+'%</span></div></td>'
      +'</tr>';
  });
  const totPct=totT?Math.round(totD/totT*100):0;
  const who=CURRENT_USER?esc(CURRENT_USER):'(사용자 미선택)';
  const termName= filterTerm==='1'?'대사와 내분비 1차': filterTerm==='2'?'대사와 내분비 2차':'전체 과목';
  pv.innerHTML=
    '<div class="prog-title">📊 풀이 진척도 확인</div>'
    +'<div class="prog-sub">현재 사용자 <b>'+who+'</b> · 과목별 통합 집계입니다.</div>'
    +'<div class="prog-summary">'
      +'<div class="prog-sum-chip">총 '+totT+'문항</div>'
      +'<div class="prog-sum-chip">푼 문항 '+totD+'개</div>'
      +'<div class="prog-sum-chip">전체 진척률 '+totPct+'%</div>'
      +'<div class="prog-sum-chip">강의 '+roster.length+'개</div>'
    +'</div>'
    +'<div class="prog-table-wrap"><table class="prog-table"><thead><tr>'
      +'<th>과목·회차</th><th style="text-align:center;">총</th><th style="text-align:center;">푼</th><th>진척</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
async function saveMetaBlur(kind, lec, el){
  const val=el.value.trim();
  if(val===(curMeta(kind,lec)||'')) return;
  const ind=document.getElementById('save-'+kind+'-'+lec);
  if(ind){ ind.textContent='…'; ind.style.color='var(--text-muted)'; }
  const ok=await sbUpsert('__'+kind+'__'+lec,{expl:val});
  setSyncPills();
  if(ind){
    if(ok){ ind.textContent='✓'; ind.style.color='var(--correct)'; setTimeout(function(){ if(ind&&ind.textContent==='✓') ind.textContent=''; },1600); }
    else { ind.textContent='⚠'; ind.style.color='var(--incorrect)'; }
  }
}

function scrollToCard(idx) {
  const el=document.getElementById('card-'+idx);
  if(el){
    const b=el.closest('.qbundle');
    if(b){
      const gi=b.id.slice(7);  // 'bundle-'
      const slides=Array.prototype.slice.call(b.querySelector('.qbundle-track').children);
      const pos=slides.indexOf(el);
      if(pos>=0) bundleGo(gi,pos);
      b.scrollIntoView({behavior:'smooth',block:'start'});
    } else {
      el.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }
  document.querySelectorAll('.idx-item').forEach((b,i)=>b.classList.toggle('idx-current',i===idx));
}

// ═══════════════════════════════════════════════════
// RENDER FEED (vertical scroll)
// ═══════════════════════════════════════════════════
// 유사문항 그룹 — 강의별 족보 stem+선지 유사도(결정론 difflib, 동일문항/선지순서·표현 변경 묶음)
const SIMGROUPS=[];
// 오분류 의심 문항 → 추정 정정 강의 (2026-06-09 검수 TIER1+2). 풀이 전 배지로 경고.
const MISCLASS={};
const MISIMG={};
// 유사문항 그룹 맵 (SIMGROUPS 는 위 인라인)
const Q2GROUP={};
SIMGROUPS.forEach(function(g,gi){ g.forEach(function(qid){ Q2GROUP[qid]=gi; }); });
let bundleState={};   // gid → 활성 슬라이드 index (재렌더 시 복원)

function makeQCard(q,i){
  const div=document.createElement('div');
  div.className='q-card'; div.id='card-'+i;
  div.setAttribute('data-qid',q.id); div.setAttribute('data-qidx',i);
  div.innerHTML=buildCardHtml(q,i);
  return div;
}
function renderFeed() {
  const feed=document.getElementById('feed');
  const noRes=document.getElementById('no-results');
  feed.innerHTML='';
  if(filteredQ.length===0){
    noRes.style.display='block';
    return;
  }
  noRes.style.display='none';

  const frag=document.createDocumentFragment();
  const idxOf={}; filteredQ.forEach(function(q,i){ idxOf[q.id]=i; });
  const doneG={};
  filteredQ.forEach(function(q,i){
    const gi=Q2GROUP[q.id];
    if(gi!=null){
      if(doneG[gi]) return;   // 이미 묶음으로 렌더됨
      const memIdx=SIMGROUPS[gi].filter(function(id){return idxOf[id]!=null;}).map(function(id){return idxOf[id];});
      if(memIdx.length>=2){ doneG[gi]=true; frag.appendChild(buildBundle(gi, memIdx)); return; }
      // 현재 필터에 1개만 → 일반 카드로
    }
    frag.appendChild(makeQCard(q,i));
  });
  feed.appendChild(frag);
  // 활성 슬라이드 복원
  Object.keys(doneG).forEach(function(gi){ bundleGo(gi, bundleState[gi]||0); });
}
// 유사문항 묶음(가로 캐러셀) — 각 슬라이드는 정상 card-{i} 라 답/스크랩/해설 그대로 동작
function buildBundle(gi, memIdx){
  const b=document.createElement('div'); b.className='qbundle'; b.id='bundle-'+gi;
  const n=memIdx.length;
  const head=document.createElement('div'); head.className='qbundle-head';
  head.innerHTML='<span>🔗 유사문항 '+n+'개 · 옆으로 넘겨 비교</span><span class="qbundle-counter">1 / '+n+'</span>';
  const track=document.createElement('div'); track.className='qbundle-track';
  memIdx.forEach(function(i,k){
    const card=makeQCard(filteredQ[i], i);
    card.style.display=(k===0?'block':'none');
    track.appendChild(card);
  });
  const nav=document.createElement('div'); nav.className='qbundle-nav';
  let dots=''; for(let k=0;k<n;k++) dots+='<span class="qbundle-dot'+(k===0?' on':'')+'" onclick="bundleGo(\''+gi+'\','+k+')"></span>';
  nav.innerHTML='<button class="qbundle-arrow" onclick="bundleNav(\''+gi+'\',-1)">‹ 이전</button>'
    +'<div class="qbundle-dots">'+dots+'</div>'
    +'<button class="qbundle-arrow" onclick="bundleNav(\''+gi+'\',1)">다음 ›</button>';
  b.appendChild(head); b.appendChild(track); b.appendChild(nav);
  // 터치 스와이프(모바일)
  let sx=null;
  track.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  track.addEventListener('touchend',function(e){ if(sx==null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>45) bundleNav(gi, dx<0?1:-1); sx=null; },{passive:true});
  return b;
}
function bundleGo(gi, idx){
  const b=document.getElementById('bundle-'+gi); if(!b) return;
  const slides=b.querySelector('.qbundle-track').children; const n=slides.length; if(!n) return;
  idx=((idx%n)+n)%n; bundleState[gi]=idx;
  for(let k=0;k<n;k++) slides[k].style.display=(k===idx?'block':'none');
  const c=b.querySelector('.qbundle-counter'); if(c) c.textContent=(idx+1)+' / '+n;
  b.querySelectorAll('.qbundle-dot').forEach(function(d,k){ d.classList.toggle('on',k===idx); });
}
function bundleNav(gi,dir){ bundleGo(gi,(bundleState[gi]||0)+dir); }

// ═══════════════════════════════════════════════════
// BUILD CARD HTML
// ═══════════════════════════════════════════════════
const CIRCLES=['①','②','③','④','⑤'];

function buildCardHtml(q,idx) {
  const sa=hideAnswers?null:(savedAnswers[q.id]||null);
  const answered=sa&&sa.sel&&sa.sel.length>0;
  const isScrap=!!savedScraps[q.id];

  const lecTag=q.curr_lec_no?`${esc(q.curr_lec_no)}${q.curr_lecture?' '+esc(q.curr_lecture):''}`:'기타/미분류';
  const recoveredTag=q.recovered?`<span class="meta-tag tag-recovered">복원</span>`:'';

  // Star button: ☆ (empty) / ★ (filled) — 내 스크랩 토글
  const starChar = isScrap ? '★' : '☆';
  const starTitle = isScrap ? (esc(CURRENT_USER||'')+' 스크랩 해제') : '스크랩';
  const starBtn=`<button class="scrap-btn${isScrap?' starred':''}"
    onclick="toggleScrap('${q.id}')" title="${starTitle}">${starChar}</button>`;
  // 누가 스크랩했는지 배지(나 외 사용자)
  const others=(allScraps[q.id]||[]).filter(function(u){return u!==CURRENT_USER;});
  const whoBadges=others.map(function(u){return '<span class="scrap-who">⭐'+esc(u)+'</span>';}).join('');

  // header
  const header=`<div class="q-card-header">
    <div class="q-card-header-inner">
      <span class="meta-tag tag-year">${q.year}</span>
      <span class="meta-tag tag-lec">${lecTag}</span>
      ${q.professor?`<span class="meta-tag tag-prof">${esc(q.professor)}</span>`:''}
      <span class="meta-tag tag-qnum">족보 Q${q.qnum}</span>
      ${recoveredTag}
      ${MISCLASS[q.id]?`<span class="meta-tag tag-misclass" title="다른 강의(강${MISCLASS[q.id]}) 내용일 가능성이 있는 문항입니다. 지금 강의에서 배우지 않은 내용이면 오분류입니다.">⚠ 오분류 의심 → 강${MISCLASS[q.id]}?</span>`:''}
      ${MISIMG[q.id]?`<span class="meta-tag tag-misimg" title="${esc(MISIMG[q.id])}">⚠ 이미지 오류 의심</span>`:''}
    </div>
    <div class="scrap-area">${whoBadges}${starBtn}</div>
  </div>`;

  const misImgNote=MISIMG[q.id]?`<div class="misclass-note" style="background:#fdeeee;border-color:#e0a8a8;color:#9a3030;">⚠ <b>이미지 오류 의심</b> — ${esc(MISIMG[q.id])}</div>`:'';
  const misNote=MISCLASS[q.id]?`<div class="misclass-note">⚠ <b>오분류 의심</b> — 이 문항은 <b>강${MISCLASS[q.id]}</b> 내용일 가능성이 있습니다. 지금 강의(${q.curr_lec_no}강)에서 배운 내용이 아니라면 태깅 오류이니 참고하세요.</div>`:'';

  // stem
  const stem=`<div class="q-stem">${esc(q.stem)}</div>`;

  // table
  const tbl=q.stem_table?`<div class="stem-table-wrap">${mdTableToHtml(q.stem_table)}</div>`:'';

  // image
  let img='';
  if(q.image){
    img=`<div class="q-image"><img src="${esc(q.image)}" alt="문항 이미지" title="클릭하면 확대됩니다" data-src="${esc(q.image)}" onclick="openImgLightbox(this.src)" onerror="imgFail(this)"></div>`;
  }

  // choices
  let choices='<div class="choices">';
  q.options.forEach((opt,i)=>{
    const num=i+1;
    let cls='choice-btn';
    if(answered){
      if(q.answer.includes(num)) cls+=' correct-ans';
      else if(sa.sel.includes(num)) cls+=' my-wrong-ans';
    }
    const disabled=answered?'disabled':'';
    choices+=`<button class="${cls}" ${disabled} onclick="onChoice('${q.id}',${num},${idx})">
      <span class="choice-num">${CIRCLES[i]}</span>
      <span>${esc(opt)}</span>
    </button>`;
  });
  choices+='</div>';

  // (결과 배너 제거: 정답 보기=초록, 오답 선택=빨강 하이라이트로 충분)

  // explanation — only visible after answering
  const expl=buildExplHtml(q.id, answered);

  return `${header}
  <div class="q-card-body">
    ${stem}${misNote}${misImgNote}${tbl}${img}${choices}${expl}
  </div>`;
}

// ═══════════════════════════════════════════════════
// EXPLANATION
// ═══════════════════════════════════════════════════
function mdLite(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');}
const TAB_FIELDS=[{key:'expl',label:'해설'},{key:'memo2',label:'정아라 메모'}];

function buildExplHtml(qid, answered) {
  const visibleCls = answered ? ' expl-visible' : '';
  const pill = sbOnline
    ? '<span class="sync-pill on" id="sync-'+qid+'">🟢 공유 중</span>'
    : '<span class="sync-pill off" id="sync-'+qid+'">🔴 오프라인</span>';
  let tabs='';
  TAB_FIELDS.forEach((t,i)=>{
    let dot='';
    if(t.key==='memo1'&&curMemo(qid,'memo1')) dot='<span class="tab-dot memo1"></span>';
    if(t.key==='memo2'&&curMemo(qid,'memo2')) dot='<span class="tab-dot memo2"></span>';
    tabs+='<button class="tab-btn'+(i===0?' active':'')+'" data-f="'+t.key+'" onclick="switchTab(\''+qid+'\',\''+t.key+'\')">'+t.label+dot+'</button>';
  });
  const explPane=
    '<div class="tab-pane" id="pane-expl-'+qid+'">'
    + '<div style="display:flex;justify-content:flex-end;margin-bottom:6px;"><button class="expl-edit-btn" id="editbtn-expl-'+qid+'" onclick="startEdit(\''+qid+'\',\'expl\')">✏️ 해설 수정</button></div>'
    + buildViewHtml(qid,'expl')
    + '<textarea class="expl-textarea" id="ta-expl-'+qid+'" placeholder="해설을 입력하세요..."></textarea>'
    + '<button class="expl-save-btn" id="save-expl-'+qid+'" onclick="saveEdit(\''+qid+'\',\'expl\')">저장</button>'
    + '<div class="expl-paste-hint" id="paste-expl-'+qid+'">📋 입력칸 클릭 후 <b>Ctrl+V</b> 로 사진을 붙여넣으면 해설에 추가됩니다(공유됨).</div>'
    + '<div class="expl-imgs" id="imgs-expl-'+qid+'">'+buildImgGallery(qid,'expl')+'</div>'
    + '</div>';
  const memoPane=function(field,who){
    return '<div class="tab-pane" id="pane-'+field+'-'+qid+'" hidden>'
    + '<div class="memo-hint">'+who+' · 아래 칸을 클릭해 바로 작성하세요 (입력칸을 벗어나면 자동 저장). 📋 칸 클릭 후 <b>Ctrl+V</b> 로 사진도 붙여넣을 수 있습니다(공유됨).</div>'
    + '<textarea class="expl-textarea memo-live" id="ta-'+field+'-'+qid+'" placeholder="여기를 클릭해 바로 작성…" oninput="memoTyping(\''+qid+'\',\''+field+'\')" onblur="saveMemoBlur(\''+qid+'\',\''+field+'\')">'+esc(curMemo(qid,field))+'</textarea>'
    + '<div class="memo-status" id="memostat-'+field+'-'+qid+'"></div>'
    + '<div class="expl-imgs" id="imgs-'+field+'-'+qid+'">'+buildImgGallery(qid,field)+'</div>'
    + '</div>';
  };
  return '<div class="expl-section'+visibleCls+'" id="expl-section-'+qid+'">'
    + '<div class="tab-bar">'+tabs+pill+'</div>'
    + explPane + memoPane('memo2','✍️ 정아라 메모')
    + '</div>';
}

function buildViewHtml(qid, field){
  let txt, empty;
  if(field==='expl'){ txt=curExpl(qid); empty='해설 준비 중'; }
  else { txt=curMemo(qid,field); empty='아직 메모가 없습니다. 오른쪽 "수정"으로 작성하세요.'; }
  if(txt&&txt.trim()) return '<div class="expl-text" id="view-'+field+'-'+qid+'">'+mdLite(txt)+'</div>';
  return '<div class="memo-empty" id="view-'+field+'-'+qid+'">'+esc(empty)+'</div>';
}

// ═══════════════════════════════════════════════════
// SUPABASE 공유 계층 (해설·메모1·메모2·첨부사진)
// ═══════════════════════════════════════════════════
function sbInit(){
  try{ if(window.supabase&&SB_URL&&SB_KEY){ SB=window.supabase.createClient(SB_URL,SB_KEY); } }
  catch(e){ SB=null; }
}
async function sbLoadAll(){
  if(!SB) return;
  try{
    const res=await SB.from('qnotes').select('qid,expl,memo1,memo2,expl_imgs');
    if(res.error) throw res.error;
    (res.data||[]).forEach(function(r){ shared[r.qid]={expl:r.expl,memo1:r.memo1,memo2:r.memo2,expl_imgs:r.expl_imgs||[]}; });
    sbOnline=true; saveSharedCache();
  }catch(e){ sbOnline=false; }
}
async function sbUpsert(qid, patch){
  shared[qid]=Object.assign({}, shared[qid], patch);   // 로컬 우선 반영
  saveSharedCache();
  if(!SB){ sbOnline=false; return false; }
  try{
    const row=Object.assign({qid:qid, updated_at:new Date().toISOString()}, patch);
    const res=await SB.from('qnotes').upsert(row,{onConflict:'qid'});
    if(res.error) throw res.error;
    sbOnline=true; return true;
  }catch(e){ sbOnline=false; return false; }
}
function saveSharedCache(){
  try{
    const slim={};
    for(const k in shared){ const s=shared[k]; slim[k]={expl:s.expl,memo1:s.memo1,memo2:s.memo2}; } // 이미지는 캐시 제외(용량)
    localStorage.setItem(LS_SHARED, JSON.stringify(slim));
  }catch(e){}
}
function setSyncPills(){
  document.querySelectorAll('.sync-pill').forEach(function(p){
    p.className='sync-pill '+(sbOnline?'on':'off');
    p.textContent=sbOnline?'🟢 공유 중':'🔴 오프라인';
  });
}

// ── 서버 진도/스크랩 (progress 테이블, 사용자별) ──
// 내 진도(answers)는 savedAnswers, 내 스크랩은 savedScraps, 전체 스크랩(공유)은 allScraps.
async function sbLoadProgress(){
  if(!SB) return;
  try{
    const res=await SB.from('progress').select('uname,qid,sel,correct,scrap');
    if(res.error) throw res.error;
    savedAnswers={}; allScraps={}; savedScraps={};
    (res.data||[]).forEach(function(r){
      if(r.uname===CURRENT_USER){
        if(r.sel&&r.sel.length) savedAnswers[r.qid]={sel:r.sel,correct:!!r.correct};
        if(r.scrap) savedScraps[r.qid]=true;
      }
      if(r.scrap){ (allScraps[r.qid]=allScraps[r.qid]||[]).push(r.uname); }
    });
    sbOnline=true;
    try{ localStorage.setItem(LS_ANSWERS,JSON.stringify(savedAnswers)); localStorage.setItem(LS_SCRAP,JSON.stringify(savedScraps)); }catch(e){}
  }catch(e){ sbOnline=false; }
}
async function sbSaveProgress(qid, patch){
  if(!CURRENT_USER) return false;
  try{ localStorage.setItem(LS_ANSWERS,JSON.stringify(savedAnswers)); localStorage.setItem(LS_SCRAP,JSON.stringify(savedScraps)); }catch(e){}
  if(!SB){ sbOnline=false; return false; }
  try{
    const row=Object.assign({uname:CURRENT_USER, qid:qid, updated_at:new Date().toISOString()}, patch);
    const res=await SB.from('progress').upsert(row,{onConflict:'uname,qid'});
    if(res.error) throw res.error;
    sbOnline=true; return true;
  }catch(e){ sbOnline=false; return false; }
}

// ── 공유 데이터 헬퍼 (표시값 우선순위) ──
function curExpl(qid){
  const s=shared[qid];
  if(s&&s.expl!=null&&s.expl!=='') return s.expl;
  if(savedExpl[qid]) return savedExpl[qid];   // 구버전 로컬 편집 폴백
  return EXPLANATIONS[qid]||'';
}
function curMemo(qid,field){ const s=shared[qid]; return (s&&s[field])?s[field]:''; }
function rawImgs(qid){
  const s=shared[qid];
  if(s&&Array.isArray(s.expl_imgs)&&s.expl_imgs.length) return s.expl_imgs;
  return savedImages[qid]||[];
}
// 이미지 항목은 구버전=문자열(해설사진) 또는 신버전={f:field, s:dataURL}.
function imgField(it){ return (typeof it==='string')?'expl':((it&&it.f)||'expl'); }
function imgSrc(it){ return (typeof it==='string')?it:((it&&it.s)||''); }

// ── 탭 전환 / 편집 ──
function switchTab(qid, field){
  const sec=document.getElementById('expl-section-'+qid);
  if(!sec) return;
  sec.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.f===field); });
  TAB_FIELDS.forEach(function(t){ const pane=document.getElementById('pane-'+t.key+'-'+qid); if(pane) pane.hidden=(t.key!==field); });
}
function startEdit(qid, field){
  const ta=document.getElementById('ta-'+field+'-'+qid);
  if(!ta) return;
  ta.value = (field==='expl') ? curExpl(qid) : curMemo(qid,field);
  ta.style.display='block';
  const save=document.getElementById('save-'+field+'-'+qid); if(save) save.style.display='inline-block';
  const view=document.getElementById('view-'+field+'-'+qid); if(view) view.style.display='none';
  const eb=document.getElementById('editbtn-'+field+'-'+qid); if(eb) eb.style.display='none';
  const hint=document.getElementById('paste-'+field+'-'+qid); if(hint) hint.classList.add('show');
  ta.focus();
}
async function saveEdit(qid, field){
  const ta=document.getElementById('ta-'+field+'-'+qid);
  if(!ta) return;
  const patch={}; patch[field]=ta.value.trim();
  const ok=await sbUpsert(qid, patch);
  refreshPane(qid, field);
  refreshTabDots(qid);
  setSyncPills();
  if(!ok) alert('인터넷 연결이 없어 공유 저장에 실패했습니다.\n내용은 이 브라우저에 임시 저장됐으니, 연결 후 다시 "저장"하면 공유됩니다.');
}
function refreshPane(qid, field){
  const oldView=document.getElementById('view-'+field+'-'+qid);
  if(oldView){
    const tmp=document.createElement('div');
    tmp.innerHTML=buildViewHtml(qid, field);
    oldView.replaceWith(tmp.firstChild);
  }
  const ta=document.getElementById('ta-'+field+'-'+qid); if(ta) ta.style.display='none';
  const save=document.getElementById('save-'+field+'-'+qid); if(save) save.style.display='none';
  const eb=document.getElementById('editbtn-'+field+'-'+qid); if(eb) eb.style.display='';
  const hint=document.getElementById('paste-'+field+'-'+qid); if(hint) hint.classList.remove('show');
}
function refreshTabDots(qid){
  const sec=document.getElementById('expl-section-'+qid);
  if(!sec) return;
  ['memo1','memo2'].forEach(function(f){
    const btn=sec.querySelector('.tab-btn[data-f="'+f+'"]'); if(!btn) return;
    let dot=btn.querySelector('.tab-dot');
    const has=!!curMemo(qid,f);
    if(has&&!dot){ dot=document.createElement('span'); dot.className='tab-dot '+f; btn.appendChild(dot); }
    else if(!has&&dot){ dot.remove(); }
  });
}
// 메모: '수정' 버튼 없이 텍스트창 클릭→바로 작성, 입력칸 벗어나면(blur) 자동 저장
function memoTyping(qid, field){
  const stat=document.getElementById('memostat-'+field+'-'+qid);
  if(stat){ stat.textContent='작성 중… (칸을 벗어나면 저장)'; stat.className='memo-status saving'; }
}
async function saveMemoBlur(qid, field){
  const ta=document.getElementById('ta-'+field+'-'+qid);
  if(!ta) return;
  const val=ta.value.trim();
  const stat=document.getElementById('memostat-'+field+'-'+qid);
  if(val===(curMemo(qid,field)||'')){ if(stat){ stat.textContent=''; stat.className='memo-status'; } return; } // 변경 없음
  if(stat){ stat.textContent='저장 중…'; stat.className='memo-status saving'; }
  const patch={}; patch[field]=val;
  const ok=await sbUpsert(qid, patch);
  refreshTabDots(qid); setSyncPills();
  if(stat){
    if(ok){ stat.textContent='✓ 저장됨 (공유됨)'; stat.className='memo-status ok'; setTimeout(function(){ if(stat&&stat.classList.contains('ok')) stat.textContent=''; },2500); }
    else { stat.textContent='⚠ 오프라인 — 인터넷 연결 후 칸을 다시 벗어나면 저장됩니다'; stat.className='memo-status err'; }
  }
}

// ═══════════════════════════════════════════════════
// EXPLANATION IMAGES — 해설 수정 중 Ctrl+V 붙여넣기
// ═══════════════════════════════════════════════════
function buildImgGallery(qid, field){
  const raw=rawImgs(qid);
  let html='';
  raw.forEach(function(it,i){
    if(imgField(it)!==field) return;   // 같은 탭(해설/구민준/이현우)에 속한 사진만
    const src=imgSrc(it);
    html+='<div class="expl-img-wrap"><img class="expl-img" src="'+src+'" onclick="openLightbox(\''+qid+'\','+i+')"><button class="expl-img-del" title="사진 삭제" onclick="delExplImg(\''+qid+'\','+i+')">✕</button></div>';
  });
  return html;
}
function refreshExplImgs(qid){
  ['expl','memo1','memo2'].forEach(function(f){
    const el=document.getElementById('imgs-'+f+'-'+qid);
    if(el) el.innerHTML=buildImgGallery(qid,f);
  });
}
// 붙여넣은 이미지를 최대 1100px로 축소 + JPEG 압축 → Supabase 공유 저장(탭별로 태깅)
function addImageFromBlob(qid, field, blob){
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const MAX=1100; let w=img.width, h=img.height;
      if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
      if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      let dataURL;
      try{ dataURL=cv.toDataURL('image/jpeg',0.82); }catch(e){ dataURL=ev.target.result; }
      const imgs=rawImgs(qid).slice(); imgs.push({f:field, s:dataURL});
      sbUpsert(qid,{expl_imgs:imgs}).then(function(ok){
        refreshExplImgs(qid); setSyncPills();
        if(!ok) alert('인터넷 연결이 없어 사진 공유 저장에 실패했습니다. 연결 후 다시 시도해 주세요.');
      });
    };
    img.onerror=function(){ alert('이미지를 불러오지 못했습니다.'); };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(blob);
}
function delExplImg(qid,i){
  const cur=rawImgs(qid);
  if(!cur[i]) return;
  if(!confirm('이 사진을 삭제할까요? (공유됨)')) return;
  const imgs=cur.slice(); imgs.splice(i,1);
  sbUpsert(qid,{expl_imgs:imgs}).then(function(){ refreshExplImgs(qid); setSyncPills(); });
}
// 범용 이미지 확대 — 문항 이미지·해설 첨부 이미지 공통
function openImgLightbox(src){
  const lb=document.getElementById('img-lightbox'); if(!lb||!src) return;
  lb.querySelector('img').src=src;
  lb.classList.add('show');
}
function openLightbox(qid,i){
  const it=rawImgs(qid)[i]; if(!it) return;
  openImgLightbox(imgSrc(it));
}
// 문항 이미지 로드 실패 시 자리표시(따옴표 중첩 버그 방지 위해 함수로 분리)
function imgFail(el){
  const p=el.getAttribute('data-src')||'';
  const parent=el.parentNode; if(!parent) return;
  parent.innerHTML='';
  const span=document.createElement('span');
  span.className='img-placeholder';
  span.textContent='[이미지 없음'+(p?': '+p:'')+']';
  parent.appendChild(span);
}
// paste 핸들러 — 해설/구민준/이현우 textarea 가 포커스됐을 때 동작(탭별 태깅)
document.addEventListener('paste',function(e){
  const ae=document.activeElement;
  if(!ae||!ae.id) return;
  const m=ae.id.match(/^ta-(expl|memo1|memo2)-(.+)$/);
  if(!m) return;
  const field=m[1], qid=m[2];
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  let found=false;
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      const blob=items[i].getAsFile();
      if(blob){ addImageFromBlob(qid,field,blob); found=true; }
    }
  }
  if(found) e.preventDefault();
});

// ═══════════════════════════════════════════════════
// CHOICE CLICK
// ═══════════════════════════════════════════════════
function onChoice(qid, num, cardIdx) {
  if(hideAnswers) return; // 풀이 숨김 중에는 새로 풀 수 없음(표시만 숨김)
  if(!CURRENT_USER){ showIdentityPrompt(); return; }
  const q=QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  if(savedAnswers[qid]&&savedAnswers[qid].sel&&savedAnswers[qid].sel.length>0) return;
  const correct=q.answer.length===1
    ? q.answer[0]===num
    : q.answer.includes(num);

  savedAnswers[qid]={sel:[num], correct:correct};
  saveAnswers();
  sbSaveProgress(qid,{sel:[num], correct:correct});   // 서버에 사용자별 저장
  refreshCard(qid, cardIdx);
  updateStats();
  updateScopeBar();
  renderIndex();
}

function refreshCard(qid, cardIdx) {
  const card=document.getElementById('card-'+cardIdx);
  if(!card) return;
  const q=filteredQ[cardIdx];
  if(!q||q.id!==qid) return;
  card.innerHTML=buildCardHtml(q,cardIdx);
}

// ═══════════════════════════════════════════════════
// SCRAP
// ═══════════════════════════════════════════════════
function toggleScrap(qid) {
  if(!CURRENT_USER){ showIdentityPrompt(); return; }
  const nowScrap = !savedScraps[qid];
  if(nowScrap) savedScraps[qid]=true; else delete savedScraps[qid];
  saveScraps();
  // 전체 스크랩 맵에서 내 이름 갱신
  let arr=(allScraps[qid]||[]).filter(function(u){return u!==CURRENT_USER;});
  if(nowScrap) arr.push(CURRENT_USER);
  if(arr.length) allScraps[qid]=arr; else delete allScraps[qid];
  sbSaveProgress(qid,{scrap:nowScrap});   // 서버 저장
  // 카드 재렌더(스크랩한 사람 표시 갱신)
  const cardEl=document.querySelector('.q-card[data-qid="'+qid+'"]');
  if(cardEl){ const i=parseInt(cardEl.getAttribute('data-qidx'),10); if(filteredQ[i]) cardEl.innerHTML=buildCardHtml(filteredQ[i], i); }
  renderIndex();
  updateScopeBar();
  if(filterScrapOnly) applyFilters();
}

// ═══════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════
// '이 강의 풀이 지우기' — 현재 필터 범위의 내 풀이(답)만 삭제. 스크랩·메모 유지. 본인 것만.
async function clearScopeAnswers(){
  if(!CURRENT_USER){ showIdentityPrompt(); return; }
  const targets=filteredQ.filter(function(q){return savedAnswers[q.id];}).map(function(q){return q.id;});
  if(!targets.length){ alert('현재 화면에 지울 풀이 기록이 없습니다.'); return; }
  const scope = (filterLec!=='all') ? filterLec : ((filterYear!=='all') ? (filterYear+'년') : '현재 화면');
  if(!confirm(scope+' 범위의 내 풀이 '+targets.length+'개를 지울까요?\n(스크랩·메모는 그대로 유지됩니다)')) return;
  targets.forEach(function(qid){ delete savedAnswers[qid]; });
  saveAnswers();
  if(SB){
    const keep=targets.filter(function(q){return savedScraps[q];});  // 스크랩 있는 행은 답만 비우고 유지
    const drop=targets.filter(function(q){return !savedScraps[q];}); // 나머지는 행 삭제
    try{
      if(keep.length) await SB.from('progress').update({sel:null,correct:null,updated_at:new Date().toISOString()}).eq('uname',CURRENT_USER).in('qid',keep);
      if(drop.length) await SB.from('progress').delete().eq('uname',CURRENT_USER).in('qid',drop);
      sbOnline=true;
    }catch(e){ sbOnline=false; alert('인터넷 연결 문제로 서버 반영에 실패했을 수 있습니다. 다시 시도해 주세요.'); }
  }
  renderFeed(); updateStats(); updateScopeBar(); renderIndex(); setSyncPills();
  alert('완료: '+targets.length+'개 문항의 풀이를 지웠습니다.');
}

// '풀이 숨기기' 토글 — savedAnswers 는 보존, 표시만 on/off.
// 해제하면 내가 푼 문항의 풀이/해설이 다시 표시됨(안 푼 문항은 그대로 미표시).
function toggleHideAnswers() {
  hideAnswers=!hideAnswers;
  try{ localStorage.setItem(LS_HIDE, hideAnswers?'1':'0'); }catch(e){}
  updateHideBtn();
  renderFeed();
  updateStats();
  updateScopeBar();
  renderIndex();
}
function updateHideBtn() {
  const btn=document.getElementById('hide-btn');
  if(!btn) return;
  btn.textContent = hideAnswers ? '👁 풀이 보이기' : '🙈 풀이 숨기기';
  btn.classList.toggle('active', hideAnswers);
}

// ═══════════════════════════════════════════════════
// SIDEBAR TOGGLE (mobile)
// ═══════════════════════════════════════════════════
function toggleSidebar() {
  const s=document.getElementById('sidebar');
  const o=document.getElementById('sidebar-overlay');
  s.classList.toggle('open');
  o.classList.toggle('visible');
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
// (백업/복원 미사용 dead code — 2026-06-09 제거: export/import/checkStorageHealth/ALL_LS_KEYS/pad2)


function buildYearFilter(){var yrs=[...new Set(QUESTIONS.map(q=>q.year))].sort((a,b)=>b-a);var c=document.getElementById('year-btns');if(c)c.innerHTML='<button class="yr-btn active" data-year="all" onclick="setYear(\'all\')">전체</button>'+yrs.map(y=>'<button class="yr-btn" data-year="'+y+'" onclick="setYear(\''+y+'\')">'+y+'</button>').join('');}
function buildSubjectFilter(){var order=['민법','경제학원론','부동산학원론','감정평가관계법규','회계학'];var subs=[...new Set(QUESTIONS.map(q=>q.curr_lec_no))].sort((a,b)=>(order.indexOf(a)+99)%100-(order.indexOf(b)+99)%100);var sel=document.getElementById('lec-select');if(sel)sel.innerHTML='<option value="all">전체 과목</option>'+subs.map(s=>'<option value="'+s+'">'+esc(s)+'</option>').join('');}
function init() {
  buildYearFilter(); buildSubjectFilter();
  updateHideBtn();
  updateUserPanel();
  FULL_LEC=lecRoster();                 // 전체 강의 로스터 캡처(드롭다운 재구성 전)
  const termSel=document.getElementById('term-select'); if(termSel) termSel.value=filterTerm;
  rebuildLecOptions();                   // 현재 과목에 맞춰 강의 드롭다운 구성
  document.querySelectorAll('.yr-btn').forEach(b=>b.classList.toggle('active',b.dataset.year===filterYear));
  const sel=document.getElementById('lec-select');
  if(filterLec!=='all') sel.value=filterLec;
  const scrapChk=document.getElementById('scrap-only-chk');
  if(filterScrapOnly) scrapChk.checked=true;
  applyFilters();
  // 공유데이터(해설·메모) + 진도/스크랩(서버) 로드 → 렌더. 사용자 미선택 시 "누구세요?".
  sbInit();
  Promise.all([sbLoadAll(), sbLoadProgress()]).then(function(){
    renderFeed(); updateStats(); updateScopeBar(); renderIndex(); setSyncPills();
    if(!CURRENT_USER) showIdentityPrompt();
  });
}

init();
</script>
