<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감정평가사 기출 퀴즈</title>
<style>
:root {
  --header-bg:#2c3e5d;--header-text:#fff;--body-bg:#FAFAF8;
  --sidebar-bg:#f0ede8;--sidebar-border:#ddd8d0;
  --accent:#4080b0;--accent-hover:#306090;--accent-light:#eaf1f7;
  --correct:#3a7a4a;--correct-light:#d4edda;--correct-border:#b5d8bd;
  --incorrect:#b85450;--incorrect-light:#f8d7da;--incorrect-border:#e8b4b2;
  --card-bg:#ffffff;--card-border:#e0dbd4;--card-shadow:0 1px 4px rgba(60,50,40,0.07);
  --text-primary:#2c3e5d;--text-secondary:#555555;--text-muted:#9a958c;
  --chip-bg:#e8f0f8;--chip-text:#2c5080;
  --font-stack:'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif;
  --sidebar-width:296px;
  --star-color:#e8a020;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --header-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-stack);background:var(--body-bg);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* HEADER */
header{
  background:var(--header-bg);color:var(--header-text);
  padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  height:var(--header-h);position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.header-left{display:flex;flex-direction:column;gap:2px;}
header h1{font-size:1rem;font-weight:700;letter-spacing:-0.02em;line-height:1.2;}
.header-sub{font-size:0.7rem;opacity:0.7;letter-spacing:0.01em;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
#mobile-sidebar-btn{
  display:none;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
  color:#fff;padding:6px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.79rem;
  font-family:var(--font-stack);transition:background 0.15s;
}
#mobile-sidebar-btn:hover{background:rgba(255,255,255,0.2);}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - var(--header-h));}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar-width);min-width:var(--sidebar-width);
  background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
  overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:#d0d8e4 transparent;
}
#sidebar::-webkit-scrollbar{width:5px;}
#sidebar::-webkit-scrollbar-track{background:transparent;}
#sidebar::-webkit-scrollbar-thumb{background:#d0d8e4;border-radius:10px;}

/* Single panel (no tabs) */
.sidebar-panel{flex:1;overflow-y:auto;padding:16px 14px 20px;}

/* Filter section */
.filter-section{margin-bottom:18px;}
.filter-label{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.year-btns{display:flex;flex-wrap:wrap;gap:5px;}
.yr-btn{
  background:transparent;border:1.5px solid var(--card-border);border-radius:20px;
  padding:4px 12px;font-size:0.76rem;cursor:pointer;color:var(--text-secondary);
  transition:all 0.15s;font-family:var(--font-stack);font-weight:500;
}
.yr-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.yr-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
#lec-select{
  width:100%;padding:7px 10px;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  font-size:0.79rem;font-family:var(--font-stack);color:var(--text-primary);
  background:var(--card-bg);cursor:pointer;outline:none;transition:border-color 0.15s;
}
#lec-select:focus{border-color:var(--accent);}
/* scrap filter */
.scrap-filter-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
.scrap-toggle-label{font-size:0.8rem;cursor:pointer;color:var(--text-secondary);user-select:none;display:flex;align-items:center;gap:5px;}
.scrap-toggle-label input{cursor:pointer;accent-color:var(--accent);}

.scope-bar{
  background:var(--accent-light);border:1px solid #c8dff4;border-radius:var(--radius-sm);
  padding:9px 11px;font-size:0.77rem;color:var(--text-secondary);margin-bottom:12px;
  line-height:1.8;
}
.scope-bar b{color:var(--text-primary);}

.sidebar-actions{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.action-btn{
  width:100%;padding:8px 12px;background:var(--header-bg);color:#fff;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;font-family:var(--font-stack);
  font-weight:600;transition:all 0.15s;letter-spacing:0.01em;
}
.action-btn:hover{background:var(--accent-hover);}
.action-btn.secondary{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.action-btn.secondary.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;}
.action-btn.shuffle-btn{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.shuffle-btn.active{
  background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;
}
.action-btn.shuffle-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.action-btn.clear-btn{background:transparent;color:#9a5b3b;border:1.5px solid #e0c4b0;font-weight:500;}
.action-btn.clear-btn:hover{border-color:#c2603a;color:#fff;background:#c2603a;}

/* Backup / Restore */
/* Current user panel */
.user-box{margin-bottom:14px;padding:11px;border:1px solid var(--sidebar-border);border-radius:var(--radius-sm);background:rgba(0,0,0,0.015);}
.user-line{font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;}
.user-line b{color:var(--accent);font-weight:700;}
.user-switch{width:100%;padding:7px 10px;background:#fff;color:var(--text-secondary);border:1.5px solid var(--card-border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.76rem;font-family:var(--font-stack);font-weight:600;}
.user-switch:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.user-hint{font-size:0.66rem;color:var(--text-muted);line-height:1.5;margin-top:7px;}
/* Identity prompt modal */
.id-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.id-modal.show{display:flex;}
.id-card{background:#fff;border-radius:14px;padding:28px 26px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
.id-title{font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-bottom:6px;}
.id-sub{font-size:0.78rem;color:var(--text-muted);margin-bottom:18px;line-height:1.5;}
.id-btns{display:flex;flex-direction:column;gap:10px;}
.id-btn{padding:13px;border:1.5px solid var(--card-border);border-radius:10px;background:#fff;color:var(--text-primary);font-family:var(--font-stack);font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.12s;}
.id-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

/* Divider */
.sidebar-divider{height:1px;background:var(--sidebar-border);margin:14px 0;}

/* Inline index list (inside filter panel) */
.idx-header{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.idx-scope-inline{
  font-size:0.75rem;color:var(--text-secondary);margin-bottom:8px;padding:7px 9px;
  background:var(--card-bg);border-radius:var(--radius-sm);border:1px solid var(--card-border);
  line-height:1.6;
}
.idx-scope-inline b{color:var(--text-primary);}
.idx-list{display:flex;flex-direction:column;gap:2px;}
.idx-item{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:0.76rem;color:var(--text-primary);transition:background 0.12s;
  text-decoration:none;border:none;background:transparent;font-family:var(--font-stack);
  text-align:left;width:100%;
}
.idx-item:hover{background:var(--accent-light);}
.idx-item.idx-current{background:rgba(42,114,181,0.15);font-weight:600;}
.idx-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#d0d8e4;
}
.idx-dot.dot-correct{background:var(--correct);}
.idx-dot.dot-wrong{background:var(--incorrect);}
.idx-dot.dot-scrap{background:var(--star-color);}
.idx-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* MAIN */
#main{flex:1;padding:20px 22px;max-width:880px;overflow-x:hidden;}
.stats-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.stat-chip{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;
  padding:4px 14px;font-size:0.76rem;color:var(--text-secondary);
  box-shadow:var(--card-shadow);
}
.stat-chip b{color:var(--text-primary);}

/* QUESTION CARDS FEED */
#feed{display:flex;flex-direction:column;gap:18px;}
#no-results{text-align:center;color:var(--text-muted);margin-top:80px;font-size:0.95rem;display:none;line-height:2;}

/* SINGLE CARD */
.q-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--card-shadow);
  scroll-margin-top:64px;transition:box-shadow 0.15s;
}
.q-card:hover{box-shadow:0 3px 12px rgba(20,50,90,0.11);}
.q-card-header{
  background:linear-gradient(135deg,#f5f3ef 0%,#ede9e4 100%);
  padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;
  border-bottom:1px solid var(--card-border);
}
.q-card-header-inner{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;}
.meta-tag{
  font-size:0.67rem;font-weight:700;padding:2px 9px;border-radius:12px;
  letter-spacing:0.02em;line-height:1.5;
}
.tag-year{background:var(--header-bg);color:#fff;}
.tag-lec{background:var(--chip-bg);color:var(--chip-text);}
.tag-prof{background:#f0e8f5;color:#5a3270;}
.tag-qnum{background:#f5f0e6;color:#6a4c20;}
.tag-recovered{background:#fff8cc;color:#7a5a00;}

/* Star button: ☆/★ */
.scrap-btn{
  margin-left:auto;background:transparent;border:none;cursor:pointer;
  font-size:1.2rem;line-height:1;padding:2px 5px;border-radius:4px;
  transition:transform 0.15s,color 0.15s;flex-shrink:0;color:#c8d0da;
}
.scrap-btn:hover{transform:scale(1.25);}
.scrap-btn.starred{color:var(--star-color);}

.q-card-body{padding:18px 18px 14px;}
.q-stem{
  font-size:0.91rem;line-height:1.75;color:var(--text-primary);
  margin-bottom:14px;font-weight:500;white-space:pre-wrap;word-break:break-word;
}
/* stem table */
.stem-table-wrap{margin-bottom:14px;overflow-x:auto;}
.stem-table{width:100%;border-collapse:collapse;font-size:0.81rem;}
.stem-table th{
  background:var(--header-bg);color:#fff;padding:6px 10px;
  text-align:center;font-weight:600;border:1px solid #2a5070;
}
.stem-table td{
  border:1px solid #d0dce8;padding:5px 10px;text-align:center;background:#f7fafd;
}
.stem-table tr:nth-child(even) td{background:#eef4fa;}
/* image */
.q-image{margin-bottom:14px;text-align:center;}
.q-image img{max-width:100%;max-height:320px;border-radius:var(--radius-sm);border:1px solid var(--card-border);object-fit:contain;background:#f4f6f8;cursor:zoom-in;transition:filter 0.12s;}
.q-image img:hover{filter:brightness(0.94);}
.img-placeholder{display:inline-block;padding:8px 16px;background:#f4f6f8;border:1px dashed #c8d0da;border-radius:var(--radius-sm);color:var(--text-muted);font-size:0.8rem;}

/* choices */
.choices{display:flex;flex-direction:column;gap:7px;}
.choice-btn{
  background:#fafbfc;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  padding:10px 13px;text-align:left;cursor:pointer;font-size:0.86rem;line-height:1.55;
  color:var(--text-primary);transition:all 0.15s;font-family:var(--font-stack);
  display:flex;align-items:flex-start;gap:9px;width:100%;
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);}
.choice-num{font-weight:700;font-size:0.77rem;color:var(--accent);flex-shrink:0;min-width:18px;margin-top:1px;}
/* CORRECT = green */
.choice-btn.correct-ans{background:var(--correct-light);border-color:var(--correct-border);color:#154530;font-weight:600;}
.choice-btn.correct-ans .choice-num{color:var(--correct);}
/* MY WRONG = light red */
.choice-btn.my-wrong-ans{background:var(--incorrect-light);border-color:var(--incorrect-border);color:#7a1820;}
.choice-btn.my-wrong-ans .choice-num{color:var(--incorrect);}
.choice-btn:disabled{cursor:default;}

/* answer reveal */
.answer-reveal{
  margin-top:14px;padding:11px 15px;
  background:linear-gradient(135deg,#f0faee 0%,#e5f5e0 100%);
  border:1px solid var(--correct-border);border-radius:var(--radius-sm);display:none;
  font-size:0.83rem;color:#154530;line-height:1.65;
}
.answer-reveal.show{display:block;}
.answer-reveal.wrong{background:linear-gradient(135deg,#fdf1f0 0%,#fce8e7 100%);border-color:var(--incorrect-border);color:#7a1820;}
.ans-label{font-weight:700;font-size:0.73rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--correct);margin-bottom:3px;}
.answer-reveal.wrong .ans-label{color:var(--incorrect);}

/* EXPLANATION — hidden until answered */
.expl-section{
  margin-top:12px;border-top:1px solid var(--card-border);padding-top:12px;
  display:none;
}
.expl-section.expl-visible{display:block;}
.expl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.expl-title{font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;}
.expl-actions{display:flex;gap:5px;}
.expl-edit-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid var(--card-border);background:transparent;color:var(--text-secondary);
  font-family:var(--font-stack);transition:all 0.12s;
}
.expl-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.expl-revert-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid #e0b870;background:transparent;color:#8a5c18;
  font-family:var(--font-stack);transition:all 0.12s;display:none;
}
.expl-revert-btn.show{display:inline-block;}
.expl-revert-btn:hover{background:#fff5e0;}
.expl-text{font-size:0.84rem;line-height:1.75;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;}
.expl-text.placeholder{color:var(--text-muted);font-style:italic;}
.expl-textarea{
  width:100%;min-height:80px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);
  padding:8px 10px;font-size:0.84rem;line-height:1.6;font-family:var(--font-stack);
  color:var(--text-primary);resize:vertical;outline:none;
  display:none;background:#fafcff;
}
.expl-save-btn{
  display:none;margin-top:6px;padding:6px 16px;background:var(--accent);
  color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;
  font-family:var(--font-stack);font-weight:600;transition:background 0.15s;
}
.expl-save-btn:hover{background:var(--accent-hover);}
.expl-paste-hint{font-size:0.72rem;color:var(--text-muted);margin-top:6px;display:none;line-height:1.5;}
.expl-paste-hint.show{display:block;}
.expl-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.expl-img-wrap{position:relative;display:inline-block;}
.expl-img{max-width:100%;max-height:340px;border:1px solid var(--card-border);border-radius:6px;cursor:zoom-in;display:block;}
.expl-img-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;font-size:0.78rem;line-height:1;cursor:pointer;padding:0;}
.expl-img-del:hover{background:rgba(184,84,80,0.95);}
/* Tabs (해설 / 메모1 / 메모2) */
.tab-bar{display:flex;align-items:center;gap:4px;border-bottom:1.5px solid var(--card-border);margin-bottom:10px;flex-wrap:wrap;}
.tab-btn{font-size:0.78rem;padding:6px 13px;border:none;background:transparent;color:var(--text-secondary);font-family:var(--font-stack);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all 0.12s;}
.tab-btn:hover{color:var(--accent);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;}
.tab-dot.memo1{background:#d98a3d;} .tab-dot.memo2{background:#3d7fd9;}
.sync-pill{margin-left:auto;font-size:0.64rem;font-weight:600;padding:2px 7px;border-radius:9px;white-space:nowrap;}
.sync-pill.on{color:#2f7a44;background:#e7f4ec;} .sync-pill.off{color:#9a3b38;background:#f7e9e8;}
.tab-pane{}
.tab-pane[hidden]{display:none;}
.memo-empty{font-size:0.82rem;color:var(--text-muted);font-style:italic;line-height:1.7;}
.memo-hint{font-size:0.68rem;color:var(--text-muted);margin-bottom:7px;line-height:1.5;}
.expl-textarea.memo-live{display:block;min-height:90px;background:#fff;}
.expl-textarea.memo-live:focus{border-color:var(--accent);background:#fafcff;}
.memo-status{font-size:0.68rem;margin-top:5px;min-height:1em;line-height:1.4;}
.memo-status.saving{color:var(--text-muted);}
.memo-status.ok{color:#2f7a44;}
.memo-status.err{color:#9a3b38;}
.offline-note{font-size:0.7rem;color:#9a3b38;background:#f7e9e8;border-radius:5px;padding:6px 9px;margin-top:7px;line-height:1.5;}
.scrap-area{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.scrap-who{font-size:0.66rem;font-weight:700;color:#b8860b;background:#fdf6e3;border:1px solid #ecdca0;border-radius:9px;padding:2px 7px;white-space:nowrap;}
.img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;cursor:zoom-out;}
.img-lightbox.show{display:flex;}
.img-lightbox img{width:96vw;height:92vh;object-fit:contain;border-radius:6px;}

/* MOBILE */
@media(max-width:767px){
  #mobile-sidebar-btn{display:block;}
  .layout{flex-direction:column;}
  #sidebar{
    position:fixed;top:0;left:-310px;width:300px;height:100vh;
    z-index:200;transition:left 0.25s ease;box-shadow:4px 0 20px rgba(0,0,0,0.2);
  }
  #sidebar.open{left:0;}
  .sidebar-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:199;
  }
  .sidebar-overlay.visible{display:block;}
  #main{padding:12px 13px;max-width:100%;}
}
/* HEADER CONTROLS (과목·사용자 변경) */
.hdr-select{font-family:var(--font-stack);font-size:0.74rem;font-weight:600;padding:5px 7px;border-radius:6px;border:1px solid rgba(255,255,255,0.32);background:rgba(255,255,255,0.13);color:#fff;cursor:pointer;max-width:160px;}
.hdr-select option{color:#222;}
.hdr-user-btn{font-family:var(--font-stack);font-size:0.74rem;font-weight:700;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.32);background:rgba(255,255,255,0.13);color:#fff;cursor:pointer;white-space:nowrap;}
.hdr-user-btn:hover,.hdr-select:hover{background:rgba(255,255,255,0.24);}
/* TOP VIEW TABS */
#top-tabs{display:flex;gap:0;background:var(--sidebar-bg);border-bottom:1px solid var(--sidebar-border);padding:0 14px;position:sticky;top:var(--header-h);z-index:90;}
.top-tab{font-size:0.86rem;font-weight:700;font-family:var(--font-stack);padding:11px 18px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;transition:all 0.12s;}
.top-tab:hover{color:var(--accent);}
.top-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
/* PROGRESS DASHBOARD */
#progress-view{max-width:1000px;margin:0 auto;padding:22px 18px 60px;}
.prog-title{font-size:1.05rem;font-weight:700;color:var(--text-primary);margin-bottom:4px;}
.prog-sub{font-size:0.8rem;color:var(--text-muted);margin-bottom:18px;line-height:1.6;}
.prog-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.prog-sum-chip{background:var(--chip-bg);color:var(--chip-text);border-radius:var(--radius-sm);padding:8px 14px;font-size:0.84rem;font-weight:600;}
.prog-table{width:100%;border-collapse:collapse;font-size:0.84rem;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-md);overflow:hidden;}
.prog-table th{background:var(--sidebar-bg);color:var(--text-primary);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--sidebar-border);font-size:0.78rem;}
.prog-table td{padding:9px 12px;border-bottom:1px solid #efece6;vertical-align:middle;}
.prog-table tr:last-child td{border-bottom:none;}
.prog-table tbody tr:hover td{background:#faf8f4;}
.prog-lec{font-weight:600;color:var(--text-primary);}
.prog-num{text-align:center;white-space:nowrap;}
.prog-done-full{color:var(--correct);font-weight:700;}
.prog-bar{position:relative;height:8px;background:#eceae4;border-radius:5px;overflow:hidden;min-width:70px;}
.prog-bar>span{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:5px;transition:width 0.2s;}
.prog-bar.full>span{background:var(--correct);}
.prog-prof{color:var(--text-secondary);white-space:nowrap;font-size:0.8rem;}
.prog-cell-prog{display:flex;align-items:center;gap:8px;}
.prog-pct{font-size:0.78rem;color:var(--text-secondary);min-width:32px;}
.prog-sim{font-weight:700;}
.prog-sim.hi{color:#1f9d57;}
.prog-sim.mid{color:#c2a200;}
.prog-sim.lo{color:#c0392b;}
.prog-sim.na{color:#cfccc6;font-weight:600;}
.meta-input{padding:4px 6px;border:1px solid var(--card-border);border-radius:5px;font-family:var(--font-stack);font-size:0.8rem;text-align:center;background:#fff;}
.date-input{width:80px;}
.sim-input{width:56px;}
.meta-input:focus{border-color:var(--accent);outline:none;background:#fafcff;}
.meta-saved{font-size:0.7rem;margin-left:4px;}
.prog-table-wrap{overflow-x:auto;}
/* 유사문항 묶음(캐러셀) */
.qbundle{border:1.5px solid var(--accent);border-radius:var(--radius-lg);background:var(--card-bg);margin-bottom:18px;overflow:hidden;box-shadow:0 2px 10px rgba(64,128,176,0.12);}
.qbundle-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 15px;background:var(--accent-light);border-bottom:1px solid var(--card-border);font-size:0.82rem;font-weight:700;color:var(--accent);}
.qbundle-counter{font-weight:600;color:var(--text-secondary);font-size:0.76rem;white-space:nowrap;}
.qbundle-track{position:relative;}
.qbundle-track>.q-card{margin:0;border:none;box-shadow:none;border-radius:0;animation:bundleFade 0.22s ease;}
@keyframes bundleFade{from{opacity:0.35;transform:translateX(8px);}to{opacity:1;transform:none;}}
.qbundle-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--card-border);background:#fbfaf7;}
.qbundle-arrow{font-family:var(--font-stack);font-size:0.82rem;font-weight:700;padding:6px 14px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:#fff;color:var(--accent);cursor:pointer;transition:all 0.12s;}
.qbundle-arrow:hover{background:var(--accent);color:#fff;}
.qbundle-dots{display:flex;gap:7px;align-items:center;}
.qbundle-dot{width:9px;height:9px;border-radius:50%;background:#d3d0ca;cursor:pointer;transition:background 0.12s;}
.qbundle-dot.on{background:var(--accent);}
/* 오분류 의심 배지 */
.tag-misclass{background:#fff3e0;color:#b35900;border:1px solid #e0a060;font-weight:700;cursor:help;}
.tag-misimg{background:#fde7e7;color:#b03030;border:1px solid #e09090;font-weight:700;cursor:help;}
.misclass-note{margin:8px 0 0;padding:8px 11px;background:#fff7ec;border:1px solid #e8c79a;border-radius:var(--radius-sm);font-size:0.78rem;color:#8a5a1a;line-height:1.55;}
@media(max-width:767px){
  #top-tabs{top:var(--header-h);overflow-x:auto;}
  .top-tab{padding:11px 13px;font-size:0.8rem;white-space:nowrap;}
  #progress-view{padding:16px 10px 50px;}
  .prog-table{font-size:0.78rem;min-width:660px;}
  .prog-table th,.prog-table td{padding:7px 6px;}
  .date-input{width:72px;}
  .sim-input{width:50px;}
  header h1{font-size:0.86rem;}
  .hdr-select{max-width:118px;font-size:0.7rem;}
  .hdr-user-btn{font-size:0.7rem;padding:5px 7px;}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>감정평가사 기출 퀴즈</h1>
    <div class="header-sub">감정평가사 1차 기출 · 2008~2026</div>
  </div>
  <div class="header-right">
    <select id="term-select" class="hdr-select" onchange="setTerm(this.value)" title="과목" aria-label="과목" style="display:none">
      <option value="all">전체 과목</option>
      <option value="1">대사와 내분비 1차</option>
      <option value="2">대사와 내분비 2차</option>
    </select>
    <button id="user-switch-btn" class="hdr-user-btn" onclick="showIdentityPrompt()" title="사용자 변경" aria-label="사용자 변경">👤 <span id="hdr-user">선택</span> ▾</button>
    <button id="mobile-sidebar-btn" onclick="toggleSidebar()">☰</button>
  </div>
</header>

<nav id="top-tabs" aria-label="화면 전환">
  <button class="top-tab active" id="toptab-quiz" onclick="switchView('quiz')">📋 문제 풀이</button>
  <button class="top-tab" id="toptab-progress" onclick="switchView('progress')">📊 풀이 진척도 확인</button>
</nav>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <!-- SIDEBAR -->
  <nav id="sidebar" aria-label="필터 및 문항목록">
    <div class="sidebar-panel">
      <!-- YEAR FILTER -->
      <div class="filter-section">
        <span class="filter-label">연도</span>
        <div class="year-btns" id="year-btns"><button class="yr-btn active" data-year="all" onclick="setYear('all')">전체</button></div>
      </div>
      <!-- LECTURE FILTER (with lecture number prefix) -->
      <div class="filter-section">
        <span class="filter-label">과목</span>
        <select id="lec-select" onchange="setLecture(this.value)"><option value="all">전체 과목</option><option value="민법">민법</option></select>
      </div>
      <!-- SCRAP FILTER -->
      <div class="filter-section">
        <span class="filter-label">스크랩</span>
        <label class="scrap-filter-row">
          <input type="checkbox" id="scrap-only-chk" onchange="setScrapOnly(this.checked)">
          <span class="scrap-toggle-label">★ 스크랩만 보기</span>
        </label>
      </div>
      <!-- SCOPE BAR -->
      <div class="scope-bar" id="scope-bar">로딩 중...</div>
      <!-- ACTION BUTTONS -->
      <div class="sidebar-actions">
        <button class="action-btn secondary" id="hide-btn" onclick="toggleHideAnswers()">🙈 풀이 숨기기</button>
        <button class="action-btn shuffle-btn" id="shuffle-btn" onclick="toggleShuffle()">↕ 랜덤 순서</button>
        <button class="action-btn clear-btn" id="clear-btn" onclick="clearScopeAnswers()">🗑 이 강의 풀이 지우기</button>
      </div>

      <!-- CURRENT USER -->
      <div class="user-box">
        <div class="user-line">현재 사용자: <b id="user-name">—</b></div>
        <button class="user-switch" onclick="showIdentityPrompt()">사용자 변경</button>
        <div class="user-hint">풀이 진도·스크랩이 이름별로 서버에 저장됩니다.</div>
      </div>

      <!-- DIVIDER -->
      <div class="sidebar-divider"></div>

      <!-- INLINE INDEX LIST -->
      <span class="idx-header">문항 목록</span>
      <div class="idx-scope-inline" id="idx-scope">로딩 중...</div>
      <div class="idx-list" id="idx-list"></div>
    </div>
  </nav>

  <!-- MAIN FEED -->
  <main id="main">
    <div class="stats-bar">
      <div class="stat-chip">표시 <b id="stat-shown">0</b>문항</div>
      <div class="stat-chip">정답 <b id="stat-correct" style="color:var(--correct)">0</b></div>
      <div class="stat-chip">오답 <b id="stat-wrong" style="color:var(--incorrect)">0</b></div>
    </div>
    <div id="no-results">해당 조건의 문항이 없습니다.</div>
    <div id="feed"></div>
  </main>
</div>

<div id="progress-view" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════════

const QUESTIONS = [{"id":"2020-31-민법-1","year":2020,"qnum":1,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"법원(法源)에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["사회구성원이 관습법으로 승인된 관행의 법적 구속력을 확신하지 않게 된 때에는 그 관습법은 효력을 잃는다.","헌법의 기본권은 특별한 사정이 없으면 사법관계에 직접 적용된다.","법원은 당사자의 주장ㆍ증명을 기다림이 없이 관습법을 직권으로 조사ㆍ확정하여야 한다.","우리나라가 가입한 국제조약은 일반적으로 민법이나 상법 또는 국제사법보다 우선적으로 적용된다.","관습법은 법령에 저촉되지 아니하는 한 법칙으로서의 효력이 있다."],"answer":[2],"image":null},{"id":"2020-31-민법-2","year":2020,"qnum":2,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"미성년자의 행위능력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["행위능력제도는 자기책임의 원칙을 구현하여 거래의 안전을 도모하기 위한 것이다.","미성년자가 그 소유의 부동산을 그의 친권자에게 증여하고 소유권이전등기를 마친 경우, 다른 사정이 없으면 적법한 절차를 거친 등기로 추정된다.","친권자는 그의 미성년 자(子)의 이름으로 체결한 계약을 자(子)가 미성년임을 이유로 취소할 수 있다.","친권자가 그의 친구의 제3자에 대한 채무를 담보하기 위하여 미성년 자(子) 소유의 부동산에 담보를 설정하는 행위는 이해상반행위이다.","미성년자가 타인을 대리할 때에는 법정대리인의 동의를 얻어야 한다."],"answer":[2],"image":null},{"id":"2020-31-민법-3","year":2020,"qnum":3,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"권리주체에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["의사능력은 자신의 행위의 의미와 결과를 합리적으로 판단할 수 있는 정신적 능력으로 구체적인 법률행위와 관련하여 개별적으로 판단되어야 한다.","어떤 법률행위가 일상적인 의미만으로 알기 어려운 특별한 법률적 의미나 효과를 가진 경우, 이를 이해할 수 있을 때 의사능력이 인정된다.","현행 민법은 태아의 권리능력에 관하여 일반적 보호주의를 취한다.","태아의 상태에서는 법정대리인이 있을 수 없고, 법정대리인에 의한 수증행위도 할 수 없다.","피상속인과 그의 직계비속 또는 형제자매가 동시에 사망한 것으로 추정되는 경우에도 대습상속이 인정된다."],"answer":[3],"image":null},{"id":"2020-31-민법-4","year":2020,"qnum":4,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"부재자의 재산관리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["부재자가 스스로 위임한 재산관리인에게 재산처분권까지 준 경우에도 그 재산관리인은 재산처분에 법원의 허가를 얻어야 한다.","재산관리인의 권한초과행위에 대한 법원의 허가결정은 기왕의 처분행위를 추인하는 방법으로도 할 수 있다.","재산관리인이 소송절차를 진행하던 중 부재자에 대한 실종선고가 확정되면 그 재산관리인의 지위도 종료한다.","생사불명의 부재자를 위하여 법원이 선임한 재산관리인은 그가 부재자의 사망을 확인한 때에도 선임결정이 취소되지 않으면 계속 권한을 행사할 수 있다.","생사불명의 부재자에 대하여 실종이 선고되더라도 법원이 선임한 재산관리인의 처분행위에 근거한 등기는 그 선임결정이 취소되지 않으면 적법하게 마친 것으로 추정된다."],"answer":[1],"image":null},{"id":"2020-31-민법-5","year":2020,"qnum":5,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"법인에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["법인은 설립등기를 함으로써 성립한다.","어느 사단법인과 다른 사단법인의 동일 여부는, 다른 사정이 없으면 사원의 동일 여부를 기준으로 결정된다.","법인의 대표자는 그 명칭이나 직위 여하가 아니라 법인등기를 기준으로 엄격하게 확정하여야 한다.","행위의 외형상 직무행위로 인정할 수 있으면, 대표자 개인의 이익을 위한 것이거나 법령에 위반한 것이라도 직무에 관한 행위이다.","대표자의 행위가 직무에 관한 것이 아님을 알았거나 중대한 과실로 모른 피해자는 법인에 손해배상책임을 물을 수 없다."],"answer":[3],"image":null},{"id":"2020-31-민법-6","year":2020,"qnum":6,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"법인에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["법인의 대표기관이 법인을 위하여 계약을 체결한 경우, 다른 사정이 없으면 그 성립의 효과는 직접 법인에 미치고 계약을 위반한 때에는 법인이 손해를 배상할 책임이 있다.","단체의 실체를 갖추어 법인 아닌 사단으로 성립하기 전에 설립주체인 개인이 취득한 권리ㆍ의무는 바로 법인 아닌 사단에 귀속된다.","법인 아닌 사단은 대표권제한을 등기할 수 없으므로 거래상대방이 사원총회가 대표권 제한을 결의한 사실을 몰랐고 모른데 잘못이 없으면, 제한을 넘는 이사의 거래행위는 유효하다.","민법에서 법인과 그 기관인 이사의 관계는 위임인과 수임인의 법률관계와 같다.","사단법인의 하부조직 중 하나라 하더라도 스스로 단체의 실체를 갖추고 독자활동을 한다면 독립된 법인 아닌 사단으로 볼 수 있다."],"answer":[2],"image":null},{"id":"2020-31-민법-7","year":2020,"qnum":7,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"강행규정에 위반되어 그 효력이 인정되지 않는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 제3자가 타인의 동의를 받지 않고 타인을 보험계약자 및 피보험자로 하여 체결한 생명보험계약\nㄴ. 건물의 임차인이 비용을 지출하여 개조한 부분에 대한 원상회복의무를 면하는 대신 그 개조비용의 상환청구권을 포기하기로 하는 약정\nㄷ. 사단법인의 사원의 지위를 양도ㆍ상속할 수 있다는 규약\nㄹ. 승소를 시켜주면 소송물의 일부를 양도하겠다는 민사소송의 당사자와 변호사 아닌 자 사이의 약정","stem_table":null,"options":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"answer":[3],"image":null},{"id":"2020-31-민법-8","year":2020,"qnum":8,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"물건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["종물은 주물소유자의 상용에 공여된 물건을 말한다.","주물과 다른 사람의 소유에 속하는 물건은 종물이 될 수 없다.","주물과 종물의 관계에 관한 법리는 권리 상호간에도 적용된다.","저당권의 효력이 종물에 미친다는 규정은 종물은 주물의 처분에 따른다는 것과 이론적 기초를 같이 한다.","토지의 개수는 지적공부의 등록단위가 되는 필(筆)을 표준으로 한다."],"answer":[1],"image":null},{"id":"2020-31-민법-9","year":2020,"qnum":9,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"불공정한 법률행위에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["불공정한 법률행위로 무효가 된 행위의 전환은 인정되지 않는다.","불공정한 법률행위라도 당사자가 무효임을 알고 추인한 경우 유효로 될 수 있다.","불공정한 법률행위에 해당하는지 여부는 그 행위를 한 때를 기준으로 판단한다.","불공정한 법률행위의 요건을 갖추지 못한 법률행위는 반사회질서행위가 될 수 없다.","증여와 같이 아무런 대가관계 없이 당사자 일방이 상대방에게 일방적인 급부를 하는 행위도 불공정한 법률행위가 될 수 있다."],"answer":[3],"image":null},{"id":"2020-31-민법-10","year":2020,"qnum":10,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"18세의 甲은 乙의 대리인을 사칭하여 그가 보관하던 乙의 노트북을 그 사정을 모르는 丙에게 팔았다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["乙이 丙에게 매매계약을 추인한 때에는 매매계약은 확정적으로 효력이 생긴다.","乙이 甲에게 추인한 때에도 그 사실을 모르는 丙은 매매계약을 철회할 수 있다.","乙이 추인하지 않으면, 甲은 자신의 선택으로 丙에게 매매계약을 이행하거나 손해를 배상하여야 한다.","丙이 甲에게 대리권이 없음을 알았더라도 丙은 乙에게 추인 여부의 확답을 최고할 수 있다.","乙이 추인한 때에는 甲은 자신이 미성년자임을 이유로 매매계약을 취소하지 못한다."],"answer":[3],"image":null},{"id":"2020-31-민법-11","year":2020,"qnum":11,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"대리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["계약체결의 권한을 수여받은 대리인은 체결한 계약을 처분할 권한이 있다.","본인이 이의제기 없이 무권대리행위를 장시간 방치한 것을 추인으로 볼 수는 없다.","매매계약의 체결과 이행에 관한 대리권을 가진 대리인은, 특별한 사정이 없으면 매수인의 대금지급기일을 연기할 수 있는 권한을 가진다.","본인이 사회통념상 대리권을 추단할 수 있는 직함이나 명칭 등의 사용을 승낙한 경우, 수권행위가 있는 것으로 볼 수 있다.","무권대리행위가 제3자의 위법행위로 야기된 경우에도, 본인이 추인하지 않으면 무권대리인은 계약을 이행하거나 손해를 배상하여야 한다."],"answer":[1],"image":null},{"id":"2020-31-민법-12","year":2020,"qnum":12,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"착오에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["매도인이 매매대금 미지급을 이유로 매매계약을 해제한 후에도 매수인은 착오를 이유로 이를 취소할 수 있다.","보험회사의 설명의무 위반으로 보험계약의 중요사항을 제대로 이해하지 못하고 착오에 빠져 계약을 체결한 고객은 그 계약을 취소할 수 있다.","계약서에 X토지를 목적물로 기재한 때에도 Y토지에 대하여 의사의 합치가 있었다면 Y토지를 목적으로 하는 계약이 성립한다.","착오에 관한 민법규정은 법률의 착오에 적용되지 않는다.","취소의 의사표시는 취소자가 그 착오를 이유로 자신의 법률행위의 효력을 처음부터 없애려는 의사가 드러나면 충분하다."],"answer":[4],"image":null},{"id":"2020-31-민법-13","year":2020,"qnum":13,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"의사표시의 효력발생시기에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["상대방 있는 의사표시는 상대방에게 도달한 때에 그 효력이 생긴다.","표의자가 의사표시의 통지를 발송한 후 제한능력자가 되어도 그 의사표시의 효력은 영향을 받지 아니한다.","상대방이 현실적으로 통지를 수령하거나 그 내용을 안 때에 도달한 것으로 본다.","상대방이 정당한 사유 없이 통지의 수령을 거절한 경우, 상대방이 그 통지의 내용을 알 수 있는 객관적 상태에 놓여 있는 때에 의사표시의 효력이 생긴다.","등기우편으로 발송된 경우, 상당한 기간 내에 도달하였다고 추정된다."],"answer":[3],"image":null},{"id":"2020-31-민법-14","year":2020,"qnum":14,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"甲은 乙의 기망으로 그 소유의 X토지를 丙에게 팔았고, 丙은 그의 채권자 丁에게 X토지에 근저당권을 설정하였다. 甲은 기망행위를 이유로 매매계약을 취소하려고 한다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲은 丙이 그의 잘못없이 기망사실을 몰랐을 때에만 매매계약을 취소할 수 있다.","丙의 악의 또는 과실은 甲이 증명하여야 한다.","甲은 매매계약을 취소하지 않고 乙에게 불법행위책임을 물을 수 있다.","丁의 선의는 추정된다.","매매계약을 취소한 甲은, 丁이 선의이지만 과실이 있으면 근저당권설정등기의 말소를 청구할 수 있다."],"answer":[1,5],"image":null},{"id":"2020-31-민법-15","year":2020,"qnum":15,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"법률행위의 효력에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 매매계약을 체결하면서 양도소득세를 면탈할 의도로 소유권이전등기를 일정기간 유보하는 약정은 반사회질서행위로 볼 수 없다.\nㄴ. 경매목적물과 매각대금이 현저하게 공정을 잃은 경우에도 그 경매는 불공정한 법률행위에 해당하지 않는다.\nㄷ. 도박에 쓸 것을 알면서 빌려준 금전을 담보하기 위하여 저당권을 설정한 사람은 저당권설정등기의 말소를 청구할 수 있다.","stem_table":null,"options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[5],"image":null},{"id":"2020-31-민법-16","year":2020,"qnum":16,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"조건과 기한에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["법률행위의 조건은 그 조건의 존재를 주장하는 사람이 증명하여야 한다.","정지조건부 법률행위에서 조건이 성취된 사실은 조건의 성취로 권리를 취득하는 사람이 증명하여야 한다.","불능조건이 정지조건인 경우 그 법률행위는 무효이다.","조건의 성취로 불이익을 받을 당사자가 신의성실에 반하여 조건의 성취를 방해한 경우, 처음부터 조건없는 법률행위로 본다.","기한이익 상실의 약정은 특별한 사정이 없으면 형성권적 기한이익 상실의 약정으로 추정한다."],"answer":[4],"image":null},{"id":"2020-31-민법-17","year":2020,"qnum":17,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"형성권에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 형성권의 행사는 상대방에 대한 일방적 의사표시로 한다.\nㄴ. 다른 사정이 없으면, 형성권의 행사에 조건 또는 기한을 붙이지 못한다.\nㄷ. 다른 사정이 없으면, 형성권은 그 일부를 행사할 수 있다.\nㄹ. 다른 사정이 없으면, 형성권은 제척기간의 적용을 받는다.","stem_table":null,"options":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":[2],"image":null},{"id":"2020-31-민법-18","year":2020,"qnum":18,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"소멸시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["인도받은 부동산을 소유권이전등기를 하지 않고 제3자에게 처분ㆍ인도한 매수인의 등기청구권은 소멸시효에 걸리지 않는다.","채무불이행으로 인한 손해배상청구권의 소멸시효는 손해배상을 청구한 때부터 진행한다.","채권자가 보증인을 상대로 이행을 청구하는 소를 제기한 때에도 주채무의 소멸시효가 완성하면 보증인은 주채무가 시효로 소멸되었음을 주장할 수 있다.","재산권이전청구권과 동시이행관계에 있는 매매대금채권의 소멸시효는 지급기일부터 진행한다.","등기 없는 점유취득시효가 완성하였으나 등기하지 않은 토지점유자가 토지의 점유를 잃은 경우, 그로부터 10년이 지나면 등기청구권은 소멸한다."],"answer":[2],"image":null},{"id":"2020-31-민법-19","year":2020,"qnum":19,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"소멸시효이익의 포기에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["시효이익은 미리 포기하지 못한다.","금전채무에 대한 시효이익의 포기는 채무 전부에 대하여 하여야 한다.","시효이익을 포기한 때부터 새로이 소멸시효가 진행한다.","시효이익의 포기는 철회하지 못한다.","채권의 시효이익을 포기한 경우, 이는 채권자와 채무자의 관계에서만 효력이 생긴다."],"answer":[2],"image":null},{"id":"2020-31-민법-20","year":2020,"qnum":20,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"소멸시효와 등기 없는 취득시효에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["취득시효기간 동안 계속하여 등기명의인이 동일한 때에도 반드시 점유를 개시한 때를 기산점으로 하여야 한다.","점유자가 전(前)점유자의 점유를 아울러 주장할 때에는 그 점유의 개시시기를 어느 점유자의 점유기간 중 임의의 시점으로 선택할 수 있다.","채권의 소멸시효가 완성하면 그 채무자의 다른 채권자는 직접 그 완성을 원용할 수 있다.","압류 또는 가압류는 소멸시효와 취득시효의 중단사유이다.","취득시효의 중단사유는 종래의 점유상태의 계속을 파괴하는 것으로 인정될 수 있는 것이어야 한다."],"answer":[5],"image":null},{"id":"2020-31-민법-21","year":2020,"qnum":21,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"물권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["특별한 사정이 없으면, 물건의 일부는 물권의 객체가 될 수 없다.","권원 없이 타인의 토지에 심은 수목은 독립한 물권의 객체가 될 수 없다.","종류, 장소 또는 수량지정 등의 방법으로 특정할 수 있으면 수량이 변동하는 동산의 집합도 하나의 물권의 객체가 될 수 있다.","소유권을 비롯한 물권은 소멸시효의 적용을 받지 않는다.","소유권을 상실한 전(前)소유자는 물권적 청구권을 행사할 수 없다."],"answer":[4],"image":null},{"id":"2020-31-민법-22","year":2020,"qnum":22,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"물권적 청구권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["물권적 청구권은 물권과 분리하여 양도하지 못한다.","물권적 청구권을 보전하기 위하여 가등기를 할 수 있다.","미등기건물을 매수한 사람은 소유권이전등기를 갖출 때까지 그 건물의 불법점유자에게 직접 자신의 소유권에 기하여 인도를 청구하지 못한다.","토지소유자는 권원 없이 그의 토지에 건물을 신축ㆍ소유한 사람으로부터 건물을 매수하여 그 권리의 범위에서 점유하는 사람에게 건물의 철거를 청구할 수 있다.","소유권에 기한 말소등기청구권은 소멸시효의 적용을 받지 않는다."],"answer":[2],"image":null},{"id":"2020-31-민법-23","year":2020,"qnum":23,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"부동산 물권변동에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["소유권이전등기를 마친 등기명의인은 제3자에 대하여 적법한 등기원인으로 소유권을 취득한 것으로 추정되지만 그 전(前)소유자에 대하여는 그렇지 않다.","미등기건물의 원시취득자는 그 승계인과 합의하여 승계인 명의로 소유권보존등기를 하여 건물소유권을 이전할 수 있다.","등기는 물권의 존속요건이 아니므로 등기가 원인 없이 말소되더라도 그 권리는 소멸하지 않는다.","미등기건물의 소유자가 건물을 그 대지와 함께 팔고 대지에 관한 소유권이전등기를 마친 때에는 매도인에게 관습법상 법정지상권이 인정되지 않는다.","저당권설정등기가 원인 없이 말소된 때에도 그 부동산이 경매되어 매수인이 매각대금을 납부하면 원인 없이 말소된 저당권은 소멸한다."],"answer":[1],"image":null},{"id":"2020-31-민법-24","year":2020,"qnum":24,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"등기에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["경정등기는 원시적으로 진실한 권리관계와 등기가 일부 어긋나는 경우 이를 바로잡는 등기이다.","소유자만이 진정명의회복을 위한 소유권이전등기를 청구할 수 있다.","진정명의회복을 위한 소유권이전등기청구의 상대방은 현재의 등기명의인이다.","증여로 부동산을 취득하였으나 등기원인을 매매로 기재하였다면 그 등기는 무효등기이다.","그 이유가 무엇이든 당사자가 자발적으로 말소등기한 경우 말소회복등기를 할 수 없다."],"answer":[4],"image":null},{"id":"2020-31-민법-25","year":2020,"qnum":25,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"甲소유의 X토지에 乙명의로 소유권이전청구권을 보전하기 위한 가등기를 한 경우에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["乙은 부기등기의 형식으로는 가등기된 소유권이전청구권을 양도하지 못한다.","가등기가 있으면 乙이 甲에게 소유권이전을 청구할 법률관계가 있다고 추정된다.","乙이 가등기에 기하여 본등기를 하면 乙은 가등기한 때부터 X토지의 소유권을 취득한다.","가등기 후에 甲이 그의 채권자 丙에게 저당권을 설정한 경우, 가등기에 기하여 본등기를 마친 乙은 丙에 대하여 물상보증인의 지위를 가진다.","乙이 별도의 원인으로 X토지의 소유권을 취득한 때에는, 특별한 사정이 없으면 가등기로 보전된 소유권이전청구권은 소멸하지 않는다."],"answer":[5],"image":null},{"id":"2020-31-민법-26","year":2020,"qnum":26,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"선의취득에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["점유권과 유치권은 선의취득할 수 없다.","점유개정의 방법으로 양도담보를 설정한 동산소유자가 다시 제3자와 양도담보설정계약을 맺고 그 동산을 점유개정으로 인도한 경우, 제3자는 양도담보권을 선의취득하지 못한다.","인도가 물권적 합의보다 먼저 이루어진 경우, 선의ㆍ무과실의 판단은 인도를 기준으로 한다.","선의취득자는 임의로 소유권취득을 거부하지 못한다.","선의취득자는 권리를 잃은 전(前)소유자에게 부당이득을 반환할 의무가 없다."],"answer":[3],"image":null},{"id":"2020-31-민법-27","year":2020,"qnum":27,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"점유자와 회복자의 관계에 관한 설명으로 옳지 않은 것은?","stem_table":null,"options":["선의의 점유자는 점유물의 과실을 취득한다.","과실의 수취에 관하여 점유자의 선ㆍ악의는 과실이 원물에서 분리되는 때를 기준으로 판단한다.","악의의 점유자는 그가 소비한 과실의 대가를 보상하여야 한다.","그의 책임 있는 사유로 점유물을 멸실ㆍ훼손한 선의의 타주점유자는 손해 전부를 배상하여야 한다.","과실을 취득한 점유자는 그가 지출한 비용 전부를 청구할 수 있다."],"answer":[5],"image":null},{"id":"2020-31-민법-28","year":2020,"qnum":28,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"점유에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["점유매개자의 점유는 자주점유이다.","점유는 사실상 지배로 성립한다.","다른 사정이 없으면, 건물의 소유자가 그 부지를 점유하는 것으로 보아야 한다.","점유매개관계가 소멸하면 간접점유자는 직접점유자에게 점유물의 반환을 청구할 수 있다.","점유자는 소유의 의사로 점유한 것으로 추정한다."],"answer":[1],"image":null},{"id":"2020-31-민법-29","year":2020,"qnum":29,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"甲이 乙명의의 X토지에 대하여 점유취득시효기간을 완성한 경우에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 甲이 乙에게 X토지의 소유권이전등기를 청구한 후 乙이 그 토지를 丙에게 처분한 경우, 이는 乙이 자신의 소유권을 행사한 것이므로 乙은 甲에게 불법행위책임을 지지 않는다.\nㄴ. 甲이 아직 소유권이전등기를 하지 않고 있던 중, 丙이 취득시효가 완성하기 전에 마친 丙명의의 가등기에 기하여 소유권이전의 본등기를 한 경우에도 甲은 丙에 대하여 시효취득을 주장할 수 있다.\nㄷ. 甲으로부터 X토지의 점유를 승계한 丁은 甲의 취득시효완성의 효과를 주장하여 직접 자기에게 소유권이전등기를 청구하지 못한다.","stem_table":null,"options":["ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"],"answer":[3],"image":null},{"id":"2020-31-민법-30","year":2020,"qnum":30,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"소유권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["매도인은 매매계약의 이행으로 토지를 인도받았으나 소유권이전등기를 하지 않고 점유ㆍ사용하는 매수인에게 부당이득의 반환을 청구할 수 있다.","토지의 경계는 지적공부에 의하여 확정된다.","토지가 포락되어 사회통념상 원상복구가 어려워 토지로서의 효용을 상실한 때에는 그 토지의 소유권이 소멸한다.","도급계약에서 신축집합건물의 소유권을 수인의 도급인에게 귀속할 것을 약정한 경우, 그 건물의 각 전유부분의 소유관계는 공동도급인의 약정에 의한다.","소유권에 기한 방해배제청구권에서 '방해'는 현재 지속되고 있는 침해를 의미한다."],"answer":[1],"image":null},{"id":"2020-31-민법-31","year":2020,"qnum":31,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"민법이 명문으로 공유물분할청구를 금지하는 경우는?","stem_table":null,"options":["구분소유하는 건물과 그 부속물 중 공용하는 부분의 경우","주종을 구별할 수 없는 동산이 부합된 경우","수인이 공동으로 매장물을 발견한 경우","수인이 공동으로 유실물을 습득한 경우","수인이 공동으로 무주물을 선점한 경우"],"answer":[1],"image":null},{"id":"2020-31-민법-32","year":2020,"qnum":32,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"첨부에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["타인이 그의 권원에 의하여 부동산에 부속한 물건은 이를 분리하여도 경제적 가치가 없으면 부동산소유자의 소유로 한다.","저당권의 효력은 다른 사정이 없으면 저당부동산에 부합된 물건에 미친다.","동일인 소유의 여러 동산들이 결합하는 것은 부합이 아니다.","부합의 원인은 인위적이든 자연적이든 불문한다.","타인의 동산에 가공한 때에는 가공물의 소유권은 가공자의 소유로 한다."],"answer":[5],"image":null},{"id":"2020-31-민법-33","year":2020,"qnum":33,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"명의신탁에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["종중재산이 여러 사람에게 명의신탁된 경우, 그 수탁자들 상호간에는 형식상 공유관계가 성립한다.","3자간 등기명의신탁관계의 명의신탁자는 수탁자에게 명의신탁된 부동산의 소유권이전등기를 청구하지 못한다.","채무자는 채권을 담보하기 위하여 채권자에게 그 소유의 부동산에 관한 소유권이전등기를 할 수 있다.","부부 사이에 유효하게 성립한 명의신탁은 배우자 일방의 사망으로 잔존배우자와 사망한 배우자의 상속인에게 효력을 잃는다.","계약 상대방이 명의수탁자임을 알면서 체결한 매매계약의 효력으로 소유권이전등기를 받은 사람은 소유권을 취득한다."],"answer":[4],"image":null},{"id":"2020-31-민법-34","year":2020,"qnum":34,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"법정지상권에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. X토지에 Y건물의 소유를 위한 법정지상권을 가진 甲의 Y건물을 경매에서 매수한 乙은, 건물철거의 매각조건 등 특별한 사정이 없으면 당연히 법정지상권을 취득한다.\nㄴ. X토지를 소유하는 甲이 乙과 함께 그 지상에 Y건물을 신축ㆍ공유하던 중 X토지에 저당권을 설정하였고 그의 실행에 의한 경매에서 丙이 X토지의 소유권을 취득한 경우, Y건물을 위한 법정지상권이 성립하지 않는다.\nㄷ. 甲소유의 X토지와 그 지상건물에 공동저당권이 설정된 후 지상건물을 철거하고 Y건물을 신축하였고 저당권의 실행으로 X토지와 Y건물이 다른 소유자에게 매각된 경우, 특별한 사정이 없으면 Y건물을 위한 법정지상권이 성립한다.\nㄹ. X토지에 저당권을 설정한 甲이 저당권자 乙의 동의를 얻어 Y건물을 신축하였으나 저당권의 실행에 의한 경매에서 丙이 X토지의 소유권을 취득한 경우, Y건물을 위한 법정지상권이 성립한다.","stem_table":null,"options":["ㄱ, ㄷ","ㄱ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":[4],"image":null},{"id":"2020-31-민법-35","year":2020,"qnum":35,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"지역권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["지역권은 점유를 요건으로 하는 물권이다.","지역권은 독립하여 양도ㆍ처분할 수 있는 물권이다.","통행지역권은 지료의 약정을 성립요건으로 한다.","통행지역권의 시효취득을 위하여 지역권이 계속되고 표현되면 충분하고 승역지 위에 통로를 개설할 필요는 없다.","통행지역권을 시효취득한 요역지소유자는, 특별한 사정이 없으면 승역지의 사용으로 그 소유자가 입은 손해를 보상하여야 한다."],"answer":[5],"image":null},{"id":"2020-31-민법-36","year":2020,"qnum":36,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"민사유치권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["수급인은 특별한 사정이 없으면 그의 비용과 노력으로 완공한 건물에 유치권을 가지지 못한다.","물건의 소유자는 그 물건을 점유하는 제3자가 비용을 지출할 때에 점유권원이 없음을 알았거나 중대한 과실로 몰랐음을 증명하여 비용상환청구권에 기한 유치권의 주장을 배척할 수 있다.","채권과 물건 사이에 견련관계가 있더라도, 그 채무불이행으로 인한 손해배상채권과 그 물건 사이의 견련관계는 인정되지 않는다.","저당권의 실행으로 부동산에 경매개시결정의 기입등기가 이루어지기 전에 유치권을 취득한 사람은 경매절차의 매수인에게 이를 행사할 수 있다.","토지 등 그 성질상 다른 부분과 쉽게 분할할 수 있는 물건의 경우, 그 일부를 목적으로 하는 유치권이 성립할 수 있다."],"answer":[3],"image":null},{"id":"2020-31-민법-37","year":2020,"qnum":37,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"전세권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["목적물의 인도는 전세권의 성립요건이다.","전세권이 존속하는 중에 전세권자는 전세권을 그대로 둔 채 전세금반환채권만을 확정적으로 양도하지 못한다.","전세목적물이 처분된 때에도 전세권을 설정한 양도인이 전세권관계에서 생기는 권리ㆍ의무의 주체이다.","전세권은 전세권설정등기의 말소등기 없이 전세기간의 만료로 당연히 소멸하지만, 전세권저당권이 설정된 때에는 그렇지 않다.","전세권저당권이 설정된 경우, 제3자의 압류 등 다른 사정이 없으면 전세권이 기간만료로 소멸한 때에 전세권설정자는 저당권자에게 전세금을 지급하여야 한다."],"answer":[2],"image":null},{"id":"2020-31-민법-38","year":2020,"qnum":38,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"질권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["질권은 질물 전부에 효력이 미친다.","저당권으로 담보된 채권에 설정된 질권은 그 저당권등기에 질권의 부기등기를 하여야 저당권에 효력이 미친다.","금전채권에 질권을 취득한 질권자는 자기채권액의 범위에서 직접 추심하여 변제에 충당할 수 있다.","질권설정자는 피담보채무의 변제기 이후의 약정으로 질권자에게 변제에 갈음하여 질물의 소유권을 이전할 수 있다.","금전채무자가 채권자에게 담보물을 제공한 경우, 특별한 사정이 없으면 채무자의 변제의무와 채권자의 담보물반환의무는 동시이행관계에 있다."],"answer":[5],"image":null},{"id":"2020-31-민법-39","year":2020,"qnum":39,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"저당권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["저당권의 효력은 천연과실뿐만 아니라 법정과실에도 미친다.","저당권으로 담보된 채권을 양수하였으나 아직 대항요건을 갖추지 못한 양수인도 저당권이전의 부기등기를 마치고 저당권실행의 요건을 갖추면 경매를 신청할 수 있다.","후순위담보권자가 경매를 신청한 경우, 선순위근저당권의 피담보채권은 매수인이 경락대금을 완납하여 그 근저당권이 소멸하는 때에 확정된다.","저당권의 이전을 위하여 저당권의 양도인과 양수인, 그리고 저당권설정자 사이의 물권적 합의와 등기가 있어야 한다.","공동저당관계의 등기를 공동저당권의 성립요건이나 대항요건이라고는 할 수 없다."],"answer":[4],"image":null},{"id":"2020-31-민법-40","year":2020,"qnum":40,"curr_lec_no":"민법","curr_lecture":"","professor":"31회","stem":"저당권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["저당부동산의 소유권이 제3자에게 양도된 후 피담보채권이 변제된 때에는 저당권을 설정한 종전소유자도 저당권설정등기의 말소를 청구할 권리가 있다.","저당권을 설정한 사람이 채무자가 아닌 경우, 그는 원본채권이 이행기를 경과한 때부터 1년분의 범위에서 지연배상을 변제할 책임이 있다.","근저당권의 채무자가 피담보채권의 일부를 변제한 경우, 변제한 만큼 채권최고액이 축소된다.","저당권자는 배당기일 전까지 물상대위권을 행사하여 우선변제를 받을 수 있다.","대체물채권을 담보하기 위하여 저당권을 설정한 경우, 피담보채권액은 채권을 이행할 때의 시가로 산정한 금액으로 한다."],"answer":[1],"image":null},{"id":"2021-32-민법-1","year":2021,"qnum":1,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"관습법과 사실인 관습에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["관습법은 성문법에 대하여 보충적 효력을 갖는다.","공동선조와 성과 본을 같이하는 미성년자인 후손은 종중의 구성원이 될 수 없다.","관습법이 성립한 후 사회구성원들이 그러한 관행의 법적 구속력에 더 이상 법적 확 신을 갖지 않게 된 경우, 그 관습법은 법적 규범으로서의 효력이 없다.","사실인 관습은 법령으로서의 효력이 없고, 법률행위 당사자의 의사를 보충함에 그친 다.","미등기 무허가건물의 매수인은 그 소유권이전등기를 마치지 않아도 소유권에 준하는 관습상의 물권을 취득한다."],"answer":[5],"image":null},{"id":"2021-32-민법-2","year":2021,"qnum":2,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"신의성실의 원칙에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례 에 따름) ㄱ. 회사의 이사가 회사의 확정채무를 보증한 경우에는 그 직을 사임하더라도 사정 변경을 이유로 그 보증계약을 해지할 수 없다. ㄴ. 소멸시효 완성 전에 채무자가 시효중단을 현저히 곤란하게 하여 채권자가 아무 런 조치를 취할 수 없었던 경우, 그 채무자가 시효완성을 주장하는 것은 신의칙 상 허용되지 않는다. ㄷ. 강행법규를 위반한 자가 스스로 강행법규 위반을 이유로 약정의 무효를 주장하 는 것은 특별한 사정이 없는 한 신의칙에 반한다.","stem_table":null,"options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[3],"image":null},{"id":"2021-32-민법-3","year":2021,"qnum":3,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"제한능력에 관한 설명으로 옳지 않은 것은?","stem_table":null,"options":["가정법원은 한정후견개시의 심판을 할 때 본인의 의사를 고려하지 않아도 된다.","가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있으나, 성 년후견인의 청구에 의하여 이를 변경할 수 있다.","성년후견인은 일상생활에 필요하고 그 대가가 과도하지 않은 피성년후견인의 법률행 위를 취소할 수 없다.","가정법원은 성년후견개시의 심판을 할 때 본인의 의사를 고려하여야 한다.","피성년후견인이 성년후견인의 동의를 얻어 재산상의 법률행위를 한 경우에도 성년후 견인은 이를 취소할 수 있다."],"answer":[1],"image":null},{"id":"2021-32-민법-4","year":2021,"qnum":4,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"실종선고에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["가족관계등록부상 이미 사망으로 기재되어 있는 자에 대해서는 원칙적으로 실종선고 를 할 수 없다.","실종선고를 받아 사망으로 간주된 자는 실종선고가 취소되지 않는 한 반증을 통해 그 효력을 번복할 수 없다.","실종선고 후 그 취소 전에 선의로 한 행위의 효력은 실종선고의 취소에 의해 영향을 받지 않는다.","실종선고의 취소에는 공시최고를 요하지 않는다.","실종자를 당사자로 한 판결이 확정된 후에 실종선고가 확정되어 그 사망간주의 시점 이 소제기 전으로 소급하는 경우, 특별한 사정이 없는 한 그 판결은 당사자능력이 없 는 사람을 상대로 한 판결로서 무효가 된다."],"answer":[5],"image":null},{"id":"2021-32-민법-5","year":2021,"qnum":5,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"법인에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["사단법인 이사의 대표권 제한은 이를 등기하지 않으면 악의의 제3자에게도 대항하지 못한다.","재단법인의 정관변경은 그 변경방법을 정관에서 정한 때에도 주무관청의 허가를 얻 지 않으면 그 효력이 없다.","재단법인의 기본재산에 관한 근저당권 설정행위는 특별한 사정이 없는 한 주무관청 의 허가를 얻을 필요가 없다.","재단법인의 기본재산 변경 시, 그로 인하여 기본재산이 새로이 편입되는 경우에는 주무관청의 허가를 얻을 필요가 없다.","법인에 대한 청산종결등기가 경료된 경우에도 청산사무가 종결되지 않는 한 그 범위 내에서는 청산법인으로서 존속한다."],"answer":[4],"image":null},{"id":"2021-32-민법-6","year":2021,"qnum":6,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"법인의 불법행위책임에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["외형상 직무행위로 인정되는 대표자의 권한 남용행위에 대해서도 법인의 불법행위책 임이 인정될 수 있다.","등기된 대표자의 행위로 인하여 타인에게 손해를 가한 경우에만 법인의 불법행위책 임이 성립할 수 있다.","대표자의 행위가 직무에 관한 행위에 해당하지 않음을 피해자 자신이 중대한 과실로 알지 못한 경우, 법인의 불법행위책임이 인정된다.","대표권 없는 이사가 그 직무와 관련하여 타인에게 손해를 가한 경우, 법인의 불법행 위책임이 성립한다.","법인의 불법행위책임이 성립하는 경우 그 대표기관은 손해배상책임이 없다."],"answer":[1],"image":null},{"id":"2021-32-민법-7","year":2021,"qnum":7,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"비법인사단에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["비법인사단의 대표자는 자신의 업무를 타인에게 포괄적으로 위임할 수 있다.","여성은 종중구성원이 되지만, 종중총회의 소집권을 가지는 연고항존자가 될 수는 없다.","이사의 선임에 관한 민법 제63조는 비법인사단에 유추적용될 수 없다.","교회는 비법인사단이므로 그 합병과 분열이 인정된다.","비법인사단의 대표자가 총회의 결의를 거치지 않고 총유물을 권한 없이 처분한 경우 에는 권한을 넘은 표현대리에 관한 민법 제126조가 준용되지 않는다."],"answer":[5],"image":null},{"id":"2021-32-민법-8","year":2021,"qnum":8,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"물건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["주물 소유자의 사용에 공여되는 물건이라도 주물 자체의 효용과 직접 관계가 없으면 종물이 아니다.","「입목에 관한 법률」에 의하여 소유권보존등기를 한 수목의 집단은 저당권의 객체가 된다.","종물과 주물의 관계에 관한 법리는 권리 상호간에도 적용될 수 있다.","분필절차를 거치지 않은 1필의 토지의 일부에 대해서도 저당권을 설정할 수 있다.","저당권의 효력은 저당부동산의 종물에 미치므로 경매를 통하여 저당부동산의 소유권 을 취득한 자는 특별한 사정이 없는 한 종물의 소유권을 취득한다."],"answer":[4],"image":null},{"id":"2021-32-민법-9","year":2021,"qnum":9,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"반사회적 법률행위에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["어느 법률행위가 사회질서에 반하는지 여부는 특별한 사정이 없는 한 법률행위 당시 를 기준으로 판단해야 한다.","강제집행을 면할 목적으로 부동산에 허위의 근저당권을 설정하는 행위는 특별한 사 정이 없는 한 반사회적 법률행위라고 볼 수 없다.","대리인이 매도인의 배임행위에 적극 가담하여 이루어진 부동산의 이중매매의 경우, 본인인 매수인이 그러한 사정을 몰랐다면 반사회적 법률행위가 되지 않는다.","법률행위의 성립과정에서 단지 강박이라는 불법적 방법이 사용된 것에 불과한 때에 는 반사회적 법률행위로 볼 수 없다.","반사회적 법률행위임을 이유로 하는 무효는 선의의 제3자에게 대항할 수 있다."],"answer":[3],"image":null},{"id":"2021-32-민법-10","year":2021,"qnum":10,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"물건의 승계취득에 해당하는 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["무주물 선점에 의한 소유권 취득","상속에 의한 소유권 취득","환지처분에 의한 국가의 소유권 취득","건물 신축에 의한 소유권 취득","공용징수에 의한 토지 소유권 취득"],"answer":[2],"image":null},{"id":"2021-32-민법-11","year":2021,"qnum":11,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"통정허위표시에 의하여 외형상 형성된 법률관계를 기초로 하여 ‘새로운 법률상 이해관계를 맺은 제3자’에 해당하지 않는 자는? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["가장전세권에 관하여 저당권을 취득한 자","가장소비대차에 기한 대여금채권을 양수한 자","가장저당권 설정행위에 기한 저당권의 실행에 의하여 목적부동산을 경락받은 자","가장의 채권양도 후 채무가 변제되지 않고 있는 동안 채권양도가 허위임이 밝혀진 경우에 있어서의 채무자","가장소비대차의 대주(貸主)가 파산한 경우, 파산자와는 독립한 지위에서 파산채권자 전체의 공동의 이익을 위하여 직무를 행하게 된 파산관재인"],"answer":[4],"image":null},{"id":"2021-32-민법-12","year":2021,"qnum":12,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"착오에 의한 의사표시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["토지매매에 있어서 특별한 사정이 없는 한, 매수인이 측량을 통하여 매매목적물이 지적도상의 그것과 정확히 일치하는지 확인하지 않은 경우 중대한 과실이 인정된다.","상대방이 표의자의 진의에 동의한 경우 표의자는 착오를 이유로 의사표시를 취소할 수 없다.","상대방에 의해 유발된 동기의 착오는 동기가 표시되지 않았더라도 중요부분의 착오 가 될 수 있다.","상대방이 표의자의 착오를 알면서 이용한 경우에는 착오가 표의자의 중대한 과실로 인한 것이더라도 표의자는 착오에 의한 의사표시를 취소할 수 있다.","제3자의 기망행위에 의해 표시상의 착오에 빠진 경우에 사기가 아닌 착오를 이유로 의사표시를 취소할 수 있다."],"answer":[1],"image":null},{"id":"2021-32-민법-13","year":2021,"qnum":13,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"사기ㆍ강박에 의한 의사표시에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["교환계약의 당사자가 자기 소유 목적물의 시가를 묵비하였다면 특별한 사정이 없는 한, 위법한 기망행위가 성립한다.","강박에 의해 자유로운 의사결정의 여지가 완전히 박탈되어 그 외형만 있는 법률행위 라고 하더라도 이를 무효라고 할 수는 없다.","토지거래허가를 받지 않아 유동적 무효 상태에 있는 법률행위라도 사기에 의한 의사 표시의 요건이 충족된 경우 사기를 이유로 취소할 수 있다.","대리인의 기망행위로 계약을 체결한 상대방은 본인이 대리인의 기망행위에 대해 선 의ㆍ무과실이면 계약을 취소할 수 없다.","강박행위의 목적이 정당한 경우에는 비록 그 수단이 부당하다고 하더라도 위법성이 인정될 여지가 없다."],"answer":[3],"image":null},{"id":"2021-32-민법-14","year":2021,"qnum":14,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"의사표시의 효력발생에 관한 설명으로 옳지 않은 것은?(다툼이 있으면 판례에 따 름)","stem_table":null,"options":["도달주의의 원칙은 채권양도의 통지와 같은 준법률행위에도 유추적용될 수 있다.","의사표시의 부도달 또는 연착으로 인한 불이익은 특별한 사정이 없는 한 표의자가 이를 부담한다.","의사표시자가 그 통지를 발송한 후 제한능력자가 되었다면 특별한 사정이 없는 한 그 의사표시는 취소할 수 있다.","수령무능력자에게 의사표시를 한 경우, 특별한 사정이 없는 한 표의자는 그 의사표 시로써 수령무능력자에게 대항할 수 없다.","상대방이 정당한 사유 없이 의사표시 통지의 수령을 거절한 경우, 상대방이 그 통지 의 내용을 알 수 있는 객관적 상태에 놓여 있는 때에 의사표시의 효력이 생기는 것으 로 보아야 한다."],"answer":[3],"image":null},{"id":"2021-32-민법-15","year":2021,"qnum":15,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"복대리에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["복대리인은 제3자에 대하여 대리인과 동일한 권리의무가 있다.","본인의 묵시적 승낙에 기초한 임의대리인의 복임권행사는 허용되지 않는다.","임의대리인이 본인의 명시적 승낙을 얻어 복대리인을 선임한 때에는 본인에 대하여 그 선임감독에 관한 책임이 없다.","법정대리인이 그 자신의 이름으로 선임한 복대리인은 법정대리인의 대리인이다.","복대리인의 대리행위에 대해서는 표현대리가 성립할 수 없다."],"answer":[1],"image":null},{"id":"2021-32-민법-16","year":2021,"qnum":16,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"표현대리에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있으면 판례 에 따름) ㄱ. 대리권 소멸 후의 표현대리에 관한 규정은 임의대리에만 적용된다. ㄴ. 표현대리를 주장할 때에는 무권대리인과 표현대리에 해당하는 무권대리 행위를 특정하여 주장하여야 한다. ㄷ. 강행법규를 위반하여 무효인 법률행위라 하더라도 표현대리의 법리는 준용될 수 있다. ㄹ. 표현대리가 성립하는 경우에도 상대방에게 과실이 있다면 과실상계의 법리를 유 추적용하여 본인의 책임을 경감할 수 있다.","stem_table":null,"options":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":[4],"image":null},{"id":"2021-32-민법-17","year":2021,"qnum":17,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"소급효가 원칙적으로 인정되지 않는 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["무권대리인이 체결한 계약에 대한 추인의 효과","기한부 법률행위에서의 기한도래의 효과","토지거래 허가구역 내의 토지거래계약에 대한 허가의 효과","소멸시효 완성의 효과","법률행위 취소의 효과"],"answer":[2],"image":null},{"id":"2021-32-민법-18","year":2021,"qnum":18,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"법률행위의 조건과 기한에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","stem_table":null,"options":["법정조건도 법률행위의 부관으로서 조건에 해당한다.","채무면제와 같은 단독행위에는 조건을 붙일 수 없다.","기한은 특별한 사정이 없는 한 채권자의 이익을 위한 것으로 추정한다.","조건에 친하지 않은 법률행위에 불법조건을 붙이면 조건 없는 법률행위로 전환된다.","불확정한 사실의 발생을 기한으로 한 경우, 특별한 사정이 없는 한 그 사실의 발생 이 불가능한 것으로 확정된 때에도 기한이 도래한 것으로 본다."],"answer":[5],"image":null},{"id":"2021-32-민법-19","year":2021,"qnum":19,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"소멸시효의 기산점에 관한 설명으로 옳지 않은 것은?(다툼이 있으면 판례에 따름)","stem_table":null,"options":["정지조건부 권리는 조건이 성취되지 않은 동안에는 소멸시효가 진행되지 않는다.","이행기한을 정하지 않은 채권은 채권자의 이행최고가 있은 날로부터 소멸시효가 진 행한다.","채무불이행으로 인한 손해배상청구권은 채무불이행시로부터 소멸시효가 진행한다.","동시이행의 항변권이 붙은 채권은 그 이행기로부터 소멸시효가 진행한다.","무권대리인에 대한 상대방의 계약이행청구권이나 손해배상청구권은 그 선택권을 행 사할 수 있을 때부터 소멸시효가 진행한다."],"answer":[2],"image":null},{"id":"2021-32-민법-20","year":2021,"qnum":20,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"소멸시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["소멸시효는 법률행위에 의하여 이를 배제하거나 연장할 수 없다.","시효의 중단은 원칙적으로 당사자 및 그 승계인 사이에서만 효력이 있다.","소멸시효 중단사유로서의 채무승인은 채무가 있음을 알고 있다는 뜻의 의사표시이므 로 효과의사가 필요하다.","소멸시효의 이익은 시효가 완성되기 전에 미리 포기하지 못한다.","소멸시효 완성 후 채무자는 시효완성의 사실을 알고 그 채무를 묵시적으로 승인함으 로써 시효의 이익을 포기할 수 있다."],"answer":[3],"image":null},{"id":"2021-32-민법-21","year":2021,"qnum":21,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"부동산등기에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["전부 멸실한 건물의 보존등기를 신축한 건물의 보존등기로 유용하는 것은 허용된다.","물권에 관한 등기가 원인 없이 말소되었더라도 특별한 사정이 없는 한 그 물권의 효 력에는 아무런 영향을 미치지 않는다.","소유권이전청구권 보전의 가등기가 있더라도 소유권이전등기를 청구할 어떤 법률관 계가 있다고 추정되지 않는다.","가등기권리자가 가등기에 기한 소유권이전의 본등기를 한 경우에는 등기공무원은 그 가등기 후에 한 제3자 명의의 소유권이전등기를 직권으로 말소하여야 한다.","소유권이전등기가 마쳐지면 그 등기명의자는 제3자는 물론이고 전소유자에 대해서도 적법한 등기원인에 의하여 소유권을 취득한 것으로 추정된다."],"answer":[1],"image":null},{"id":"2021-32-민법-22","year":2021,"qnum":22,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"점유자와 회복자의 관계에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","stem_table":null,"options":["선의의 점유자가 취득하는 과실에 점유물의 사용이익은 포함되지 않는다.","유치권자에게는 원칙적으로 수익목적의 과실수취권이 인정된다.","점유물이 점유자의 귀책사유로 훼손된 경우, 선의의 점유자는 소유의 의사가 없더라 도 이익이 현존하는 한도에서 배상책임이 있다.","회복자로부터 점유물의 반환을 청구 받은 점유자는 유익비의 상환을 청구할 수 있 다.","점유물의 소유자가 변경된 경우, 점유자는 유익비 지출 당시의 전 소유자에게 비용 의 상환을 청구해야 한다."],"answer":[4],"image":null},{"id":"2021-32-민법-23","year":2021,"qnum":23,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"총유에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["비법인사단이 총유물에 관한 매매계약을 체결하는 행위는 총유물의 처분행위가 아니 다.","비법인사단이 타인 간의 금전채무를 보증하는 행위는 총유물의 관리ㆍ처분행위가 아 니다.","총유물의 보존행위는 특별한 사정이 없는 한 구성원이 단독으로 결정할 수 없다.","비법인사단의 대표자는 총유재산에 관한 소송에서 단독으로 당사자가 될 수 없다.","비법인사단인 주택조합이 주체가 되어 신축 완공한 건물로서 일반에게 분양되는 부 분은 조합원 전원의 총유에 속한다."],"answer":[1],"image":null},{"id":"2021-32-민법-24","year":2021,"qnum":24,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"점유에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["점유매개자의 점유를 통한 간접점유에 의해서도 점유에 의한 시효취득이 가능하다.","사기의 의사표시에 의해 건물을 명도해 준 자는 점유회수의 소권을 행사할 수 없다.","미등기건물을 양수하여 건물에 관한 사실상의 처분권을 보유한 양수인은 그 건물부 지의 점유자이다.","간접점유의 요건이 되는 점유매개관계는 법률행위가 아닌 법령의 규정에 의해서는 설정될 수 없다.","상속에 의하여 점유권을 취득한 상속인은 새로운 권원에 의하여 자기 고유의 점유를 개시하지 않는 한 피상속인의 점유를 떠나 자기만의 점유를 주장할 수 없다."],"answer":[4],"image":null},{"id":"2021-32-민법-25","year":2021,"qnum":25,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"선의취득에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["선의취득에 관한 민법 제249조는 저당권의 취득에도 적용된다.","동산의 선의취득에 필요한 점유의 취득은 현실의 인도뿐만 아니라 점유개정에 의해 서도 가능하다.","선의취득의 요건인 선의ㆍ무과실의 판단은 동산의 인도 여부와 관계없이 물권적 합 의가 이루어진 때를 기준으로 한다.","도품ㆍ유실물에 관한 민법 제251조는 선의취득자에게 그가 지급한 대가의 변상시까 지 취득물의 반환청구를 거부할 수 있는 항변권만을 인정한다는 취지이다.","제3자에 대한 목적물반환청구권을 양수인에게 양도하고 지명채권 양도의 대항요건을 갖추면 동산의 선의취득에 필요한 점유의 취득요건을 충족한다."],"answer":[5],"image":null},{"id":"2021-32-민법-26","year":2021,"qnum":26,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"구분소유적 공유관계에 관한 설명으로 옳지 않은 것은?(다툼이 있으면 판례에 따 름)","stem_table":null,"options":["구분소유적 공유관계의 해소는 상호명의신탁의 해지에 의한다.","당사자 내부에 있어서는 각자가 특정매수한 부분은 각자의 단독 소유가 된다.","구분소유적 공유지분을 매수한 자는 당연히 구분소유적 공유관계를 승계한다.","제3자의 방해행위가 있으면 공유자는 자기의 구분소유 부분뿐만 아니라 전체 토지에 대하여 공유물의 보존행위로서 그 배제를 구할 수 있다.","구분소유적 공유관계는 어떤 토지에 관하여 그 위치와 면적을 특정하여 여러 사람이 구분소유하기로 하는 약정이 있어야만 적법하게 성립할 수 있다."],"answer":[3],"image":null},{"id":"2021-32-민법-27","year":2021,"qnum":27,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"부동산 취득시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["무과실은 점유취득시효의 요건이 아니다.","성명불상자의 소유물도 시효취득의 대상이 된다.","점유취득시효가 완성된 후에는 취득시효 완성의 이익을 포기할 수 있다.","행정재산은 시효취득의 대상이 아니다.","압류는 점유취득시효의 중단사유이다."],"answer":[5],"image":null},{"id":"2021-32-민법-28","year":2021,"qnum":28,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"甲은 자신의 X토지를 乙에게 매도하였고, 乙은 X토지를 丙에게 전매하였다. 다음 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름) ㄱ. 甲, 乙, 丙 사이에 중간생략등기에 관한 합의가 있다면，甲의 乙에 대한 소유권 이전등기의무는 소멸한다. ㄴ. 乙의 甲에 대한 소유권이전등기청구권의 양도는 甲에 대한 통지만으로 대항력이 생긴다. ㄷ. 甲, 乙, 丙 사이에 중간생략등기에 관한 합의가 없다면, 중간생략등기가 이루어 져서 실체관계에 부합하더라도 그 등기는 무효이다. ㄹ. 甲, 乙, 丙 사이에 중간생략등기에 관한 합의가 있은 후 甲ㆍ乙 간의 특약으로 매매대금을 인상한 경우, 甲은 인상된 매매대금의 미지급을 이유로 丙에 대한 소 유권이전등기의무의 이행을 거절할 수 있다.","stem_table":null,"options":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":[4],"image":null},{"id":"2021-32-민법-29","year":2021,"qnum":29,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"공유관계에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["부동산 공유자의 공유지분 포기의 의사표시가 다른 공유자에게 도달하더라도 이로써 곧바로 공유지분 포기에 따른 물권변동의 효력이 발생하는 것은 아니다.","소수지분권자는 공유물의 전부를 협의 없이 점유하는 다른 소수지분권자에게 공유물 의 인도를 청구할 수 있다.","과반수 지분권자는 공유물의 관리에 관한 사항을 단독으로 결정할 수 있다.","토지공유자 사이에서는 지분비율로 공유물의 관리비용을 부담한다.","공유자는 특별한 사정이 없는 한 언제든지 공유물의 분할을 청구할 수 있다."],"answer":[2],"image":null},{"id":"2021-32-민법-30","year":2021,"qnum":30,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"공유물분할에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["공유물분할의 효과는 원칙적으로 소급하지 않는다.","재판에 의한 공유물분할은 현물분할이 원칙이다.","공유관계가 존속하는 한, 공유물분할청구권만이 독립하여 시효로 소멸하지는 않는 다.","공유토지를 현물분할하는 경우에 반드시 공유지분의 비율대로 토지 면적을 분할해야 하는 것은 아니다.","공유물분할의 조정절차에서 공유자 사이에 현물분할의 협의가 성립하여 조정조서가 작성된 때에는 그 즉시 공유관계가 소멸한다."],"answer":[5],"image":null},{"id":"2021-32-민법-31","year":2021,"qnum":31,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"부동산 실권리자명의 등기에 관한 법률상 명의신탁에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["투기ㆍ탈세 등의 방지라는 법의 목적상 명의신탁은 그 자체로 선량한 풍속 기타 사 회질서에 위반된다.","명의신탁이 무효인 경우, 신탁자와 수탁자가 혼인하면 명의신탁약정이 체결된 때로 부터 위 명의신탁은 유효하게 된다.","부동산 명의신탁약정의 무효는 수탁자로부터 그 부동산을 취득한 악의의 제3자에게 대항할 수 있다.","농지법에 따른 제한을 피하기 위하여 명의신탁을 한 경우에도 그에 따른 수탁자 명 의의 소유권이전등기가 불법원인급여라고 할 수 없다.","조세포탈 등의 목적 없이 종교단체장의 명의로 그 종교단체 보유 부동산의 소유권을 등기한 경우, 그 단체와 단체장 간의 명의신탁약정은 유효하다."],"answer":[4],"image":null},{"id":"2021-32-민법-32","year":2021,"qnum":32,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"甲은 乙에 대한 채권을 담보하기 위하여 乙 소유의 X토지에 관하여 저당권을 취 득하였다. 그 후 X의 담보가치 하락을 막기 위하여 乙의 X에 대한 사용ㆍ수익권을 배제하지 않는 지상권을 함께 취득하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲의 지상권의 피담보채무는 존재하지 않는다.","甲의 채권이 시효로 소멸하면 지상권도 소멸한다.","甲의 채권이 변제 등으로 만족을 얻어 소멸하면 지상권도 소멸한다.","제3자가 甲에게 대항할 수 있는 권원 없이 X 위에 건물을 신축하는 경우, 甲은 그 축조의 중지를 요구할 수 있다.","제3자가 X를 점유ㆍ사용하는 경우, 甲은 지상권의 침해를 이유로 손해배상을 청구 할 수 있다."],"answer":[5],"image":null},{"id":"2021-32-민법-33","year":2021,"qnum":33,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"분묘기지권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["분묘기지권을 시효취득하는 경우에는 특약이 없는 한 지료를 지급할 필요가 없다.","「장사 등에 관한 법률」이 시행된 후 설치된 분묘에 대해서는 더 이상 시효취득이 인정되지 않는다.","분묘기지권의 시효취득을 인정하는 종전의 관습법은 법적 규범으로서의 효력을 상실 하였다.","분묘기지권이 인정되는 분묘를 다른 곳에 이장하면 그 분묘기지권은 소멸한다.","분묘가 일시적으로 멸실되어도 유골이 존재하여 분묘의 원상회복이 가능하다면 분묘 기지권은 존속한다."],"answer":[1,3],"image":null},{"id":"2021-32-민법-34","year":2021,"qnum":34,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"전세권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["전세권이 성립한 후 목적물의 소유권이 이전되더라도 전세금반환채무가 당연히 신소 유자에게 이전되는 것은 아니다.","전세권의 존속기간이 시작되기 전에 마친 전세권설정등기는 특별한 사정이 없는 한 그 기간이 시작되기 전에는 무효이다.","전세권을 설정하는 때에는 전세금이 반드시 현실적으로 수수되어야 한다.","건물의 일부에 전세권이 설정된 경우 전세권의 목적물이 아닌 나머지 부분에 대해서 도 경매를 신청할 수 있다.","전세권자가 통상의 필요비를 지출한 경우 그 비용의 상환을 청구하지 못한다."],"answer":[5],"image":null},{"id":"2021-32-민법-35","year":2021,"qnum":35,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"2020년 5월 신탁자 甲과 그의 친구인 수탁자 乙이 X부동산에 대하여 명의신탁약 정을 한 후, 乙이 직접 계약당사자가 되어 丙으로부터 X를 매수하고 소유권이전등 기를 마쳤다. 다음 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲과 乙 사이의 명의신탁약정은 무효이다.","丙이 甲ㆍ乙 사이의 명의신탁약정 사실을 몰랐다면 乙은 X의 소유권을 취득한다.","丙이 甲ㆍ乙 사이의 명의신탁약정 사실을 알았는지 여부는 소유권이전등기가 마쳐진 때를 기준으로 판단하여야 한다.","乙이 X의 소유자가 된 경우 甲으로부터 제공받은 매수자금 상당액을 甲에게 부당이 득으로 반환하여야 한다.","丙이 甲ㆍ乙 사이의 명의신탁약정 사실을 안 경우에도 乙이 그 사정을 모르는 丁에 게 X를 매도하여 소유권이전등기를 마쳤다면 丁은 X의 소유권을 취득한다."],"answer":[3],"image":null},{"id":"2021-32-민법-36","year":2021,"qnum":36,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"유치권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["건물의 임차인이 임대인에게 지급한 임차보증금반환채권은 그 건물에 관하여 생긴 채권이 아니다.","임대인이 건물시설을 하지 않아 임차인이 건물을 임차목적대로 사용하지 못하였음을 이유로 하는 손해배상청구권은 그 건물에 관하여 생긴 채권이다.","수급인의 재료와 노력으로 건축되었고 독립한 건물에 해당되는 기성부분에 대하여는 특별한 사정이 없는 한 수급인은 유치권을 가질 수 없다.","채권자가 채무자를 직접점유자로 하여 간접점유하는 경우에는 유치권이 성립하지 않 는다.","유치권자가 점유침탈로 유치물의 점유를 상실한 경우，유치권은 원칙적으로 소멸한 다."],"answer":[2],"image":null},{"id":"2021-32-민법-37","year":2021,"qnum":37,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"질권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["양도할 수 없는 물건은 질권의 목적이 되지 못한다.","질권자는 채권의 변제를 받기 위하여 질물을 경매할 수 있다.","채권질권의 효력은 질권의 목적이 된 채권 외에 그 채권의 지연손해금에는 미치지 않는다.","질권의 목적인 채권의 양도행위는 질권자의 이익을 해하는 변경에 해당되지 않으므 로 질권자의 동의를 요하지 않는다.","수개의 채권을 담보하기 위하여 동일한 동산에 수개의 질권을 설정한 경우, 그 순위 는 설정의 선후에 의한다."],"answer":[3],"image":null},{"id":"2021-32-민법-38","year":2021,"qnum":38,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"저당권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["저당부동산에 대한 압류 후에는 저당권설정자의 저당부동산에 관한 차임채권에도 저 당권의 효력이 미친다.","저당목적물의 변형물에 대하여 이미 제3자가 압류하였더라도 저당권자가 스스로 이 를 압류하지 않으면 물상대위권을 행사할 수 없다.","저당권은 그 담보한 채권과 분리하여 타인에게 양도하거나 다른 채권의 담보로 하지 못한다.","저당권의 효력은 원칙적으로 저당부동산에 부합된 물건에 미친다.","저당부동산에 대하여 지상권을 취득한 제3자는 저당권자에게 그 부동산으로 담보된 채권을 변제하고 저당권의 소멸을 청구할 수 있다."],"answer":[2],"image":null},{"id":"2021-32-민법-39","year":2021,"qnum":39,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"甲은 乙에 대한 2억원의 채권을 담보하기 위하여 乙 소유 X토지와 Y건물에 대하 여 각각 1번 공동저당권을 취득하였다. 그 후 丙은 乙에 대한 1억 6천만원의 채권 을 담보하기 위하여 X에 대하여 2번 저당권을, 丁은 乙에 대한 7천만원의 채권을 담보하기 위하여 Y에 대하여 2번 저당권을 취득하였다. 그 후 丙이 경매를 신청하 여 X가 3억원에 매각되어 배당이 완료되었고, 다시 丁이 경매를 신청하여 Y가 1억 원에 매각되었다. 丁이 Y의 매각대금에서 배당받을 수 있는 금액은? (단, 경매비용 ㆍ이자 등은 고려하지 않으며, 다툼이 있으면 판례에 따름)","stem_table":null,"options":["0원","3,500만원","4,000만원","5,000만원","7,000만원"],"answer":[4],"image":null},{"id":"2021-32-민법-40","year":2021,"qnum":40,"curr_lec_no":"민법","curr_lecture":"","professor":"32회","stem":"전세권을 목적으로 하는 저당권에 관한 설명으로 옳지 않은 것은? (다툼이 있으 면 판례에 따름)","stem_table":null,"options":["저당권설정자는 저당권자의 동의 없이 전세권을 소멸하게 하는 행위를 하지 못한다.","전세권의 존속기간이 만료된 경우 저당권자는 전세권 자체에 대해 저당권을 실행할 수 있다.","전세권의 존속기간이 만료되면 저당권자는 전세금반환채권에 대하여 물상대위할 수 있다.","전세금반환채권은 저당권의 목적물이 아니다.","전세권이 기간만료로 소멸한 경우 전세권설정자는 원칙적으로 전세권자에 대하여만 전세금 반환의무를 부담한다."],"answer":[2],"image":null},{"id":"2023-34-민법-1","year":2023,"qnum":1,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"민법의 법원(法源)에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["민법 제1조에서 민법의 법원으로 규정한 ‘민사에 관한 법률’은 민법전만을 의미한다.","민법 제1조에서 민법의 법원으로 규정한 ‘관습법’에는 사실인 관습이 포함된다.","대법원이 정한 「공탁규칙」은 민법의 법원이 될 수 없다.","헌법에 의하여 체결·공포된 국제조약은 그것이 민사에 관한 것이더라도 민법의 법원이 될 수 없다.","미등기무허가 건물의 양수인에게는 소유권에 준하는 관습법상의 물권이 인정되지 않는다."],"answer":[5],"image":null},{"id":"2023-34-민법-2","year":2023,"qnum":2,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"제한능력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["성년후견인은 여러 명을 둘 수 있다.","가정법원은 본인의 청구에 의하여 취소할 수 없는 피성년후견인의 법률행위의 범위를 변경할 수 있다.","가정법원이 피성년후견인에 대하여 한정후견 개시의 심판을 할 때에는 종전의 성년후견의 종료 심판을 하여야 한다.","한정후견의 개시를 청구한 사건에서 의사의 감정 결과 성년후견 개시의 요건을 충족하고 있다면 법원은 본인의 의사를 고려하지 않고 성년후견을 개시할 수 있다.","특정후견의 심판이 있은 후에 피특정후견인이 특정후견인의 동의 없이 재산상의 법률행위를 하더라도 이는 취소의 대상이 되지 않는다."],"answer":[4],"image":null},{"id":"2023-34-민법-3","year":2023,"qnum":3,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"부재자의 재산관리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["부재자로부터 재산처분권한을 수여받은 재산관리인은 그 재산을 처분함에 있어 법원의 허가를 받을 필요가 없다.","부재자가 재산관리인을 정하지 않은 경우, 부재자의 채권자는 재산관리에 필요한 처분을 명할 것을 법원에 청구할 수 있다.","법원이 선임한 재산관리인은 법원의 허가 없이 부재자의 재산에 대한 차임을 청구할 수 있다.","재산관리인의 처분행위에 대한 법원의 허가는 이미 행한 처분행위를 추인하는 방법으로 할 수 있다.","부재자가 사망한 사실이 확인되면 부재자 재산관리인 선임결정이 취소되지 않더라도 관리인의 권한은 당연히 소멸한다."],"answer":[5],"image":null},{"id":"2023-34-민법-4","year":2023,"qnum":4,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"민법상 법인의 정관에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["감사의 임면에 관한 사항은 정관의 필요적 기재사항이다.","정관의 임의적 기재사항은 정관에 기재되더라도 정관의 변경절차 없이 변경할 수 있다.","정관변경의 의결정족수가 충족되면 주무관청의 허가가 없어도 정관변경의 효력이 생긴다.","재단법인이 기본재산을 편입하는 행위는 주무관청의 허가를 받지 않아도 유효하다.","재단법인의 기본재산에 관한 저당권 설정행위는 특별한 사정이 없는 한 주무관청의 허가를 얻을 필요가 없다."],"answer":[5],"image":null},{"id":"2023-34-민법-5","year":2023,"qnum":5,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"비법인사단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["비법인사단의 대표자는 자신의 업무를 타인에게 포괄적으로 위임할 수 있다.","정관이나 규약에 달리 정함이 없는 한, 사원총회의 결의를 거치지 않은 총유물의 관리행위는 무효이다.","고유한 의미의 종중은 종중원의 신분이나 지위를 박탈할 수 없고, 종중원도 종중을 탈퇴할 수 없다.","고유한 의미의 종중은 자연발생적 종족단체이므로 특별한 조직행위나 성문의 규약을 필요로 하지 않는다.","비법인사단의 사원이 집합체로서 물건을 소유할 때에는 총유로 한다."],"answer":[1],"image":null},{"id":"2023-34-민법-6","year":2023,"qnum":6,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"형성권으로만 모두 연결된 것은?","stem_table":null,"options":["저당권 - 취소권 - 동의권","상계권 - 준물권 - 예약완결권","해제권 - 취소권 - 지상물매수청구권","추인권 - 해지권 - 물권적 청구권","해지권 - 부양청구권 - 부속물매수청구권"],"answer":[3],"image":null},{"id":"2023-34-민법-7","year":2023,"qnum":7,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"민법상 법인의 기관에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["이사의 변경등기는 대항요건이 아니라 효력발생요건이다.","이사가 수인인 경우, 특별한 사정이 없는 한 법인의 사무에 관하여 이사는 공동으로 법인을 대표한다.","사단법인의 정관 변경에 관한 사원총회의 권한은 정관에 의해 박탈할 수 있다.","이사회에서 법인과 어느 이사와의 관계사항을 의결하는 경우, 그 이사는 의사정족수 산정의 기초가 되는 이사의 수에 포함된다.","법인의 대표권 제한에 관한 사항이 등기되지 않았더라도 법인은 대표권 제한에 대해 악의인 제3자에게 대항할 수 있다."],"answer":[4],"image":null},{"id":"2023-34-민법-8","year":2023,"qnum":8,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"물건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["주물의 구성부분은 종물이 될 수 없다.","1필의 토지의 일부는 분필절차를 거치지 않는 한 용익물권의 객체가 될 수 없다.","국립공원의 입장료는 법정과실이 아니다.","주물과 장소적 밀접성이 인정되더라도 주물 그 자체의 효용과 직접 관계가 없는 물건은 종물이 아니다.","저당권 설정행위에 “저당권의 효력이 종물에 미치지 않는다”는 약정이 있는 경우, 이를 등기하지 않으면 그 약정으로써 제3자에게 대항할 수 없다."],"answer":[2],"image":null},{"id":"2023-34-민법-9","year":2023,"qnum":9,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"법률행위의 목적에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 甲이 乙에게 매도한 건물이 계약체결 후 甲의 방화로 전소하여 乙에게 이전할 수 없게 된 경우, 甲의 손해배상책임이 문제될 수 있다.\nㄴ. 甲이 乙에게 매도한 토지가 계약체결 후 재결수용으로 인하여 乙에게 이전할 수 없게 된 경우, 위험부담이 문제될 수 있다.\nㄷ. 甲이 乙에게 매도하기로 한 건물이 계약체결 전에 지진으로 전파(全破)된 경우, 계약체결상의 과실책임이 문제될 수 있다.","stem_table":null,"options":["ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[5],"image":null},{"id":"2023-34-민법-10","year":2023,"qnum":10,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"반사회적 법률행위로서 무효가 아닌 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["변호사가 민사소송의 승소대가로 성공보수를 받기로 한 약정","도박자금에 제공할 목적으로 금전을 대여하는 행위","수증자가 부동산 매도인의 배임행위에 적극 가담하여 체결한 부동산 증여계약","마약대금채무의 변제로서 토지를 양도하기로 한 계약","처음부터 보험사고를 가장하여 오로지 보험금을 취득할 목적으로 체결한 생명보험계약"],"answer":[1],"image":null},{"id":"2023-34-민법-11","year":2023,"qnum":11,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"통정허위표시에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["통정허위표시에 의한 급부는 특별한 사정이 없는 한 불법원인급여이다.","대리인이 대리권의 범위 안에서 현명하여 상대방과 통정허위표시를 한 경우, 본인이 선의라면 특별한 사정이 없는 한 그는 허위표시의 유효를 주장할 수 있다.","가장행위인 매매계약이 무효라면 은닉행위인 증여계약도 당연히 무효이다.","통정허위표시의 무효로부터 보호되는 선의의 제3자는 통정허위표시를 알지 못한 것에 대해 과실이 없어야 한다.","가장매매계약의 매수인과 직접 이해관계를 맺은 제3자가 악의라 하더라도 그와 다시 법률상 이해관계를 맺은 전득자가 선의라면 가장매매계약의 무효로써 전득자에게 대항할 수 없다."],"answer":[5],"image":null},{"id":"2023-34-민법-12","year":2023,"qnum":12,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"착오로 인한 의사표시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["매도인의 하자담보책임이 성립하더라도 착오를 이유로 한 매수인의 취소권은 배제되지 않는다.","계약 당시를 기준으로 하여 장래의 미필적 사실의 발생에 대한 기대나 예상이 빗나간 경우, 착오취소는 인정되지 않는다.","동기의 착오는 동기가 표시되어 해석상 법률행위의 내용으로 된 경우에 한해서만 유일하게 고려된다.","매매계약에서 매수인이 목적물의 시가에 관해 착오를 하였더라도 이는 원칙적으로 중요부분의 착오에 해당하지 않는다.","상대방이 표의자의 착오를 알면서 이용하였다면 표의자의 착오에 중대한 과실이 있더라도 착오취소가 인정된다."],"answer":[3],"image":null},{"id":"2023-34-민법-13","year":2023,"qnum":13,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"의사표시의 효력발생에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["의사표시의 발신 후 표의자가 사망하였다면, 그 의사표시는 상대방에게 도달하더라도 무효이다.","의사표시의 효력발생시기에 관해 도달주의를 규정하고 있는 민법 제111조는 임의규정이다.","상대방이 정당한 사유 없이 의사표시의 수령을 거절하더라도 상대방이 그 의사표시의 내용을 알 수 있는 객관적 상태에 놓여 있다면 그 의사표시는 효력이 있다.","재단법인 설립행위의 효력발생을 위해서는 의사표시의 도달이 요구되지 않는다.","미성년자는 그 행위능력이 제한되고 있는 범위에서 수령무능력자이다."],"answer":[1],"image":null},{"id":"2023-34-민법-14","year":2023,"qnum":14,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"법률행위의 대리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["무권대리인의 상대방에 대한 책임은 대리권의 흠결에 관하여 대리인에게 귀책사유가 있는 경우에만 인정된다.","민법 제124조에서 금지하는 자기계약이 행해졌다면 그 계약은 유동적 무효이다.","행위능력자인 임의대리인이 성년후견개시 심판을 받아 제한능력자가 되면 그의 대리권은 소멸한다.","대리인이 수인인 경우, 법률 또는 수권행위에서 다른 정함이 없으면 각자가 본인을 대리한다.","상대방 없는 단독행위의 무권대리는 특별한 사정이 없는 한 확정적 무효이다."],"answer":[1],"image":null},{"id":"2023-34-민법-15","year":2023,"qnum":15,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"복대리에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["복대리인은 대리인의 대리인이다.","복대리인은 본인에 대해 어떠한 권리ㆍ의무도 부담하지 않는다.","복대리인이 선임되면 복대리인의 대리권 범위 내에서 대리인의 대리권은 잠정적으로 소멸한다.","대리인이 복대리인을 선임한 후 사망하더라도 특별한 사정이 없는 한 그 복대리권은 소멸하지 않는다.","복임권 없는 대리인에 의해 선임된 복대리인의 대리행위에 대해서도 권한을 넘은 표현대리에 관한 규정이 적용될 수 있다."],"answer":[5],"image":null},{"id":"2023-34-민법-16","year":2023,"qnum":16,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"법률행위의 무효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["무권대리행위에 대한 본인의 추인은 다른 의사표시가 없는 한 소급효를 가진다.","법률행위의 일부분이 무효일 때, 그 나머지 부분의 유효성을 판단함에 있어 나머지 부분을 유효로 하려는 당사자의 가정적 의사를 고려하여야 한다.","토지거래허가구역 내의 토지를 매매한 당사자가 계약체결시부터 허가를 잠탈할 의도였더라도, 그 후 해당 토지에 대한 허가구역 지정이 해제되었다면 위 매매계약은 유효가 된다.","무효인 법률행위를 추인에 의하여 새로운 법률행위로 보기 위해서는 당사자가 그 무효를 알고서 추인하여야 한다.","처분권자는 명문의 규정이 없더라도 처분권 없는 자의 처분행위를 추인하여 이를 유효하게 할 수 있다."],"answer":[3],"image":null},{"id":"2023-34-민법-17","year":2023,"qnum":17,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"법률행위의 취소에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["취소권의 단기제척기간은 취소할 수 있는 날로부터 3년이다.","취소권의 행사시 반드시 취소원인의 진술이 함께 행해져야 하는 것은 아니다.","취소할 수 있는 법률행위의 상대방이 그 행위로 취득한 특정의 권리를 양도한 경우, 양수인이 아닌 원래의 상대방에게 취소의 의사표시를 하여야 한다.","노무자의 노무가 일정 기간 제공된 후 행해진 고용계약의 취소에는 소급효가 인정되지 않는다.","매도인이 매매계약을 적법하게 해제한 후에도 매수인은 그 매매계약을 착오를 이유로 취소할 수 있다."],"answer":[1],"image":null},{"id":"2023-34-민법-18","year":2023,"qnum":18,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"법률행위 부관인 조건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["물권행위에는 조건을 붙일 수 없다.","조건이 되기 위해서는 법률이 요구하는 것이 아니라 당사자가 임의로 부가한 것이어야 한다.","조건의 성취를 의제하는 효과를 발생시키는 조건성취 방해 행위에는 과실에 의한 행위도 포함된다.","부첩(夫妾)관계의 종료를 해제조건으로 하는 부동산 증여계약은 해제조건뿐만 아니라 증여계약도 무효이다.","당사자의 특별한 의사표시가 없는 한 정지조건이든 해제조건이든 그 성취의 효력은 소급하지 않는다."],"answer":[1],"image":null},{"id":"2023-34-민법-19","year":2023,"qnum":19,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"소멸시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["손해배상청구권에 대해 법률이 제척기간을 규정하고 있더라도 그 청구권은 소멸시효에 걸린다.","동시이행의 항변권이 붙어 있는 채권은 그 항변권이 소멸한 때로부터 소멸시효가 기산한다.","채권양도 후 대항요건을 갖추지 못한 상태에서 양수인이 채무자를 상대로 소를 제기하면 양도된 채권의 소멸시효는 중단된다.","비법인사단이 채무를 승인하여 소멸시효를 중단시키는 것은 사원총회의 결의를 요하는 총유물의 관리·처분행위가 아니다.","채권의 소멸시효 완성 후 채무자가 채권자에게 그 담보를 위해 저당권을 설정해 줌으로써 소멸시효의 이익을 포기했다면 그 효력은 그 후 저당부동산을 취득한 제3자에게도 미친다."],"answer":[2],"image":null},{"id":"2023-34-민법-20","year":2023,"qnum":20,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"甲의 乙에 대한 채권의 소멸시효 완성을 독자적으로 원용할 수 있는 자를 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 甲이 乙에 대한 채권을 보전하기 위하여 행사한 채권자취소권의 상대방이 된 수익자\nㄴ. 乙의 일반채권자\nㄷ. 甲의 乙에 대한 채권을 담보하기 위한 유치권이 성립된 부동산의 매수인\nㄹ. 甲의 乙에 대한 채권을 담보하기 위해 저당권이 설정된 경우, 그 후순위 저당권자","stem_table":null,"options":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":[2],"image":null},{"id":"2023-34-민법-21","year":2023,"qnum":21,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"물권의 객체에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["지상권은 물건이 아니므로 저당권의 객체가 될 수 없다.","법률상 공시방법이 인정되지 않는 유동집합물이라도 특정성이 있으면 이를 양도담보의 목적으로 할 수 있다.","저당권과 질권은 서로 다른 물권이므로 하나의 물건에 관하여 동시에 성립할 수 있다.","토지소유권은 토지의 상하에 미치므로 지상공간의 일부만을 대상으로 하는 구분지상권은 원칙적으로 허용되지 않는다.","기술적인 착오 없이 작성된 지적도에서의 경계가 현실의 경계와 다르다면, 토지소유권의 범위는 원칙적으로 현실의 경계를 기준으로 확정하여야 한다."],"answer":[2],"image":null},{"id":"2023-34-민법-22","year":2023,"qnum":22,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"법률에서 정하는 요건이 충족되면 당연히 성립하는 법정담보물권에 해당하는 것은?","stem_table":null,"options":["유치권","채권질권","법정지상권","전세권저당권","동산·채권 등의 담보에 관한 법률에 따른 동산담보권"],"answer":[1],"image":null},{"id":"2023-34-민법-23","year":2023,"qnum":23,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"등기의 유효요건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["물권에 관한 등기가 원인 없이 말소되더라도 특별한 사정이 없는 한 그 물권의 효력에는 영향을 미치지 않는다.","미등기건물의 승계취득자가 원시취득자와의 합의에 따라 직접 소유권보존등기를 마친 경우, 그 등기는 실체관계에 부합하는 등기로서 유효하다.","멸실된 건물의 보존등기를 멸실 후에 신축된 건물의 보존등기로 유용할 수 없다.","중복된 소유권보존등기의 등기명의인이 동일인이 아닌 경우, 선등기가 원인무효가 아닌 한 후등기는 무효이다.","토지거래허가구역 내의 토지에 대한 최초매도인과 최후매수인 사이의 중간생략등기에 관한 합의만 있더라도, 그에 따라 이루어진 중간생략등기는 실체관계에 부합하는 등기로서 유효하다."],"answer":[5],"image":null},{"id":"2023-34-민법-24","year":2023,"qnum":24,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"등기를 마치지 않더라도 물권변동의 효력이 발생하는 경우는? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["지상권설정계약에 따른 지상권의 취득","피담보채권의 시효소멸에 따른 저당권의 소멸","공익사업에 필요한 토지에 관하여 토지소유자와 관계인 사이의 협의에 의한 토지소유권의 취득","공유토지의 현물분할에 관한 조정조서의 작성에 따른 공유관계의 소멸","당사자 사이의 법률행위를 원인으로 한 소유권이전등기절차 이행의 소에서의 승소판결에 따른 소유권의 취득"],"answer":[2],"image":null},{"id":"2023-34-민법-25","year":2023,"qnum":25,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"동산의 선의취득에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["등기나 등록에 의하여 공시되는 동산은 원칙적으로 선의취득의 대상이 될 수 없다.","선의취득이 성립하기 위해서는 양도인이 무권리자라고 하는 점을 제외하고는 아무런 흠이 없는 거래행위이어야 한다.","양도인이 제3자에 대한 반환청구권을 양수인에게 양도하고 지명채권 양도의 대항요건을 갖춘 경우, 선의취득에 필요한 점유의 취득 요건을 충족한다.","동산질권의 선의취득을 저지하기 위해서는 취득자의 점유취득이 과실에 의한 것임을 동산의 소유자가 증명하여야 한다.","양수인이 도품을 공개시장에서 선의·무과실로 매수한 경우, 피해자는 양수인이 지급한 대가를 변상하고 그 물건의 반환을 청구할 수 있다."],"answer":[4],"image":null},{"id":"2023-34-민법-26","year":2023,"qnum":26,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"자주점유에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["점유매개자의 점유는 타주점유에 해당한다.","부동산의 매매 당시에는 그 무효를 알지 못하였으나 이후 매매가 무효임이 밝혀지더라도 특별한 사정이 없는 한, 매수인의 점유는 여전히 자주점유이다.","양자간 등기명의신탁에 있어서 부동산 명의수탁자의 상속인에 의한 점유는 특별한 사정이 없는 한, 자주점유에 해당하지 않는다.","공유토지 전부를 공유자 1인이 점유하고 있는 경우, 특별한 사정이 없는 한 다른 공유자의 지분비율 범위에 대해서는 타주점유에 해당한다.","자주점유의 판단기준인 소유의 의사 유무는 점유취득의 원인이 된 권원의 성질이 아니라 점유자의 내심의 의사에 따라 결정된다."],"answer":[5],"image":null},{"id":"2023-34-민법-27","year":2023,"qnum":27,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"점유자와 회복자의 관계에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["선의의 점유자라도 점유물의 사용으로 인한 이익은 회복자에게 반환하여야 한다.","임차인이 지출한 유익비는 임대인이 아닌 점유회복자에 대해서도 민법 제203조 제2항에 근거하여 상환을 청구할 수 있다.","과실수취권 있는 선의의 점유자란 과실수취권을 포함하는 본권을 가진다고 오신할 만한 정당한 근거가 있는 점유자를 가리킨다.","선의점유자에 대해서는 점유에 있어서의 과실(過失) 유무를 불문하고 불법행위를 이유로 한 손해배상책임이 배제된다.","점유물이 타주점유자의 책임 있는 사유로 멸실된 경우, 그가 선의의 점유자라면 현존 이익의 범위에서 손해배상책임을 진다."],"answer":[3],"image":null},{"id":"2023-34-민법-28","year":2023,"qnum":28,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"상린관계에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["인접하는 토지를 소유한 자들이 공동비용으로 통상의 경계표를 설치하는 경우, 다른 관습이 없으면 측량비용은 토지의 면적에 비례하여 부담한다.","지상권자 상호간에도 상린관계에 관한 규정이 준용된다.","주위토지통행권은 장래의 이용을 위하여 인정될 수 있으므로, 그 범위와 관련하여 장래의 이용상황까지 미리 대비하여 통행로를 정할 수 있다.","건물을 축조함에는 특별한 관습이 없으면 경계로부터 반미터 이상의 거리를 두어야 한다.","경계에 설치된 경계표나 담은 특별한 사정이 없는 한, 상린자의 공유로 추정한다."],"answer":[3],"image":null},{"id":"2023-34-민법-29","year":2023,"qnum":29,"curr_l
