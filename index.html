도인으로서는 매매대금 지급을 위한 매수인의 자 력, 신용 등 매수인이 누구인지에 따라 계약유지 여부를 달리 생각할 여지가 있다. 이러한 이유로 매매로 인한 소유권이전등기청구권의 양도는 특별한 사정이 없는 이상 양도가 제한되고 양도에 채무자의 승낙이나 동의를 요한다고 할 것이므로 통상의 채권양도와 달리 양도 인의 채무자에 대한 통지만으로는 채무자에 대한 대항력이 생기지 않으며 반드시 채무자의 동의나 승낙을 받아야 대항력이 생긴다(대판 2018.7.12. 2015다36167). 따라서 乙의 甲에 대한 매매에 기한 소유권이전등기청구권의 양도는 甲에 대한 통지만으로 대항력이 생기지 않는다. ※ 비교판례: 그러나 취득시효완성으로 인한 소유권이전등기청구권은 채권자와 채무자 사이에 아 무런 계약관계나 신뢰관계가 없고, 그에 따라 채권자가 채무자에게 반대급부로 부담하여야 하 는 의무도 없다. 따라서 취득시효완성으로 인한 소유권이전등기청구권의 양도의 경우에는 매매로 인한 소유권 이전등기청구권에 관한 양도제한의 법리가 적용되지 않는다. ㄷ. (×) : 당사자 사이에 적법한 원인행위가 성립되어 중간생략등기가 이루어진 이상, 중간생략등 기에 관한 합의가 없었다는 사유만으로는 그 소유권이전등기를 무효라고 할 수 없다(대판 1980.2.12. 79다2104). 따라서 甲, 乙, 丙 사이에 중간생략등기에 관한 합의가 없더라도, 당사 자 사이에 적법한 원인행위인 매매에 기해 중간생략등기가 이루어진 이상 실체적 권리관계에 부합되어 적법한 등기로서 유효하다. ㄹ. (○) : 중간생략등기의 합의란 부동산이 전전 매도된 경우 각 매매계약이 유효하게 성립함을 전제로 그 이행의 편의상 최초의 매도인으로부터 최종의 매수인 앞으로 소유권이전등기를 경료 하기로 한다는 당사자 사이의 합의에 불과할 뿐이므로, 이러한 합의가 있다고 하여 최초의 매 도인이 자신이 당사자가 된 매매계약상의 매수인인 중간자에 대하여 갖고 있는 매매대금청구 권의 행사가 제한되는 것은 아니다. 따라서 최초 매도인과 중간 매수인, 중간 매수인과 최종 매수인 사이에 순차로 매매계약이 체결되고 이들 간에 중간생략등기의 합의가 있은 후에 최초 매 도인과 중간 매수인 간에 매매대금을 인상하는 약정이 체결된 경우, 최초 매도인은 인상된 매매대 금이 지급되지 않았음을 이유로 최종 매수인 명의로의 소유권이전등기의무의 이행을 거절할 수 있다(대판 2005.4.29., 2003다66431). 따라서 甲, 乙, 丙 사이에 중간생략등기에 관한 합의 가 있은 후 甲ㆍ乙 간의 특약으로 매매대금을 인상한 경우, 甲은 인상된 매매대금의 미지급을 이유로 丙에 대한 소유권이전등기의무의 이행을 거절할 수 있다.", "2021-32-민법-29": "① 민법 제267조는 “공유자가 그 지분을 포기하거나 상속인 없이 사망한 때에는 그 지분은 다른 공유자에게 각 지분의 비율로 귀속한다.”라고 규정하고 있다. 여기서 공유지분의 포기는 법률 행위로서 상대방 있는 단독행위에 해당하므로, 부동산 공유자의 공유지분 포기의 의사표시가 다른 공유자에게 도달하더라도 이로써 곧바로 공유지분 포기에 따른 물권변동의 효력이 발생하 는 것은 아니고, 다른 공유자는 자신에게 귀속될 공유지분에 관하여 소유권이전등기청구권을 취득하며, 이후 민법 제186조에 의하여 등기를 하여야 공유지분 포기에 따른 물권변동의 효력 이 발생한다. 그리고 부동산 공유자의 공유지분 포기에 따른 등기는 해당 지분에 관하여 다른 공유자 앞으로 소유권이전등기를 하는 형태가 되어야 한다(대판 2016.10.27. 2015다52978). ② 공유자 자신의 지분이 과반수에 미달하면 소수지분권자에 지나지 않으므로 배타적으로 공유물을 점유하는 다른 과반수 미달의 공유자를 전면적으로 배제하고 자신만이 단독으로 공유물을 점유하 도록 인도해 달라고 청구할 권원은 없다. 대법원은 공유물의 소수지분권자가 다른 공유자와 협 의하지 않고 공유물의 전부 또는 일부를 독점적으로 점유하는 경우, 다른 소수지분권자자는 배타적으로 점유하고 있는 소수지분권자에게 공유물의 인도를 청구할 수는 없다고 한다(대판(전) 2020.5.21, 2018다287522). ※ 비교: 그러나 소나무 등 설치한 지상물에 대한 제거 등 방해배제는 청구할 수 있다고 판시했다(대판(전) 2020.5.21, 2018다287522). ③ 공유자 사이에 공유물을 사용⋅수익할 구체적인 방법을 정하는 것은 공유물의 관리에 관한 사항으 로서 공유자의 지분의 과반수로써 결정하여야 할 것이고, 과반수 지분의 공유자는 다른 공유자와 사이에 미리 공유물의 관리방법에 관한 협의가 없었다 하더라도 공유물의 관리에 관한 사항을 단 독으로 결정할 수 있다(대판 2002.5.14, 2002다9738). ④ 제266조【공유물의 부담】① 공유자는 그 지분의 비율로 공유물의 관리비용 기타 의무를 부담한다. ⑤ 공유자는 다른 약정이 없으면 언제든지 공유물의 분할을 청구할 수 있다(민법 제268조). 공유 는 공동소유자 상호간에 아무런 인적 결합관계 없이 각기 독립적으로 목적물을 지배할 수 있는 공동소유 형태로서, 물건에 대한 1개의 소유권이 분량적으로 분할되어 여러 사람에게 속하는 것 이므로 특별한 사정이 없는 한 각 공유자는 공유물의 분할을 청구하여 기존의 공유관계를 해소 하고 각 공유자 간에 공유물을 분배하는 법률관계를 실현하는 일방적인 권리를 가진다(대판 1991.11.12. 91다27228 등 참조). 제268조【공유물의 분할청구】 ① 공유자는 공유물의 분할을 청구할 수 있다. 그러나 5년 내의 기간으로 분할하지 아니할 것을 약정할 수 있다.", "2021-32-민법-30": "① 공유물분할의 효과는 원칙적으로 소급하지 아니한다. 다만, 예외적으로 공동상속재산의 분할에 있어서는 상속법상의 원칙에 따라 분할의 효과가 상속개시 시로 소급한다(제1015조). ② 재판에 의한 공유물분할은 각 공유자의 지분에 따른 합리적인 분할을 할 수 있는 한 현물분할 을 하는 것이 원칙이며 대금분할에 있어서 ‘현물로 분할 할 수 없다’는 요건은 이를 물리적 으로 엄격하게 해석할 것은 아니고 공유물의 성질, 위치나 면적, 이용상황, 분할 후의 사용가치 등에 비추어 보아 현물분할을 하는 것이 곤란하거나 부적당한 경우를 포함한다 할 것이고, ‘현물로 분할을 하게 되면 현저히 그 가액이 감손될 염려가 있는 경우’라는 것도 공유자의 한 사람이라도 현물분할에 의하여 단독으로 소유하게 될 부분의 가액이 분할 전의 소유지분 가 액보다 현저하게 감손될 염려가 있는 경우도 포함한다고 할 것이다(대판 1991.11.12. 91다 27228). ③ 공유물분할청구권은 공유관계에서 수반되는 형성권이므로 공유관계가 존속하는 한 그 분할청 구권만이 독립하여 시효소멸될 수 없다(대판 1981.3.24. 80다1888,1889). ④ 현물분할의 방법은 법원의 자유재량에 따라 공유관계나 그 객체인 물건의 제반 상황에 따라 공유자의 지분비율에 따라 합리적으로 분할하면 되는 것이고, 여기에서 공유지분비율에 따른다 함은 지분에 따른 가액비율에 따름을 의미하는 것으로 보는 것이 상당하므로 토지를 분할하는 경우에는 원칙적으로는 각 공유자가 취득하는 토지의 면적이 그 공유지분의 비율과 같아야 할 것이나, 반드시 그렇게 하지 아니하면 안되는 것은 아니고 토지의 형상이나 위치, 그 이용상황 이나 경제적 가치가 균등하지 아니할 때에는 이와 같은 제반 사정을 고려하여 경제적 가치가 지분비율에 상응하도록 분할하는 것도 허용된다(대판 1991.11.12. 91다27228). ⑤ 공유물분할의 소송절차 또는 조정절차에서 공유자 사이에 공유토지에 관한 현물분할의 협의가 성립하여 그 합의사항을 조서에 기재함으로써 조정이 성립하였다고 하더라도, 그와 같은 사정 만으로 재판에 의한 공유물분할의 경우와 마찬가지로 그 즉시 공유관계가 소멸하고 각 공유자 에게 그 협의에 따른 새로운 법률관계가 창설되는 것은 아니고, 공유자들이 협의한 바에 따라 토지의 분필절차를 마친 후 각 단독소유로 하기로 한 부분에 관하여 다른 공유자의 공유지분을 이전받아 등기를 마침으로써 비로소 그 부분에 대한 대세적 권리로서의 소유권을 취득하게 된 다고 보아야 한다(대판(전) 2013.11.21. 2011두1917).", "2021-32-민법-31": "① 부동산실권리자명의등기에관한법률이 규정하는 명의신탁약정은 부동산에 관한 물권의 실권리 자가 타인과의 사이에서 대내적으로는 실권리자가 부동산에 관한 물권을 보유하거나 보유하기 로 하고 그에 관한 등기는 그 타인의 명의로 하기로 하는 약정을 말하는 것일 뿐이므로, 그 자 체로 선량한 풍속 기타 사회질서에 위반하는 경우에 해당한다고 단정할 수 없을 뿐만 아니라, 위 법률은 원칙적으로 명의신탁약정과 그 등기에 기한 물권변동만을 무효로 하고 명의신탁자가 다른 법률관계에 기하여 등기회복 등의 권리행사를 하는 것까지 금지하지는 않는 대신, 명의신 탁자에 대하여 행정적 제재나 형벌을 부과함으로써 사적자치 및 재산권보장의 본질을 침해하지 않도록 규정하고 있으므로, 위 법률이 비록 부동산등기제도를 악용한 투기·탈세·탈법행위 등 반사회적 행위를 방지하는 것 등을 목적으로 제정되었다고 하더라도, 무효인 명의신탁약정에 기하여 타인 명의의 등기가 마쳐졌다는 이유만으로 그것이 당연히 불법원인급여에 해당한다고 볼 수 없다(대판 2003.11.27. 2003다41722). ② 어떠한 명의신탁등기가 위 법률에 따라 무효가 되었다고 할지라도 그 후 신탁자와 수탁자가 혼인하여 그 등기의 명의자가 배우자로 된 경우에는 조세포탈, 강제집행의 면탈 또는 법령상 제한의 회피를 목적으로 하지 아니하는 한 이 경우에도 위 법률 제8조 제2호의 특례를 적용하여 그 명의신탁등 기는 당사자가 혼인한 때로부터 유효하게 된다고 보아야 한다(대판 2002.10.25, 2002다23840). ③ 명의신탁약정의 무효는 선⋅악의를 불문하고 제3자에게 대항하지 못한다(제4조 제3항). 즉 제3자에 대한 관계에서는 유효한 것으로 취급되고, 그 결과 수탁자의 처분행위는 유효하게 된다는 것이 다(대판 2004.8.30, 2002다48771). ④ 부동산 실권리자명의 등기에 관한 법률(이하 ‘부동산실명법’이라 한다) 규정의 문언, 내용, 체계와 입법 목적 등을 종합하면, 부동산실명법을 위반하여 무효인 명의신탁약정에 따라 명의 수탁자 명의로 등기를 하였다는 이유만으로 그것이 당연히 불법원인급여에 해당한다고 단정할 수는 없다. 이는 농지법에 따른 제한을 회피하고자 명의신탁을 한 경우에도 마찬가지이다(대판 (전) 2019.6.20. 2013다218156). ⑤ 부동산실명법이 적용되지 않은 예외가 인정되는 경우는 조세포탈⋅강제집행의 면탈 또는 법령 상 제한의 회피를 목적으로 하지 않는 경우로 종교단체의 명의로 그 산하 조직이 보유한 부동산 에 관한 물권을 등기한 경우(동법 제8조 제3호)이므로, 종교단체장의 명의로 그 종교단체 보유 부동산의 소유권을 등기한 경우, 그 단체와 단체장 간의 명의신탁약정은 무효이다. 부동산실권리자명의 등기에 관한법률 제8조【종중, 배우자 및 종교단체에 대한 특례】 다음 각 호의 어느 하나에 해당하는 경우로서 조세 포탈, 강제집행의 면탈 또는 법령상 제한의 회피를 목적으로 하지 아니하는 경우 에는 제4조부터 제7조까지 및 제12조 제1항부터 제3항까지를 적용하지 아니한다 . 1. 종중이 보유한 부동산에 관한 물권을 종중(종중과 그 대표자를 같이 표시하여 등기한 경우를 포함한다) 외의 자의 명의로 등기한 경우 2. 배우자 명의로 부동산에 관한 물권을 등기한 경우 3. 종교단체의 명의로 그 산하 조직이 보유한 부동산에 관한 물권을 등기한 경우", "2021-32-민법-32": "① 토지에 관하여 저당권을 취득함과 아울러 그 저당권의 담보가치를 확보하기 위하여 지상권을 취득하는 경우, 특별한 사정이 없는 한 당해 지상권은 저당권이 실행될 때까지 제3자가 용익권 을 취득하거나 목적 토지의 담보가치를 하락시키는 침해행위를 하는 것을 배제함으로써 저당 부동산의 담보가치를 확보하는 데에 그 목적이 있다(대결 2004.3.29. 2003마1753). 사안의 경 우는 용익물권인 지상권이 저당권과 함께 담보가치를 위해 전용된 것으로 甲의 지상권 자체에 피담보채무가 존재하지 않는다. ②, ③ 근저당권 등 담보권설정의 당사자들이 그 목적이 된 토지 위에 차후 용익권이 설정되거나 건 물 또는 공작물이 축조⋅설치되는 등으로써 그 목적물의 담보가치가 저감하는 것을 막는 것을 주요 한 목적으로 하여 채권자 앞으로 아울러 지상권을 설정하였다면, 그 피담보채권이 변제 등으로 만족을 얻어 소멸한 경우는 물론이고 시효소멸한 경우에도 그 지상권은 피담보채권에 부종하여 소멸한다(대판 2011.4.14. 2011다6342). ④, ⑤ 토지에 관하여 저당권을 취득함과 아울러 그 저당권의 담보가치를 확보하기 위하여 지상권 을 취득하는 경우, 특별한 사정이 없는 한 당해 지상권은 저당권이 실행될 때까지 제3자가 용 익권을 취득하거나 목적 토지의 담보가치를 하락시키는 침해행위를 하는 것을 배제함으로써 저 당 부동산의 담보가치를 확보하는 데에 그 목적이 있다고 할 것이므로, 그와 같은 경우 제3자 가 비록 토지소유자로부터 신축중인 지상 건물에 관한 건축주 명의를 변경받았다 하더라도, 그 지상권자에게 대항할 수 있는 권원이 없는 한 지상권자로서는 제3자에 대하여 목적 토지 위에 건물을 축조하는 것을 중지하도록 요구할 수 있다(대결 2004.3.29. 2003마1753). 그러나 제3자 가 X를 점유ㆍ사용하는 경우, 甲은 지상권의 침해를 이유로 손해배상을 청구할 수 없다. 왜냐 하면 甲은 乙의 X에 대한 사용ㆍ수익권을 배제하지 않는 지상권을 취득하였을 뿐이므로 원래 사용ㆍ수익권이 없었으므로 제3자가 X를 점유ㆍ사용하더라도 손해가 생기지 않기 때문이다.", "2021-32-민법-33": "① 장사법 시행일 이전에 타인의 토지에 분묘를 설치한 다음 20년간 평온·공연하게 그 분묘의 기지를 점유함으로써 분묘기지권을 시효로 취득하였더라도, 분묘기지권자는 토지 소유자가 분 묘기지에 관한 지료를 청구하면 그 청구한 날부터의 지료를 지급할 의무가 있다고 보아야 한다 (대판(전) 2021.4.29. 2017다228007). ② 토지 소유자의 승낙이 없음에도 20년간 평온, 공연한 점유가 있었다는 사실만으로 사실상 영 구적이고 무상인 분묘기지권의 시효취득을 인정하는 종전의 관습은 적어도 2001. 1. 13. 장사법 (법률 제6158호)이 시행될 무렵에는 사유재산권을 존중하는 헌법을 비롯한 전체 법질서에 반하 는 것으로서 정당성과 합리성을 상실하였을 뿐 아니라 이러한 관습의 법적 구속력에 대하여 우 리 사회 구성원들이 확신을 가지지 않게 됨에 따라 법적 규범으로서 효력을 상실하였다. 그렇 다면 2001. 1. 13. 당시 아직 20년의 시효기간이 경과하지 아니한 분묘의 경우에는 법적 규범 의 효력을 상실한 분묘기지권의 시효취득에 관한 종전의 관습을 가지고 분묘기지권의 시효취득 을 주장할 수 없다(대판(전) 2017.1.19. 2013다17292). ③ 2001. 1. 13.부터 시행된 ‘장사 등에 관한 법률’(이하 개정 전후를 불문하고 ‘장사법’이라 고 한다) 부칙 규정들에 의하면, 토지 소유자의 승낙 없이 설치된 분묘에 대하여 토지 소유자가 이를 개장하는 경우에 분묘의 연고자는 당해 토지 소유자에 대항할 수 없다는 내용의 규정들은 장사법(법률 제6158호) 시행 후 설치된 분묘에 관하여만 적용한다고 명시하고 있으므로, 위 법 률 시행 전에 설치된 분묘에 대한 분묘기지권의 존립 근거가 위 법률의 시행으로 상실되었다고 볼 수 없다(대판(전) 2017.1.19. 2013다17292). ④ 분묘기지권에는 그 효력이 미치는 범위 안에서 새로운 분묘를 설치하거나 원래의 분묘를 다른 곳으로 이장할 권능은 포함되지 않는다(대판 2007.6.28, 2007다16885). 따라서 분묘기지권이 인정되는 분묘를 다른 곳에 이장하면 그 분묘기지권은 소멸한다. ⑤ 토지소유자의 승낙을 얻어 분묘가 설치된 경우 분묘소유자는 분묘기지권을 취득하고, 분묘기지 권의 존속기간에 관하여는 당사자 사이에 약정이 있는 등 특별한 사정이 있으면 그에 따를 것 이나, 그러한 사정이 없는 경우에는 권리자가 분묘의 수호와 봉사를 계속하며 그 분묘가 존속 하고 있는 동안 존속한다고 해석함이 타당하다. 또, 분묘가 멸실된 경우라고 하더라도 유골이 존재하여 분묘의 원상회복이 가능하여 일시적인 멸실에 불과하다면 분묘기지권은 소멸하지 않 고 존속하고 있다고 해석함이 상당하다(대판 2007.6.28. 2005다44114).", "2021-32-민법-34": "① 전세권이 성립한 후 전세목적물의 소유권이 이전된 경우 민법이 전세권 관계로부터 생기는 상 환청구, 소멸청구, 갱신청구, 전세금증감청구, 원상회복, 매수청구 등의 법률관계의 당사자로 규정하고 있는 전세권설정자 또는 소유자는 모두 목적물의 소유권을 취득한 신 소유자로 새길 수밖에 없다고 할 것이므로, 전세권은 전세권자와 목적물의 소유권을 취득한 신 소유자 사이에 서 계속 동일한 내용으로 존속하게 된다고 보아야 할 것이고, 따라서 목적물의 신 소유자는 구 소유자와 전세권자 사이에 성립한 전세권의 내용에 따른 권리의무의 직접적인 당사자가 되어 전세권이 소멸하는 때에 전세권자에 대하여 전세권설정자의 지위에서 전세금 반환의무를 부담 하게 된다(대판 1994.6.24. 94다10900). ② 전세권자는 전세금을 지급하고 타인의 부동산을 점유하여 그 부동산의 용도에 좇아 사용·수 익하며, 그 부동산 전부에 대하여 후순위권리자 기타 채권자보다 전세금의 우선변제를 받을 권 리가 있다(민법 제303조 제1항). 이처럼 전세권이 용익물권적인 성격과 담보물권적인 성격을 모 두 갖추고 있는 점에 비추어 전세권 존속기간이 시작되기 전에 마친 전세권설정등기도 특별한 사정이 없는 한 유효한 것으로 추정된다. 한편 부동산등기법 제4조 제1항은 “같은 부동산에 관하여 등기한 권리의 순위는 법률에 다른 규정이 없으면 등기한 순서에 따른다.”라고 정하고 있으므로, 전세권은 등기부상 기록된 전세권설정등기의 존속기간과 상관없이 등기된 순서에 따 라 순위가 정해진다(대결 2018.1.25. 2017마1093). ③ 전세금의 지급은 전세권 성립의 요소가 되는 것이지만 그렇다고 하여 전세금의 지급이 반드 시 현실적으로 수수되어야만 하는 것은 아니고 기존의 채권으로 전세금의 지급에 갈음할 수 도 있다(대판 2009.1.30, 2008다67217). ④ 전세권의 임의경매(제318조)와 관련된 건물일부의 경매신청의 적법성 문제이다. 건물의 일부에 대하여 전세권이 설정되어 있는 경우 그 전세권자는 민법 제303조 제1항의 규정에 의하여 그 건물 전부에 대하여 후순위권리자 기타 채권자보다 전세금의 우선변제를 받을 권리가 있 고, 민법 제318조의 규정에 의하여 전세권설정자가 전세금의 반환을 지체한 때에는 전세권의 목적물의 경매를 청구할 수 있는 것이나, 전세권의 목적물이 아닌 나머지 건물부분에 대하여는 우선변제권은 별론으로 하고 경매신청권은 없으므로, 위와 같은 경우 전세권자는 전세권의 목적 이 된 부분을 초과하여 건물 전부의 경매를 청구할 수 없다고 할 것이고, 그 전세권의 목적이 된 부분이 구조상 또는 이용상 독립성이 없어 독립한 소유권의 객체로 분할할 수 없고 따라서 그 부분만의 경매신청이 불가능하다고 하여 달리 볼 것은 아니다(대판 2001.7.2, 2001마212). ※ 비교: 일부전세의 경우 → 나머지 경매 ×, 우선변제 ○ 01 ③ 즉, 전세권의 목적이 된 부분을 초과한 경매 ×, 불가분관계에 있다하더라도 ✔ but 우선변제권은 전부에서 가능 ⑤ 전세권자는 현상을 유지하여야 의무가 있기 때문에 전세권설정자에게 목적물의 현상을 유지하 기 위하여 지출한 필요비의 상환을 청구할 수 없다(제310조). 제310조【전세권자의 상환청구권】 ① 전세권자가 목적물을 개량하기 위하여 지출한 금액 기타 유익비에 관하여는 그 가액의 증가가 현존한 경우에 한하여 소유자의 선택에 좇아 그 지출액이나 증가액의 상환을 청구할 수 있다. ② 전항의 경우에 법원은 소유자의 청구에 의하여 상당한 상환기간을 허여할 수 있다.", "2021-32-민법-35": "① 사안의 경우는 명의수탁자 乙이 매수인으로서 계약의 당사자가 되어 매도인 丙과 매매계약을 체 결하고 등기도 명의수탁자 乙 앞으로 마친 것이므로 이른바 계약명의신탁의 유형에 해당한다. 이때 명의신탁 약정은 매도인 丙이 선의인지 악의인지 불문하고 무효이다(부동산실명법 제4조 제1항). ②, ④ ‘부동산 실권리자명의 등기에 관한 법률’ 제4조 제1항, 제2항에 의하면 명의신탁자와 명 의수탁자가 이른바 계약명의신탁약정을 맺고 명의수탁자가 당사자가 되어 명의신탁약정이 있다 는 사실을 알지 못하는 소유자와의 사이에 부동산에 관한 매매계약을 체결한 후 그 매매계약에 따라 당해 부동산의 소유권이전등기를 수탁자 명의로 마친 경우에는 명의신탁자와 명의수탁자 사이의 명의신탁약정의 무효에도 불구하고 그 명의수탁자는 당해 부동산의 완전한 소유권을 취 득하게 되고, 다만 명의수탁자는 명의신탁자에 대하여 부당이득반환의무를 부담하게 될 뿐이다. 이 경우 그 계약명의신탁약정이 ‘부동산 실권리자명의 등기에 관한 법률’ 시행 후인 경우에 는 명의신탁자는 애초부터 당해 부동산의 소유권을 취득할 수 없었으므로, 위 계약명의신탁약 정의 무효로 인하여 명의신탁자가 입은 손해는 당해 부동산 자체가 아니라 명의수탁자에게 제 공한 매수자금이고, 따라서 명의수탁자는 당해 부동산 자체가 아니라 명의신탁자로부터 제공받 은 매수자금 상당액을 부당이득하였다고 할 것이다(대판 2010.10.14. 2007다90432). ③ 부동산 실권리자명의 등기에 관한 법률 제4조 제2항 단서는 부동산 거래의 상대방을 보호하기 위한 것으로 상대방이 명의신탁약정이 있다는 사실을 알지 못한 채 물권을 취득하기 위한 계약 을 체결한 경우 그 계약과 그에 따른 등기를 유효라고 한 것이다. 명의신탁자와 명의수탁자가 계약명의신탁약정을 맺고 명의수탁자가 당사자가 되어 매도인과 부동산에 관한 매매계약을 체 결하는 경우 그 계약과 등기의 효력은 매매계약을 체결할 당시 매도인의 인식을 기준으로 판단 해야 하고, 매도인이 계약 체결 이후에 명의신탁약정 사실을 알게 되었다고 하더라도 위 계약 과 등기의 효력에는 영향이 없다. 매도인이 계약 체결 이후 명의신탁약정 사실을 알게 되었다 는 우연한 사정으로 인해서 위와 같이 유효하게 성립한 매매계약이 소급적으로 무효로 된다고 볼 근거가 없다. 만일 매도인이 계약 체결 이후 명의신탁약정 사실을 알게 되었다는 사정을 들 어 매매계약의 효력을 다툴 수 있도록 한다면 매도인의 선택에 따라서 매매계약의 효력이 좌우 되는 부당한 결과를 가져올 것이다(대판 2018.4.10. 2017다257715). ⑤ 「부동산 실권리자명의 등기에 관한 법률」(이하 ‘부동산실명법’) 제4조 제3항에 의하면 명 의신탁약정 및 이에 따른 등기로 이루어진 부동산에 관한 물권변동의 무효는 제3자에게 대항하 지 못하는데, 여기서 ‘제3자’는 명의신탁약정의 당사자 및 포괄승계인 이외의 자로서 명의수 탁자가 물권자임을 기초로 그와 사이에 직접 새로운 이해관계를 맺은 사람으로서 소유권이나 저당권 등 물권을 취득한 자뿐만 아니라 압류 또는 가압류채권자도 포함하고 그의 선의·악의 를 묻지 않는다(대판 2000.3.28. 99다56529 등 참조). 따라서 丙이 甲ㆍ乙 사이의 명의신탁약 정 사실을 안 경우에도 乙이 그 사정을 모르는 제3자 丁에게 X를 매도하여 소유권이전등기를 마쳤다면, 甲은 명의신탁약정과 등기의 무효를 가지고 제3자인 丁에게 대항할 수 없기 때문에 丁이 X의 소유권을 취득한다.", "2021-32-민법-36": "①, ② 건물의 임대차에 있어서 임차인의 임대인에게 지급한 임차보증금반환청구권이나 임대인이 건물시설을 아니하기 때문에 임차인에게 건물을 임차목적대로 사용 못한 것을 이유로 하는 손 해배상청구권은 모두 민법 제320조 소정 소위 그 건물에 관하여 생긴 채권이라 할 수 없다(대 판 1976.5.11, 75다1305). ③ 유치권은 타물권인 점에 비추어 볼 때 수급인의 재료와 노력으로 건축되었고 독립한 건물에 해당되는 기성부분은 수급인의 소유라 할 것이므로 수급인은 공사대금을 지급받을 때까지 이에 대하여 유치권을 가질 수 없다(대판 1993.3.26. 91다14116) ④ 유치권의 성립요건이자 존속요건인 유치권자의 점유는 직접점유이든 간접점유이든 관계가 없으 나, 다만 유치권은 목적물을 유치함으로써 채무자의 변제를 간접적으로 강제하는 것을 본체적 효 력으로 하는 권리인 점 등에 비추어, 그 직접점유자가 채무자인 경우에는 유치권의 요건으로서의 점유에 해당하지 않는다(대판 2008.4.11. 2007다27236). ⑤ 유치권자가 점유침탈로 유치물의 점유를 상실한 경우，유치권은 원칙적으로 소멸한다(제328조). 제328조【점유상실과 유치권소멸】유치권은 점유의 상실로 인하여 소멸한다.", "2021-32-민법-37": "① 제331조【질권의 목적물】질권은 양도할 수 없는 물건을 목적으로 하지 못한다. ② 제338조 제1항【경매, 간이변제충당】질권자는 채권의 변제를 받기 위하여 질물을 경매할 수 있다. ③ 질권의 목적이 된 채권이 금전채권인 때에는 질권자는 자기채권의 한도에서 질권의 목적이 된 채권을 직접 청구할 수 있고, 채권질권의 효력은 질권의 목적이 된 채권의 지연손해금 등과 같 은 부대채권에도 미치므로 채권질권자는 질권의 목적이 된 채권과 그에 대한 지연손해금채권을 피담보채권의 범위에 속하는 자기채권액에 대한 부분에 한하여 직접 추심하여 자기채권의 변제 에 충당할 수 있다(대판 2005.2.25. 2003다40668). ④ 질권의 목적인 채권의 양도행위는 민법 제352조 소정의 질권자의 이익을 해하는 변경에 해당 되지 않으므로 질권자의 동의를 요하지 아니한다(대판 2005.12.22. 2003다55059). 제352조【질권설정자의 권리처분제한】질권설정자는 질권자의 동의 없이 질권의 목적된 권리를 소멸하게 하거나 질권자의 이익을 해하는 변경을 할 수 없다. ⑤ 제333조【동산질권의 순위】수개의 채권을 담보하기 위하여 동일한 동산에 수개의 질권을 설정한 때 에는 그 순위는 설정의 선후에 의한다.", "2021-32-민법-38": "① 민법 제359조 제1항은 ʻ저당권의 효력은 저당부동산에 대한 압류가 있은 후에 저당권설정자가 그 부동산으로부터 수취한 과실 또는 수취할 수 있는 과실에 미친다.ʼ 고 규정하고 있는데, 위 규정상의 ʻ과실ʼ에는 천연과실뿐만 아니라 법정과실도 포함된다고 할 것이므로, 저당부동산에 대 한 압류가 있으면 그 압류 이후의 저당권설정자의 저당부동산에 관한 차임채권 등에도 저당권 의 효력이 미친다(대판 2016.7.27. 2015다230020). ② 민법 제370조, 제342조 단서가 저당권자는 물상대위권을 행사하기 위하여 저당권설정자가 받 을 금전 기타 물건의 지급 또는 인도 전에 압류하여야 한다고 규정한 것은 물상대위의 목적인 채권의 특정성을 유지하여 그 효력을 보전함과 동시에 제3자에게 불측의 손해를 입히지 않으려 는 데 있는 것이므로, 저당목적물의 변형물인 금전 기타 물건에 대하여 일반 채권자가 물상대 위권을 행사하려는 저당채권자보다 단순히 먼저 압류나 가압류의 집행을 함에 지나지 않은 경 우에는 저당권자는 그 전은 물론 그 후에도 목적채권에 대하여 물상대위권을 행사하여 일반 채 권자보다 우선변제를 받을 수가 있다(대판 1994.11.22. 94다25728). ③ 제361조【저당권의 처분제한】저당권은 그 담보한 채권과 분리하여 타인에게 양도하거나 다른 채권의 담보로 하지 못한다. ④ 원칙적으로 저당권의 효력은 저당부동산에 부합된 물건에 미친다(제358조). 저당권설정 전에 부 합한 것이든 그 후에 부합한 것이든 불문한다(판례). 제358조【저당권의 효력의 범위】 저당권의 효력은 저당부동산에 부합된 물건과 종물에 미친다. 그러나 법률에 특별한 규정 또는 설정행위에 다른 약정이 있으면 그러하지 아니하다. ⑤ 제364조【제3취득자의 변제】저당부동산에 대하여 소유권, 지상권 또는 전세권을 취득한 제3자는 저 당권자에게 그 부동산으로 담보된 채권을 변제하고 저당권의 소멸을 청구할 수 있다.", "2021-32-민법-39": "④ 사안은 채권자 甲이 채무자 乙에 대한 2억원의 채권을 담보하기 위하여 모두 채무자 소유인 X 토지와 Y건물에 대하여 각각 1번 공동저당권을 취득한 후 동시배상이 아니라, 이시배상이 이루 어진 경우이다. 동시배당이 되었다면 제368조 제1항이 적용되어 각 부동산의 경매대가에 비례하여 채권이 분 담이 되기 때문에 1순위자인 공동저당권자 甲은 X토지에서는 1억 5천만원(2억원 × 3/4)만을 배당받고, Y건물에서 5천만원(2억원 × 1/4)을 배당받게 된다. 이 경우 X토지의 후순위저당권 자인 丙은 X토지의 경매대금 3억원 중 남은 1억 5천만원을 배당받게 되고, Y건물의 후순위저당 권자 丁이 Y건물의 경매대금 1억원 중 남은 5천만원을 배당받게 된다. 그러나 사안은 공동저당물 중 X토지에 대해 먼저 경매가 이루어져, 경매대금 3억원 중 2억원 은 1순위자인 공동저당권자 甲에게, 나머지 1억은 후순위저당권자인 丙에게 배상이 완료되었다. 그 후 Y건물에 대하여 경매가 이루어지는 경우로, 1순위자인 공동저당권자 甲은 이미 채권 전 액을 X토지에서 변제받았으므로 다시 Y건물에서는 배당받을 수 없다. 그렇다 하여도 甲의 저당 권은 말소되지 않고, 동시배당의 경우보다 불이익을 받게 된 후순위저당권자 丙이 제368조 제2 항에 따라 甲의 저당권을 법정대위를 할 수 있게 된다. 즉 먼저 경매된 X토지의 후순위저당권자인 丙은 동시에 배당하였으면 1억 5천만원을 배당받을 수 있음에도 1억원만 배당받게 된다. 이 경우 1순위자인 공동저당권자 甲이 Y건물의 대가에서 변 제받을 수 있었던 5천만원의 한도에서 공동저당권자 甲를 대위하여 저당권을 행사할 수 있다. 따라서 Y건물에 대한 경매대금 1억원은 제368조 제2항에 근거한 후순위저당권자의 법정대위에 기해 丙이 5천만원을 배당받고, Y건물의 후순위저당권자인 丁이 나머지 5천만원을 배당받게 된 다. ■ 공동저당 동시배당 1. → : 제368조 제1항 적용 경매대가 비례 각 부동산의 에 분담 하여 채권 목적물 전부가 이시배당 2. : 제368조 제2항 적용 채무자소유 또는 → 전문: 공동저당권자는 먼저 경매된 부동산의 대가에서 채권 전부변제수령 가능 물상보증인 → 후문: 이 경우 먼저 경매된 부동산의 후순위저당권자 는 동시에 배당하였으면 소유인 경우 공동저당권자가 다른 부동산에서 변제 받을 수 있는 금액의 한도에서 공동저당권자를 대위 하여 저당권행사 가능 동시배당: 제368조 제1항 적용 × 1. 목적물 일부는 → ① ○ 채무자소유: 먼저 배당 ② 채무자 소유, 이시배당 ○ 부족시: 물상보증인 목적물 일부는 2. 제368조 제2항 대위 × 물상보증인 (1) 채무자 소유가 먼저 경매된 경우: 소유인 경우 ①(2) 물상보증인 소유가 먼저 경매된 경우 § 물상보증인: 법정대위( 481) ② 〓 후순위저당권자( 물상보증인에게 돈을 대여한 자): 물상대위", "2021-32-민법-40": "① 제371조【지상권, 전세권을 목적으로 하는 저당권】② 지상권 또는 전세권을 목적으로 저당권을 설정한 자 는 저당권자의 동의없이 지상권 또는 전세권을 소멸하게 하는 행위를 하지 못한다. ②, ③, ④, ⑤ 전세권에 대하여 저당권이 설정된 경우 그 저당권의 목적물은 물권인 전세권 자체이지 전세금반환채권은 그 목적물이 아니고, ② 전세권의 존속기간이 만 료되면 전세권은 소멸하므로 더 이상 전세권 자체에 대하여 저당권을 실행할 수 없게 되고, ③ 이러한 경우에는 민법 제370조, 제342조(물상대위) 및 민사소송법 제733조 에 의하여 저당권의 목적물인 전세권에 갈음하여 존속하는 것으로 볼 수 있는 전세금 반환채권에 대하여 압류 및 추심명령 또는 전부명령을 받거나 제3자가 전세금반환채 권에 대하여 실시한 강제집행절차에서 배당요구를 하는 등의 방법으로 자신의 권리를 행사하여 비로소 전세권설정자에 대해 전세금의 지급을 구할 수 있게 된다는 점, 원 래 동시이행항변권은 공평의 관념과 신의칙에 입각하여 각 당사자가 부담하는 채무가 서로 대가적 의미를 가지고 관련되어 있을 때 그 이행에 있어서 견련관계를 인정하여 당사자 일방은 상대방이 채무를 이행하거나 이행의 제공을 하지 아니한 채 당사자 일 방의 채무의 이행을 청구할 때에는 자기의 채무이행을 거절할 수 있도록 하는 제도인 점, 전세권을 목적물로 하는 저당권의 설정은 전세권의 목적물 소유자의 의사와는 상 관없이 전세권자의 동의만 있으면 가능한 것이고, 원래 전세권에 있어 전세권설정자 가 부담하는 전세금반환의무는 전세금반환채권에 대한 제3자의 압류 등이 없는 한 전 세권자에 대해 전세금을 지급함으로써 그 의무이행을 다할 뿐이라는 점에 비추어 볼 때, ⑤ 전세권저당권이 설정된 경우에도 전세권이 기간만료로 소멸되면 전세권설정자 는 전세금반환채권에 대한 제3자의 압류 등이 없는 한 전세권자에 대하여만 전세금반 환의무를 부담한다고 보아야 한다.(대판 1994.6.24. 94다10900).", "2023-34-민법-1": "① 민법 제1조의 ‘법률’이란 형식적 의미의 법률에 한정하지 않고 모든 성문법(명령·규칙·조례·조약 포함)을 의미하므로 민법전만을 의미하지 않는다. ② 관습법은 사회의 법적 확신에 의하여 법적 규범으로 승인된 것이고, 사실인 관습은 그 정도에 이르지 않은 단순한 관행으로서 법률행위 당사자의 의사를 보충함에 그친다(대판 1983.6.14. 80다3231). 따라서 ‘관습법’에는 사실인 관습이 포함되지 않는다. ③ 대법원이 법률에 저촉되지 않는 범위에서 제정한 규칙이 민사에 관한 사항을 정한 것이면 민법의 법원이 되므로, 「공탁규칙」도 민법의 법원이 될 수 있다(헌법 제108조). ④ 헌법에 의하여 체결·공포된 조약과 일반적으로 승인된 국제법규는 국내법과 같은 효력을 가지므로(헌법 제6조), 그것이 민사에 관한 것이면 민법의 법원이 될 수 있다. ⑤ 미등기 무허가건물의 양수인에게 소유권에 준하는 관습법상의 물권을 인정할 수 없다(대판 2006.10.7. 2006다49000). 관습법상 물권은 분묘기지권, 관습법상 법정지상권, 동산의 양도담보에 한한다.", "2023-34-민법-2": "① 성년후견인은 피성년후견인의 신상과 재산에 관한 모든 사정을 고려하여 여러 명을 둘 수 있다(제930조 제2항). 법인도 성년후견인이 될 수 있다. ② 가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있고(제10조 제2항), 본인 등의 청구에 의하여 그 범위를 변경할 수 있다(제10조 제3항). ③ 가정법원이 피성년후견인에 대하여 한정후견 개시의 심판을 할 때에는 종전의 성년후견의 종료 심판을 하여야 한다(제14조의3 제2항). ④ 성년후견이든 한정후견이든 개시 여부 결정 시 본인의 의사를 고려하여야 하므로(제9조 제2항, 제12조 제2항), 한정후견의 개시를 청구한 사건에서 성년후견 개시 요건을 충족하더라도 법원은 본인의 의사를 고려하지 않고 성년후견을 개시할 수 없다(대결 2021.6.10. 2020스596). ⑤ 피특정후견인은 완전한 행위능력자이므로, 특정후견인의 동의 없이 재산상의 법률행위를 하더라도 유효한 법률행위로서 취소의 대상이 되지 않는다.", "2023-34-민법-3": "① 부재자 스스로 위임한 재산관리인에게 재산처분권까지 위임된 경우에는 그 재산을 처분함에 법원의 허가를 요하지 않는다(대판 1973.7.24. 72다2136). ② 부재자가 재산관리인을 정하지 아니한 때에는 법원은 이해관계인이나 검사의 청구에 의하여 필요한 처분을 명하여야 하며(제22조), 채권자는 법률상 이해관계인으로서 청구할 수 있다. ③ 법원이 선임한 재산관리인의 보존행위·이용·개량행위는 법원의 허가를 요하지 않으므로(제25조, 제118조), 차임청구는 보존행위로서 허가 없이 할 수 있다. ④ 법원의 초과행위허가 결정은 장래의 처분행위뿐 아니라 기왕의 처분행위를 추인하는 방법으로도 할 수 있다(대판 1982.9.14. 80다3063 등). ⑤ 법원에 의하여 부재자재산관리인으로 선임된 자는 부재자의 사망이 확인된 후라도 선임결정이 취소되지 않는 한 관리인으로서의 권한이 소멸하지 않고 계속하여 권한을 행사할 수 있다(대판 1991.11.26. 91다11810).", "2023-34-민법-4": "① 감사는 임의기관이므로 감사의 임면에 관한 사항은 정관의 필요적 기재사항이 아니다(제66조, 제40조). ②③ 정관은 필요적·임의적 기재사항을 불문하고 기재되면 동일한 효력이 있어 변경에는 주무관청의 허가가 있어야 효력이 발생하므로, 임의적 기재사항도 변경절차 없이 변경할 수 없고, 의결정족수가 충족되어도 주무관청 허가 없이는 정관변경의 효력이 생기지 않는다(제42조). ④ 재단법인의 기본재산을 새로 편입하는 행위도 정관의 변경을 초래하므로 주무관청의 허가가 있어야 유효하다(대판 1991.5.28. 90다8558). ⑤ 재단법인의 기본재산에 관한 저당권 설정행위는 특별한 사정이 없는 한 정관 기재사항을 변경하여야 하는 경우에 해당하지 않으므로 주무관청의 허가를 얻을 필요가 없다(대결 2018.7.20. 2017마1565).", "2023-34-민법-5": "① 비법인사단의 대표자는 정관 또는 총회의 결의로 금지하지 아니한 사항에 한하여 타인으로 하여금 특정한 행위를 대리하게 할 수 있을 뿐, 제반 업무처리를 포괄적으로 위임할 수는 없다(제62조 유추적용, 대판 1996.9.6. 94다18522). ② 총유물의 관리·처분행위는 정관에 달리 정함이 없으면 사원총회의 결의를 요하며, 이를 거치지 않은 처분행위는 무효이다(대판 2014.2.13. 2012다112299). ③ 고유한 의미의 종중은 종중원의 신분이나 지위를 박탈할 수 없고(소위 할종은 무효, 대판 1983.2.8. 80다1194), 종중원도 임의로 탈퇴할 수 없다. ④ 고유 의미의 종중은 자연발생적 관습상 종족집단체로서 특별한 조직행위를 필요로 하지 않는다(대판 1995.12.22. 95다12736). ⑤ 법인이 아닌 사단의 사원이 집합체로서 물건을 소유할 때에는 총유로 한다(제275조 제1항).", "2023-34-민법-6": "형성권은 권리자의 일방적 의사표시에 의하여 법률관계의 발생·변경·소멸을 일으키는 권리이다(동의권·취소권·추인권·상계권·해제권·해지권·예약완결권 등). ① 취소권·동의권은 형성권이나 저당권은 물권(지배권)이다. ② 상계권·예약완결권은 형성권이나 준물권(광업권·어업권 등)은 지배권이다. ③ 해제권·취소권은 형성권이고, 지상물매수청구권(제283조)도 명칭에 구애받지 않고 그 성질상 형성권이므로 모두 형성권이다. ④ 추인권·해지권은 형성권이나 물권적 청구권은 청구권이다. ⑤ 해지권·부속물매수청구권(제316조)은 형성권이나 부양청구권은 청구권이다. ※ 명칭은 청구권이지만 형성권인 권리: 공유물분할청구권(제268조), 지상물매수청구권(제283조), 지료증감청구권(제286조), 부속물매수청구권(제316조), 임차인·전차인의 매수청구권(제643조~제647조).", "2023-34-민법-7": "① 이사의 변경등기는 설립등기 이외의 등기로서 효력발생요건이 아니라 대항요건이다(제54조 제1항). ② 이사가 수인인 경우 원칙적으로 각자 법인을 대표한다(제59조 제1항). ③ 사단법인의 정관 변경은 사원총회의 전권사항으로 정관으로도 박탈할 수 없다. ④ 법인과 어느 이사와의 관계사항을 의결하는 경우 그 이사는 의결권이 없으나(제74조 유추), 이해관계 있는 이사는 의사정족수 산정의 기초가 되는 이사의 수에는 포함되고 다만 출석이사에는 산입되지 아니한다(대판 2009.4.9. 2008다1521). ⑤ 대표권 제한이 등기되어 있지 않으면 법인은 선의·악의를 불문하고 제3자에 대하여 대항할 수 없다(제60조, 대판 1992.2.14. 91다24564).", "2023-34-민법-8": "① 주물과 종물은 독립한 물건이어야 하므로 주물의 구성부분은 종물이 될 수 없다(대판 1993.12.10. 93다42399). ② 일물일권주의의 예외로 특정성·공시방법·사회적 필요가 있으면 물건의 일부에도 물권이 인정될 수 있어, 1필의 토지의 일부에 대한 지상권, 부동산의 일부에 대한 전세권 등이 인정된다. 즉 1필의 토지의 일부도 분필절차를 거치지 않는 한 용익물권(지상권 등)의 객체가 될 수 있다. ③ 국립공원의 입장료는 토지의 사용대가인 민법상 과실이 아니라 수익자부담 원칙에 따른 것이다(대판 2001.12.28. 2000다27749). ④ 주물 자체의 경제적 효용과 관계없는 물건은 주물의 소유자·이용자의 사용에 공여되더라도 종물이 아니다(대판 2007.12.13. 2007도7247). ⑤ “저당권의 효력이 종물에 미치지 않는다”는 약정은 등기하지 않으면 제3자에게 대항할 수 없다(제358조).", "2023-34-민법-9": "ㄱ. (○) 계약체결 후 甲의 방화로 전소된 것은 채무자의 귀책사유로 인한 후발적 불능으로서 채무불이행에 해당하여 甲의 손해배상책임(제390조)이 문제될 수 있다. ㄴ. (○) 계약체결 후 재결수용으로 이전 불능이 된 것은 당사자 쌍방의 책임 없는 사유로 인한 후발적 불능이므로 위험부담(제537조)이 문제될 수 있다. ㄷ. (○) 계약체결 전에 지진으로 전파된 것은 원시적·객관적·전부불능으로 법률행위는 무효이나, 계약체결상의 과실책임(제535조 제1항)이 문제될 수 있다. 따라서 ㄱ, ㄴ, ㄷ 모두 옳다.", "2023-34-민법-10": "① 변호사의 민사사건 성공보수약정은 사적 자치·계약자유의 원칙상 허용되어 유효하다(형사사건의 성공보수약정만 무효, 대판(전) 2015.7.23. 2015다200111). ② 도박자금에 제공할 목적의 금전대차계약은 제103조 위반으로 무효이다(대판 1973.5.22. 72다2249). ③ 매도인의 배임행위에 적극 가담하여 체결한 증여계약은 반사회질서 행위로서 무효이다(대판 1983.4.26. 83다카57). ④ 불법인 마약거래를 원인으로 한 마약대금채무의 변제로 토지를 양도하기로 한 계약도 반사회질서 행위로서 무효이다. ⑤ 오로지 보험사고를 가장하여 보험금을 취득할 목적의 생명보험계약은 사회질서에 위배되어 무효이다(대판 2000.2.11. 99다49064).", "2023-34-민법-11": "① 통정허위표시에 의한 급부는 제103조 위반이 아니어서 불법원인급여에 해당하지 않는다(대판 2004.5.28. 2003다70041). ② 대리인의 통정허위표시에서 본인은 당사자로서 새로운 이해관계를 맺은 제3자가 아니므로, 선의라 하더라도 특별한 사정이 없는 한 허위표시의 유효를 주장할 수 없다. ③ 은닉행위(예: 증여)는 허위표시(가장 매매)와 달리 그 법률행위의 요건을 구비하는 한 유효하다(대판 1993.8.28. 93다12930). ④ 제108조 제2항의 제3자는 선의이면 족하고 무과실은 요건이 아니다(대판 2004.5.28. 2003다70041). ⑤ 선의의 제3자가 보호되는 이해관계에는 당사자와 직접 이해관계를 가지는 경우뿐만 아니라 그 법률관계를 바탕으로 다시 이해관계를 가지게 되는 전득자도 포함되므로, 제3자가 악의이더라도 전득자가 선의라면 통정허위표시의 무효로 전득자에게 대항할 수 없다(대판 2013.2.15. 2012다49292).", "2023-34-민법-12": "① 착오취소 제도와 하자담보책임 제도는 취지·요건·효과가 다르므로, 매매계약 내용의 중요부분에 착오가 있으면 매수인은 하자담보책임 성립 여부와 상관없이 착오를 이유로 취소할 수 있다(대판 2018.9.13. 2015다78703). ② 장래의 미필적 사실의 발생에 대한 기대·예상이 빗나간 경우는 인식과 대조사실의 불일치가 없어 착오로 다룰 수 없다(대판 2012.12.13. 2012다65317). ③ 동기의 착오는 동기가 표시되어 법률행위의 내용으로 된 경우뿐 아니라, 동기의 착오가 상대방에 의해 유발된 경우에는 동기가 표시되지 않더라도 취소사유인 착오에 해당할 수 있다(대판 1990.7.10. 90다카7460). 따라서 동기가 표시된 경우에 한해서만 유일하게 고려되는 것은 아니다. ④ 매매목적물의 시가에 대한 착오는 중요부분의 착오에 해당하지 않는다(대판 1992.10.23. 92다29337). ⑤ 상대방이 표의자의 착오를 알고 이용한 경우에는 착오가 표의자의 중대한 과실로 인한 것이라도 취소할 수 있다(대판 2014.11.27. 2013다49794).", "2023-34-민법-13": "① 의사표시자가 그 통지를 발송한 후 사망하거나 제한능력자가 되어도 의사표시의 효력에 영향을 미치지 아니하므로(제111조 제2항), 발신 후 표의자가 사망하더라도 그 의사표시는 유효하다. ② 도달주의를 정한 제111조는 임의규정이므로 당사자가 약정으로 효력발생시기를 달리 정할 수 있다. ③ 상대방이 정당한 사유 없이 수령을 거절한 경우에는 그 내용을 알 수 있는 객관적 상태에 놓인 때에 효력이 생긴다(대판 2008.6.12. 2008다19973). ④ 재단법인 설립행위는 상대방 없는 단독행위이므로 표시행위가 완료된 때 효력이 발생하고 의사표시의 도달이 요구되지 않는다(대판 1999.7.9. 98다9045). ⑤ 민법은 미성년자 등 모든 제한능력자를 의사표시의 수령무능력자로 본다(제112조).", "2023-34-민법-14": "① 무권대리인의 상대방에 대한 책임(제135조)은 무과실책임으로서 대리권 흠결에 관하여 대리인에게 귀책사유가 있어야만 인정되는 것이 아니다(대판 2014.2.27. 2013다213038). ② 자기계약·쌍방대리 금지(제124조) 위반행위는 절대적 무효가 아니라 무권대리로 유동적 무효가 되어 본인이 추인할 수 있다. ③ 대리인의 성년후견 개시는 대리권 소멸사유이므로(제127조), 임의대리인이 성년후견개시 심판을 받아 제한능력자가 되면 대리권이 소멸한다(한정후견 개시는 제외). ④ 대리인이 수인인 때에는 법률 또는 수권행위에 다른 정함이 없으면 각자가 본인을 대리한다(제119조). ⑤ 상대방 없는 단독행위의 무권대리는 절대적 무효이며 추인하여도 확정적 무효이다.", "2023-34-민법-15": "① 복대리인은 대리인이 자신의 이름으로 선임한 본인의 대리인이지 대리인의 대리인이 아니다. ② 복대리인은 본인이나 제3자에 대하여 대리인과 동일한 권리의무가 있다(제123조 제2항). ③ 복대리인을 선임해도 대리인의 대리권은 소멸하지 않는다. ④ 복대리권은 대리인의 대리권에 의존(부종성)하므로, 대리인이 복대리인을 선임한 후 사망하면 대리권 소멸로 그 복대리권도 소멸한다. ⑤ 복임권 없는 대리인에 의해 선임된 복대리인의 권한도 기본대리권이 될 수 있으므로, 권한을 넘은 표현대리(제126조)에 관한 규정이 적용될 수 있다(대판 1998.3.27. 97다48982).", "2023-34-민법-16": "① 무권대리행위에 대한 본인의 추인은 다른 의사표시가 없는 때에는 계약 시에 소급하여 효력이 생긴다(제133조). ② 일부무효 시 나머지 부분을 유효로 하려는 당사자의 가정적 의사가 인정되면 그 부분은 유효로 유지될 수 있다(제137조, 대판 2015.12.10. 2013다207538). ③ 허가를 배제·잠탈할 의도로 체결된 토지거래허가구역 내 매매계약은 체결된 때부터 확정적으로 무효이고, 그 후 허가구역 지정이 해제되더라도 유효로 되지 않는다(대판 2019.1.31. 2017다228618). ④ 무효행위를 추인에 의하여 새로운 법률행위로 보려면 당사자가 무효임을 알고 추인하여야 한다(대판 2014.3.27. 2012다106607). ⑤ 처분권자는 명문의 규정이 없더라도 무권리자의 처분행위를 추인하여 유효하게 할 수 있다(대판 2017.6.8. 2017다3499).", "2023-34-민법-17": "① 취소권은 추인할 수 있는 날로부터 3년 내에, 법률행위를 한 날로부터 10년 내에 행사하여야 한다(제146조). 따라서 단기제척기간의 기산점은 ‘취소할 수 있는 날’이 아니라 ‘추인할 수 있는 날’이다. ② 취소의 의사표시는 반드시 명시적·취소원인의 진술이 함께 행해져야 하는 것은 아니다(대판 2005.5.27. 2004다43824). ③ 취소는 직접 상대방에게 함이 원칙이므로, 상대방이 취득한 권리를 양도한 경우에도 양수인이 아닌 원래의 상대방에게 취소의 의사표시를 하여야 한다(제142조). ④ 근로계약(고용)의 취소에는 소급효가 인정되지 않고 취소의 의사표시 이후 장래에 관하여만 효력이 소멸한다(대판 2017.12.22. 2013다25194). ⑤ 매도인이 매매계약을 적법하게 해제한 후에도 매수인은 착오를 이유로 취소권을 행사하여 매매계약 전체를 무효로 돌릴 수 있다(대판 1991.8.27. 91다11308).", "2023-34-민법-18": "① 조건을 붙일 수 없는 것은 단독행위·신분행위·어음·수표행위 등 효과가 즉시 확정적으로 발생해야 하는 것이고, 물권행위에는 조건을 붙일 수 있다. ② 조건은 당사자가 임의로 정한 것이어야 하므로 법률이 정한 법정조건은 조건이 아니다. ③ 고의뿐만 아니라 과실에 의한 경우에도 신의성실에 반하여 조건의 성취를 방해한 때에 해당하여 상대방은 조건이 성취된 것으로 주장할 수 있다(제150조 제1항, 대판 1998.12.22. 98다42356). ④ 부첩관계의 종료를 해제조건으로 하는 증여계약은 그 조건만이 아니라 증여계약 자체가 무효이다(제151조 제1항, 대판 1966.6.21. 66다530). ⑤ 조건성취의 효력은 원칙적으로 소급하지 않고 성취된 때로부터 발생·소멸하나, 당사자의 의사표시로 소급효를 허용할 수 있다(제147조 제3항).", "2023-34-민법-19": "① 하자담보책임에 기한 매수인의 손해배상청구권은 제582조의 제척기간이 적용되더라도 제162조 제1항의 채권 소멸시효 규정의 적용이 배제되지 않는다(대판 2011.10.13. 2011다10266). ② 소멸시효는 권리를 행사할 수 있는 때로부터 진행하므로, 동시이행의 항변권이 붙어 있는 채권이라도 그 이행기(지급기일)로부터 소멸시효가 진행하며, 항변권이 소멸한 때로부터 기산하는 것이 아니다(대판 1991.3.22. 90다9797). ③ 대항요건을 갖추지 못하였더라도 채권 양수인이 채무자를 상대로 재판상 청구를 하였다면 소멸시효 중단사유인 재판상 청구에 해당한다(대판 2018.6.15. 2018다10920). ④ 비법인사단의 소멸시효 중단사유로서의 채무승인은 총유물 자체의 관리·처분행위가 아니므로 사원총회 결의를 요하지 않는다(대판 2009.11.26. 2009다64383). ⑤ 소멸시효 완성 후 저당권 설정으로 시효이익을 포기한 경우 그 효력은 그 후 저당부동산을 취득한 제3자에게도 미친다(대판 2015.6.11. 2015다200227).", "2023-34-민법-20": "소멸시효를 원용할 수 있는 자는 권리의 소멸에 의하여 직접 이익을 받는 자에 한정된다. ㄱ. (○) 사해행위취소소송의 상대방이 된 수익자는 채권 소멸에 의하여 직접 이익을 받는 자에 해당한다(대판 2007.11.29. 2007다54849). ㄴ. (×) 일반채권자는 채무자를 대위하여 소멸시효를 주장할 수 있을 뿐, 채권자의 지위에서 독자적으로 소멸시효를 주장할 수 없다(대판 2014.5.16. 2012다20604). ㄷ. (○) 유치권이 성립된 부동산의 매수인은 피담보채권의 시효소멸로 직접 이익을 받는 자에 해당한다(대판 2009.9.24. 2009다39530). ㄹ. (×) 후순위 담보권자의 배당액 증가 기대는 순위 상승에 따른 반사적 이익에 지나지 않으므로 선순위 담보권의 피담보채권 소멸시효를 독자적으로 원용할 수 없다(대판 2021.2.5. 2016다232597). 따라서 ㄱ, ㄷ이다.", "2023-34-민법-21": "① 지상권과 전세권도 예외적으로 저당권의 객체가 될 수 있다(제371조). ② 일단의 증감 변동하는 동산(집합물)이라도 종류·장소·수량지정 등의 방법으로 특정되어 있으면 양도담보의 목적으로 할 수 있다(대판 1990.12.26. 88다카20224). ③ 저당권은 부동산을, 질권은 동산·재산권을 목적으로 하므로 하나의 물건에 양 권리가 동시에 성립할 수 없다. ④ 토지소유권은 토지의 상하에 미치나(제212조), 지상공간의 일부만을 대상으로 하는 구분지상권도 원칙적으로 허용된다(제289조의2 제1항). ⑤ 기술적 착오 없이 작성된 지적도의 경계가 현실의 경계와 다르더라도 토지소유권의 범위는 원칙적으로 지적공부상의 경계에 의하여 확정되어야 한다(대판 2012.1.12. 2011다72066).", "2023-34-민법-22": "① 유치권은 법률규정에 의하여 당연히 생기는 법정담보물권이다(제320조). ② 채권질권, ④ 전세권저당권, ⑤ 동산담보권은 당사자의 의사표시에 의해 발생하는 약정담보물권이다. ③ 법정지상권은 법률규정에 의하여 당연히 생기지만 담보물권이 아니라 법정용익물권이다. 따라서 법정담보물권은 유치권이다.", "2023-34-민법-23": "① 등기는 물권의 효력발생요건이지 존속요건이 아니므로, 물권에 관한 등기가 원인 없이 말소되더라도 그 물권의 효력에는 영향을 미치지 않는다(대판 1982.9.14. 81다카923). ② 미등기건물의 원시취득자와 승계취득자 사이의 합치된 의사에 따라 승계취득자 앞으로 직접 소유권보존등기를 경료한 경우 실체관계에 부합하여 유효하다(대판 1995.12.26. 94다44675). ③ 멸실된 건물의 보존등기를 신축된 건물의 보존등기로 유용할 수 없다(표제부 유용 불허, 대판 1980.11.11. 80다441). ④ 등기명의인을 달리하는 중복 소유권보존등기에서 선등기가 원인무효가 아닌 한 후등기는 무효이다(대판(전) 1996.10.17. 96다12511). ⑤ 토지거래허가구역 내 토지는 최초매도인과 최후매수인 사이에 직접 매매계약이 체결된 것이 아니므로, 중간생략등기 합의만으로 적법한 토지거래허가 없이 경료된 중간생략등기는 무효이다(대판 1997.11.11. 97다33218).", "2023-34-민법-24": "① 지상권설정계약(법률행위)에 기한 지상권의 취득은 제186조가 적용되어 등기가 필요하다. ② 피담보채권의 시효소멸에 따른 저당권의 소멸은 제369조의 법률규정에 따른 것이므로 제187조가 적용되어 말소등기 없이 물권변동의 효력이 발생한다. ③ 공익사업법령에 의한 협의취득은 사법상 법률행위이므로 제186조가 적용되어 등기가 필요하다(대판 2012.2.23. 2010다91206). 강제취득인 재결수용만이 제187조의 공용징수에 해당한다. ④ 조정조서 작성으로 현물분할 협의가 성립하더라도 그 즉시 공유관계가 소멸하는 것이 아니라 분필절차를 마치고 등기를 마쳐야 소유권을 취득한다(대판(전) 2013.11.21. 2011두1917). ⑤ 법률행위를 원인으로 한 소유권이전등기절차 이행의 소에서의 승소판결은 제187조의 판결에 해당하지 않으므로 등기 경료 시까지는 소유권을 취득하지 못한다(대판 1982.10.12. 82다129). 따라서 정답은 ②.", "2023-34-민법-25": "① 자동차 등 등록에 의하여 공시되는 동산은 인도를 전제로 하는 제249조의 선의취득 규정이 적용되지 않음이 원칙이다(대판 2016.12.15. 2016다205373). ② 양도인이 무권리자라는 점을 제외하고는 거래행위가 아무런 흠 없이 유효하게 성립한 것이어야 하므로, 제한능력·의사흠결 등으로 무효·취소되면 선의취득은 성립하지 않는다(대판 1995.6.29. 94다22071). ③ 양도인이 제3자에 대한 반환청구권을 양수인에게 양도하고 지명채권 양도의 대항요건을 갖춘 경우 점유의 취득 요건을 충족한다(대판 1999.1.26. 97다48906). ④ 동산질권의 선의취득에서 질권자의 선의·무과실은 동산질권자(취득자)가 입증하여야 하므로, 이를 저지하기 위해 소유자가 점유취득의 과실을 증명하여야 하는 것이 아니다(대판 1981.12.22. 80다2910). ⑤ 양수인이 도품을 공개시장에서 선의·무과실로 매수한 경우 피해자는 대가를 변상하고 반환을 청구할 수 있다(제251조).", "2023-34-민법-26": "① 지상권자·전세권자·임차인·수치인·질권자 등 점유매개자의 점유는 타인이 소유자임을 전제하므로 타주점유이다. ② 부동산 매수인의 점유는 처음에 소유의 의사로 점유한 것이며, 나중에 매매가 무효임이 밝혀지더라도 점유의 성질이 변하지 않아 여전히 자주점유이다(대판 1996.5.28. 95다40328). ③ 명의수탁자의 점유는 그 권원의 성질상 자주점유라 할 수 없고, 명의수탁자로부터 상속에 의하여 점유를 승계한 자의 점유도 자주점유로 될 수 없다(대판 1996.6.11. 96다7403). ④ 공유자 1인이 공유토지 전부를 점유하는 경우 다른 공유자의 지분비율 범위에 대해서는 타주점유에 해당한다(대판 2008.9.25. 2008다31485). ⑤ 자주·타주점유 여부는 점유자의 내심의 의사가 아니라 점유취득의 원인이 된 권원의 성질이나 점유와 관계된 모든 사정에 의하여 외형적·객관적으로 결정된다(대판(전) 1997.8.21. 95다28625).", "2023-34-민법-27": "① 선의의 점유자가 직접 물건을 사용함으로써 얻은 이득(사용이익)도 과실에 준하여 취득하므로 회복자에게 반환할 필요가 없다(대판 1996.1.26. 95다44290). ② 점유자가 유익비 지출 당시 계약관계 등 적법한 점유권원을 가진 경우에는 그 계약관계의 상대방에게 비용상환을 청구할 수 있을 뿐, 점유회복 당시의 소유자에 대하여 제203조 제2항에 따른 상환을 구할 수 없다(대판 2003.7.25. 2001다64752). ③ 과실수취권 있는 선의의 점유자란 과실수취권을 포함하는 권원이 있다고 오신할 만한 정당한 근거가 있는 점유자를 말한다(대판 2000.3.10. 99다63350). ④ 선의의 점유자도 과실(過失)이 있으면 불법행위로 인한 손해배상책임이 배제되지 않는다(대판 1966.7.19. 66다994). ⑤ 점유물의 멸실·훼손 책임은 원칙적으로 전부 배상이고 선의·자주점유자만 현존이익을 배상하므로, 타주점유자는 선의라 하더라도 손해의 전부를 배상하여야 한다(제202조 단서).", "2023-34-민법-28": "① 통상의 경계표·담 설치비용은 절반씩 부담하되 측량비용은 토지의 면적에 비례하여 부담한다(제237조 제2항). ② 지상권자 상호간에도 상린관계에 관한 규정이 준용된다(제290조 제1항). ③ 주위토지통행권은 현재의 토지 용법에 따른 이용 범위에서 인정되는 것이지 장래의 이용상황까지 미리 대비하여 통행로를 정할 것은 아니다(대판 1992.12.22. 92다30528). ④ 건물을 축조함에는 특별한 관습이 없으면 경계로부터 반미터 이상의 거리를 두어야 한다(제242조 제1항). ⑤ 경계에 설치된 경계표·담·구거 등은 상린자의 공유로 추정한다(제239조).", "2023-34-민법-29": "① 집합건물의 공용부분은 전유부분과 분리하여 처분할 수 없으므로 취득시효에 의한 소유권 취득의 대상이 될 수 없다(대판 2013.12.12. 2011다78200). ② 시효완성을 이유로 한 소유권취득의 효력은 점유를 개시한 때로 소급하며(제247조 제1항), 등기를 함으로써 점유를 개시한 때로 소급하여 소유권을 취득한다. 따라서 장래를 향하여 발생한다는 설명은 옳지 않다. ③ 점유자가 무단점유임을 알면서 타인 소유의 부동산을 점유한 것이 입증되면 자주점유 추정이 깨어져 시효취득이 인정되지 않는다(대판(전) 1997.8.21. 95다28625). ④ 점유기간을 통틀어 등기명의인이 동일한 경우에는 임의의 시점을 기산점으로 삼을 수 있다(대판 1998.5.12. 97다8496). ⑤ 시효이익의 포기는 특별한 사정이 없는 한 시효취득자가 취득시효완성 당시의 진정한 소유자에 대하여 하여야 효력이 발생한다(대판 1994.12.23. 94다40734).", "2023-34-민법-30": "① 민법은 부동산에의 부합(제256조)과 동산 상호간의 부합(제257조)을 모두 인정한다. ② 건물의 증축 부분과 같이 부동산도 기존 부동산에 부합될 수 있으므로, 부동산은 부합물이 될 수 없다는 설명은 옳지 않다(대판 2002.10.25. 2000다63110). ③ 부합은 소유자를 달리하는 물건이 결합하는 경우에 적용되므로, 동일인 소유의 부동산과 동산 상호간에는 원칙적으로 부합이 인정되지 않는다. ④ 분리가 가능하더라도 분리할 경우 경제적 가치가 심하게 손상되는 경우에도 부합이 인정된다(대판 2012.1.26. 2009다76546). ⑤ 부동산의 소유자는 원칙적으로 그 부동산에 부합한 물건의 소유권을 취득한다(제256조).", "2023-34-민법-31": "① 공유자는 다른 공유자의 동의 없이 공유물을 처분하거나 변경하지 못한다(제264조). ② 합유는 수인이 조합체로서 물건을 소유하는 형태이고(제271조 제1항), 합유자는 전원의 동의 없이 합유물에 대한 지분을 처분하지 못한다(제273조 제1항). ③ 합유물의 처분·변경에는 합유자 전원의 동의가 필요하나 보존행위는 각자가 할 수 있다(제272조). ④ 구조상·이용상 독립성이 있어 위치·면적이 특정된 경우에는 구분소유적 공유관계가 성립할 수 있으므로, 항상 성립할 수 없다는 설명은 옳지 않다(대판 2014.2.27. 2011다42430). ⑤ 공유물분할 금지약정은 갱신할 수 있으나 그 기간은 갱신한 날부터 5년을 넘지 못한다(제268조 제2항).", "2023-34-민법-32": "① 명의신탁자에게 법률효과를 직접 귀속시킬 의도로 계약을 체결한 사정이 인정되면 명의신탁자가 계약당사자이므로 3자간 등기명의신탁으로 보아야 한다(대판 2016.10.27. 2016두43091). ② 부동산소유권·공유지분뿐만 아니라 용익물권 등 부동산에 관한 물권도 명의신탁의 대상이 될 수 있다(부동산실명법 제2조 제1호). ③ 명의신탁자인 종중은 명의신탁된 부동산에 관하여 제3자이의의 소의 원인이 되는 권리를 가지지 않으므로, 불법점유자·불법등기명의자에 대하여 직접 인도 또는 등기말소를 청구할 수 없다(대판 2007.5.10. 2007다7409). ④ 부동산실명법 제8조의 ‘배우자’에는 사실혼 관계의 배우자가 포함되지 않으므로(대판 1999.5.14. 99두35), 특례에 해당하지 않아 사실혼 배우자간의 명의신탁은 무효이다. ⑤ 매도인이 명의수탁자라는 사정을 알지 못한 계약명의신탁(제4조 제2항 단서)에서는 그 계약과 등기가 유효하여 물권변동은 유효하고 명의수탁자가 완전한 소유권을 취득한다(대판 2018.4.10. 2017다257715).", "2023-34-민법-33": "① 지상권자는 토지소유자의 동의 없이 그 권리를 양도하거나 존속기간 내에서 토지를 임대할 수 있다(제282조). ② 지료는 지상권의 요소가 아니므로 지료합의(유상 약정)가 없는 지상권 설정계약도 유효하다(제279조, 대판 1999.9.3. 99다24874). ③ 견고한 건물이나 수목의 소유를 목적으로 한 지상권의 최단존속기간은 30년이다(제280조 제1항). ④ 구분지상권은 제3자가 토지를 사용·수익할 권리를 가진 때에는 그 권리자 전원의 승낙이 있어야 설정할 수 있으므로(제289조의2 제2항), 지상권자의 승낙 없이는 설정할 수 없다. ⑤ 장사법 시행 전에 설치된 분묘에 대한 분묘기지권의 시효취득은 위 법률 시행으로 그 존립 근거가 상실되었다고 볼 수 없어 법적 규범으로 유지되고 있다(대판(전) 2017.1.19. 2013다17292).", "2023-34-민법-34": "① 지역권은 요역지의 사용가치를 높이기 위해 타인의 토지인 승역지를 이용하는 것을 내용으로 하는 물권이다(제291조). ② 요역지와 승역지는 반드시 인접할 필요가 없다(상린관계와의 차이점). ③ 요역지가 수인의 공유인 경우 1인에 의한 지역권 소멸시효의 중단·정지는 다른 공유자를 위하여 효력이 있다(제296조). ④ 지역권자는 방해제거·방해예방청구권은 행사할 수 있으나(제301조, 제214조), 승역지를 점유하는 권능이 없으므로 점유침탈이 있더라도 지역권에 기한 승역지 반환청구권은 행사할 수 없다. ⑤ 지역권은 계속되고 표현된 것에 한하여 시효취득할 수 있다(제294조).", "2023-34-민법-35": "① 건물 일부의 전세권자는 그 건물 전부에 대하여 우선변제권은 있으나, 전세권의 목적이 된 부분을 초과하여 나머지 건물 부분에 대한 경매신청권은 없다(대판 2001.7.2. 2001마212). ② 사용·수익 권능을 완전히 배제하고 채권담보만을 위한 전세권은 물권법정주의에 반하여 허용되지 않고 그 설정등기는 무효이다(대판 2021.12.30. 2018다267238). ③ 전세금의 지급은 전세권 성립의 요소이나, 반드시 현실적으로 수수되어야 하는 것은 아니고 기존의 채권으로 갈음할 수도 있다(대판 2009.1.30. 2008다67217). ④ 전세권자는 존속기간 내에서 전세목적물을 타인에게 전전세 또는 임대할 수 있다(설정행위로 금지한 경우 제외, 제306조). ⑤ 전세권이 소멸한 때 전세권설정자는 목적물의 인도 및 말소등기서류의 교부를 받는 동시에 전세금을 반환하여야 하므로, 인도가 전세금 반환보다 선이행되어야 하는 것은 아니다(제317조, 동시이행).", "2023-34-민법-36": "① 유치물의 소유자가 변동된 후 유치권자가 새로이 유익비를 지급하여 그 가격증가가 현존하는 경우 이 유익비에 대하여도 유치권을 행사할 수 있다(대판 1972.1.31. 71다2414). ② 유치권의 불가분성(제321조)에 따라 다세대주택의 한 세대를 점유하는 유치권은 그 한 세대 공사대금만이 아니라 다세대주택 전체에 대한 공사대금채권 잔액 전부를 피담보채권으로 하여 성립하므로, 그 유치권 행사는 인정된다(대판 2007.9.7. 2005다16942). ③ 수급인의 재료와 노력으로 신축한 독립한 건물의 기성부분은 수급인 소유이므로 타물권인 유치권은 인정되지 않는다(대판 1993.3.26. 91다14116). ④ 유치권의 목적이 될 수 있는 것은 동산·부동산·유가증권이다(제320조 제1항). ⑤ 유치권자가 보존행위로서 목적물을 사용하는 것은 적법행위이다(제324조 제2항 단서, 대판 1972.1.31. 71다2414).", "2023-34-민법-37": "① 유치적 효력 확보를 위하여 점유개정에 의한 동산질권설정은 금지된다(제332조). ② 질권자는 채권 전부를 변제받을 때까지 질물 전부에 대하여 그 권리를 행사할 수 있다(제321조, 제343조, 불가분성). ③ 질권은 질물의 멸실·훼손 또는 공용징수로 질권설정자가 받을 금전 기타 물건(수용보상금)에 대하여도 행사할 수 있다(물상대위, 제342조). ④ 전질은 질권설정자의 승낙이 있어야 하는 승낙전질(제324조 제2항)과 설정자의 승낙 없이 자신의 책임으로 가능한 책임전질(제336조)이 모두 인정되므로, 승낙이 있으면 허용되고 승낙이 없는 경우에도 인정될 수 있다. ⑤ 질권은 재산권을 목적으로 할 수 있으나 부동산의 사용·수익을 목적으로 하는 권리는 그러하지 아니하므로(제345조 단서), 부동산의 사용·수익을 내용으로 하는 질권은 물권법정주의에 반한다.", "2023-34-민법-38": "① 채권자와 근저당권자가 불가분적 채권자의 관계에 있다고 볼 수 있는 경우에는 그 제3자 명의의 근저당권설정등기도 유효하다(대판 2021.4.29. 2017다294585). ② 근저당권의 존속기간이나 결산기를 정하지 않은 때에는 근저당권설정자가 근저당권자를 상대로 언제든지 기본계약 해지의 의사표시를 함으로써 피담보채무를 확정시킬 수 있다(대판 2017.10.31. 2015다65042). ③ 무효인 저당권등기의 유용은 유용합의 이전에 등기상 이해관계 있는 제3자가 없어야 유효하다(대판 1963.10.10. 63다583). ④ 저당물의 제3취득자가 부동산의 보존·개량을 위해 지출한 필요비·유익비는 제203조에 의하여 저당물의 경매대가에서 우선상환을 받을 수 있다(제367조). 따라서 우선 변제받을 수 없다는 설명은 옳지 않다. ⑤ 저당권의 효력은 압류 이후 저당권설정자가 수취한(수취할) 과실에 미치며, 법정과실인 차임채권에도 미친다(제359조, 대판 2016.7.27. 2015다230020).", "2023-34-민법-39": "ㄱ. (○) 토지 저당권 설정 후 설정자 甲이 그 토지에 Y건물을 신축한 경우, 저당권자 乙은 토지와 함께 Y건물에 대한 경매도 신청할 수 있으나 건물의 경매대가에서 우선변제를 받을 수는 없다(제365조 일괄경매청구권). ㄴ. (×) 제365조의 일괄경매청구권은 원칙적으로 토지소유자인 저당권설정자가 축조하여 소유하고 있는 건물이어야 하므로, 경매 당시 건물의 소유권이 제3자에게 이전된 경우에는 일괄경매를 청구할 수 없다(대결 1994.1.24. 93마1736). ㄷ. (○) 저당권설정자가 원시취득한 건물에 한하지 않으므로, 지상권자 丙이 축조한 Y건물의 소유권을 저당권설정자 甲이 취득한 경우에는 乙은 토지와 함께 Y건물에 대한 경매를 청구할 수 있다(대판 2003.4.11. 2003다3850). 따라서 ㄱ, ㄷ이다.", "2023-34-민법-40": "① 제366조의 법정지상권은 저당권 설정 당시부터 토지 위에 건물이 존재할 경우에 한하여 인정되므로, 건물이 없는 토지에 저당권이 설정될 당시 근저당권자가 건물 건축에 동의하였더라도 그러한 주관적·비공시적 사정으로는 법정지상권이 성립하지 않는다(대판 2003.9.5. 2003다26051). ② 토지에 정착되어 있다고 볼 수 없는 가설건축물의 소유를 위한 법정지상권은 성립하지 않는다(대판 2021.10.28. 2020다224821). ③ 관습상의 법정지상권은 건물이 무허가건물·미등기건물이라도 인정될 수 있다(대판 1991.8.13. 91다16631). ④ 토지공유자 중 1인이 다른 공유자의 동의를 얻어 건물을 소유하면서 자신의 토지지분에 저당권을 설정한 후 실행경매로 소유자가 달라진 경우 법정지상권이 성립하지 않는다(제366조 법정지상권도 동일, 대판 2014.9.4. 2011다73038). ⑤ 동일인 소유의 토지와 건물 중 건물에 전세권이 설정된 후 토지소유자가 바뀐 경우, 전세권설정자인 건물소유자가 그 토지에 대하여 지상권을 취득한 것으로 본다(제305조 제1항).", "2024-35-민법-1": "① 헌법재판소의 결정은 법원 기타 국가기관과 지방자치단체를 기속하므로, 그 결정내용이 민사에 관한 것인 한, 민법의 법원이 될 수 있다(헌법재판소법 제47조). ② 사실인 관습은 사적 자치가 인정되는 분야 즉 그 분야의 제정법이 주로 임의규정일 경우에는 법률행위의 해석기준으로서 또는 의사를 보충하는 기능으로서 재판의 자료로 할 수 있다(대판 1983.6.14. 80다3231, 제106조). ③ 종중 구성원의 자격에 관한 대법원 견해의 변경처럼, 변경된 견해를 통해 기존 관습법의 효력을 부정할 수 있다(대판(전) 2005.7.21. 2002다1178). ④ 가족의례준칙 제13조 규정과 배치되는 관습법의 효력을 인정하는 것은 관습법의 제정법에 대한 열후적·보충적 성격에 비추어 민법 제1조의 취지에 어긋난다. 따라서 제정법과 배치되는 관습법은 효력이 없다(대판 1983.6.14. 80다3231). ⑤ 법령과 같은 효력을 갖는 관습법은 당사자의 주장·입증을 기다림이 없이 법원이 직권으로 이를 확정하여야 한다(대판 1983.6.14. 80다3231).", "2024-35-민법-2": "① 숙박업자는 고객에게 위험이 없는 안전하고 편안한 객실 및 관련 시설을 제공함으로써 고객의 안전을 배려하여야 할 신의칙상 보호의무를 부담한다(대판 2000.11.24. 2000다38718, 38725). ② 병원은 입원환자의 휴대품 등의 도난을 방지함에 필요한 적절한 조치를 강구하여 줄 신의칙상 보호의무가 있다(대판 2003.4.11. 2002다63275). ③ 기획여행업자는 여행자의 생명·신체·재산 등의 안전을 확보하기 위한 신의칙상 안전배려의무를 부담한다(대판 2011.5.26. 2011다1330). ④ 계약 성립의 기초가 되지 아니한 사정이 그 후 변경되어 일방당사자가 계약 당시 의도한 계약목적을 달성할 수 없게 되어 손해를 입게 되었다 하더라도 특별한 사정이 없는 한 그 계약 내용의 효력을 그대로 유지하는 것이 신의칙에 반한다고 볼 수 없다(대판 2014.5.16. 2011다5578). ⑤ 토지거래허가구역 내 토지를 허가 없이 매매한 자가 무효를 주장하는 것은 특단의 사정이 없는 한 신의성실의 원칙에 반한다고 할 수 없다(대판 1995.11.21. 94다20532).", "2024-35-민법-3": "모든 항목이 옳다. ㄱ.(○) 의사무능력자 甲과 乙이 체결한 대출거래약정 및 근저당권설정계약은 무효이다(대판 2006.9.22. 2004다51627). ㄴ.(○) 무능력자의 책임을 제한하는 민법 제141조 단서는 제748조의 특칙으로서 선의·악의를 묻지 아니하고 반환범위를 현존이익에 한정하며, 의사능력 흠결로 무효가 되는 경우에도 유추적용된다. 금전상의 이득은 현존하는 것으로 추정되므로 현존하지 아니함은 의사무능력자 측이 입증해야 한다(대판 2009.1.15. 2008다58367). ㄷ.(○) 대출로써 받은 이익이 제3자에 대한 대여금채권 또는 부당이득반환채권의 형태로 현존하므로, 금융기관은 대출금 자체의 반환을 구할 수는 없더라도 현존이익인 위 채권의 양도를 구할 수 있다(대판 2009.1.15. 2008다58367).", "2024-35-민법-4": "① 법정대리인으로부터 허락을 얻은 특정한 영업에 관하여는 미성년자는 성년자와 동일한 행위능력을 가지므로, 그 범위에서 법정대리권이 소멸한다(제8조). ② 제한능력을 이유로 하는 취소는 선의의 제3자에게도 대항할 수 있다(제5조 제2항, 제10조 제1항, 제13조 제4항). ③ 제한능력자의 단독행위는 추인이 있을 때까지 상대방이 거절할 수 있다(제16조 제2항). 즉 유효한 추인이 있은 후에는 거절할 수 없다. ④ 가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있다(제10조 제2항). ⑤ 특정후견은 본인의 의사에 반하여 할 수 없다(제14조의2 제2항).", "2024-35-민법-5": "ㄱ.(○) 대표자로서의 모든 권한을 포괄적으로 위임하고 자신은 직무를 집행하지 않은 甲의 직무유기는 그 자체로 이사의 선관주의의무(제61조)를 위반한 행위이다. ㄴ.(×) 비법인사단의 대표자는 제반 업무처리를 포괄적으로 위임할 수 없으므로(제62조), 포괄위임에 근거한 사실상 대표자 乙이 丙과 체결한 계약의 효력은 A에게 미치지 않는다(대판 1996.9.6. 94다18522). ㄷ.(○) 민법 제35조 제1항의 '법인의 대표자'에는 명칭·직위·등기 여부를 불문하고 법인을 사실상 대표하여 사무를 집행하는 사람이 포함되며, 이 법리는 비법인사단에도 적용된다. A는 丁에 대하여 법인의 불법행위로 인한 손해배상책임을 부담한다(대판 2011.4.28. 2008다15438).", "2024-35-민법-6": "① 적법한 대표권을 가진 자와 맺은 법률행위의 효과는 본인인 법인에 귀속한다(제59조 제2항). ② 대표이사가 대표권 범위 내에서 한 행위는 자기 또는 제3자의 이익을 도모할 목적으로 권한을 남용하였더라도 유효하나, 상대방이 진의를 알았거나 알 수 있었을 때에는 회사에 대하여 무효가 된다(대판 2013.7.11. 2013다16473). ③ 법인 대표권의 제한은 그 취지가 등기되어 있지 않다면 선의·악의에 관계없이 제3자에게 대항할 수 없다(제60조, 대판 1992.2.14. 91다24564). 즉 A는 등기 없이 악의의 乙에게도 대항할 수 없다. ④ A의 고의·과실은 행위를 하는 대표자 甲을 기준으로 결정한다(제116조 제2항). ⑤ 법인과 이사의 이익이 상반하는 사항에 관하여는 이사는 대표권이 없고 특별대리인을 선임하여야 한다(제64조).", "2024-35-민법-7": "① 해산사유는 사단법인 정관의 필수적 기재사항이다(제40조 제7호). ② 사단법인의 정관은 자치법규이므로, 사원총회의 결의로 정관의 규범적 의미내용과 다른 해석을 표명하였다고 하더라도 그 결의에 의한 해석은 사원이나 법인을 구속할 수 없다(대판 2000.11.24. 99다12437). ③ 제56조는 강행규정이 아니므로 정관으로 양도·상속을 인정할 수 있으나, 정관에 달리 정함이 없으면 양도할 수 없다(대판 1992.4.14. 91다26850). ④ 정관에 이사 해임사유 규정이 있는 경우 특별한 사정이 없는 한 정관에서 정하지 않은 사유로 이사를 해임할 수 없다(대판 2024.1.4. 2023다263537). ⑤ 직무집행정지 가처분으로 권한이 정지된 대표이사가 정지기간 중 체결한 계약은 절대적으로 무효이고, 그 후 가처분신청이 취하되었더라도 유효하게 되지 않는다(대판 2008.5.29. 2008다4537).", "2024-35-민법-8": "① 토지의 개수는 지적공부상 토지의 필수를 표준으로 결정된다(대판 1990.12.7. 90다카25208). ② 분할절차를 거치지 않은 분필등기가 표상하는 목적물은 특정되었다고 할 수 없어, 그 점유자는 등기부취득시효의 요건인 '부동산의 소유자로 등기한 자'에 해당하지 아니하므로 등기부취득시효를 할 수 없다(대판 1995.6.16. 94다4615). ③ 주물을 점유하더라도 현실로 점유하지 않은 종물에 대한 점유는 인정되지 않으므로, 주물에 대한 점유취득시효의 효력은 점유하지 않은 종물에 미치지 않는다(제100조 제2항 부적용). ④ 주물의 상용에 공하여진 타인 소유 물건은 종물이 아니어서 저당권의 효력이 미치지 않으나, 매수인이 선의·무과실로 점유하는 등 선의취득 요건을 구비하면 그 소유권을 취득할 수 있다(대판 2008.5.8. 2007다36933, 36940). ⑤ 미분리의 천연과실과 수목의 집단은 명인방법을 갖춘 경우 독립한 물건으로서 거래의 객체가 될 수 있다(대판 1977.4.12. 76도2887).", "2024-35-민법-9": "① 불공정한 법률행위에 해당하는지는 법률행위 시를 기준으로 판단한다(대판(전) 2013.9.26. 2013다26746). ② 대리인이 매매계약을 체결한 경우, 경솔·무경험은 대리인을 기준으로, 궁박상태는 본인을 기준으로 판단한다(대판 2002.10.22. 2002다38927). ③ 경매에는 불공정한 법률행위에 관한 민법 제104조, 제608조가 적용될 여지가 없다(대결 1980.3.21. 80마77). ④ 불공정한 법률행위는 무효이며 무효행위의 추인에 의하여 유효로 될 수 없고, 법정추인이 적용될 여지도 없다(대판 1994.6.24. 94다10900). ⑤ 불공정한 법률행위는 선의의 제3자에게도 무효를 주장할 수 있다.", "2024-35-민법-10": "① 의사표시자가 통지를 발송한 후 사망하거나 제한능력자가 되어도 의사표시의 효력에 영향을 미치지 아니한다(제111조 제2항). ② 통정의 동기나 목적은 허위표시의 성립요건이 아니므로 그 성립에 영향이 없다(제108조). ③ 무효인 법률행위에 따른 법률효과를 침해하는 위법행위나 채무불이행이 있어도 손해는 없는 것이므로 손해배상을 청구할 수 없다(대판 2003.3.28. 2002다72125). ④ 착오로 인하여 표의자가 경제적 불이익을 입은 것이 아니라면 중요부분의 착오라고 할 수 없다(대판 1999.2.23. 98다47924). ⑤ 상대방이 표의자의 착오를 알고 이를 이용한 경우에는 착오가 표의자의 중대한 과실로 인한 것이라도 표의자는 의사표시를 취소할 수 있다(대판 2014.11.27. 2013다49794).", "2024-35-민법-11": "① 민법 제110조는 표의자의 의사결정의 자유를 보호하는 데 목적이 있으므로 피기망자에게 손해를 가할 의사는 사기에 의한 의사표시의 성립요건이 아니다. ② 강박에 의한 의사표시라고 하려면 상대방의 불법적 해악 고지로 말미암아 공포를 느끼고 의사표시를 한 것이어야 한다(대판 1996.4.26. 94다34432). ③ 상대방의 대리인 등 상대방과 동일시할 수 있는 자의 사기·강박은 제3자의 사기·강박에 해당하지 아니한다(대판 1999.2.23. 98다60828). ④ 단순히 상대방의 피용자에 지나지 않는 자는 상대방과 동일시할 수 없어 제3자에 해당한다(대판 1998.1.23. 96다41496). ⑤ 사기에 의한 매수인으로부터 부동산의 권리를 취득한 제3자는 특별한 사정이 없는 한 선의로 추정되므로, 양도인이 취소를 주장하려면 제3자의 악의를 입증하여야 한다(대판 1970.11.24. 70다2155).", "2024-35-민법-12": "① 매매계약 체결의 대리권을 수여받은 대리인은 특별한 사정이 없는 한 중도금이나 잔금을 수령할 권한이 있다(대판 1994.2.8. 93다39379). ② 금전소비대차계약 및 담보권설정계약을 체결할 대리권을 수여받았더라도 특별한 사정이 없는 한 이를 해제할 권한까지 당연히 가진다고 볼 수 없다(대판 1997.9.30. 97다23372). ③ 본인의 사망은 대리권 소멸사유이므로(제127조), 본인 乙이 사망하면 임의대리인 甲의 대리권은 소멸한다. ④ 대리인은 행위능력자임을 요하지 아니하므로(제117조), 대리인 甲이 미성년자임을 이유로 매매계약을 취소할 수 없다. ⑤ 복대리인은 본인의 대리인이므로(제123조 제1항), 丙은 甲의 대리인이 아니라 본인 乙의 대리인이다.", "2024-35-민법-13": "① 표현대리가 성립하면 본인은 전적인 책임을 져야 하고 상대방에게 과실이 있더라도 과실상계의 법리를 유추적용하여 책임을 감경할 수 없다(대판 1996.7.12. 95다49554). ② 유권대리에 관한 주장 속에 표현대리의 주장이 포함되어 있다고 볼 수 없다(대판 1983.12.13. 83다카1489). ③ 민법 제126조의 권한을 넘은 표현대리 규정은 법정대리에도 적용된다(대판 1997.6.27. 97다3828). ④ 복대리에도 표현대리법리가 적용된다. 대리권 소멸 후 복대리인을 선임하여 대리행위를 하도록 한 경우 대리권 소멸 후의 표현대리가 성립할 수 있다(대판 1998.3.27. 97다48982). ⑤ 수권행위가 무효라면 처음부터 대리권이 존재하지 않았던 경우이므로 제129조는 적용되지 않는다.", "2024-35-민법-14": "① 본인이 무권대리인이나 상대방으로부터 대금을 수령한 경우 특단의 사유가 없는 한 매매계약을 추인한 것으로 본다(대판 1992.2.28. 91다15584). ② 본인이 무권대리인에게 추인한 경우 상대방이 그 사실을 안 때에는 본인은 상대방에게 추인의 효력을 주장할 수 있다(제132조 단서). ③ 무권대리인이 본인을 단독상속한 후 본인의 지위에서 추인을 거절하거나 무효를 주장하는 것은 금반언의 원칙이나 신의칙에 반하여 허용되지 않는다(대판 1994.9.27. 94다20617). ④ 상대방이 추인 여부의 확답을 최고하였으나 본인이 기간 내에 확답을 발하지 아니한 때에는 추인을 거절한 것으로 본다(제131조). ⑤ 본인 甲이 추인하면 그 효과는 본인에게 귀속하므로, 丙은 乙을 상대로 무권대리인의 책임을 물을 수 없다(제135조 제1항).", "2024-35-민법-15": "① 허가 전 거래계약은 채권적 효력도 발생하지 아니하여 무효이므로 이행청구를 할 수 없다(대판 2000.1.28. 99다40524). ② 유동적 무효 상태의 거래계약 당사자는 상대방이 협력의무를 이행하지 아니하였음을 들어 일방적으로 거래계약 자체를 해제할 수 없다. 협력의무는 부수적 채무에 불과하기 때문이다(대판(전) 1999.6.17. 98다40459). ③ 허가구역 지정해제 시 확정적으로 무효로 된 경우를 제외하고는 확정적으로 유효로 된다(대판(전) 1999.6.17. 98다40459). ④ 일단 허가를 받으면 계약은 소급해서 유효로 되므로 허가 후 새로이 거래계약을 체결할 필요는 없다(대판 1991.12.24. 90다12243). ⑤ 사기 등 하자 있는 의사에 의한 경우 거래허가 신청 전 단계에서도 그 사유를 주장하여 취소할 수 있다(대판 1996.11.8. 96다35309).", "2024-35-민법-16": "① 매도인이 매수인의 채무불이행을 이유로 매매계약을 적법하게 해제한 후라도, 매수인은 손해배상책임을 면하기 위하여 착오를 이유로 취소권을 행사하여 매매계약 전체를 무효로 돌릴 수 있다(대판 1991.8.27. 91다11308). ② 법률행위의 취소를 전제로 한 이행거절 가운데는 취소의 의사표시가 포함되어 있다고 볼 수 있다(대판 1993.9.14. 93다13162). ③ 일단 취소된 후에는 취소할 수 있는 법률행위의 추인에 의하여 다시 유효하게 할 수는 없고 무효행위 추인의 요건·효력으로서 추인할 수 있을 뿐이다(대판 1997.12.12. 95다38240). ④ 취소권은 추인할 수 있는 날로부터 3년 내에, 법률행위를 한 날로부터 10년 내에 행사하여야 한다(제146조). ⑤ 취소권의 행사기간은 제척기간이다(대판 1996.9.20. 96다25371).", "2024-35-민법-17": "① 기성조건이 정지조건이면 조건 없는 법률행위로 한다(제151조 제2항). ② 불능조건이 해제조건이면 조건 없는 법률행위로 한다(제151조 제3항). ③ 조건의 내용 자체가 불법적이어서 무효일 경우 그 조건만을 분리하여 무효로 할 수는 없고 그 법률행위 전부가 무효로 된다(제151조 제1항, 대결 2005.11.8. 2005마541). ④ 기한부 법률행위의 효력은 기한도래시부터 생기며 당사자의 특약으로도 소급효를 인정할 수 없다(제152조). ⑤ 기한은 채무자의 이익을 위한 것으로 추정한다(제153조 제1항).", "2024-35-민법-18": "① 불확정기한부 채권은 기한이 객관적으로 도래한 때부터 소멸시효가 진행한다. ② 부당이득반환청구권은 그 성립과 동시에 권리를 행사할 수 있으므로 청구권이 성립한 때부터 소멸시효가 진행한다(대판 2017.7.18. 2017다9039, 9046). '기한의 도래를 안 때'로 연결한 것은 잘못이다. ③ 정지조건부 권리는 조건 미성취 동안은 소멸시효가 진행하지 않으므로 조건이 성취된 때부터 진행한다(대판 1992.12.22. 92다28822). ④ 부작위를 목적으로 하는 채권의 소멸시효는 위반행위를 한 때로부터 진행한다(제166조 제2항). ⑤ 선택채권은 선택권을 행사할 수 있는 때로부터 소멸시효가 진행한다(대판 1965.8.24. 64다1156).", "2024-35-민법-19": "① 응소행위로 인한 시효중단의 효력은 피고가 현실적으로 권리를 행사하여 응소한 때에 발생한다(대판 2005.12.23. 2005다59383, 59390). 원고가 소를 제기한 때가 아니다. ② 물상보증인이 제기한 저당권설정등기 말소청구소송에서 채권자 겸 저당권자가 응소하여 피담보채권의 존재를 주장한 것은 채무자에 대한 재판상 청구로 볼 수 없어 시효중단사유에 해당하지 아니한다(대판 2004.1.16. 2003다30890). ③ 재판상의 청구로 중단된 시효는 재판이 확정된 때로부터 새로이 진행한다(제178조 제2항). ④ 가압류에 의한 시효중단의 효력은 가압류신청을 한 때에 소급한다(대판 2017.4.7. 2016다35451). ⑤ 대항요건을 갖추지 못하였더라도 채권양수인이 채무자를 상대로 재판상 청구를 하였다면 소멸시효 중단사유인 재판상 청구에 해당한다(대판 2018.6.15. 2018다10920).", "2024-35-민법-20": "②③④⑤ 모두 민법 제108조 제2항의 '제3자'에 해당한다. 제3자란 당사자 및 포괄승계인 이외의 자로서 허위표시에 의하여 외형상 형성된 법률관계를 토대로 실질적으로 새로운 법률상 이해관계를 맺은 자를 말한다. ① 구 상호신용금고법상 계약이전을 받은 금융기관은 통정허위표시에 따라 형성된 법률관계를 기초로 새로운 법률상 이해관계를 가지게 된 것이 아니므로 제108조 제2항의 제3자에 해당하지 않는다(대판 2004.1.15. 2002다31537). ② 가장매매의 매수인으로부터 저당권 설정을 받은 자는 제3자이다. ③ 가장의 금전소비대차에 기한 대여금채권을 가압류한 자는 제3자이며, 제108조 제2항의 제3자는 선의이면 족하고 무과실은 요건이 아니다(대판 2004.5.28. 2003다70041). ④ 가장매매의 매수인으로부터 부동산을 매수하여 이전등기를 마친 자는 제3자이다. ⑤ 가장의 전세권설정등기에 관하여 저당권을 취득한 근저당권자는 제3자이다(대판 2008.3.13. 2006다29372).", "2024-35-민법-21": "① 일물일권주의의 원칙상 구분·분할 절차를 거치지 아니한 채 하나의 부동산 중 일부분만에 관하여 따로 소유권보존등기를 경료하는 것은 허용되지 아니한다(대판 2000.10.27. 2000다39582). ② 온천권은 관습법상의 물권이라고 볼 수 없다(대판 1970.5.26. 69다1239). ③ 1필 토지의 일부도 객관적 징표가 계속 존재하면 점유취득시효의 대상이 될 수 있다(대판 2015.4.9. 2012다2408). ④ 1동의 건물은 그 전체를 경락허가의 대상으로 삼아야 하고 일부분을 분리하여 따로 경락허가의 대상으로 삼을 수 없다. 부속건물로 등기된 창고건물을 분할등기 없이 원채인 주택과 분리하여 경락허가한 것은 일물일권주의에 위반되어 위법하다(대판 1990.10.11. 90마679). ⑤ 지상권은 저당권의 목적이 될 수 있다(제371조 제1항).", "2024-35-민법-22": "① Y건물을 관리하는 甲의 직원 A는 점유보조자일 뿐 점유자가 아니므로(제195조), 乙은 A에게 X의 반환청구를 할 수 없다. ② 甲이 법인인 경우 법인 자체가 건물 소유자이므로 대표이사 B 개인이 아니라 토지 점유자인 甲법인에게 반환청구를 할 수 있다. ③ 건물 소유자가 토지를 점유하는 경우 토지 소유자는 건물 철거와 대지 인도를 청구할 수 있을 뿐, 자기 소유 건물을 점유하는 자에게 퇴거를 청구할 수는 없다(대판 1999.7.9. 98다57457). ④ 미등기 건물을 매수하여 인도받은 丙은 사실상 처분을 할 수 있는 지위에 있으므로 토지 소유자 乙은 丙을 상대로 건물철거 청구를 할 수 있다(대판 2003.1.24. 2002다61521). ⑤ 물상청구권은 소유권과 분리하여 소유권 없는 전소유자에게 유보하여 행사시킬 수 없다(대판 1980.9.9. 80다7).", "2024-35-민법-23": "① 환매특약이 등기부에 기재되어 있는 때에는 반증이 없는 한 환매특약이 진정하게 성립된 것으로 추정한다(대판 1991.10.11. 91다13700). ② 소유권이전등기가 제3자(대리인)의 처분행위에 의한 것이라도 적법히 이루어진 것으로 추정되므로 적법한 대리행위의 존재가 추정된다(대판 1997.4.8. 97다416). ③ 저당권등기가 있으면 저당권의 존재뿐만 아니라 피담보채권의 존재도 추정된다. ④ 원인 없이 말소된 등기의 등기명의인은 적법한 권리자로 추정된다(대판 1997.9.30. 95다39526). ⑤ 토지등기부의 표제부는 사실의 등기이지 권리의 등기가 아니므로 추정력이 없어 등기부상 면적의 존재가 추정된다고 할 수 없다(대판 1991.2.22. 90다12977).", "2024-35-민법-24": "①② 동산질권을 선의취득하려면 평온·공연하게 선의·무과실로 목적동산을 취득하여야 하고, 그 선의·무과실은 질권자가 입증하여야 한다(제249조, 제343조, 대판 1981.12.22. 80다2910). ③ 선의·무과실의 기준시점은 물권행위가 완성되는 때(인도된 때)이므로, 계약 체결 당시 선의였더라도 인도받을 때 악의였다면 선의취득은 인정되지 않는다(대판 1991.3.22. 91다70). ④ 점유개정에 의한 점유취득만으로는 선의취득 요건을 충족하지 못하므로(대판 1978.1.17. 77다1872), 甲이 직접점유를 취득하는 형태(점유개정)로 점유를 취득한 경우 선의취득은 인정되지 않는다. ⑤ 선의취득은 무권리자라는 점을 제외하고 흠이 없는 거래행위여야 성립하므로, 거래행위가 제한능력으로 취소되면 선의취득은 성립하지 않는다(대판 2008.5.8. 2007다36933).", "2024-35-민법-25": "① 지상권자는 타주점유자이지만 용익물권자로서 과실수취권이 인정된다(대판 2000.3.10. 99다63350). ② 필요비는 점유자가 선의·악의나 소유의사를 묻지 않고 회복자에 대하여 상환을 청구할 수 있으므로(제203조 제1항), 타주점유자도 점유물 보존을 위해 지출한 금액의 상환을 청구할 수 있다. ③ 악의의 점유자가 과실(過失) 없이 과실(果實)을 수취하지 못한 경우에는 그 대가를 보상할 필요가 없다(제201조 제2항). ④ 선의라 해도 타주점유자는 손해의 전부를 배상하여야 한다(제202조 단서). ⑤ 유익비 상환은 회복자의 선택에 좇아 청구할 수 있다(제203조 제2항). '점유자의 선택'이라 한 부분이 잘못이다.", "2024-35-민법-26": "① 경계에 설치된 담이 공유인 경우, 제268조 제3항(제239조)에 의해 공유물분할청구가 금지된다. ② 인접하여 토지를 소유한 자는 공동비용으로 통상의 경계표나 담을 설치할 수 있다(제237조 제1항). ③ 경계표 설치비용은 절반씩 부담하나 측량비용은 토지의 면적에 비례하여 부담한다(제237조 제2항). ④ 인접지의 수목 뿌리가 경계를 넘은 때에는 임의로 제거할 수 있다(제240조 제3항). ⑤ 건물을 축조함에는 특별한 관습이 없으면 경계로부터 반미터 이상의 거리를 두어야 한다(제242조 제1항).", "2024-35-민법-27": "① 건물 부지를 평온·공연하게 20년간 점유하면 지상권을 시효취득한다(대판 1994.10.14. 94다9849). ② 저당권은 그 성질상 점유를 수반하지 않기 때문에 시효취득의 대상이 되지 않는다. ③ 소유권은 점유취득시효의 대상이다(제245조 제1항). ④ 지역권은 계속되고 표현된 것에 한하여 시효취득의 대상이 된다(제294조). ⑤ 동산질권도 시효취득의 대상이 된다(제248조).", "2024-35-민법-28": "① 동산이 부동산에 부합하여 동산의 소유권이 소멸한 때에는 그 동산을 목적으로 한 다른 권리도 소멸한다(제260조 제1항). ② 부합한 동산의 주종을 구별할 수 없는 때에는 부합 당시의 가액 비율로 합성물을 공유한다(제257조). ③ 권원 없는 자가 토지소유자의 승낙 없이 임차인의 승낙만 받아 나무를 심었다면 토지소유자에 대하여 그 나무의 소유권을 주장할 수 없으므로(제256조 단서, 대판 1989.7.11. 88다카9067), X토지의 양수인은 자신의 소유인 수목을 벌채할 수 있다. ④ 타인의 권원에 의하여 부합된 물건이 부동산의 구성부분이 된 경우 부동산 소유자는 방해배제청구권에 기하여 부합물의 철거를 청구할 수 없다(대판 1985.12.4. 84다카2428). ⑤ 증축부분이 본건물에 부합된 후 구조의 변경 등으로 독립한 권리의 객체성을 취득하게 된 때에는 본건물과 독립하여 거래의 대상이 될 수 있다(대판 1982.1.26. 81다519).", "2024-35-민법-29": "① 후순위 저당권자 乙이 소유권을 취득하더라도 저당권이 혼동으로 소멸하면 가압류한 丙이 부당한 이득을 얻게 되는 불합리한 결과가 되므로, 乙의 저당권은 혼동으로 소멸하지 않는다(제191조 제1항 단서, 대판 1998.7.10. 98다18643). ② 유치권을 사후에 포기한 경우 곧바로 유치권은 소멸하며, 그 후 목적물을 계속 점유하더라도 무단점유에 지나지 않는다(대판 2011.5.13. 2010마1544). 즉 점유를 반환하여야 소멸하는 것이 아니다. ③ 점유권은 다른 물권과 양립할 수 있으므로 혼동의 법리가 적용되지 않는다(제191조 제3항). ④ 지역권은 20년간 행사하지 않으면 소멸시효가 완성된다(제162조 제2항). ⑤ 대항력 있는 임차인이 임차주택을 경락받아 소유권을 취득하면 임대차계약에 기한 채권이 혼동으로 소멸한다(대판 1998.9.25. 97다28650).", "2024-35-민법-30": "① 사용·수익권을 포기한 것으로 볼 수 있다면 타인이 점유·사용하더라도 토지소유자는 부당이득반환이나 인도를 구할 수 없다(대판(전) 2019.1.24. 2016다264556). ② 사용·수익 권능의 대세적·영구적 포기는 물권법정주의에 반하여 허용되지 않는다. ③ 토지소유자는 일반 공중의 통행 등 이용을 방해하지 않는 범위 내에서는 토지를 처분하거나 사용·수익할 권능을 상실하지 않는다. ④ 상속인의 독점적·배타적 사용·수익권의 행사도 제한된다. ⑤ 토지가 일반 공중이 아니라 지상 건물 소유자들만을 위한 용도로 제공된 경우에는 위 법리가 적용되지 않으므로, 특별한 사정이 없는 한 X토지 매수인의 배타적 사용·수익권 행사는 제한되지 않는다(대판 2019.11.14. 2015다211685).", "2024-35-민법-31": "① 소수지분권자가 다른 공유자와 협의 없이 공유물을 독점 점유·사용하는 경우 다른 소수지분권자는 인도청구는 할 수 없으나 지분권에 기초하여 방해배제는 청구할 수 있다(대판(전) 2020.5.21. 2018다287522). 따라서 乙은 방해배제를 청구할 수 있다. ② 공유물 처분에는 전원의 동의가 필요하므로(제264조), 甲·乙의 협의로 매도하여도 丙의 지분에는 미치지 않는다. ③ 공유물을 무단 점유하는 제3자에 대해 각 공유자는 단독으로 목적물 전부의 반환을 청구할 수 있으므로, 甲은 자신의 지분에 한하지 않고 전부에 대해 반환을 청구할 수 있다. ④ 공유지분 포기에 따른 물권변동은 다른 공유자가 등기를 하여야 효력이 발생하므로, 甲이 지분을 포기하더라도 乙·丙이 이전등기를 하여야 甲의 지분을 취득한다(제267조, 대판 2016.10.27. 2015다52978). ⑤ 공유자가 1년 이상 의무이행을 지체한 때 다른 공유자는 상당한 가액으로 지분을 매수할 수 있을 뿐(제266조 제2항), 무상으로 취득할 수는 없다.", "2024-35-민법-32": "① 각 공유자는 다른 약정이 없으면 언제든지 공유물의 분할을 청구할 수 있다(제268조, 대판 1991.11.12. 91다27228). ② 5년 내의 분할금지약정이 가능하므로 3년간 분할하지 않기로 한 합의는 유효하다(제268조 제1항). ③ 특별한 사정이 있는 때에는 현물을 소유하게 되는 공유자로 하여금 다른 공유자에게 지분의 적정한 가격을 배상시키는 방법(가액배상)에 의한 분할도 현물분할의 하나로 허용된다(대판 2004.10.14. 2004다30583). ④ 공유자 1인의 지분 위에 설정된 근저당권 등 담보물권은 특단의 합의가 없는 한 공유물분할 후에도 종전의 지분비율대로 공유물 전부 위에 그대로 존속한다(대판 1989.8.8. 88다카24868). ⑤ 공유자 사이에 이미 분할 협의가 성립된 경우에는 일부 공유자가 이전등기에 협조하지 않더라도 소유권이전등기를 청구할 수 있을 뿐, 다시 공유물분할의 소를 제기할 수는 없다(대판 1995.1.12. 94다30348).", "2024-35-민법-33": "① 담보가치 유지를 위해 설정된 지상권은 피담보채권이 변제·시효소멸 등으로 소멸하면 부종하여 소멸한다(대판 2011.4.14. 2011다6342). ② 최단 존속기간 규정(제280조)은 건물을 건축하거나 수목을 식재할 목적의 지상권에만 적용되므로, 기존 건물의 사용을 목적으로 설정된 지상권은 존속기간을 30년 미만으로 정할 수 있다(대판 1996.3.22. 95다49318). ③ 지상권자가 적법한 권원에 의하여 부속한 수목의 소유권은 그 지상권자에게 귀속되며(제256조 단서), 지상권자는 지상물매수청구권을 행사할 수 있다. ④ 지상권의 양도금지 특약은 편면적 강행규정(제282조, 제289조)에 위반되어 무효이므로, 양도가 금지된 지상권의 양수인도 양수한 지상권으로 설정자에게 대항할 수 있다. ⑤ 토지양수인은 전소유자에 대한 연체기간의 합산을 주장하지 못한다(제287조, 대판 2001.3.13. 99다17142).", "2024-35-민법-34": "ㄱ.(○) 전세권이 갱신 없이 존속기간이 만료되면 그 용익물권적 권능은 전세권설정등기의 말소 없이도 당연히 소멸한다(대판 1999.9.17. 98다31301). ㄴ.(×) 전세금의 지급은 전세권 성립의 요소이지만 반드시 현실적으로 수수되어야 하는 것은 아니고 기존의 채권으로 전세금의 지급에 갈음할 수 있다(대판 2009.1.30. 2008다67217). ㄷ.(○) 전세권 존속기간이 시작되기 전에 마친 전세권설정등기도 특별한 사정이 없는 한 유효한 것으로 추정된다(대판 2018.1.25. 2017마1093). ㄹ.(×) 채권담보 목적으로 전세권을 설정하고 설정과 동시에 목적물을 인도하지 아니한 경우라도, 장차 전세권자가 목적물을 사용·수익하는 것을 완전히 배제하는 것이 아니라면 그 전세권의 효력을 부인할 수 없다(대판 1995.2.10. 94다18508).", "2024-35-민법-35": "① 유치권은 점유가 불법행위로 개시된 경우에는 인정되지 않는다(제320조 제2항). ② 유치권자가 소유자의 승낙 없이 유치물을 임대한 경우 유치물의 소유자는 제324조 제3항에 의하여 유치권의 소멸을 청구할 수 있고, 그 후 소유권을 취득한 제3자도 소멸청구를 할 수 있다(대판 2023.8.31. 2019다295278). ③ 점유회수의 소를 제기하여 승소판결을 받아 점유를 회복하면 유치권이 되살아나지만, 점유를 회복하기 전에는 유치권이 되살아나는 것이 아니다(대판 2012.2.9. 2011다72189). ④ 유치권자의 점유가 간접점유인 경우, 그 직접점유자가 채무자인 때에는 유치권의 요건으로서의 점유에 해당하지 않는다(대판 2008.4.11. 2007다27236). ⑤ 제3취득자는 제367조에 의한 비용상환청구권을 피담보채권으로 주장하면서 유치권을 행사할 수 없다(대판 2023.7.13. 2022다265093).", "2024-35-민법-36": "① 주택건물의 신축공사를 한 수급인이 그 건물을 점유하고 있고 그 건물에 관하여 생긴 공사금 채권이 있다면 수급인은 그 채권을 변제받을 때까지 건물을 유치할 권리가 있다(대판 1995.9.15. 95다16202). ② 권리금반환청구권은 건물에 관하여 생긴 채권이라 할 수 없으므로 이를 가지고 유치권을 행사할 수 없다(대판 1994.10.14. 93다62119). ③ 매도인이 소유권을 이전한 후 매매대금채권을 피담보채권으로 유치권을 주장할 수 없다(대결 2012.1.12. 2011마2380). ④ 건축자재대금채권은 매매대금채권에 불과하여 건물 자체에 관하여 생긴 채권이라 할 수 없다(대판 2012.1.26. 2011다96208). ⑤ 임차보증금반환청구권은 건물에 관하여 생긴 채권이라 할 수 없다(대판 1976.5.11. 75다1305).", "2024-35-민법-37": "① 질물보다 먼저 다른 재산에 관한 배당을 실시하는 경우에는 제340조 제1항이 적용되지 않으므로, 질권자는 채권 전액을 가지고 배당에 참가하여 배당받을 수 있다(제340조 제2항 본문). 다만 다른 채권자는 질권자에게 배당금액의 공탁을 청구할 수 있다. ② 질권자는 채권 전부를 변제받을 때까지 질물 전부에 대하여 권리를 행사할 수 있다(제321조, 제343조). ③ 질권은 질물의 멸실·훼손·공용징수로 인하여 질권설정자가 받을 금전 등에 대하여도 행사할 수 있으며, 지급 또는 인도 전에 압류하여야 한다(제342조). ④ 정당한 이유 있는 때에는 질권자는 감정인의 평가에 의하여 질물로 직접 변제에 충당할 것을 법원에 청구할 수 있고, 미리 채무자 및 질권설정자에게 통지하여야 한다(제338조 제2항). ⑤ 질권자는 그 권리의 범위 내에서 자기의 책임으로 질물을 전질할 수 있다(제336조).", "2024-35-민법-38": "① 저당부동산에 대한 압류가 있으면 압류 이후의 차임채권 등 법정과실에도 저당권의 효력이 미친다(제359조, 대판 2016.7.27. 2015다230020). ② 주물 그 자체의 효용과 직접 관계가 없는 물건은 종물이 아니므로, 그러한 물건을 부합물이나 종물로 보아 경매를 같이 진행하여 경락허가를 하였다 하더라도 그 경락은 당연무효이고 경락인은 소유권을 취득할 수 없다(대판 1988.2.23. 87다카600). ③ 구분건물의 전유부분에 대한 저당권의 효력은 종된 권리인 대지사용권에도 미친다(대판 2008.3.13. 2005다15048). ④ 기존건물에 부합된 증축부분이 경매목적물로 평가되지 아니하였더라도 경락인은 부합된 증축부분의 소유권을 취득한다(대판 1992.12.8. 92다26772). ⑤ 건물에 대한 저당권의 효력은 종된 권리인 건물 소유를 목적으로 하는 지상권에도 미친다(제358조 유추, 대판 1996.4.26. 95다52864).", "2024-35-민법-39": "ㄷ. 항목의 경우에만 법정지상권이 성립한다. ㄱ.(×) 제366조의 법정지상권은 저당권 설정 당시 토지 위에 건물이 존재할 경우에 한하여 인정되며, 토지에 저당권 설정 당시 건물 건축이 개시되기 이전이었다면 저당권자가 건물 건축에 동의하였더라도 법정지상권은 성립하지 않는다(대판 2003.9.5. 2003다26051). ㄴ.(×) 토지 및 지상 건물에 공동저당권이 설정된 후 건물이 철거되고 신축된 경우, 특별한 사정이 없는 한 신축건물을 위한 법정지상권은 성립하지 않는다(대판(전) 2003.12.18. 98다43601). ㄷ.(○) 건물공유자의 1인이 그 부지인 토지를 단독 소유하면서 토지에만 저당권을 설정하였다가 경매로 토지 소유자가 달라진 경우, 건물공유자들은 제366조에 의하여 토지 전부에 관하여 법정지상권을 취득한다(대판 2011.1.13. 2010다67159).", "2024-35-민법-40": "공동저당의 목적물 중 일부는 채무자(乙) 소유, 일부는 물상보증인(丙) 소유인 경우, 물상보증인 소유 부동산이 먼저 경매되어 선순위 공동저당권자가 변제를 받으면 물상보증인은 채무자에 대하여 구상권을 취득함과 동시에 변제자대위에 의하여 채무자 소유 부동산에 대한 선순위 공동저당권을 대위취득한다(대판 2018.7.11. 2017다292756). 사안에서 물상보증인 丙소유 Y토지(2억원)에서 甲이 2억원을 배당받았으므로, 남은 채권액 1억원은 X토지 매각대금(3억원)에서 甲이 우선 배당받고, 나머지 2억원은 물상보증인 丙이 변제자대위에 의하여 채무자 乙소유 X토지에 대한 선순위 공동저당권자 甲을 대위하여 배당받는다. 결국 후순위 저당권자 丁이 배당받을 수 있는 금액은 없다(0원).", "2026-37-민법-1": "① 관습법은 법률에 대하여 열후적ㆍ보충적 성격을 가진다(제1조, 대판 1983.6.14. 80다3231). ② 민법 제1조의 '법률'은 형식적 의미의 법률에 한정하지 않고 모든 성문법(명령ㆍ규칙ㆍ조례ㆍ조약 포함)을 의미하므로, 민사에 관한 것이라면 대통령의 헌법상 긴급명령도 민법의 법원이 될 수 있다(옳음). ③ 관습법은 당사자의 주장ㆍ입증을 기다림 없이 법원이 직권으로 확정하여야 한다(대판 1983.6.14. 80다3231). ④ 사실인 관습은 법령으로서의 효력이 없는 단순한 관행으로서 법률행위 당사자의 의사를 보충함에 그친다. ⑤ 관습법을 적용할 시점의 전체 법질서에 부합하지 않게 되었다면 그 관습법은 법적 규범으로서의 효력이 부정될 수밖에 없다(대판(전) 2005.7.21. 2002다1178).", "2026-37-민법-2": "① 제24조 ① 법원이 선임한 재산관리인은 관리할 재산목록을 작성하여야 한다. ② 제26조 ② 법원은 그 선임한 재산관리인에 대하여 부재자의 재산으로 상당한 보수를 지급할 수 있다. ③ 법원의 초과행위허가 결정은 장래의 처분행위뿐 아니라 기왕의 처분행위를 추인하는 방법으로도 할 수 있다(대판 1982.9.14. 80다3063 등). 따라서 과거 처분행위 추인도 가능하므로 옳지 않다. ④ 제25조. 부재자의 생사가 분명하지 아니한 경우 부재자가 정한 재산관리인이 권한을 넘는 행위를 할 때에도 법원의 허가를 얻어야 한다. ⑤ 권한초과행위 허가를 받고 선임결정 취소 전에 한 권한 내의 행위는 실종선고기간 만료 뒤에 이루어졌더라도 유효하다(대판 1981.7.28. 80다2668).", "2026-37-민법-3": "① 제10조 ② 가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있다. ② 제14조의2 ① 특정후견 청구권자에 검사 또는 지방자치단체의 장이 포함된다. ③ 제14조의2 ③ 특정후견의 심판을 하는 경우에는 특정후견의 기간 또는 사무의 범위를 정하여야 한다. ④ 피특정후견인은 완전한 행위능력자이며 특정후견은 본인의 의사에 반하여 할 수 없다(제14조의2 ②). 따라서 옳지 않다. ⑤ 제14조의3 ① 가정법원이 피한정후견인에 대하여 성년후견개시의 심판을 할 때에는 종전의 한정후견의 종료 심판을 한다.", "2026-37-민법-4": "㉠ 법인은 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다(제33조). X부동산 소재지인 광주가 아니라 주된 사무소 소재지인 서울에 설립등기하여야 하므로 틀림. ㉡ 재단법인은 사원자격의 득실에 관한 사항이 정관의 필수적 기재사항이 아니고(제43조, 제40조) 등기사항도 아니므로 틀림. ㉢ 제44조. 재단법인 설립자가 명칭ㆍ사무소 소재지 또는 이사임면의 방법을 정하지 아니하고 사망한 때에는 이해관계인 또는 검사의 청구에 의하여 법원이 이를 정한다(옳음). ㉣ 재단법인 출연자는 착오를 원인으로 취소요건을 갖춘 경우 법인 성립 여부나 출연재산의 기본재산 여부와 관계없이 출연행위를 취소할 수 있다(대판 1999.7.9. 98다9045). 따라서 취소할 수 있으므로 틀림. 옳은 것은 ㉢뿐이다.", "2026-37-민법-5": "① 감사는 임의기관이므로(제66조) 그 성명과 주소는 설립등기사항이 아니다. ② 법인과 이사의 이익이 상반하는 사항에는 임시이사가 아니라 특별대리인을 선임하여야 한다(제64조). ③ 법인과 이사는 위임 유사의 관계이므로 이사는 언제든지 사임할 수 있고 주무관청의 허가가 없더라도 사임할 수 있다(대판 2008.9.25. 2007다17109). ④ 정관에 이사의 해임사유에 관한 규정이 있는 경우, 이사의 중대한 의무위반 등 특별한 사정이 없는 한 법인은 정관에서 정하지 아니한 사유로 이사를 해임할 수 없다(대판 2024.1.4. 2023다263537)(옳음). ⑤ 대표권이 없는 이사는 대표기관이 아니므로 그들의 행위로 인한 법인의 불법행위는 성립하지 않는다(대판 2005.12.23. 2003다30159).", "2026-37-민법-6": "① 제42조 ② 정관의 변경은 주무관청의 허가를 얻지 아니하면 효력이 없다. ② 재단법인의 기본재산 변경은 정관변경을 초래하므로 기존 기본재산 처분뿐 아니라 새로이 기본재산으로 편입하는 행위도 주무장관의 허가가 있어야 유효하다(대판 1991.5.28. 90다8558). ③ 제45조 ① 재단법인의 정관은 그 변경방법을 정관에 정한 때에 한하여 변경할 수 있다. ④ 제56조의 사원지위 양도ㆍ상속 금지는 강행규정이 아니므로 정관으로 인정하면 양도ㆍ상속이 허용된다(대판 1992.4.14. 91다26850). ⑤ 정관은 자치법규이므로 사원총회 결의로 정관의 규범적 의미와 다른 해석을 표명하더라도 그 해석은 사원이나 법인을 구속할 수 없다(대판 2000.11.24. 99다12437). 따라서 옳지 않다.", "2026-37-민법-7": "㉠ 총유물 매매계약 체결은 처분행위에 해당하나, 그 채무존재를 인식하고 있다는 뜻을 표시하는 데 불과한 소멸시효 중단사유로서의 승인은 총유물의 관리ㆍ처분행위라고 볼 수 없다(대판 2009.11.26. 2009다64383). 따라서 틀림. ㉡ 비법인사단의 대표권 제한은 등기방법이 없어 제60조를 준용할 수 없고, 거래 상대방이 대표권 제한사실을 알았거나 알 수 있었을 경우가 아니라면 그 거래행위는 유효하다(대판 2003.7.22. 2002다64780)(옳음). ㉢ 비법인사단의 대표자는 제반 업무처리를 포괄적으로 위임할 수 없으므로(제62조), 포괄적 수임인의 대행행위는 비법인사단에 그 효력이 미치지 아니한다(대판 1996.9.6. 94다18522)(옳음). 옳은 것은 ㉡, ㉢.", "2026-37-민법-8": "① 국립공원의 입장료는 토지의 사용대가인 민법상 과실이 아니라 수익자 부담원칙에 따른 유지ㆍ관리비용 부담이다(대판 2001.12.28. 2000다27749). ② 물건의 용법에 의하여 수취하는 산출물은 천연과실이다(제101조 ①). ③ 종물은 독립한 물건이면 되고 동산ㆍ부동산을 불문하므로 부동산도 종물이 될 수 있다(대판 1991.5.14. 91다2779). ④ 주물 자체의 효용과 관계없는 물건은 주물 소유자ㆍ이용자의 사용에 공여되더라도 종물이 아니다(대판 2007.12.13. 2007도7247). ⑤ 종물과 주물의 법리는 권리 상호 간에도 적용되고, 그 처분에는 압류와 같은 공법상 처분도 포함된다(대판 2006.10.26. 2006다29020)(옳음).", "2026-37-민법-9": "① 경매에는 불공정한 법률행위에 관한 제104조가 적용될 여지가 없다(대결 1980.3.21. 80마77). ② 매매대금의 과다로 불공정한 법률행위에 해당하여 무효인 경우 무효행위 전환에 관한 제138조가 적용될 수 있다(대판 2010.7.15. 2009다50308)(옳음). ③ 불공정한 법률행위는 무효이며 선의의 제3자에게도 무효를 주장할 수 있다. ⑤ 추인에 의하여 유효로 될 수 없고 법정추인도 적용되지 않는다(대판 1994.6.24. 94다10900). ④ 대리인에 의한 법률행위에서 경솔ㆍ무경험은 대리인을 기준으로, 궁박은 본인을 기준으로 판단한다(대판 2002.10.22. 2002다38927).", "2026-37-민법-10": "형성권이란 권리자의 일방적 의사표시에 의하여 법률관계의 발생ㆍ변경ㆍ소멸을 일으키는 권리를 말한다. 청구권이라는 명칭에 구애받지 않고 그 성질에 따라 공유물분할청구권(제268조), 지상권자의 지상물매수청구권(제283조), 지료증감청구권(제286조), 부속물매수청구권(제316조)은 형성권이다.", "2026-37-민법-11": "㉠ 제108조 제2항의 제3자는 선의이면 족하고 무과실은 요건이 아니다(대판 2004.5.28. 2003다70041)(옳음). ㉡ 계약이전을 받은 금융기관은 통정허위표시에 따라 형성된 법률관계를 기초로 새로운 법률상 이해관계를 가지게 된 제3자에 해당하지 않는다(대판 2004.1.15. 2002다31537)(옳음). ㉢ 임대차보증금반환채권 양도계약이 허위표시로 무효인 경우 양수인의 채권자(압류ㆍ추심채권자)는 외형상 형성된 법률관계를 기초로 새로운 이해관계를 맺은 제3자에 해당한다(대판 2014.4.10. 2013다59753)(옳음). 모두 옳다.", "2026-37-민법-12": "① 소송행위에는 의사표시의 하자를 이유로 무효ㆍ취소를 주장할 수 없다(대판 1980.8.26. 80다76). ② 대리행위의 하자, 착오의 유무는 대리인을 표준으로 결정한다(제116조 ①). ③ 매도인이 매수인의 채무불이행을 이유로 적법하게 해제한 후라도 매수인은 손해배상책임 등 불이익을 면하기 위하여 착오를 이유로 취소권을 행사하여 계약 전체를 무효로 돌릴 수 있다(대판 1996.12.6. 95다24982). 즉 취소권은 소멸하지 않으므로 옳지 않다. ④ 표의자가 경제적 불이익을 입은 것이 아니라면 중요부분의 착오라 할 수 없다(대판 1999.2.23. 98다47924). ⑤ 착오취소와 하자담보책임은 취지ㆍ요건ㆍ효과가 구별되므로 매수인은 하자담보책임 성립 여부와 상관없이 착오를 이유로 취소할 수 있다(대판 2018.9.13. 2015다78703).", "2026-37-민법-13": "① 동기에 관한 착오를 일으킨 경우에도 표의자는 사기에 의한 의사표시로서 취소할 수 있다(대판 1985.4.9. 85도167). ② 부당이득반환청구권과 손해배상청구권이 경합ㆍ병존하면 채권자는 어느 것이라도 선택하여 행사할 수 있지만 중첩적으로 행사할 수는 없다(대판 1993.4.27. 92다56087). 따라서 옳지 않다. ③ 매수인이 시가를 묵비하여 고지하지 않거나 낮게 고지하더라도 특별한 사정이 없는 한 위법한 기망행위가 되지 않는다(대판 2014.4.10. 2012다54997). ④ 사기로 인한 매수인으로부터 권리를 취득한 제3자는 특별한 사정이 없는 한 선의로 추정된다(대판 1970.11.24. 70다2155). ⑤ 상대방의 대리인 등 상대방과 동일시할 수 있는 자의 사기는 제3자의 사기가 아니므로(제110조 ①) 상대방은 선의ㆍ무과실이더라도 취소할 수 있다(대판 1999.2.23. 98다60828).", "2026-37-민법-14": "① 대리인은 행위능력자임을 요하지 아니하므로(제117조) 피한정후견인도 임의대리인이 될 수 있다. ② 제118조의 권한을 정하지 아니한 대리인은 보존행위를 할 수 있고, 소멸시효 중단행위는 보존행위이므로 할 수 있다. ③ 등기신청은 제124조 단서의 '채무의 이행'에 준하므로 법무사가 등기권리자와 등기의무자 쌍방을 대리하여 등기를 신청하는 것은 허용된다(옳음). ④ 복대리인 선임권 없는 대리인이 선임한 복대리인의 권한도 기본대리권이 될 수 있다(대판 1998.3.27. 97다48982). ⑤ 아파트분양업무처럼 수임인의 능력에 따라 성공 여부가 결정되는 사무는 본인의 명시적 승낙 없이는 복대리인 선임이 허용되지 않는다(대판 1999.9.3. 97다56099).", "2026-37-민법-15": "옳지 않은 것을 고르는 문제. ㉠ 계약체결 대리권을 수여받은 대리인이 수권된 법률행위를 하면 대리권은 소멸하므로, 그 계약을 해제할 권한까지 당연히 포함한다고 볼 수 없다(대판 2015.12.23. 2013다81019). 따라서 틀린 설명(정답 포함). ㉡ 본인의 성년후견개시는 대리권 소멸사유가 아니므로(제127조) 乙의 대리권은 소멸하지 않는다. 따라서 틀린 설명(정답 포함). ㉢ 대리인은 변제를 수령할 권한도 가지며 본인에게 전달하지 않았더라도 수령한 때 효력이 발생하므로 丙의 잔금지급채무는 소멸한다(대판 2011.8.18. 2011다30871)(옳은 설명). ㉣ 해제로 인한 원상회복의무는 대리인이 아니라 본인이 부담하므로 丙은 乙에게 손해배상을 청구할 수 없다(옳은 설명). 옳지 않은 것은 ㉠, ㉡.", "2026-37-민법-16": "① 무효행위의 추인은 묵시적으로도 가능하다(대판 2014.3.27. 2012다106607). ② 무효행위의 추인은 그 무효원인이 소멸한 후에 하여야 효력이 있다(대판 2003.3.28. 2002다72125). ③ 무효인 법률행위는 당초부터 효력이 없으므로 그 법률효과를 침해하는 것처럼 보이는 위법행위가 있더라도 침해에 따른 손해가 없어 손해배상을 청구할 수 없다(대판 2003.3.28. 2002다72125). 따라서 옳지 않다. ④ 무권리자 처분을 권리자가 추인하면 무권대리 추인 규정(제130조, 제133조)을 유추적용하여 원칙적으로 계약 체결 시로 소급하여 권리자에게 귀속한다(대판 2017.6.8. 2017다3499). ⑤ 토지거래허가구역 내 허가를 잠탈하는 매매계약은 체결된 때부터 확정적 무효이고 허가구역 지정이 해제되더라도 유효로 되지 않는다(대판 2019.1.31. 2017다228618).", "2026-37-민법-17": "제145조의 법정추인사유는 1. 전부나 일부의 이행, 2. 이행의 청구(취소권자가 청구한 경우만 포함), 3. 경개, 4. 담보의 제공, 5. 취소할 수 있는 행위로 취득한 권리의 양도(취소권자가 양도한 경우만), 6. 강제집행이다. ① 이행의 청구는 취소권자가 청구하는 경우에 한하므로, 상대방이 취소권자에게 이행을 청구한 경우는 법정추인사유에 해당하지 않는다(정답). ② 저당권 설정은 제4호 담보제공. ③ 제6호 강제집행. ④ 제5호 권리의 양도. ⑤ 제3호 경개에 해당한다.", "2026-37-민법-18": "① 정지조건은 이미 성립한 법률행위에 효력의 발생을 장래의 불확실한 사실의 성부에 의존하게 한 부관이므로, 조건이 성취되었을 때 법률행위가 성립하는 것이 아니라 효력이 발생한다(제147조 ①). 따라서 옳지 않다. ② 제151조 ① 조건이 선량한 풍속 기타 사회질서에 위반한 것이면 그 법률행위는 무효로 한다. ③ 조건의 존재를 주장하는 자가 증명책임을 진다(대판 2006.11.24. 2006다35766). ④ 불능조건이 해제조건이면 조건 없는 법률행위로 하고 정지조건이면 무효로 한다(제151조 ③). ⑤ 불확정한 사실의 발생이 불가능하게 된 때에도 이행기한은 도래한 것으로 본다(대판 2007.5.10. 2005다67353).", "2026-37-민법-19": "① 제163조 제5호의 3년 단기시효는 변호사 등에만 적용되고 세무사 직무에 관한 채권은 일반채권으로 10년 시효에 걸린다(대판 2022.8.31. 2022다217124). ② '채무자가 시효완성 후 채무를 승인하면 시효이익을 포기한 것으로 추정된다'는 추정 법리는 타당하지 않다(대판(전) 2025.7.24. 2023다240299로 판례 변경). 따라서 채무를 승인한 것만으로 시효이익을 포기한 것으로 볼 수 없으므로 옳지 않다. ③ 제165조 ① 판결로 확정된 채권은 단기시효에 해당하더라도 그 소멸시효는 10년으로 한다. ④ 제166조 ② 부작위를 목적으로 하는 채권의 소멸시효는 위반행위를 한 때로부터 진행한다. ⑤ 후순위 담보권자는 선순위 담보권의 피담보채권 소멸로 직접 이익을 받는 자에 해당하지 않아 시효완성을 주장할 수 없다(대판 2021.2.25. 2016다232597).", "2026-37-민법-20": "㉠ 최고를 여러 번 거듭하다가 재판상 청구를 한 경우 시효중단 효력은 항상 최초의 최고 시에 발생하는 것이 아니라, 재판상 청구 시점으로부터 소급하여 6월 이내에 한 최고 시에 발생한다(대판 1983.7.12. 83다카437). 따라서 틀림. ㉡ 시효중단사유로서의 승인은 시효진행 개시 이후에만 가능하고, 현존하지 아니하는 장래의 채권을 미리 승인하는 것은 허용되지 않는다(대판 2001.11.9. 2001다52568)(옳음). ㉢ 물상보증인이 제기한 저당권설정등기 말소청구소송에서 채권자가 청구기각을 구하고 피담보채권 존재를 주장하더라도 직접 채무자에 대한 재판상 청구로 볼 수 없어 제168조 제1호의 '청구'에 해당하지 아니한다(대판 2004.1.16. 2003다30890)(옳음). 옳은 것은 ㉡, ㉢.", "2026-37-민법-21": "① 건물의 개수는 공부상 등록이 아니라 사회통념 또는 거래관념에 따라 물리적 구조, 이용목적 등을 참작하여 결정된다(대판 1997.7.8. 96다36517). ② 성장을 계속하는 어류일지라도 집합물 양도담보의 대상이 될 수 있어 양만장 내 뱀장어 전부에 대한 양도담보계약은 담보목적물이 특정되어 유효하게 성립한다(대판 1990.12.26. 88다카20224). ③ 권원 없이 타인의 토지에 심은 수목은 토지에 부합하여 토지소유자에게 귀속되므로 독립한 물권의 객체가 될 수 없다(대판 1980.9.30. 80도1874)(옳음). ④ 물권의 객체는 물건이 원칙이나 준점유, 권리질권, 지상권ㆍ전세권을 목적으로 하는 저당권 등 특별 규정이 있는 경우 권리도 대상이 된다. ⑤ 제212조 토지의 소유권은 정당한 이익 있는 범위 내에서 토지의 상하에 미친다.", "2026-37-민법-22": "① 소유권을 상실한 전소유자는 물권적 청구권에 의한 방해배제를 구할 수 없다(대판 1980.9.9. 80다7). ② 건물철거의무가 있는 자는 건물소유자나 미등기건물을 매수하여 법률상ㆍ사실상 처분할 수 있는 지위에 있는 사람이므로, 토지소유자는 건물의 점유자인 임차인을 상대로 건물철거를 청구할 수 없다(대판 1987.11.24. 87다카257). 따라서 옳지 않다. ③ 지상권을 설정한 토지소유자도 불법점유자에 대하여 방해배제 물권적 청구권을 행사할 수 있다(대판 1974.11.12. 74다1150). ④ 미등기 무허가건물 양수인은 소유권이전등기를 경료받지 않는 한 직접 자신의 소유권에 기하여 명도를 청구할 수 없다(대판 2007.6.15. 2007다11347). ⑤ 민법은 물권적 청구권 실현에 드는 비용부담 주체에 관하여 명시적 규정을 두고 있지 않다(대판 2014.11.27. 2014다52612).", "2026-37-민법-23": "① 가등기상 권리의 이전등기는 가등기에 대한 부기등기 형식으로 경료할 수 있다(대판 1998.11.19. 98다24105). ② 무효로 된 가등기의 유용 합의 이전에 등기상 이해관계 있는 제3자가 나타나지 않는 한 그 가등기는 유효하게 존속한다(대판 1986.12.9. 86다카7165). ③ 가등기가 경료되어 있다 하더라도 소유권이전등기를 청구할 어떤 법률관계가 있다고 추정되지 않는다(대판 1979.5.22. 79다239). ④ 가등기는 순위보전적 효력만 있을 뿐 아무런 실체법상 효력이 없으므로 중복 소유권보존등기가 무효이더라도 가등기권리자는 그 말소를 청구할 권리가 없다(대판 2001.3.23. 2000다51285). 따라서 옳지 않다. ⑤ 본등기 순위가 가등기한 때로 소급할 뿐 물권변동의 효력이 가등기한 때로 소급하여 발생하는 것은 아니다(대판 1992.9.25. 92다21258).", "2026-37-민법-24": "제187조에 의해 상속, 공용징수, 판결, 경매, 기타 법률의 규정에 의한 부동산물권의 취득은 등기를 요하지 아니한다. ①, ③ 법정대위에 의한 저당권 이전(제481조), 법정저당권 취득(제649조)은 법률의 규정에 의한 취득으로 등기 불요. ② 공유물분할 조정이 성립하더라도 그 즉시 공유관계가 소멸하는 것이 아니라 분필절차를 마치고 공유지분을 이전받아 등기를 마쳐야 비로소 소유권을 취득한다(대판(전) 2013.11.21. 2011두1917). 따라서 등기를 요하므로 정답. ④ 재결수용은 수용의 개시일에 등기 없이 소유권을 취득한다(토지보상법 제45조). ⑤ 공경매에서 매각대금을 완납한 때 등기 없이 소유권을 취득한다.", "2026-37-민법-25": "① 제249조 선의취득은 점유인도를 요건으로 하는 동산 소유권취득(질권 준용)에 관한 규정으로 저당권 취득에는 적용될 수 없다(대판 1985.12.24. 84다카2428). ② 선의ㆍ무과실 판단시점은 물권행위가 완성되는 때이며 인도받을 때까지 선의ㆍ무과실이 계속되어야 한다(대판 1991.3.22. 91다70). ③ 채무자 이외의 자 소유 동산을 경매한 경우에도 경락대금을 납부하고 인도받은 경락인은 특별한 사정이 없는 한 소유권을 선의취득한다(대판 1998.3.27. 97다32680). 따라서 옳지 않다. ④ 선의취득은 양도인이 무권리자라는 점을 제외하고는 거래행위에 아무런 흠이 없어야 성립한다(대판 1995.6.29. 94다22071). ⑤ 점유개정의 방법으로는 선의취득이 인정되지 않으므로 뒤의 채권자는 양도담보권을 취득할 수 없다(대판 2005.2.18. 2004다37430).", "2026-37-민법-26": "① 자주점유는 소유자와 동일한 지배를 하려는 의사를 가지고 하는 점유를 의미하는 것이지 소유권이 있다고 믿고 하는 점유를 의미하는 것은 아니다(대판 1996.10.11. 96다23719). ② 점유자가 매매ㆍ증여 등 자주점유 권원을 주장하였으나 인정되지 않더라도 그 사유만으로 자주점유의 추정이 번복되지 않는다(대판 2020.7.9. 2017다241116). ③ 매도인이 착오로 다른 토지를 인도하였더라도 매수인이 매매목적물로 믿고 점유를 개시한 이상 자주점유로 보아야 한다(대판 1984.2.14. 83다카587). ④ 점유권원의 성질이 분명하지 않을 때 자주점유 추정은 국가나 지방자치단체가 점유하는 경우에도 마찬가지로 적용된다(대판 2024.12.12. 2024다281266). ⑤ 타주점유자가 그 명의로 소유권이전등기를 경료한 것만으로는 자주점유로 전환되었다고 볼 수 없다(대판 1993.7.16. 92다37871)(옳음).", "2026-37-민법-27": "㉠ 선의의 점유자는 점유물의 과실을 취득하므로(제201조 ①) 법률상 원인 없이 타인의 건물을 점유ㆍ사용하여 손해를 입혔더라도 그 점유ㆍ사용으로 인한 이득을 반환할 의무가 없다(대판 1996.1.26. 95다44290)(옳음). ㉡ 과실을 취득한 점유자는 통상의 필요비를 청구하지 못하므로(제203조 ① 단서), 선의의 매수인이 농지를 경작하여 수확하였다면 비료비용 등 통상필요비를 상환청구할 수 없다(대판 1964.7.14. 63다1119)(옳음). ㉢ 상환기간 허여는 유익비의 경우에만 인정되므로(제203조 ③), 현상 유지를 위한 필요비에 대해서는 법원이 상당한 상환기간을 허여할 수 없다. 따라서 틀림. 옳은 것은 ㉠, ㉡.", "2026-37-민법-28": "① 생활방해가 수인한도를 넘는 경우 소유자ㆍ점유자는 소유권ㆍ점유권에 기하여 방해 제거ㆍ예방을 위한 유지청구를 할 수 있다(대판 2007.6.15. 2004다37904). ② 수도 등 시설권은 법정 요건을 갖추면 당연히 인정되며, 통과 토지 소유자의 동의나 승낙을 받아야 하는 것이 아니다(대판 2016.12.15. 2015다247325). ③ 제238조 인지소유자는 자기의 비용으로 담의 재료를 통상보다 양호한 것으로 할 수 있다. ④ 제242조 ① 건물을 축조함에는 특별한 관습이 없으면 경계로부터 반미터 이상의 거리를 두어야 한다. ⑤ 인접지 수목의 가지가 경계를 넘은 경우 먼저 소유자에 대하여 가지제거를 청구하고, 이에 응하지 아니한 때에만 청구자가 그 가지를 제거할 수 있다(제240조). 청구 없이 임의로 제거할 수 없으므로 옳지 않다.", "2026-37-민법-29": "① 제245조 ②의 '소유자로 등기한 자'에서 등기는 적법ㆍ유효할 필요는 없고 무효의 등기라도 관계없다(대판 1994.2.8. 93다23367). ② 등기부취득시효의 선의ㆍ무과실은 등기에 관한 것이 아니고 점유취득에 관한 것이다(대판 1995.2.10. 94다22651). ③ 선의ㆍ무과실은 점유개시 시에 존재하면 족하고 시효기간 내내 계속되어야 하는 것은 아니다(대판 1987.8.18. 87다카191). ④ 10년간 반드시 자기 명의로 등기되어 있어야 하는 것은 아니고 앞 사람의 등기까지 아울러 10년 동안 등기되어 있으면 되므로, 등기된 기간과 점유기간이 때를 같이 하여야 하는 것은 아니다(대판(전) 1989.12.26. 87다카2176). 따라서 옳지 않다. ⑤ 매도인의 처분권한을 조사하였더라면 처분권한이 없음을 알 수 있었음에도 조사하지 않고 매수하였다면 점유에 과실이 있어 등기부취득시효는 완성되지 않는다(대판 2017.12.13. 2016다248424).", "2026-37-민법-30": "① 보존행위는 각자가 할 수 있으므로(제265조) 소수지분권자도 보존행위를 할 수 있다. ②, ⑤ 공유자는 그 지분을 처분할 수 있고 공유물 전부를 지분의 비율로 사용ㆍ수익할 수 있으므로(제263조) 소수지분권자도 저당권설정과 지분비율에 따른 사용이 가능하다. ③ 공유물을 배타적으로 점유하는 다른 소수지분권자에게 다른 소수지분권자는 공유물의 인도를 청구할 수 없다(다만 방해배제는 청구 가능)(대판(전) 2020.5.21. 2018다287522). 따라서 단독으로 할 수 없으므로 정답. ④ 과반수지분권자는 다른 공유자와 미리 협의하지 않더라도 공유물의 특정 부분을 배타적으로 사용ㆍ수익할 수 있다(대판 1991.9.24. 88다카33855).", "2026-37-민법-31": "① 토지의 일부에 대한 지상권도 범위를 특정하여 공시방법인 등기를 하면 성립할 수 있다(부동산등기법 제69조). ② 지상권자는 지상권을 유보한 채 지상물 소유권만을 양도할 수 있고, 지상권과 지상물 소유자가 반드시 일치하여야 하는 것은 아니다(대판 2006.6.15. 2006다6126). ③ 지료의 지급은 지상권의 요소가 아니므로 지료 약정이 없더라도 지상권 성립에 영향이 없다(대판 1999.9.3. 99다24874). ④ 지상권은 토지 사용을 본질로 하므로 설정 당시 건물 등이 없거나 기존 건물이 멸실되더라도 존속기간이 만료되지 않는 한 지상권은 소멸하지 않는다(대판 1996.3.22. 95다49318). 따라서 옳지 않다. ⑤ 제285조 ② 지상권설정자가 상당한 가액을 제공하여 매수를 청구한 때에는 지상권자는 정당한 이유 없이 이를 거절하지 못한다.", "2026-37-민법-32": "① 관습상의 법정지상권에서 건물은 건물로서의 요건을 갖추고 있는 이상 무허가건물이거나 미등기건물이거나를 가리지 않는다(대판 1988.4.12. 87다카2404). ② 법정지상권을 취득한 자가 대지소유자와 임대차계약을 체결한 경우 특별한 사정이 없는 한 관습상의 법정지상권을 포기한 것으로 된다(대판 1991.5.14. 91다1912). ③ 토지소유자의 사용승낙을 받고 건물을 신축한 경우는 토지와 건물이 같은 소유자에 속하였다가 달라진 것이 아니므로 관습법상 법정지상권이 성립할 여지가 없다(대판 1990.10.30. 90다카26003). ④ 토지공유자 중 1인이 공유토지 위에 건물을 소유하다가 토지의 공유지분만을 양도한 경우에는 관습법상 법정지상권이 인정되지 않는다(대판 1997.12.26. 96다34665)(옳음). ⑤ 대지소유자가 지상건물을 타인과 공유하면서 단독소유 대지만을 건물철거 조건 없이 매도한 경우 건물공유자들은 대지 전부에 관습상 법정지상권을 취득한다(대판 1977.7.26. 76다388).", "2026-37-민법-33": "① 제292조 ② 지역권은 요역지와 분리하여 양도하거나 다른 권리의 목적으로 하지 못한다. ② 제300조 ① 승역지의 소유자는 지역권의 행사를 방해하지 아니하는 범위 내에서 지역권자가 승역지에 설치한 공작물을 사용할 수 있다(옳음). ③ 도로를 개설하여 영구히 사용케 하기로 한 약정은 지역권 설정에 관한 합의로 봄이 상당하다(대판 1980.1.29. 79다1704). ④ 통행지역권 시효취득을 위해서는 요역지 소유자가 승역지에 통로를 개설하였을 것을 요한다(대판 1993.5.11. 91다46861). ⑤ 지역권은 승역지를 점유하는 권능이 없어 반환청구권은 인정되지 않으나 방해제거ㆍ방해예방청구권은 인정된다(제301조, 제214조).", "2026-37-민법-34": "① 동산 소유권이나 질권은 선의취득할 수 있으나 유치권은 선의취득할 수 없다(제249조, 제343조 참고)(옳음). ② 유치권은 피담보채권이 변제기에 있어야 성립하므로 아직 변제기에 이르지 아니한 채권으로는 유치권을 행사할 수 없다(대판 2007.9.21. 2005다41740). ③ 유치권자는 우선변제적 효력은 없으나 채권의 변제를 받기 위하여 유치물을 경매할 수 있다(환가를 위한 경매, 제322조). ④ 경매개시결정 기입등기 전에 유치권을 취득한 사람은 매수인에게 유치권으로 대항할 수 있다(대판 2009.1.15. 2008다70763). ⑤ 유치물은 채무자 이외의 제3자 소유의 물건이어도 무방하다(제320조 ①).", "2026-37-민법-35": "① 제304조 ① 타인의 토지에 있는 건물에 전세권을 설정한 때에는 전세권의 효력은 그 건물의 소유를 목적으로 한 지상권 또는 임차권에 미친다. 따라서 X토지의 임차권에 미치지 않는다는 설명은 옳지 않다. ② 제315조 ② 전세권의 목적물 일부가 전세권자에 책임 있는 사유로 멸실된 때 전세권설정자는 전세권이 소멸된 후 전세금으로써 손해배상에 충당할 수 있다. ③ 채권담보 목적으로 전세권을 설정하고 목적물을 인도하지 않았더라도 장차 사용ㆍ수익을 완전히 배제하지 않았다면 전세권의 효력을 부인할 수 없다(대판 1995.2.10. 94다18508). ④ 전세권 성립 후 목적물 소유권이 이전되면 전세권은 신 소유자 사이에서 동일 내용으로 존속하므로 신 소유자가 전세금 반환의무를 부담한다(대판 2006.5.11. 2006다6072). ⑤ 건물 일부에 전세권이 설정된 경우 전세권자는 목적물이 아닌 나머지 부분에 대해서는 경매신청권이 없다(대판 2001.7.2. 2001마212).", "2026-37-민법-36": "①, ② 지상권, 지역권은 용익물권이다(제279조, 제291조). ③ 점유권은 제한물권이 아닌 사실상 지배권이다. ④ 유치권은 법정담보물권이다. ⑤ 채권질권은 당사자의 의사에 의해 인정되는 약정담보물권이다(제345조, 제346조). 따라서 정답.", "2026-37-민법-37": "㉠ 채무불이행에 의한 손해배상청구권은 원채권의 연장이므로 물건과 원채권 사이에 견련관계가 있으면 손해배상채권과 물건 사이에도 견련관계가 인정되어 유치권 항변을 할 수 있다(대판 1976.9.28. 76다582)(옳음). ㉡ 제322조 ② 정당한 이유 있는 때 유치권자는 감정인 평가에 의하여 유치물로 직접 변제충당을 법원에 청구할 수 있으나, 이 경우 미리 채무자에게 통지하여야 한다. 따라서 통지하지 않아도 된다는 것은 틀림. ㉢ 점유회수의 소에서 승소하여 점유를 회복하면 유치권이 되살아나지만, 점유를 회복하기 전에는 유치권이 되살아나지 않는다(대판 2012.2.9. 2011다72189)(옳음). ㉣ 제324조 위반 임대행위가 있은 뒤에 유치물의 소유권을 취득한 제3자도 유치권소멸청구를 할 수 있다(대판 2023.8.31. 2019다295278)(옳음). 옳은 것은 ㉠, ㉢, ㉣.", "2026-37-민법-38": "① 질권자 甲은 선량한 관리자의 주의로 X시계를 점유하여야 한다(제324조, 제343조). ② 동산질권을 선의취득하기 위하여는 질권자가 평온ㆍ공연ㆍ선의ㆍ무과실로 질권의 목적동산을 취득하여야 하며 그 입증책임은 질권자에게 있다(대판 1981.12.22. 80다2910). ③ 질권자는 채권 전부를 변제받을 때까지 질물 전부에 대하여 권리를 행사할 수 있다(불가분성, 제321조, 제343조). ④ 제335조 질권자는 변제를 받을 때까지 질물을 유치할 수 있으나 자기보다 우선권이 있는 채권자에게 대항하지 못한다. ⑤ 질권자는 질물을 경매할 수 있고(제338조 ①) 그 매각대금으로부터 다른 채권자보다 자기채권의 우선변제를 받을 권리가 있다(제329조). 일반채권자와 동일한 순위로 변제받는 것이 아니므로 옳지 않다.", "2026-37-민법-39": "저당권은 타인의 부동산을 객체로 하는 담보물권이므로 원칙적으로 권리는 저당권의 객체가 될 수 없으나(제356조), 제371조의 특별규정에 의해 지상권과 전세권은 저당권의 객체가 될 수 있다. ①, ② 질권, 지역권은 객체가 될 수 없다. ③ 지상권은 제371조에 의해 저당권의 객체가 될 수 있으므로 정답. ④ 성숙한 농작물은 토지와 별개의 독립한 부동산이나 등기할 수 없어 저당권의 객체가 될 수 없다. ⑤ 등기한 선박은 예외적으로 저당권의 대상이나 등기되지 않은 선박은 일반 동산이므로 저당권의 객체가 될 수 없다.", "2026-37-민법-40": "① 후순위권리자 또는 일반채권자에 의하여 경매가 신청된 경우 선순위 근저당권의 피담보채권은 경락대금 완납 시에 확정된다(대판 1999.9.21. 95다36596). ② 근저당권에 의하여 담보되는 채권이 전부 소멸하고 거래를 계속할 의사가 없는 경우 근저당권설정자는 계약을 해지하고 말소를 구할 수 있으며 이때 피담보채권은 확정된다(대판 2002.5.24. 2002다7176). ③ 물상보증인은 채권최고액만 변제하면 근저당권설정등기의 말소청구를 할 수 있고 초과 부분까지 변제할 의무는 없다(대판 1974.12.10. 74다998). ④ 피담보채무 확정 전 당사자 합의로 채무의 범위 또는 채무자를 변경할 수 있고, 후순위저당권자 등 이해관계인은 이미 채권최고액 상당 담보가치가 파악되어 있어 예측하지 못한 손해를 입었다고 볼 수 없으므로 이해관계인의 승낙을 받을 필요가 없다(대판 2021.12.16. 2021다264161). 따라서 옳지 않다. ⑤ 후순위 근저당권자는 제364조의 제3취득자에 해당하지 않으므로, 확정된 피담보채무 전부를 변제하여야 비로소 선순위 근저당권의 말소를 청구할 수 있다(대판 2006.1.26. 2005다17341).", "2024-35-감정평가관계법규-1": "④ 도축장은 보건위생시설이다.", "2024-35-감정평가관계법규-2": "① 중앙행정기관의 장, 시ㆍ도지사, 시장 또는 군수는 국토교통부장관이나 도지사에게 광역계획권의 지정 또는 변경을 요청할 수 있다.\n② 도지사가 광역계획권을 지정하거나 변경하려면 관계 중앙행정기관의 장, 관계 시ㆍ도지사, 시장 또는 군수의 의견을 들은 후 지방도시계획위원회의 심의를 거쳐야 한다. 관계 중앙행정 기관의 장의 승인을 받을 필요는 없다.\n③ 국토교통부장관 또는 도지사는 광역계획권을 지정하거나 변경하면 지체 없이 관계 시ㆍ도 지사, 시장 또는 군수에게 그 사실을 통보하여야 한다.\n④ 광역계획권을 지정한 날부터 3년이 지날 때까지 관할 시장 또는 군수로부터 광역도시계획 의 승인 신청이 없는 경우 관할 도지사가 광역도시계획을 수립한다.", "2024-35-감정평가관계법규-3": "④ 도시ㆍ군관리계획의 입안을 제안받은 자는 제안자와 협의하여 제안된 도시ㆍ군관리 계획의 입안 및 결정에 필요한 비용의 전부 또는 일부를 제안자에게 부담시킬 수 있다.", "2024-35-감정평가관계법규-4": "제2종일반주거지역 : 중층주택을 중심으로 편리한 주거환경을 조성하기 위하여 필요한 지역", "2024-35-감정평가관계법규-5": "① 도시개발구역 등이 200만제곱미터를 초과하는 경우에는 해당 지역등에서 개발사업 을 시행하는 자는 공동구를 설치하여야 한다.\n② 가스관, 하수도관은 공동구협의회의 심의를 거쳐 수용할 수 있다.\n④ 부담금의 납부통지를 받은 공동구 점용예정자는 공동구설치공사가 착수되기 전에 부담액의 3분의 1 이상을 납부하여야 하며, 그 나머지 금액은 점용공사기간 만료일전까지 납부하여야 한다.\n⑤ 공동구관리자는 1년에 1회 이상 공동구의 안전점검을 실시하여야 한다.", "2024-35-감정평가관계법규-6": "개발행위허가의 기준이 되는 개발행위의 규모(토지의 형질변경면적)는 다음과 같다.\n1. 도시지역\n가. 주거지역ㆍ상업지역ㆍ자연녹지지역ㆍ생산녹지지역 : 1만제곱미터 미만\n나. 공업지역 : 3만제곱미터 미만\n다. 보전녹지지역 : 5천제곱미터 미만\n2. 관리지역 : 3만제곱미터 미만\n3. 농림지역 : 3만제곱미터 미만\n4. 자연환경보전지역 : 5천제곱미터 미만", "2024-35-감정평가관계법규-7": "ㄱ. 제2종전용주거지역 : 50%\nㄴ. 유통상업지역 : 80%\nㄷ. 일반공업지역 : 70%\nㄹ. 농림지역 : 20%", "2024-35-감정평가관계법규-8": "개발행위허가를 받은 자가 행정청인 경우 개발행위허가를 받은 자는 개발행위가 끝나 준공검사를 마친 때에는 해당 시설의 관리청에 공공시설의 종류와 토지의 세목(細目)을 통지 하여야 한다. 이 경우 공공시설은 그 통지한 날에 해당 시설을 관리할 관리청과 개발행위허가 를 받은 자에게 각각 귀속된 것으로 본다.", "2024-35-감정평가관계법규-9": "개발밀도관리구역에서는 용도지역에 적용되는 용적률의 최대한도의 50퍼센트 범위에서 용적률을 강화하여 적용한다.", "2024-35-감정평가관계법규-10": "성장관리계획구역에서는 다음의 구분에 따른 범위에서 성장관리계획으로 정하는 바에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 정하는 비율까지 건폐율 을 완화하여 적용할 수 있다.\n1. 계획관리지역: 50퍼센트 이하\n2. 생산관리지역ㆍ농림지역 및 대통령령으로 정하는 녹지지역: 30퍼센트 이하", "2024-35-감정평가관계법규-11": "① 용도지역을 도시ㆍ군관리계획결정으로 다시 세분하여 지정하거나 변경할 수 있다.\n② 하나의 시ㆍ도 안에서 둘 이상의 시ㆍ군에 걸쳐 지정되는 용도지역에 대해서는 도지사가 직접 도시ㆍ군관리계획을 입안할 수 있다.\n③ 공유수면(바다만 해당한다)의 매립 목적이 그 매립구역과 이웃하고 있는 용도지역의 내용 과 같으면 도시ㆍ군관리계획의 입안 및 결정 절차 없이 그 매립준공구역은 그 매립의 준공인 가일부터 이와 이웃하고 있는 용도지역으로 지정된 것으로 본다.\n⑤ 택지개발지구가 해제되는 경우(개발사업의 완료로 해제되는 경우는 제외한다) 이 법 또는 다른 법률에서 그 구역등이 어떤 용도지역에 해당되는지를 따로 정하고 있지 아니한 경우에는 이를 지정하기 이전의 용도지역으로 환원된 것으로 본다.", "2024-35-감정평가관계법규-12": "시가화조정구역에서 입목의 조림 또는 육림은 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별 자치도지사ㆍ시장 또는 군수의 허가를 받아 그 행위를 할 수 있다.", "2024-35-감정평가관계법규-13": "입지규제최소구역에 대하여는 다음의 법률 규정을 적용하지 아니할 수 있다.\n1. 「주택법」 제35조에 따른 주택의 배치, 부대시설ㆍ복리시설의 설치기준 및 대지조성기준\n2. 「주차장법」 제19조에 따른 부설주차장의 설치\n3. 「문화예술진흥법」 제9조에 따른 건축물에 대한 미술작품의 설치\n4. 「건축법」 제43조에 따른 공개 공지 등의 확보", "2024-35-감정평가관계법규-14": "표준주택가격 조사ㆍ산정을 의뢰받은 한국부동산원은 표준주택가격 및 다음의 사항을 조사ㆍ산정한 후 표준주택가격 조사ㆍ산정보고서를 작성하여 국토교통부장관에게 제출하여야 한다.\n1. 주택의 소재지, 공부상 지목 및 대지면적\n2. 주택 대지의 용도지역\n3. 도로접면\n4. 대지 형상\n5. 주건물 구조 및 층수\n6. 「건축법」에 따른 사용승인연도\n7. 주위 환경", "2024-35-감정평가관계법규-15": "비주거용 표준부동산가격의 공시에는 다음의 사항이 포함되어야 한다.\n1. 비주거용 표준부동산의 지번\n2. 비주거용 표준부동산가격\n3. 비주거용 표준부동산의 대지면적 및 형상\n4. 비주거용 표준부동산의 용도, 연면적, 구조 및 사용승인일(임시사용승인일을 포함한다)\n5. 그 밖에 대통령령으로 정하는 사항", "2024-35-감정평가관계법규-16": "① 60일 → 30일\n② 3.3제곱미터 → 1제곱미터\n③ 다음의 어느 하나에 해당하는 토지에 대해서는 개별공시지가를 결정ㆍ공시하지 아니할 수 있다.\n1. 표준지로 선정된 토지\n2. 농지보전부담금 또는 개발부담금 등의 부과대상이 아닌 토지\n3. 국세 또는 지방세 부과대상이 아닌 토지(국공유지의 경우에는 공공용 토지만 해당한다)\n⑤ 국고에서 보조할 수 있는 비용은 개별공시지가의 결정ㆍ공시에 드는 비용의 50퍼센트 이 내로 한다.", "2024-35-감정평가관계법규-17": "감정평가사에 대한 징계의 종류는 다음과 같다.\n1. 자격의 취소\n2. 등록의 취소\n3. 2년 이하의 업무정지\n4. 견책", "2024-35-감정평가관계법규-18": "장부나 서류 등의 검사를 거부, 방해 또는 기피한 경우의 행정처분 기준은 다음과 같다.\n• 1차 위반 : 업무정지 1개월\n• 2차 위반 : 업무정지 3개월\n• 3차 이상 위반 : 업무정지 6개월", "2024-35-감정평가관계법규-19": "교육연수의 대상자는 ‘등록의 취소’ 및 ‘2년 이하의 업무정지’의 징계를 받은 감정평가 사로 한다.", "2024-35-감정평가관계법규-20": "ㄱ. 기부채납이란 국가 외의 자가 제5조제1항 각 호에 해당하는 재산의 소유권을 무상 으로 국가에 이전하여 국가가 이를 취득하는 것을 말한다.\nㄴ. 변상금이란 사용허가나 대부계약 없이 국유재산을 사용ㆍ수익하거나 점유한 자에게 부과 하는 금액을 말한다.\nㄷ. 총괄청이란 기획재정부장관을 말한다.", "2024-35-감정평가관계법규-21": "정부기업이나 정부시설에서 사용하는 기계와 기구로서 해당 기업이나 시설의 폐지와 함께 포괄적으로 용도폐지된 것은 해당 기업이나 시설이 폐지된 후에도 국유재산으로 한다.", "2024-35-감정평가관계법규-22": "① 사용허가를 받은 자는 허가기간이 끝나거나 사용허가가 취소 또는 철회된 경우에는 그 재산을 원래 상태대로 반환하여야 한다. 다만, 중앙관서의 장이 미리 상태의 변경을 승인한 경우에는 변경된 상태로 반환할 수 있다.\n② 경작용으로 실경작자에게 사용허가를 하는 경우 수의의 방법으로 사용허가를 받을 자를 결 정할 수 있다.\n④ 행정재산의 사용허가에 관하여는 이 법에서 정한 것을 제외하고는 「국가를 당사자로 하는 계약에 관한 법률」의 규정을 준용한다.\n⑤ 행정재산의 사용허가를 받은 자가 그 재산에 대하여 유지ㆍ보수 외의 시설을 설치하려는 때에는 그 경비조서를 갖추어 소관 중앙관서의 장의 승인을 받아야 한다. (국유재산법 시행규 칙 제19조)", "2024-35-감정평가관계법규-23": "매각대금을 나누어 내게 하는 경우로서 공익사업의 원활한 시행 등을 위하여 소유권의 이전이 불가피하여 대통령령으로 정하는 경우에는 매각대금이 완납되기 전에 소유권을 이전할 수 있다. 대통령령으로 정하는 경우는 다음과 같다.\n1. 공공단체가 직접 비영리공익사업용으로 사용하려는 재산을 해당 공공단체에 매각하는 경우\n2. 「도시 및 주거환경정비법」에 따른 재개발사업을 시행하기 위한 정비구역에 있는 토지로서 사 유건물로 점유ㆍ사용되고 있는 토지를 재개발사업 사업시행계획인가 당시의 점유ㆍ사용자로부터 그 권리ㆍ의무를 승계한 자에게 매각하는 경우\n3. 지방자치단체에 그 지방자치단체가 직접 공용 또는 공공용 등의 용도로 사용하려는 재산을 매각 하는 경우\n4. 「도시 및 주거환경정비법」에 따른 재개발사업을 시행하기 위한 정비구역에 있는 토지로서 사 유건물로 점유ㆍ사용되고 있는 토지를 재개발사업 시행인가 당시의 점유ㆍ사용자에게 매각하는 경 우 국가가 매각재산을 일정기간 계속하여 점유ㆍ사용하는 경우 매각대금을 5년 이내의 기간에 걸쳐 나누어 내게 할 수 있으나, 매각대금이 완납되지 전에 소유권을 이전할 수 있는 경우에 는 해당하지 않는다.", "2024-35-감정평가관계법규-24": "기둥과 기둥 사이의 거리가 20미터 이상인 건축물이 특수구조 건축물이다.", "2024-35-감정평가관계법규-25": "장례시설은 산업 등 시설군에 속한다.", "2024-35-감정평가관계법규-26": "국토교통부장관 및 허가권자는 도로에 인접한 건축물의 건축을 통한 조화로운 도시경관 의 창출을 위하여 이 법 및 관계 법령에 따라 일부 규정을 적용하지 아니하거나 완화하여 적 용할 수 있도록 다음 각 호의 어느 하나에 해당하는 지구 또는 구역에서 대통령령으로 정하는 도로에 접한 대지의 일정 구역을 특별가로구역으로 지정할 수 있다.\n1. 경관지구\n2. 지구단위계획구역 중 미관유지를 위하여 필요하다고 인정하는 구역 대통령령으로 정하는 도로란 다음의 어느 하나에 해당하는 도로를 말한다.\n1. 건축선을 후퇴한 대지에 접한 도로로서 허가권자가 건축조례로 정하는 도로\n2. 허가권자가 리모델링 활성화가 필요하다고 인정하여 지정ㆍ공고한 지역 안의 도로\n3. 보행자전용도로로서 도시미관 개선을 위하여 허가권자가 건축조례로 정하는 도로\n4. 「지역문화진흥법」에 따른 문화지구 안의 도로\n5. 그 밖에 조화로운 도시경관 창출을 위하여 필요하다고 인정하여 국토교통부장관이 고시하거나 허가권자가 건축조례로 정하는 도로", "2024-35-감정평가관계법규-27": "가구ㆍ세대 등 간 소음 방지를 위하여 다음의 어느 하나에 해당하는 건축물의 층간바닥 (화장실의 바닥은 제외한다)은 국토교통부령으로 정하는 기준에 따라 설치해야 한다.\n1. 단독주택 중 다가구주택\n2. 공동주택\n3. 업무시설 중 오피스텔\n4. 제2종 근린생활시설 중 다중생활시설\n5. 숙박시설 중 다중생활시설", "2024-35-감정평가관계법규-28": "주유소용지는 ‘주’로 표기한다.", "2024-35-감정평가관계법규-29": "등록전환을 신청할 수 있는 경우는 다음과 같다.\n1. 「산지관리법」에 따른 산지전용허가ㆍ신고, 산지일시사용허가ㆍ신고, 「건축법」에 따른 건축허 가ㆍ신고 또는 그 밖의 관계 법령에 따른 개발행위 허가 등을 받은 경우\n2. 대부분의 토지가 등록전환되어 나머지 토지를 임야도에 계속 존치하는 것이 불합리한 경우\n3. 임야도에 등록된 토지가 사실상 형질변경되었으나 지목변경을 할 수 없는 경우\n4. 도시ㆍ군관리계획선에 따라 토지를 분할하는 경우", "2024-35-감정평가관계법규-30": "ㄷ. 지목변경을 신청할 수 있는 경우는 다음과 같다.\n1. 「국토의 계획 및 이용에 관한 법률」 등 관계 법령에 따른 토지의 형질변경 등의 공사가 준공 된 경우\n2. 토지나 건축물의 용도가 변경된 경우\n3. 도시개발사업 등의 원활한 추진을 위하여 사업시행자가 공사 준공 전에 토지의 합병을 신청하는 경우\nㄹ. 지적소관청이 지목변경을 하는 경우 시ㆍ도지사의 승인을 받을 필요가 없다. 지적소관청이 시ㆍ도지사 또는 대도시 시장의 승인을 받아야 하는 경우는 다음과 같다.\n1. 지번의 변경\n2. 지적공부의 반출\n3. 축척변경", "2024-35-감정평가관계법규-31": "① 토지대장에 소유자의 성명 또는 명칭, 주소 및 주민등록번호를 등록하여야 한다.\n② 공유지연명부에 토지소유자가 변경된 날과 그 원인을 등록하여야 한다.\n③ 지적공부에 등록하는 지번ㆍ지목ㆍ면적ㆍ경계 또는 좌표는 토지의 이동이 있을 때 토지소 유자의 신청을 받아 지적소관청이 결정한다. 다만, 신청이 없으면 지적소관청이 직권으로 조사 ㆍ측량하여 결정할 수 있다.\n④ 지적소관청은 지적공부에 등록된 토지가 지형의 변화 등으로 바다로 된 경우로서 원상(原 狀)으로 회복될 수 없거나 다른 지목의 토지로 될 가능성이 없는 경우에는 지적공부에 등록된 토지소유자에게 지적공부의 등록말소 신청을 하도록 통지하여야 한다.", "2024-35-감정평가관계법규-32": "① 법인 아닌 사단에 속하는 부동산의 등기에 관하여는 그 사단을 등기권리자 또는 등 기의무자로 한다.\n② 법인 아닌 사단의 등록번호는 시장, 군수 또는 구청장이 부여한다.\n③ 법인 아닌 사단이나 재단 명의의 등기를 할 때에는 그 대표자나 관리인의 성명, 주소 및 주민등록번호를 함께 기록하여야 한다.\n④ 법인 아닌 사단이나 재단은 전자신청을 할 수 없다.", "2024-35-감정평가관계법규-33": "② 등기관이 등기를 마친 후 사건이 그 등기소의 관할이 아닌 경우 또는 사건이 등기할 것이 아닌 경우에 해당된 것임을 발견하였을 때에는 등기권리자, 등기의무자와 등기상 이해관 계 있는 제3자에게 1개월 이내의 기간을 정하여 그 기간에 이의를 진술하지 아니하면 등기를 말소한다는 뜻을 통지하여야 한다.\n③ 권리의 변경이나 경정의 등기는 등기상 이해관계 있는 제3자의 승낙이 있는 경우에만 부 기로 한다. 환매특약등기는 제3자의 승낙 여부와 관계없이 부기로 한다.\n④ 미등기의 토지 또는 건물에 관한 소유권보존등기는 다음의 어느 하나에 해당하는 자가 신 청할 수 있다.\n1. 토지대장, 임야대장 또는 건축물대장에 최초의 소유자로 등록되어 있는 자 또는 그 상속인, 그 밖의 포괄승계인\n2. 확정판결에 의하여 자기의 소유권을 증명하는 자\n3. 수용으로 인하여 소유권을 취득하였음을 증명하는 자\n4. 특별자치도지사, 시장, 군수 또는 구청장의 확인에 의하여 자기의 소유권을 증명하는 자(건물의 경우로 한정) 매매계약서에 의하여 소유권을 증명하는 자는 소유권보존등기를 신청할 수 있는 자가 아니다.\n⑤ 이의에는 집행정지(執行停止)의 효력이 없다.", "2024-35-감정평가관계법규-34": "등기관이 등기사무를 처리한 때에는 등기사무를 처리한 등기관이 누구인지 알 수 있는 조치를 하여야 한다.", "2024-35-감정평가관계법규-35": "대지권이 등기된 구분건물의 등기기록에는 건물만에 관한 소유권이전등기 또는 저당권 설정등기, 그 밖에 이와 관련이 있는 등기를 할 수 없다.", "2024-35-감정평가관계법규-36": "① 여러 개의 동산(장래에 취득할 동산을 포함한다)이더라도 목적물의 종류, 보관장소, 수량을 정하거나 그 밖에 이와 유사한 방법으로 특정할 수 있는 경우에는 이를 목적으로 담보 등기를 할 수 있다.\n③ 담보권설정자와 담보권자는 존속기간을 갱신하려면 그 만료 전에 연장등기를 신청하여야 한다.\n④ 포괄승계로 인한 등기는 등기권리자 단독으로 신청할 수 있다.\n⑤ 담보목적물인 동산이 멸실된 경우 담보권설정자와 담보권자는 말소등기를 신청할 수 있다.", "2024-35-감정평가관계법규-37": "① 재개발사업이란 정비기반시설이 열악하고 노후ㆍ불량건축물이 밀집한 지역에서 주거 환경을 개선하거나 상업지역ㆍ공업지역 등에서 도시기능의 회복 및 상권활성화 등을 위하여 도시환경을 개선하기 위한 사업을 말한다.\n② 정비구역의 지정권자는 하나의 정비구역을 둘 이상의 정비구역으로 분할하여 지정할 수 있\n다.\n③ 재건축사업은 정비구역에서 인가받은 관리처분계획에 따라 주택, 부대시설ㆍ복리시설 및 오피스텔을 건설하여 공급하는 방법으로 한다.\n⑤ 재개발사업은 토지등소유자가 20인 미만인 경우에는 토지등소유자가 시행할 수 있다.", "2024-35-감정평가관계법규-38": "대통령령으로 정하는 경미한 사항을 변경하려는 때에는 총회의 의결 없이 시장ㆍ군수등 에게 신고하고 변경할 수 있다. 대통령령으로 정하는 경미한 사항이란 다음의 사항을 말한다.\n1. 착오ㆍ오기 또는 누락임이 명백한 사항\n2. 조합의 명칭 및 주된 사무소의 소재지와 조합장의 성명 및 주소(조합장의 변경이 없는 경우로 한정)\n3. 토지 또는 건축물의 매매 등으로 조합원의 권리가 이전된 경우의 조합원의 교체 또는 신규가입\n4. 조합임원 또는 대의원의 변경(총회의 의결 또는 대의원회의 의결을 거친 경우로 한정)\n5. 건설되는 건축물의 설계 개요의 변경\n6. 정비사업비의 변경\n7. 현금청산으로 인하여 정관에서 정하는 바에 따라 조합원이 변경되는 경우\n8. 정비구역 또는 정비계획의 변경에 따라 변경되어야 하는 사항. 다만, 정비구역 면적이 10퍼센트 이상의 범위에서 변경되는 경우는 제외한다.\n9. 그 밖에 시ㆍ도조례로 정하는 사항", "2024-35-감정평가관계법규-39": "① 광역시의 군수는 정비구역의 지정권자가 아니다. 광역시의 군수는 정비계획을 입안 하여 광역시장에게 정비구역 지정을 신청하여야 한다.\n② 건축물의 용도변경도 허가대상이다.\n③ 조합이 조합설립인가를 받은 날부터 3년이 되는 날까지 사업시행계획인가를 신청하지 아 니하는 경우 정비구역을 해제하여야 한다. 지정개발자가 시행자인 경우에는 해당되지 않는다.\n⑤ 정비구역등이 해제된 경우에는 정비계획으로 변경된 용도지역, 정비기반시설 등은 정비구 역 지정 이전의 상태로 환원된 것으로 본다.", "2024-35-감정평가관계법규-40": "② 매도청구에 대한 판결에 따라 관리처분계획을 변경하는 경우에는 경미한 사항의 변 경이므로 시장ㆍ군수등에게 신고하여야 한다.\n③ 사업시행자는 관리처분계획이 인가ㆍ고시된 다음 날부터 90일 이내에 분양신청을 하지 아 니한 자와 손실보상에 관한 협의를 하여야 한다.\n④ 재건축사업의 경우 시장ㆍ군수등이 선정ㆍ계약한 1인 이상의 감정평가법인등과 조합총회 의 의결로 선정ㆍ계약한 1인 이상의 감정평가법인등이 평가한 금액을 산술평균하여 산정한다.\n⑤ 사업시행자는 관리처분계획인가를 신청하기 전에 관계 서류의 사본을 30일 이상 토지등소 유자에게 공람하게 하고 의견을 들어야 한다. 시장ㆍ군수등이 직접 관리처분계획을 수립하는 경우에도 이를 준용한다.", "2025-36-감정평가관계법규-1": "시장 군수는 도지사의 승인을 받아야 한다.", "2025-36-감정평가관계법규-2": "성장관리계획, 개발밀도관리구역, 기반시설부담구역은 도시·군관리계획이 아니다. 도시·군관리계획(제2조 정의)\n가. 용도지역ㆍ용도지구의 지정 또는 변경에 관한 계획\n나. 개발제한구역, 도시자연공원구역, 시가화조정구역(市街化調整區域), 수산자원보호구역 의 지정 또는 변경에 관한 계획\n다. 기반시설의 설치ㆍ정비 또는 개량에 관한 계획\n라. 도시개발사업이나 정비사업에 관한 계획\n마. 지구단위계획구역의 지정 또는 변경에 관한 계획과 지구단위계획\n바. 삭제 <2024. 2. 6.>\n사. 도시혁신구역의 지정 또는 변경에 관한 계획과 도시혁신계획\n아. 복합용도구역의 지정 또는 변경에 관한 계획과 복합용도계획\n자. 도시ㆍ군계획시설입체복합구역의 지정 또는 변경에 관한 계획", "2025-36-감정평가관계법규-3": "법 제26조 제3항 개발진흥지구 중 공업기능 또는 유통물류기능 등을 집중적으로 개발ㆍ정비하기 위한 개발진흥 지구로서 산업ㆍ유통개발진흥지구\n① 생활권 계획 포함(25조1항).\n③ 개발제한구역은 국토교통부장관이 지정한다.\n④ 도시ㆍ군관리계획 결정의 효력은 지형도면을 고시한 날부터 발생한다.\n⑤ 시장 또는 군수가 결정할 수 있는 경우이다. - 시장 또는 군수가 입안한 지구단위계획구역의 지정ㆍ변경과 지구단위계획의 수립ㆍ변경 에 관한 도시ㆍ군관리계획 - 지구단위계획으로 대체하는 용도지구 폐지에 관한 도시ㆍ군관리계획[해당 시장(대도시 시장은 제외한다) 또는 군수가 도지사와 미리 협의한 경우에 한정한다]", "2025-36-감정평가관계법규-4": "동의대상에 국공유지를 포함하는 경우는 없다, 국공유지는 제외된다.", "2025-36-감정평가관계법규-5": "모두 도시·군관리계획없이 설치할 수 있는 시설이다.\n※ 도시⋅군관리계획으로 미리 결정하지 않고 시행할 수 있는 기반시설\n1. 도시지역 또는 지구단위계획구역에서 다음 각 목의 기반시설을 설치하고자 하는 경우\n⋅\n가. 주차장, 차량 검사 및 면허시설, 공공공지, 열공급설비, 방송 통신시설, 시장 공공청사 ⋅ ⋅\n⋅ ⋅ ⋅ 문화시설 공공필요성이 인정되는 체육시설 연구시설 사회복지시설 공공직업 훈련시 ⋅\n⋅ ⋅ ⋅ ⋅ ⋅ ⋅ 설 청소년수련시설 저수지 방화설비 방풍설비 방수설비 사방설비 방조설비 장 ⋅ ⋅ 사시설⋅종합의료시설⋅빗물저장 및 이용시설⋅폐차장\n나. ｢도시공원 및 녹지 등에 관한 법률｣의 규정에 의하여 점용허가대상이 되는 공원안의 기반시설\n다. 그 밖에 국토교통부령으로 정하는 시설 ｢ ｣\n1. 공항 중 공항시설법 시행령 제3조 제3호의 규정에 의한 도심공항터미널\n2. 삭제 <2016.12.30.>\n3. 여객자동차터미널 중 전세버스운송사업용 여객자동차터미널\n4. 광장 중 건축물부설광장\n5. 전기공급설비(발전시설, 옥외에 설치하는 변전시설 및 지상에 설치하는 전압 15만 4 천볼트 이상의 송전선로는 제외한다) ｢ ⋅ ⋅ ｣\n5의2. 신에너지 및 재생에너지 개발 이용 보급 촉진법 제2조 제3호에 따른 신 재생 ⋅ 에너지설비로서 다음 각 목의 어느 하나에 해당하는 설비 ｢ ⋅ ⋅\n가. 신에너지 및 재생에너지 개발 이용 보급 촉진법 시행규칙 제2조 제2호에 따 ｣ 른 연료전지 설비 및 같은 조 제4호에 따른 태양에너지 설비 ｢ ⋅ ⋅ ｣\n나. 신에너지 및 재생에너지 개발 이용 보급 촉진법 시행규칙 제2조 제1호, 제3호 및 제5호부터 제12호까지에 해당하는 설비로서 발전용량이 200킬로와트 이하인 설비(전용주거지역 및 일반주거지역 외의 지역에 설치하는 경우로 한정한다)\n6. 다음 각 목의 어느 하나에 해당하는 가스공급설비 ｢ ｣\n가. 액화석유가스의 안전관리 및 사업법 제5조 제1항에 따라 액화석유가스충전사업 의 허가를 받은 자가 설치하는 액화석유가스 충전시설 ｢ ｣\n나. 도시가스사업법 제3조에 따라 도시가스사업의 허가를 받은 자 또는 같은 법 제 39조의2 제1항 각 호 외의 부분 전단에 따른 도시가스사업자 외의 가스공급시설 설치자가 설치하는 같은 법 제2조 제5호에 따른 가스공급시설 ｢ ｣\n다. 환경친화적 자동차의 개발 및 보급 촉진에 관한 법률 제2조 제9호에 따른 수소 연료공급시설 ｢ ｣\n라. 고압가스 안전관리법 제3조 제1호에 따른 저장소로서 자기가 직접 다음의 어느 하나의 용도로 소비할 목적으로 고압가스를 저장하는 저장소\n1) 발전용 : 전기( 電氣)를 생산하는
