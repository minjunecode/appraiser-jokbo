<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감정평가사 기출 퀴즈</title>
<style>
:root {
  --header-bg:#2c3e5d;--header-text:#fff;--body-bg:#FAFAF8;
  --sidebar-bg:#f0ede8;--sidebar-border:#ddd8d0;
  --accent:#4080b0;--accent-hover:#306090;--accent-light:#eaf1f7;
  --correct:#3a7a4a;--correct-light:#d4edda;--correct-border:#b5d8bd;
  --incorrect:#b85450;--incorrect-light:#f8d7da;--incorrect-border:#e8b4b2;
  --card-bg:#ffffff;--card-border:#e0dbd4;--card-shadow:0 1px 4px rgba(60,50,40,0.07);
  --text-primary:#2c3e5d;--text-secondary:#555555;--text-muted:#9a958c;
  --chip-bg:#e8f0f8;--chip-text:#2c5080;
  --font-stack:'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif;
  --sidebar-width:296px;
  --star-color:#e8a020;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --header-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-stack);background:var(--body-bg);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* HEADER */
header{
  background:var(--header-bg);color:var(--header-text);
  padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  height:var(--header-h);position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.header-left{display:flex;flex-direction:column;gap:2px;}
header h1{font-size:1rem;font-weight:700;letter-spacing:-0.02em;line-height:1.2;}
.header-sub{font-size:0.7rem;opacity:0.7;letter-spacing:0.01em;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
#mobile-sidebar-btn{
  display:none;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
  color:#fff;padding:6px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.79rem;
  font-family:var(--font-stack);transition:background 0.15s;
}
#mobile-sidebar-btn:hover{background:rgba(255,255,255,0.2);}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - var(--header-h));}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar-width);min-width:var(--sidebar-width);
  background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
  overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:#d0d8e4 transparent;
}
#sidebar::-webkit-scrollbar{width:5px;}
#sidebar::-webkit-scrollbar-track{background:transparent;}
#sidebar::-webkit-scrollbar-thumb{background:#d0d8e4;border-radius:10px;}

/* Single panel (no tabs) */
.sidebar-panel{flex:1;overflow-y:auto;padding:16px 14px 20px;}

/* Filter section */
.filter-section{margin-bottom:18px;}
.filter-label{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.year-btns{display:flex;flex-wrap:wrap;gap:5px;}
.yr-btn{
  background:transparent;border:1.5px solid var(--card-border);border-radius:20px;
  padding:4px 12px;font-size:0.76rem;cursor:pointer;color:var(--text-secondary);
  transition:all 0.15s;font-family:var(--font-stack);font-weight:500;
}
.yr-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.yr-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
#lec-select{
  width:100%;padding:7px 10px;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  font-size:0.79rem;font-family:var(--font-stack);color:var(--text-primary);
  background:var(--card-bg);cursor:pointer;outline:none;transition:border-color 0.15s;
}
#lec-select:focus{border-color:var(--accent);}
/* scrap filter */
.scrap-filter-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
.scrap-toggle-label{font-size:0.8rem;cursor:pointer;color:var(--text-secondary);user-select:none;display:flex;align-items:center;gap:5px;}
.scrap-toggle-label input{cursor:pointer;accent-color:var(--accent);}

.scope-bar{
  background:var(--accent-light);border:1px solid #c8dff4;border-radius:var(--radius-sm);
  padding:9px 11px;font-size:0.77rem;color:var(--text-secondary);margin-bottom:12px;
  line-height:1.8;
}
.scope-bar b{color:var(--text-primary);}

.sidebar-actions{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.action-btn{
  width:100%;padding:8px 12px;background:var(--header-bg);color:#fff;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;font-family:var(--font-stack);
  font-weight:600;transition:all 0.15s;letter-spacing:0.01em;
}
.action-btn:hover{background:var(--accent-hover);}
.action-btn.secondary{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.action-btn.secondary.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;}
.action-btn.shuffle-btn{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.shuffle-btn.active{
  background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;
}
.action-btn.shuffle-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.action-btn.clear-btn{background:transparent;color:#9a5b3b;border:1.5px solid #e0c4b0;font-weight:500;}
.action-btn.clear-btn:hover{border-color:#c2603a;color:#fff;background:#c2603a;}

/* Backup / Restore */
/* Current user panel */
.user-box{margin-bottom:14px;padding:11px;border:1px solid var(--sidebar-border);border-radius:var(--radius-sm);background:rgba(0,0,0,0.015);}
.user-line{font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;}
.user-line b{color:var(--accent);font-weight:700;}
.user-switch{width:100%;padding:7px 10px;background:#fff;color:var(--text-secondary);border:1.5px solid var(--card-border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.76rem;font-family:var(--font-stack);font-weight:600;}
.user-switch:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.user-hint{font-size:0.66rem;color:var(--text-muted);line-height:1.5;margin-top:7px;}
/* Identity prompt modal */
.id-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.id-modal.show{display:flex;}
.id-card{background:#fff;border-radius:14px;padding:28px 26px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
.id-title{font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-bottom:6px;}
.id-sub{font-size:0.78rem;color:var(--text-muted);margin-bottom:18px;line-height:1.5;}
.id-btns{display:flex;flex-direction:column;gap:10px;}
.id-btn{padding:13px;border:1.5px solid var(--card-border);border-radius:10px;background:#fff;color:var(--text-primary);font-family:var(--font-stack);font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.12s;}
.id-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

/* Divider */
.sidebar-divider{height:1px;background:var(--sidebar-border);margin:14px 0;}

/* Inline index list (inside filter panel) */
.idx-header{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.idx-scope-inline{
  font-size:0.75rem;color:var(--text-secondary);margin-bottom:8px;padding:7px 9px;
  background:var(--card-bg);border-radius:var(--radius-sm);border:1px solid var(--card-border);
  line-height:1.6;
}
.idx-scope-inline b{color:var(--text-primary);}
.idx-list{display:flex;flex-direction:column;gap:2px;}
.idx-item{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:0.76rem;color:var(--text-primary);transition:background 0.12s;
  text-decoration:none;border:none;background:transparent;font-family:var(--font-stack);
  text-align:left;width:100%;
}
.idx-item:hover{background:var(--accent-light);}
.idx-item.idx-current{background:rgba(42,114,181,0.15);font-weight:600;}
.idx-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#d0d8e4;
}
.idx-dot.dot-correct{background:var(--correct);}
.idx-dot.dot-wrong{background:var(--incorrect);}
.idx-dot.dot-scrap{background:var(--star-color);}
.idx-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* MAIN */
#main{flex:1;padding:20px 22px;max-width:880px;overflow-x:hidden;}
.stats-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.stat-chip{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;
  padding:4px 14px;font-size:0.76rem;color:var(--text-secondary);
  box-shadow:var(--card-shadow);
}
.stat-chip b{color:var(--text-primary);}

/* QUESTION CARDS FEED */
#feed{display:flex;flex-direction:column;gap:18px;}
#no-results{text-align:center;color:var(--text-muted);margin-top:80px;font-size:0.95rem;display:none;line-height:2;}

/* SINGLE CARD */
.q-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--card-shadow);
  scroll-margin-top:64px;transition:box-shadow 0.15s;
}
.q-card:hover{box-shadow:0 3px 12px rgba(20,50,90,0.11);}
.q-card-header{
  background:linear-gradient(135deg,#f5f3ef 0%,#ede9e4 100%);
  padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;
  border-bottom:1px solid var(--card-border);
}
.q-card-header-inner{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;}
.meta-tag{
  font-size:0.67rem;font-weight:700;padding:2px 9px;border-radius:12px;
  letter-spacing:0.02em;line-height:1.5;
}
.tag-year{background:var(--header-bg);color:#fff;}
.tag-lec{background:var(--chip-bg);color:var(--chip-text);}
.tag-prof{background:#f0e8f5;color:#5a3270;}
.tag-qnum{background:#f5f0e6;color:#6a4c20;}
.tag-recovered{background:#fff8cc;color:#7a5a00;}

/* Star button: ☆/★ */
.scrap-btn{
  margin-left:auto;background:transparent;border:none;cursor:pointer;
  font-size:1.2rem;line-height:1;padding:2px 5px;border-radius:4px;
  transition:transform 0.15s,color 0.15s;flex-shrink:0;color:#c8d0da;
}
.scrap-btn:hover{transform:scale(1.25);}
.scrap-btn.starred{color:var(--star-color);}

.q-card-body{padding:18px 18px 14px;}
.q-stem{
  font-size:0.91rem;line-height:1.75;color:var(--text-primary);
  margin-bottom:14px;font-weight:500;white-space:pre-wrap;word-break:break-word;
}
/* stem table */
.stem-table-wrap{margin-bottom:14px;overflow-x:auto;}
.stem-table{width:100%;border-collapse:collapse;font-size:0.81rem;}
.stem-table th{
  background:var(--header-bg);color:#fff;padding:6px 10px;
  text-align:center;font-weight:600;border:1px solid #2a5070;
}
.stem-table td{
  border:1px solid #d0dce8;padding:5px 10px;text-align:center;background:#f7fafd;
}
.stem-table tr:nth-child(even) td{background:#eef4fa;}
/* image */
.q-image{margin-bottom:14px;text-align:center;}
.q-image img{max-width:100%;max-height:320px;border-radius:var(--radius-sm);border:1px solid var(--card-border);object-fit:contain;background:#f4f6f8;cursor:zoom-in;transition:filter 0.12s;}
.q-image img:hover{filter:brightness(0.94);}
.img-placeholder{display:inline-block;padding:8px 16px;background:#f4f6f8;border:1px dashed #c8d0da;border-radius:var(--radius-sm);color:var(--text-muted);font-size:0.8rem;}

/* choices */
.choices{display:flex;flex-direction:column;gap:7px;}
.choice-btn{
  background:#fafbfc;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  padding:10px 13px;text-align:left;cursor:pointer;font-size:0.86rem;line-height:1.55;
  color:var(--text-primary);transition:all 0.15s;font-family:var(--font-stack);
  display:flex;align-items:flex-start;gap:9px;width:100%;
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);}
.choice-num{font-weight:700;font-size:0.77rem;color:var(--accent);flex-shrink:0;min-width:18px;margin-top:1px;}
/* CORRECT = green */
.choice-btn.correct-ans{background:var(--correct-light);border-color:var(--correct-border);color:#154530;font-weight:600;}
.choice-btn.correct-ans .choice-num{color:var(--correct);}
/* MY WRONG = light red */
.choice-btn.my-wrong-ans{background:var(--incorrect-light);border-color:var(--incorrect-border);color:#7a1820;}
.choice-btn.my-wrong-ans .choice-num{color:var(--incorrect);}
.choice-btn:disabled{cursor:default;}

/* answer reveal */
.answer-reveal{
  margin-top:14px;padding:11px 15px;
  background:linear-gradient(135deg,#f0faee 0%,#e5f5e0 100%);
  border:1px solid var(--correct-border);border-radius:var(--radius-sm);display:none;
  font-size:0.83rem;color:#154530;line-height:1.65;
}
.answer-reveal.show{display:block;}
.answer-reveal.wrong{background:linear-gradient(135deg,#fdf1f0 0%,#fce8e7 100%);border-color:var(--incorrect-border);color:#7a1820;}
.ans-label{font-weight:700;font-size:0.73rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--correct);margin-bottom:3px;}
.answer-reveal.wrong .ans-label{color:var(--incorrect);}

/* EXPLANATION — hidden until answered */
.expl-section{
  margin-top:12px;border-top:1px solid var(--card-border);padding-top:12px;
  display:none;
}
.expl-section.expl-visible{display:block;}
.expl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.expl-title{font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;}
.expl-actions{display:flex;gap:5px;}
.expl-edit-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid var(--card-border);background:transparent;color:var(--text-secondary);
  font-family:var(--font-stack);transition:all 0.12s;
}
.expl-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.expl-revert-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid #e0b870;background:transparent;color:#8a5c18;
  font-family:var(--font-stack);transition:all 0.12s;display:none;
}
.expl-revert-btn.show{display:inline-block;}
.expl-revert-btn:hover{background:#fff5e0;}
.expl-text{font-size:0.84rem;line-height:1.75;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;}
.expl-text.placeholder{color:var(--text-muted);font-style:italic;}
.expl-textarea{
  width:100%;min-height:80px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);
  padding:8px 10px;font-size:0.84rem;line-height:1.6;font-family:var(--font-stack);
  color:var(--text-primary);resize:vertical;outline:none;
  display:none;background:#fafcff;
}
.expl-save-btn{
  display:none;margin-top:6px;padding:6px 16px;background:var(--accent);
  color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;
  font-family:var(--font-stack);font-weight:600;transition:background 0.15s;
}
.expl-save-btn:hover{background:var(--accent-hover);}
.expl-paste-hint{font-size:0.72rem;color:var(--text-muted);margin-top:6px;display:none;line-height:1.5;}
.expl-paste-hint.show{display:block;}
.expl-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.expl-img-wrap{position:relative;display:inline-block;}
.expl-img{max-width:100%;max-height:340px;border:1px solid var(--card-border);border-radius:6px;cursor:zoom-in;display:block;}
.expl-img-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;font-size:0.78rem;line-height:1;cursor:pointer;padding:0;}
.expl-img-del:hover{background:rgba(184,84,80,0.95);}
/* Tabs (해설 / 메모1 / 메모2) */
.tab-bar{display:flex;align-items:center;gap:4px;border-bottom:1.5px solid var(--card-border);margin-bottom:10px;flex-wrap:wrap;}
.tab-btn{font-size:0.78rem;padding:6px 13px;border:none;background:transparent;color:var(--text-secondary);font-family:var(--font-stack);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all 0.12s;}
.tab-btn:hover{color:var(--accent);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;}
.tab-dot.memo1{background:#d98a3d;} .tab-dot.memo2{background:#3d7fd9;}
.sync-pill{margin-left:auto;font-size:0.64rem;font-weight:600;padding:2px 7px;border-radius:9px;white-space:nowrap;}
.sync-pill.on{color:#2f7a44;background:#e7f4ec;} .sync-pill.off{color:#9a3b38;background:#f7e9e8;}
.tab-pane{}
.tab-pane[hidden]{display:none;}
.memo-empty{font-size:0.82rem;color:var(--text-muted);font-style:italic;line-height:1.7;}
.memo-hint{font-size:0.68rem;color:var(--text-muted);margin-bottom:7px;line-height:1.5;}
.expl-textarea.memo-live{display:block;min-height:90px;background:#fff;}
.expl-textarea.memo-live:focus{border-color:var(--accent);background:#fafcff;}
.memo-status{font-size:0.68rem;margin-top:5px;min-height:1em;line-height:1.4;}
.memo-status.saving{color:var(--text-muted);}
.memo-status.ok{color:#2f7a44;}
.memo-status.err{color:#9a3b38;}
.offline-note{font-size:0.7rem;color:#9a3b38;background:#f7e9e8;border-radius:5px;padding:6px 9px;margin-top:7px;line-height:1.5;}
.scrap-area{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.scrap-who{font-size:0.66rem;font-weight:700;color:#b8860b;background:#fdf6e3;border:1px solid #ecdca0;border-radius:9px;padding:2px 7px;white-space:nowrap;}
.img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;cursor:zoom-out;}
.img-lightbox.show{display:flex;}
.img-lightbox img{width:96vw;height:92vh;object-fit:contain;border-radius:6px;}

/* MOBILE */
@media(max-width:767px){
  #mobile-sidebar-btn{display:block;}
  .layout{flex-direction:column;}
  #sidebar{
    position:fixed;top:0;left:-310px;width:300px;height:100vh;
    z-index:200;transition:left 0.25s ease;box-shadow:4px 0 20px rgba(0,0,0,0.2);
  }
  #sidebar.open{left:0;}
  .sidebar-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:199;
  }
  .sidebar-overlay.visible{display:block;}
  #main{padding:12px 13px;max-width:100%;}
}
/* HEADER CONTROLS (과목·사용자 변경) */
.hdr-select{font-family:var(--font-stack);font-size:0.74rem;font-weight:600;padding:5px 7px;border-radius:6px;border:1px solid rgba(255,255,255,0.32);background:rgba(255,255,255,0.13);color:#fff;cursor:pointer;max-width:160px;}
.hdr-select option{color:#222;}
.hdr-user-btn{font-family:var(--font-stack);font-size:0.74rem;font-weight:700;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.32);background:rgba(255,255,255,0.13);color:#fff;cursor:pointer;white-space:nowrap;}
.hdr-user-btn:hover,.hdr-select:hover{background:rgba(255,255,255,0.24);}
/* TOP VIEW TABS */
#top-tabs{display:flex;gap:0;background:var(--sidebar-bg);border-bottom:1px solid var(--sidebar-border);padding:0 14px;position:sticky;top:var(--header-h);z-index:90;}
.top-tab{font-size:0.86rem;font-weight:700;font-family:var(--font-stack);padding:11px 18px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;transition:all 0.12s;}
.top-tab:hover{color:var(--accent);}
.top-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
/* PROGRESS DASHBOARD */
#progress-view{max-width:1000px;margin:0 auto;padding:22px 18px 60px;}
.prog-title{font-size:1.05rem;font-weight:700;color:var(--text-primary);margin-bottom:4px;}
.prog-sub{font-size:0.8rem;color:var(--text-muted);margin-bottom:18px;line-height:1.6;}
.prog-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.prog-sum-chip{background:var(--chip-bg);color:var(--chip-text);border-radius:var(--radius-sm);padding:8px 14px;font-size:0.84rem;font-weight:600;}
.prog-table{width:100%;border-collapse:collapse;font-size:0.84rem;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-md);overflow:hidden;}
.prog-table th{background:var(--sidebar-bg);color:var(--text-primary);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--sidebar-border);font-size:0.78rem;}
.prog-table td{padding:9px 12px;border-bottom:1px solid #efece6;vertical-align:middle;}
.prog-table tr:last-child td{border-bottom:none;}
.prog-table tbody tr:hover td{background:#faf8f4;}
.prog-lec{font-weight:600;color:var(--text-primary);}
.prog-num{text-align:center;white-space:nowrap;}
.prog-done-full{color:var(--correct);font-weight:700;}
.prog-bar{position:relative;height:8px;background:#eceae4;border-radius:5px;overflow:hidden;min-width:70px;}
.prog-bar>span{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:5px;transition:width 0.2s;}
.prog-bar.full>span{background:var(--correct);}
.prog-prof{color:var(--text-secondary);white-space:nowrap;font-size:0.8rem;}
.prog-cell-prog{display:flex;align-items:center;gap:8px;}
.prog-pct{font-size:0.78rem;color:var(--text-secondary);min-width:32px;}
.prog-sim{font-weight:700;}
.prog-sim.hi{color:#1f9d57;}
.prog-sim.mid{color:#c2a200;}
.prog-sim.lo{color:#c0392b;}
.prog-sim.na{color:#cfccc6;font-weight:600;}
.meta-input{padding:4px 6px;border:1px solid var(--card-border);border-radius:5px;font-family:var(--font-stack);font-size:0.8rem;text-align:center;background:#fff;}
.date-input{width:80px;}
.sim-input{width:56px;}
.meta-input:focus{border-color:var(--accent);outline:none;background:#fafcff;}
.meta-saved{font-size:0.7rem;margin-left:4px;}
.prog-table-wrap{overflow-x:auto;}
/* 유사문항 묶음(캐러셀) */
.qbundle{border:1.5px solid var(--accent);border-radius:var(--radius-lg);background:var(--card-bg);margin-bottom:18px;overflow:hidden;box-shadow:0 2px 10px rgba(64,128,176,0.12);}
.qbundle-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 15px;background:var(--accent-light);border-bottom:1px solid var(--card-border);font-size:0.82rem;font-weight:700;color:var(--accent);}
.qbundle-counter{font-weight:600;color:var(--text-secondary);font-size:0.76rem;white-space:nowrap;}
.qbundle-track{position:relative;}
.qbundle-track>.q-card{margin:0;border:none;box-shadow:none;border-radius:0;animation:bundleFade 0.22s ease;}
@keyframes bundleFade{from{opacity:0.35;transform:translateX(8px);}to{opacity:1;transform:none;}}
.qbundle-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--card-border);background:#fbfaf7;}
.qbundle-arrow{font-family:var(--font-stack);font-size:0.82rem;font-weight:700;padding:6px 14px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:#fff;color:var(--accent);cursor:pointer;transition:all 0.12s;}
.qbundle-arrow:hover{background:var(--accent);color:#fff;}
.qbundle-dots{display:flex;gap:7px;align-items:center;}
.qbundle-dot{width:9px;height:9px;border-radius:50%;background:#d3d0ca;cursor:pointer;transition:background 0.12s;}
.qbundle-dot.on{background:var(--accent);}
/* 오분류 의심 배지 */
.tag-misclass{background:#fff3e0;color:#b35900;border:1px solid #e0a060;font-weight:700;cursor:help;}
.tag-misimg{background:#fde7e7;color:#b03030;border:1px solid #e09090;font-weight:700;cursor:help;}
.misclass-note{margin:8px 0 0;padding:8px 11px;background:#fff7ec;border:1px solid #e8c79a;border-radius:var(--radius-sm);font-size:0.78rem;color:#8a5a1a;line-height:1.55;}
@media(max-width:767px){
  #top-tabs{top:var(--header-h);overflow-x:auto;}
  .top-tab{padding:11px 13px;font-size:0.8rem;white-space:nowrap;}
  #progress-view{padding:16px 10px 50px;}
  .prog-table{font-size:0.78rem;min-width:660px;}
  .prog-table th,.prog-table td{padding:7px 6px;}
  .date-input{width:72px;}
  .sim-input{width:50px;}
  header h1{font-size:0.86rem;}
  .hdr-select{max-width:118px;font-size:0.7rem;}
  .hdr-user-btn{font-size:0.7rem;padding:5px 7px;}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>감정평가사 기출 퀴즈</h1>
    <div class="header-sub">감정평가사 1차 기출 · 2008~2026</div>
  </div>
  <div class="header-right">
    <select id="term-select" class="hdr-select" onchange="setTerm(this.value)" title="과목" aria-label="과목" style="display:none">
      <option value="all">전체 과목</option>
      <option value="1">대사와 내분비 1차</option>
      <option value="2">대사와 내분비 2차</option>
    </select>
    <button id="user-switch-btn" class="hdr-user-btn" onclick="showIdentityPrompt()" title="사용자 변경" aria-label="사용자 변경">👤 <span id="hdr-user">선택</span> ▾</button>
    <button id="mobile-sidebar-btn" onclick="toggleSidebar()">☰</button>
  </div>
</header>

<nav id="top-tabs" aria-label="화면 전환">
  <button class="top-tab active" id="toptab-quiz" onclick="switchView('quiz')">📋 문제 풀이</button>
  <button class="top-tab" id="toptab-progress" onclick="switchView('progress')">📊 풀이 진척도 확인</button>
</nav>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <!-- SIDEBAR -->
  <nav id="sidebar" aria-label="필터 및 문항목록">
    <div class="sidebar-panel">
      <!-- YEAR FILTER -->
      <div class="filter-section">
        <span class="filter-label">연도</span>
        <div class="year-btns" id="year-btns"><button class="yr-btn active" data-year="all" onclick="setYear('all')">전체</button></div>
      </div>
      <!-- LECTURE FILTER (with lecture number prefix) -->
      <div class="filter-section">
        <span class="filter-label">과목</span>
        <select id="lec-select" onchange="setLecture(this.value)"><option value="all">전체 과목</option><option value="민법">민법</option></select>
      </div>
      <!-- SCRAP FILTER -->
      <div class="filter-section">
        <span class="filter-label">스크랩</span>
        <label class="scrap-filter-row">
          <input type="checkbox" id="scrap-only-chk" onchange="setScrapOnly(this.checked)">
          <span class="scrap-toggle-label">★ 스크랩만 보기</span>
        </label>
      </div>
      <!-- SCOPE BAR -->
      <div class="scope-bar" id="scope-bar">로딩 중...</div>
      <!-- ACTION BUTTONS -->
      <div class="sidebar-actions">
        <button class="action-btn secondary" id="hide-btn" onclick="toggleHideAnswers()">🙈 풀이 숨기기</button>
        <button class="action-btn shuffle-btn" id="shuffle-btn" onclick="toggleShuffle()">↕ 랜덤 순서</button>
        <button class="action-btn clear-btn" id="clear-btn" onclick="clearScopeAnswers()">🗑 이 강의 풀이 지우기</button>
      </div>

      <!-- CURRENT USER -->
      <div class="user-box">
        <div class="user-line">현재 사용자: <b id="user-name">—</b></div>
        <button class="user-switch" onclick="showIdentityPrompt()">사용자 변경</button>
        <div class="user-hint">풀이 진도·스크랩이 이름별로 서버에 저장됩니다.</div>
      </div>

      <!-- DIVIDER -->
      <div class="sidebar-divider"></div>

      <!-- INLINE INDEX LIST -->
      <span class="idx-header">문항 목록</span>
      <div class="idx-scope-inline" id="idx-scope">로딩 중...</div>
      <div class="idx-list" id="idx-list"></div>
    </div>
  </nav>

  <!-- MAIN FEED -->
  <main id="main">
    <div class="stats-bar">
      <div class="stat-chip">표시 <b id="stat-shown">0</b>문항</div>
      <div class="stat-chip">정답 <b id="stat-correct" style="color:var(--correct)">0</b></div>
      <div class="stat-chip">오답 <b id="stat-wrong" style="color:var(--incorrect)">0</b></div>
    </div>
    <div id="no-results">해당 조건의 문항이 없습니다.</div>
    <div id="feed"></div>
  </main>
</div>

<div id="progress-view" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════════

const QUESTIONS = [{"id": "2020-31-민법-1", "year": 2020, "qnum": 1, "curr_lec_no": "민법", "curr_lecture": "", "professor": "31회", "stem": "법원(法源)에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", "stem_table": null, "options": ["사회구성원이 관습법으로 승인된 관행의 법적 구속력을 확신하지 않게 된 때에는 그 관습법은 효력을 잃는다.", "헌법의 기본권은 특별한 사정이 없으면 사법관계에 직접 적용된다.", "법원은 당사자의 주장ㆍ증명을 기다림이 없이 관습법을 직권으로 조사ㆍ확정하여야 한다.", "우리나라가 가입한 국제조약은 일반적으로 민법이나 상법 또는 국제사법보다 우선적으로 적용된다.", "관습법은 법령에 저촉되지 아니하는 한 법칙으로서의 효력이 있다."], "answer": [2], "image": null}, {"id": "2020-31-민법-2", "year": 2020, "qnum": 2, "curr_lec_no": "민법", "curr_lecture": "", "professor": "31회", "stem": "미성년자의 행위능력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", "stem_table": null, "options": ["행위능력제도는 자기책임의 원칙을 구현하여 거래의 안전을 도모하기 위한 것이다.", "미성년자가 그 소유의 부동산을 그의 친권자에게 증여하고 소유권이전등기를 마친 경우, 다른 사정이 없으면 적법한 절차를 거친 등기로 추정된다.", "친권자는 그의 미성년 자(子)의 이름으로 체결한 계약을 자(子)가 미성년임을 이유로 취소할 수 있다.", "친권자가 그의 친구의 제3자에 대한 채무를 담보하기 위하여 미성년 자(子) 소유의 부동산에 담보를 설정하는 행위는 이해상반행위이다.", "미성년자가 타인을 대리할 때에는 법정대리인의 동의를 얻어야 한다."], "answer": [2], "image": null}, {"id": "2020-31-민법-3", "year": 2020, "qnum": 3, "curr_lec_no": "민법", "curr_lecture": "", "professor": "31회", "stem": "권리주체에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", "stem_table": null, "options": ["의사능력은 자신의 행위의 의미와 결과를 합리적으로 판단할 수 있는 정신적 능력으로 구체적인 법률행위와 관련하여 개별적으로 판단되어야 한다.", "어떤 법률행위가 일상적인 의미만으로 알기 어려운 특별한 법률적 의미나 효과를 가진 경우, 이를 이해할 수 있을 때 의사능력이 인정된다.", "현행 민법은 태아의 권리능력에 관하여 일반적 보호주의를 취한다.", "태아의 상태에서는 법정대리인이 있을 수 없고, 법정대리인에 의한 수증행위도 할 수 없다.", "피상속인과 그의 직계비속 또는 형제자매가 동시에 사망한 것으로 추정되는 경우에도 대습상속이 인정된다."], "answer": [3], "image": null}, {"id": "2020-31-민법-4", "year": 2020, "qnum": 4, "curr_lec_no": "민법", "curr_lecture": "", "professor": "31회", "stem": "부재자의 재산관리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", "stem_table": null, "options": ["부재자가 스스로 위임한 재산관리인에게 재산처분권까지 준 경우에도 그 재산관리인은 재산처분에 법원의 허가를 얻어야 한다.", "재산관리인의 권한초과행위에 대한 법원의 허가결정은 기왕의 처분행위를 추인하는 방법으로도 할 수 있다.", "재산관리인이 소송절차를 진행하던 중 부재자에 대한 실종선고가 확정되면 그 재산관리인의 지위도 종료한다.", "생사불명의 부재자를 위하여 법원이 선임한 재산관리인은 그가 부재자의 사망을 확인한 때에 , "qnum": 39, "curr_lec_no": "경제학원론", "curr_lecture": "", "professor": "37회", "stem": "자본이동이 완전한 소국개방경제의 먼델-플레밍 모형에서 정부지출을 증가시킬 때 나타나는 결과로 옳은 것은? (단, 물가수준은 변하지 않는다고 가정한다.)", "stem_table": null, "options": ["고정환율제도에서는 순수출이 증가한다.", "고정환율제도에서는 국내 이자율이 하락한다.", "변동환율제도에서는 국민소득이 변하지 않는다.", "변동환율제도에서는 자국 통화가치가 절하된다.", "환율제도에 관계없이 국내 통화공급량이 증가한다."], "answer": [3], "image": null}, {"id": "2026-37-경제학원론-40", "year": 2026, "qnum": 40, "curr_lec_no": "경제학원론", "curr_lecture": "", "professor": "37회", "stem": "1년 간 물가상승률이 한국은 3%, 미국은 2%가 될 것으로 예상되며, 한국의 1년 만기 명목이자율은 5%이다. 구매력평가설(purchasing power parity)과 이자율평가설(interest rate parity)이 성립하는 경우, 이에 관한 설명으로 옳은 것을 모두 고른 것은? (단, 원-달러 환율은 1달러 당 한국 원화 단위로 표시된다.)", "stem_table": null, "options": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": [3], "image": null}];

const EXPLANATIONS = /*EXPL_START*/{"2020-31-민법-1": "①, ⑤ 관습법은 법령에 저촉되지 아니하는 한 법칙으로서의 효력이 있고, 사회구성원들이 관행의 법적 구속력에 대한 확신을 갖지 않게 되었거나 전체 법질서에 부합하지 않게 되면 효력이 부정된다(대판(전) 2005.7.21, 2002다1178). ② 헌법상의 기본권은 사법관계에 직접 적용될 수 있는 예외적인 것을 제외하고는 민법 제2조, 제103조, 제750조, 제751조 등의 해석기준이 되어 간접적으로 사법관계에 효력을 미친다(대판(전) 2020.8.27. 2016다248998). 따라서 직접 적용되지 않는 것이 원칙이다(틀림). ③ 법령과 같은 효력을 갖는 관습법은 당사자의 주장 입증을 기다림이 없이 법원이 직권으로 확정하여야 한다(대판 1983.6.14, 80다3231). ④ 우리나라가 가입한 국제조약은 일반적으로 민법이나 상법 또는 국제사법보다 우선적으로 적용된다(대판 2016.3.24. 2013다81514).", "2020-31-민법-2": "① 제한능력자제도는 거래의 안전을 희생시키더라도 미성년자 개인의 이익을 보호하는 제도이다. ② 전 등기명의인이 미성년자이고 당해 부동산을 친권자에게 증여하는 행위가 이해상반행위라 하더라도 일단 친권자에게 이전등기가 경료된 이상 특별한 사정이 없는 한 적법한 절차를 거친 것으로 추정된다(대판 2002.2.5. 2001다72029). ③ 법정대리인이 미성년자 본인 이름으로 법률행위를 한 경우에도 그 효과가 미성년자에게 발생하므로 미성년임을 이유로 취소할 수 없다(대판 1962.9.20. 62다333). ④ 친권자가 그의 친구의 제3자에 대한 채무를 담보하기 위하여 미성년 자(子) 소유의 부동산에 담보를 설정하는 행위는 이해상반행위에 해당하지 않는다(대판 1996.11.22. 96다10270). ⑤ 대리인은 행위능력자임을 요하지 아니하므로(제117조) 미성년자도 법정대리인의 동의 없이 단독으로 유효하게 대리행위를 할 수 있다.", "2020-31-민법-3": "①, ② 의사능력이란 자신의 행위의 의미나 결과를 정상적인 인식력과 예기력을 바탕으로 합리적으로 판단할 수 있는 정신적 능력으로, 특별한 법률적 의미나 효과가 부여된 경우 그에 대한 이해도 요하며 개별적·구체적으로 판단된다(대판 2006.9.22, 2006다29358). ③, ④ 민법은 태아의 권리능력에 관하여 개별주의(개별적 보호주의)를 취하여 손해배상청구권·상속 등 특별한 경우에 한하여 제한된 권리능력을 인정한다. 따라서 일반적 보호주의를 취한다는 ③은 틀림. 또 태아의 수증능력은 부정되며 태아인 동안 법정대리인이 없으므로 법정대리인에 의한 수증행위도 할 수 없다(대판 1982.2.9, 81다534). ⑤ 동시사망으로 추정되는 경우에도 대습상속이 인정된다(대판 2001.3.9. 99다13157).", "2020-31-민법-4": "① 부재자 스스로 위임한 재산관리인에게 재산처분권까지 위임된 경우에는 재산을 처분함에 있어 법원의 허가를 요하지 않는다(대판 1973.7.24. 72다2136). 따라서 허가를 얻어야 한다는 ①은 틀림. ② 법원의 초과행위허가결정은 장래의 처분행위뿐만 아니라 기왕의 처분행위를 추인하는 행위로도 할 수 있다(대판 1982.9.14, 80다3063). ③ 부재자 본인에 대한 실종선고가 확정되면 재산관리인의 지위는 종료된다(대판 1987.3.24. 85다카1151). ④, ⑤ 법원이 선임한 재산관리인은 부재자의 사망을 확인했더라도 선임결정이 취소되지 않는 한 계속 권한을 행사할 수 있고, 그 처분행위에 기한 등기는 적법하게 경료된 것으로 추정된다(대판 1991.11.26. 91다11810).", "2020-31-민법-5": "① 법인은 그 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다(제33조). ② 어느 사단법인과 다른 사단법인이 동일한 것인지 여부는 그 구성원인 사원이 동일한지 여부에 따라 결정됨이 원칙이다(대판 2008.9.25. 2006다37021). ③ 민법 제35조의 '법인의 대표자'에는 명칭이나 직위 여하, 대표자로 등기되었는지 여부를 불문하고 법인을 실질적으로 운영하면서 사실상 대표하여 사무를 집행하는 사람을 포함한다(대판 2011.4.28, 2008다15438). 따라서 법인등기를 기준으로 엄격하게 확정한다는 ③은 틀림. ④ 외형상 직무행위로 인정되면 대표자 개인의 사리를 도모한 것이거나 법령에 위반한 것이라도 직무행위에 해당한다(대판 1969.8.26, 68다2320). ⑤ 직무에 관한 행위가 아님을 피해자가 알았거나 중대한 과실로 알지 못한 경우에는 법인에게 손해배상책임을 물을 수 없다(대판 2004.3.26, 2003다34045).", "2020-31-민법-6": "① 법인이 대표기관을 통하여 법률행위를 한 때에는 대리에 관한 규정이 준용되어(제59조 제2항) 그 효과 및 채무불이행으로 인한 손해배상책임도 법인에 귀속된다(대판 2019.5.30. 2017다53265). ② 교회가 아직 실체를 갖추지 못하여 법인 아닌 사단으로 성립하기 전에 설립주체인 개인이 취득한 권리의무는 바로 법인 아닌 사단에 귀속될 수 없다(대판 2008.2.28. 2007다37394). 따라서 ②는 틀림. ③ 비법인사단의 대표권 제한은 등기할 방법이 없어 거래상대방이 그 제한 사실을 알았거나 알 수 있었을 경우가 아니라면 그 거래행위는 유효하다(대판 2003.7.22, 2002다64780). ④ 법인과 이사의 관계는 위임자와 수임자의 법률관계와 같다(대판 1996.1.26. 95다40915). ⑤ 사단법인의 하부조직이라도 스스로 단체로서의 실체를 갖추고 독자적 활동을 하면 별개의 독립된 비법인사단으로 볼 수 있다(대판 2009.1.30. 2006다60908).", "2020-31-민법-7": "ㄱ. (○) 타인의 생명보험에서 피보험자의 서면동의는 강행규정으로 이를 위반한 보험계약은 무효이다(대판 1994.12.9, 94다25025). ㄴ. (×) 임차인의 비용상환청구권 포기 약정은 임의규정인 민법 제626조에 관한 것으로 유효하다(제652조 참조). ㄷ. (×) 사단법인 사원의 지위는 양도·상속할 수 없다는 민법 제56조는 강행규정이 아니므로 정관으로 양도·상속을 인정할 수 있다(대판 1992.4.14, 91다26850). ㄹ. (○) 변호사 아닌 자와 소송당사자 사이의 소송물 일부 양도 약정은 강행법규인 변호사법 위반의 반사회적 법률행위로서 무효이다(대판 1990.5.11. 89다카10514). 따라서 무효인 것은 ㄱ, ㄹ.", "2020-31-민법-8": "① 종물은 '주물 자체의 상용(경제적 효용)에 이바지하는' 물건을 말하며, 주물의 소유자나 이용자의 사용에 공여되더라도 주물 자체의 효용과 관계없는 물건은 종물이 아니다(대판 2007.12.13. 2007도7247). 따라서 '주물소유자의 상용에 공여된 물건'이라는 ①은 틀림. ② 종물은 자기 소유의 다른 물건이어야 하므로 다른 사람 소유의 물건은 종물이 될 수 없다(대판 2008.5.8. 2007다36933). ③ 종물과 주물의 관계에 관한 법리는 권리 상호간에도 적용된다(대판 2006.10.26, 2006다29020). ④ 저당권의 효력이 미치는 종물은 민법 제100조의 종물과 같은 의미이다(대결 2000.11.2. 2000마3530). ⑤ 토지의 개수는 지적공부상 토지의 필수를 표준으로 결정된다(대판 1990.12.7. 90다카25208).", "2020-31-민법-9": "① 불공정한 법률행위로 무효인 경우에도 무효행위의 전환에 관한 민법 제138조가 적용될 수 있다(대판 2010.7.15. 2009다50308). ② 불공정한 법률행위는 무효행위의 추인에 의하여 유효로 될 수 없고 법정추인도 적용되지 않는다(대판 1994.6.24, 94다10900). ③ 불공정한 법률행위에 해당하는지는 법률행위 시를 기준으로 판단한다(대판(전) 2013.9.26, 2013다26746). ④ 불공정한 법률행위에 해당하지 않더라도 반사회질서행위(제103조)는 성립할 수 있다(대판 2001.2.9, 99다38613). ⑤ 증여와 같이 일방의 급부만 있는 무상행위에는 급부와 반대급부 사이의 불균형 문제가 발생하지 않으므로 불공정한 법률행위가 될 수 없다(대판 1993.7.16, 92다41528).", "2020-31-민법-10": "① 본인 乙이 상대방 丙에게 추인하면 유동적 무효였던 매매계약은 확정적으로 유효가 된다. ② 본인이 무권대리인 甲에게 추인하더라도 상대방이 이를 알지 못하는 동안 선의의 상대방 丙은 철회할 수 있다(제132조, 대판 1981.4.14, 80다2314). ③ 무권대리인의 책임은 무권대리인이 제한능력자(미성년자)일 때에는 적용되지 않으며(제135조 제2항), 또한 그 선택권은 무권대리인이 아니라 상대방에게 있다. 따라서 '甲은 자신의 선택으로'라는 ③은 틀림. ④ 상대방은 대리권 없음을 알았더라도 본인에게 추인 여부의 확답을 최고할 수 있다(제131조). ⑤ 본인이 추인하면 계약은 소급하여 효력이 생기며, 무권대리인 甲은 미성년자임을 이유로 취소하지 못한다(제133조).", "2020-31-민법-11": "① 계약체결에 관한 대리권을 수여받은 대리인이 수권된 법률행위를 하면 대리권의 원인된 법률관계는 종료하므로, 그 대리인이 체결한 계약의 해제 등 처분권까지 가진다고 볼 수 없다(대판 2008.6.12. 2008다11276). 따라서 ①은 틀림. ② 본인이 무권대리행위를 장시간 방치하였다고 하여 추인으로 볼 수 없다(대판 1990.3.27. 88다카181). ③ 매매계약의 체결과 이행에 관하여 포괄적 대리권을 수여받은 대리인은 매매대금 지급기일을 연기할 권한도 가진다(대판 1992.4.14, 91다43107). ④ 대리권을 추단할 수 있는 직함·명칭 등의 사용을 승낙·묵인한 경우 대리권 수여의 표시가 있은 것으로 볼 수 있다(제125조, 대판 1998.6.12. 97다53762). ⑤ 무권대리인의 책임은 무과실책임으로 제3자의 위법행위로 야기된 경우에도 부정되지 않는다(대판 2014.2.27. 2013다213038).", "2020-31-민법-12": "① 매도인이 매수인의 채무불이행을 이유로 매매계약을 적법하게 해제한 후라도 매수인은 착오를 이유로 취소권을 행사할 수 있다(대판 1996.12.6. 95다24982). ② 보험회사의 설명의무 위반으로 중요사항을 이해하지 못한 채 착오에 빠져 계약을 체결한 경우 이를 이유로 취소할 수 있다(대판 2018.4.12. 2017다229536). ③ 쌍방이 甲 토지를 목적물로 삼았으나 계약서에 乙 토지로 표시한 경우, 의사 합치가 있은 甲 토지(Y토지)에 관하여 계약이 성립한다(오표시 무해)(대판 1993.10.26, 93다2629). ④ 법률에 관한 착오라도 법률행위 내용의 중요부분에 관한 것이면 취소할 수 있어 착오 규정이 적용된다(대판 1981.11.10. 80다2475). 따라서 '적용되지 않는다'는 ④는 틀림. ⑤ 취소의 의사표시는 착오를 이유로 법률행위의 효력을 처음부터 배제하려는 의사가 드러나면 족하다(대판 2005.5.27. 2004다43824).", "2020-31-민법-13": "①, ② 상대방 있는 의사표시는 도달한 때에 효력이 생기고, 통지 발송 후 표의자가 사망하거나 제한능력자가 되어도 효력에 영향이 없다(제111조). ③ 의사표시의 도달이란 상대방이 통지의 내용을 알 수 있는 객관적 상태에 놓여졌다고 인정되는 것을 말하며, 현실적으로 수령하였거나 내용을 알았을 것까지는 필요로 하지 않는다(대판 2008.6.12. 2008다19973). 따라서 '현실적으로 수령하거나 내용을 안 때'라는 ③은 틀림. ④ 정당한 사유 없이 수령을 거절한 경우 상대방이 그 내용을 알 수 있는 객관적 상태에 놓인 때에 효력이 생긴다(대판 2008.6.12. 2008다19973). ⑤ 내용증명우편이나 등기우편은 상당기간 내에 도달한 것으로 추정된다(보통우편과 달리)(대판 2002.7.26, 2000다25002).", "2020-31-민법-14": "① 제3자 乙의 사기이므로 甲은 상대방 丙이 그 사실을 알았거나 알 수 있었을 경우에 한하여 취소할 수 있다(제110조 제2항). 즉 丙이 기망사실을 몰랐고 모른 데 과실이 없으면 취소할 수 없으므로, '丙이 잘못없이 몰랐을 때에만 취소할 수 있다'는 ①은 (반대로 서술되어) 틀림. ② 제3자 사기를 이유로 취소하려면 표의자 甲이 상대방 丙의 악의 또는 과실을 증명하여야 한다. ③ 제3자의 사기행위 자체가 불법행위를 구성하므로 甲은 매매계약을 취소하지 않고도 乙에게 불법행위책임을 물을 수 있다(대판 1998.3.10. 97다55829). ④ 사기에 의한 의사표시에서 권리를 취득한 제3자 丁의 선의는 추정된다(대판 1970.11.24. 70다2155). ⑤ 제110조 제3항의 선의의 제3자는 과실 유무를 불문하므로, 丁이 선의이면 과실이 있더라도 취소에 대항할 수 있어 甲은 근저당권설정등기의 말소를 청구할 수 없다. 따라서 ⑤도 틀림. (복수정답 ①, ⑤)", "2020-31-민법-15": "ㄱ. (○) 양도소득세 일부를 회피할 목적으로 매매대금을 낮게 기재한 것만으로는 반사회질서 법률행위로서 무효가 되지 않는다(대판 2007.6.14, 2007다3285). ㄴ. (○) 경매에는 불공정한 법률행위에 관한 민법 제104조, 제608조가 적용될 여지가 없으므로 경매목적물과 매각대금이 현저하게 공정을 잃어도 불공정한 법률행위에 해당하지 않는다(대결 1980.3.21. 80마77). ㄷ. (○) 도박자금 대여채권을 담보하기 위한 근저당권은 불법원인급여로 인한 이익이 종국적인 것이 아니므로 설정자는 무효인 근저당권설정등기의 말소를 구할 수 있다(대판 1995.8.11. 94다54108). 따라서 옳은 것은 ㄱ, ㄴ, ㄷ 모두.", "2020-31-민법-16": "① 어느 법률행위에 어떤 조건이 붙어 있었는지는 사실인정의 문제로서 그 조건의 존재를 주장하는 자가 입증하여야 한다(대판 2006.11.24. 2006다35766). ② 정지조건부 법률행위에 해당한다는 사실은 법률효과의 발생을 다투려는 자에게 주장입증책임이 있고, 조건의 성취 사실은 조건 성취로 권리를 취득하는 자가 증명한다(대판 1993.9.28. 93다20832). ③ 조건이 법률행위 당시 이미 성취할 수 없는 불능조건인 경우, 정지조건이면 그 법률행위는 무효로 한다(제151조 제3항). ④ 조건의 성취로 불이익을 받을 당사자가 신의성실에 반하여 조건 성취를 방해한 때에는 상대방은 '그 조건이 성취한 것으로 주장'할 수 있다(제150조 제1항). 따라서 '처음부터 조건없는 법률행위로 본다'는 ④는 틀림. ⑤ 기한이익 상실의 특약은 특별한 사정이 없는 한 형성권적 기한이익 상실의 특약으로 추정한다(대판 2002.9.4. 2002다28340).", "2020-31-민법-17": "ㄱ. (○) 형성권은 권리자의 일방적 의사표시에 의하여 법률관계의 변동을 일으키는 권리로, 상대방의 동의나 승낙이 필요 없다. ㄴ. (○) 형성권 행사의 의사표시에는 상대방의 지위를 불안하게 하므로 원칙적으로 조건을 붙일 수 없다. ㄷ. (×) 형성권은 상대방의 동의가 없는 한 그 일부만을 행사할 수 없고 전부를 행사하여야 한다. ㄹ. (○) 형성권은 제척기간의 적용을 받는다. 따라서 옳은 것은 ㄱ, ㄴ, ㄹ.", "2020-31-민법-18": "① 부동산 매수인이 인도받아 사용·수익하다가 제3자에게 처분·인도한 경우에도 그 이전등기청구권의 소멸시효는 진행하지 않는다(대판 1999.3.18. 98다32175). ② 채무불이행으로 인한 손해배상청구권의 소멸시효는 '채무불이행시'로부터 진행한다(대판 2005.1.14. 2002다57119). 따라서 '손해배상을 청구한 때부터'라는 ②는 틀림. ③ 주채무의 시효소멸을 이유로 보증인은 보증채무의 소멸을 주장할 수 있다(대판 2012.7.12. 2010다51192). ④ 동시이행관계에 있는 매매대금채권도 그 지급기일 이후 시효의 진행에 걸린다(대판 1991.3.22. 90다9797). ⑤ 취득시효 완성 점유자가 점유를 상실하면 그때부터 10년간 등기청구권을 행사하지 않으면 소멸시효가 완성한다(대판 1996.3.8. 95다34866).", "2020-31-민법-19": "① 소멸시효의 이익은 미리 포기하지 못한다(제184조 제1항). ② 금전채무와 같은 가분채무의 일부에 대해서도 시효이익의 포기는 가능하다(대판 2012.5.10. 2011다109500). 따라서 '채무 전부에 대하여 하여야 한다'는 ②는 틀림. ③ 시효완성 후 채무를 승인하여 시효이익을 포기한 경우 그때부터 새로이 소멸시효가 진행한다(대판 2009.7.9. 2009다14340). ④ 시효이익 포기의 의사표시가 상대방에게 도달한 경우에는 철회하지 못한다(대판 2008.11.27. 2006다18129). ⑤ 시효이익의 포기는 상대적 효과만 있으므로 채권자와 채무자의 관계에서만 효력이 생긴다.", "2020-31-민법-20": "① 취득시효기간 중 등기명의자가 동일한 경우에는 전 점유자가 점유를 개시한 이후의 임의의 시점을 기산점으로 삼을 수 있다(대판 1998.5.12, 97다8496). 따라서 '반드시 점유를 개시한 때를 기산점으로'라는 ①은 틀림. ② 전 점유자의 점유를 아울러 주장하는 경우에는 그 점유의 개시 시기를 어느 점유자의 점유기간 중의 임의의 시점으로 선택할 수 '없다'(대판 1998.4.10. 97다56822). ③ 채무자에 대한 일반 채권자는 채무자를 대위하여 소멸시효를 주장할 수 있을 뿐 채권자의 지위에서 독자적·직접 원용할 수 없다(대판 1997.12.26. 97다22676). ④ 압류·가압류는 소멸시효의 중단사유이나, 종래의 점유상태의 계속을 파괴하는 것이 아니므로 취득시효의 중단사유가 될 수 없다(대판(전) 2009.7.16, 2007다15172). ⑤ 취득시효의 중단사유는 종래의 점유상태의 계속을 파괴하는 것으로 인정될 수 있는 사유이어야 한다(옳음).", "2020-31-민법-21": "① 일물일권주의가 지배하므로 특별한 사정이 없는 한 물건의 일부는 물권의 객체가 될 수 없다. ② 권원 없이 타인의 토지에 심은 수목은 토지에 부합하여 토지소유자에게 귀속되므로 독립한 물권의 객체가 될 수 없다(대판 1980.9.30. 80도1874). ③ 종류·장소·수량지정 등의 방법으로 특정되면 증감 변동하는 집합동산도 하나의 물권의 객체가 될 수 있다(대판 1990.12.26. 88다카20224). ④ 소유권·점유권은 소멸시효의 대상이 아니나, 용익물권인 지상권·지역권 등은 소멸시효의 대상이 된다. 따라서 '소유권을 비롯한 물권은 소멸시효의 적용을 받지 않는다'는 ④는 틀림. ⑤ 소유권을 상실한 전소유자는 제3자인 불법점유자에 대하여 물권적 청구권에 의한 방해배제를 청구할 수 없다(대판(전) 1969.5.27. 68다725).", "2020-31-민법-22": "① 물권적 청구권(물상청구권)은 소유권과 분리하여 양도할 수 없다(대판(전) 1969.5.27. 68다725). ② 가등기의 대상인 청구권은 물권 또는 부동산임차권의 변동을 목적으로 하는 청구권을 말하므로 물권적 청구권을 보전하기 위한 가등기는 인정되지 않는다(채권적 청구권 보전을 위한 가등기만 인정). 따라서 ②는 틀림. ③ 미등기건물 매수인은 소유권이전등기 전까지 자신의 소유권에 기하여 불법점유자에게 직접 인도를 청구하지 못한다. ④ 건물을 매수하여 점유하는 자는 등기명의가 없더라도 법률상·사실상 처분권한이 있으므로 토지소유자는 그에게 건물철거를 청구할 수 있다(대판 1986.12.23. 86다카1751). ⑤ 소유권에 기한 말소등기청구권은 물권적 청구권이므로 소멸시효의 대상이 아니다(대판 1991.11.26, 91다34387).", "2020-31-민법-23": "① 소유권이전등기명의자는 제3자뿐만 아니라 그 전 소유자에 대하여도 적법한 등기원인에 의하여 소유권을 취득한 것이라는 등기의 추정력을 주장할 수 있다(대판 1982.6.22. 81다792). 따라서 '전소유자에 대하여는 그렇지 않다'는 ①은 틀림(보존등기와 달리). ② 원시취득자와 승계취득자의 합치된 의사에 따라 승계취득자 명의로 직접 소유권보존등기를 한 경우 실체관계에 부합하여 적법한 등기로서의 효력을 가진다(대판 1995.12.26. 94다44675). ③ 등기는 물권의 효력발생요건이고 존속요건은 아니므로 원인 없이 말소되어도 물권의 효력에는 변동이 없다(대판 1988.12.27. 87다카2431). ④ 대지에 관하여만 매수인 앞으로 이전등기가 경료된 경우 매도인에게 관습상 법정지상권은 인정되지 않는다(대판(전) 2002.6.20. 2002다9660). ⑤ 근저당권설정등기가 원인 없이 말소된 후 경매절차에서 경락대금이 완납되면 원인 없이 말소된 근저당권도 소멸한다(대판 1998.10.2. 98다27197).", "2020-31-민법-24": "① 경정등기는 착오나 원시적으로 진실한 권리관계와 등기가 일부 어긋나는 경우 이를 바로잡는 등기이다(대판 1962.1.13, 4294민상445). ②, ③ 진정명의회복을 위한 소유권이전등기청구는 진정한 소유자가 현재의 등기명의인을 상대로 하는 것이므로, 진정한 소유자가 아닌 경우에는 청구할 수 없다(대판 1997.3.11. 96다47142). ④ 부동산 등기는 현실의 권리관계에 부합하는 한 권리취득의 경위·방법이 사실과 다르더라도 효력에 영향이 없으므로, 증여로 취득하였으나 등기원인을 매매로 기재하여도 그 등기는 유효하다(대판 1980.7.22. 80다791). 따라서 '무효등기'라는 ④는 틀림. ⑤ 어떤 이유이건 당사자가 자발적으로 말소등기를 한 경우에는 말소회복등기를 할 수 없다(대판 1990.6.26. 89다카5673).", "2020-31-민법-25": "① 가등기된 소유권이전청구권은 양도될 수 있는 재산권이고 가등기로 공시되므로, 양도인과 양수인의 공동신청으로 가등기에 대한 부기등기의 형식으로 그 권리의 이전등기를 경료할 수 있다(대판 1998.11.19, 98다24105). ② 가등기가 경료되어 있다 하더라도 소유권이전등기를 청구할 어떤 법률관계가 있다고 추정되지 아니한다(대판 1979.5.22, 79다239). ③ 가등기는 순위보전의 효력만 있으므로 본등기 시 순위가 가등기한 때로 소급할 뿐 물권변동의 효력은 본등기한 때부터 발생한다(대판 1992.9.25, 92다21258). ④ 가등기에 기한 본등기를 마치면 중간처분인 丙의 저당권은 직권 말소되므로 乙은 丙에게 어떠한 책임도 없다(물상보증인의 지위 부정)(대판 1975.12.27. 74마100). ⑤ 가등기에 기한 본등기청구와 단순한 소유권이전등기청구는 서로 다른 청구이므로, 乙이 별도의 원인으로 소유권을 취득해도 가등기로 보전된 소유권이전청구권은 소멸하지 않는다(대판 1994.4.26., 92다34100). 따라서 옳은 것은 ⑤.", "2020-31-민법-26": "① 선의취득의 대상은 소유권과 질권에 한하며 점유권·유치권은 선의취득할 수 없다. ② 점유개정의 방법으로는 선의취득이 인정되지 않으므로, 다시 제3자와 양도담보설정계약을 체결하고 점유개정으로 인도하여도 제3자는 양도담보권을 선의취득하지 못한다(대판 2005.2.18. 2004다37430). ③ 선의·무과실의 기준시점은 물권행위가 완성되는 때이므로, 인도가 물권적 합의보다 먼저 이루어지면 '물권적 합의가 이루어진 때'를 기준으로 한다(대판 1991.3.22, 91다70). 따라서 '인도를 기준으로 한다'는 ③은 틀림. ④ 선의취득은 원시취득이므로 선의취득자는 임의로 그 효과를 거부할 수 없다(대판 1998.6.12, 98다6800). ⑤ 선의취득이 인정되면 이익 보유의 법률상 원인이 되므로 선의취득자는 본래의 권리자에게 부당이득반환의무를 부담하지 않는다(대판 1998.6.12, 98다6800).", "2020-31-민법-27": "① 선의의 점유자는 점유물의 과실을 취득한다(제201조 제1항). ② 천연과실 수취권자 판단을 위한 점유자의 선·악의는 원물로부터 분리할 때를 기준으로 한다(제102조). ③ 악의의 점유자는 수취한 과실을 반환하여야 하며 소비하였거나 과실로 훼손·수취하지 못한 경우 그 대가를 보상하여야 한다(제201조 제2항). ④ 타주점유자는 그의 책임 있는 사유로 점유물을 멸실·훼손한 때에는 선의라도 손해의 전부를 배상하여야 한다(제202조). ⑤ 점유자가 과실을 취득한 경우에는 통상의 필요비는 청구하지 못한다(제203조 제1항 단서). 따라서 '비용 전부를 청구할 수 있다'는 ⑤는 틀림.", "2020-31-민법-28": "① 지상권자·전세권자·임차인·수치인·질권자 등 점유매개자의 점유는 타인이 소유자임을 전제하는 점유이므로 타주점유이다. 따라서 '자주점유'라는 ①은 틀림. ② 물건에 대한 점유는 사회관념상 사실상의 지배에 있다고 할 수 있는 객관적 관계로 성립한다(대판 2012.1.27. 2011다74949, 제192조). ③ 건물의 소유자는 현실로 점거하지 않더라도 그 건물의 소유를 위하여 부지를 점유한다고 보아야 한다(대판 1991.6.25. 91다10329). ④ 점유매개관계가 소멸하면 간접점유자는 직접점유자에게 점유물의 반환을 청구하여 점유권을 회복한다. ⑤ 점유자는 소유의 의사로 선의·평온·공연하게 점유한 것으로 추정한다(제197조 제1항).", "2020-31-민법-29": "ㄱ. (×) 시효취득을 주장하며 소유권이전등기청구소송을 제기하여 입증까지 마친 후 소유자가 제3자에게 처분하여 이전등기의무가 이행불능에 빠지면 불법행위가 성립한다. 이미 甲이 乙에게 소유권이전등기를 청구한 후이므로 乙은 甲에게 불법행위책임을 진다(대판 1993.2.9. 92다47892). 따라서 ㄱ은 옳지 않음. ㄴ. (×) 취득시효 완성 전에 마친 가등기에 기하여 본등기를 한 경우, 본등기의 순위가 가등기한 때로 소급할 뿐 물권변동의 효력이 소급하지 않으나, 시효완성 후 소유권을 취득한 제3자 丙에 대하여 甲은 시효취득을 주장할 수 없다(대판 1992.9.25. 92다21258). 따라서 ㄴ은 옳지 않음. ㄷ. (○) 점유를 승계한 현 점유자는 전 점유자의 취득시효 완성의 효과를 주장하여 직접 자기에게 소유권이전등기를 청구할 권원이 없다(대판(전) 1995.3.8. 93다47745). 따라서 옳지 않은 것은 ㄱ, ㄴ.", "2020-31-민법-30": "① 부동산 매수인이 매매계약의 이행으로 부동산을 인도받은 때에는 이를 점유·사용할 권리가 생기므로 그 점유·사용은 법률상 원인 없는 이득이 아니어서 매도인은 부당이득반환청구를 할 수 없다(대판 1996.6.25. 95다12682). 따라서 '청구할 수 있다'는 ①은 틀림. ② 지적공부에 일필의 토지로 등록되면 그 경계는 등록으로 확정된다(다만 기술적 착오가 있는 경우 실제 경계에 의함)(대판 1990.12.21, 88다카19712). ③ 토지가 포락되어 원상복구가 어려워 효용을 상실하면 그 소유권은 소멸하며 그 여부는 포락 당시를 기준으로 한다(대판 1992.4.10, 91다31562). ④ 신축집합건물의 각 전유부분 소유권이 누구에게 원시적으로 귀속되는지는 공동 건축주들의 약정에 따른다(대판 2005.11.25. 2004다36352). ⑤ 방해배제청구권의 '방해'는 현재에도 지속되고 있는 침해를 의미하며 이미 종결된 '손해'와 구별된다(대판 2003.3.28. 2003다5917).", "2020-31-민법-31": "공유물분할청구는 건물을 구분소유하는 경우의 공용부분(제215조), 경계에 설치된 경계표·담·구거 등(제239조)에 대하여 법률상 분할이 금지된다(제268조 제3항). 따라서 명문으로 분할청구가 금지되는 경우는 ① 구분소유하는 건물의 공용부분이다. 나머지 ②~⑤는 첨부·매장물 발견·유실물 습득·무주물 선점에 따른 공유관계로 분할청구가 금지되지 않는다.", "2020-31-민법-32": "① 타인이 권원에 의하여 부속한 물건이라도 분리하여 경제적 가치가 없는 경우에는 부동산 소유자의 소유에 귀속된다(민법 제256조 단서, 대판 2017.7.18. 2016다38290). ② 저당권의 효력은 저당부동산에 부합된 물건과 종물에 미친다(제358조). ③ 부합은 소유자를 달리하는 여러 물건이 결합하는 것이므로 동일인 소유의 여러 동산이 결합하는 것은 부합이 아니다. ④ 부합의 원인은 인공적인 경우도 포함하므로 인위적이든 자연적이든 불문한다(대판 2012.1.26. 2009다76546). ⑤ 타인의 동산에 가공한 때에는 그 물건의 소유권은 '원재료의 소유자'에게 속하고, 다만 가공으로 인한 가액의 증가가 원재료의 가액보다 현저히 다액인 때에 한하여 가공자의 소유로 한다(제259조). 따라서 무조건 '가공자의 소유로 한다'는 ⑤는 틀림.", "2020-31-민법-33": "① 종중재산이 여러 사람에게 명의신탁된 경우 수탁인들 상호간에는 형식상 공유관계가 성립한다(대판 1992.9.8. 92다18184). ② 3자간 등기명의신탁의 경우 명의신탁약정이 무효이므로 명의신탁자는 수탁자에게 직접 소유권이전등기를 청구하지 못하고, 매도인을 대위하여 말소를 구할 수 있을 뿐이다(대판 2002.3.15, 2001다61654). ③ 채권담보 목적의 양도담보로서 채권자에게 소유권이전등기를 할 수 있다(가등기담보법상 청산절차 적용). ④ 부부간 명의신탁이 유효한 경우 배우자 일방의 사망으로 부부관계가 해소되어도 사망한 배우자의 다른 상속인과의 관계에서 여전히 유효하게 존속한다(대판 2013.1.24. 2011다99498). 따라서 '효력을 잃는다'는 ④는 틀림. ⑤ 명의신탁의 무효는 제3자에게 대항할 수 없으므로(부실법 제4조 제3항), 수탁자임을 알면서 매매계약을 체결하고 이에 기해 소유권이전등기를 받은 사람은 악의라도 소유권을 취득한다(대판 2000.3.28, 99다56529).", "2020-31-민법-34": "ㄱ. (○) 건물 소유를 위한 법정지상권을 취득한 자로부터 경매로 건물 소유권을 이전받은 매수인은 건물 철거 매각조건 등 특별한 사정이 없는 한 위 지상권도 당연히 취득한다(대판 2014.12.24, 2012다73158). ㄴ. (×) 건물공유자의 1인이 토지를 단독 소유하면서 그 토지에만 저당권을 설정하였다가 경매로 소유자가 달라진 경우, 건물공유자들은 민법 제366조에 의하여 토지 전부에 관하여 법정지상권을 취득한다(대판 2011.1.13, 2010다67159). ㄷ. (×) 토지와 지상 건물에 공동저당권 설정 후 건물을 철거하고 신축한 경우, 신축건물에 토지와 동일순위의 공동저당권을 설정해 주는 등 특별한 사정이 없는 한 신축건물을 위한 법정지상권은 성립하지 않는다(대판(전) 2003.12.18, 98다43601). ㄹ. (×) 건물이 없는 토지에 저당권 설정 당시 근저당권자가 건물 건축에 동의하였더라도 공시할 수 없는 주관적 사항이므로 법정지상권은 성립하지 않는다(대판 2000.12.8. 2000다14934). 따라서 옳지 않은 것은 ㄴ, ㄷ, ㄹ.", "2020-31-민법-35": "① 지역권은 승역지를 전면적으로 사용하는 지상권·전세권과 달리 점유를 요건으로 하지 않는 물권이다. ② 지역권은 요역지를 위한 종된 권리이므로 요역지와 분리하여 양도하거나 다른 권리의 목적으로 하지 못한다(제292조). ③ 통행지역권의 경우 지료는 그 요건이 아니다(대판 2015.3.20, 2012다17479). ④ 지역권 취득시효를 위해서는 요역지 소유자가 승역지상에 통로를 개설하여 항시 사용하는 객관적 상태가 계속되어야 한다(대판 1966.9.6, 65다2305, 제294조). 따라서 '통로를 개설할 필요가 없다'는 ④는 틀림. ⑤ 통행지역권을 시효취득한 경우에도 종전 사용이 무상이었다는 등 특별한 사정이 없다면 요역지 소유자는 승역지 소유자가 입은 손해를 보상하여야 한다(대판 2015.3.20, 2012다17479). 따라서 옳은 것은 ⑤.", "2020-31-민법-36": "① 수급인의 재료와 노력으로 건축되어 독립한 건물에 해당하는 기성부분은 수급인의 소유이므로 수급인은 이에 대하여 유치권을 가질 수 없다(대판 1993.3.26. 91다14116). ② 점유물에 대한 유치권 주장을 배척하려면 점유가 불법행위로 개시되었거나 비용지출 당시 점유권원이 없음을 알았거나 중대한 과실로 알지 못하였음을 상대방이 주장·입증하여야 한다(대판 1966.6.7. 66다600). ③ 채무불이행에 의한 손해배상청구권은 원채권의 연장이므로, 물건과 원채권 사이에 견련관계가 있으면 그 손해배상채권과 물건 사이에도 견련관계가 있다(대판 1976.9.28. 76다582). 따라서 '견련관계가 인정되지 않는다'는 ③은 틀림. ④ 경매개시결정의 기입등기(압류) 전에 유치권을 취득한 사람은 경매절차의 매수인에게 유치권을 행사(대항)할 수 있다(대판 2009.1.15, 2008다70763). ⑤ 거래상 분할이 가능한 물건의 경우 그 일부를 목적으로 하는 유치권이 성립할 수 있다(대판 1968.3.5. 67다2786).", "2020-31-민법-37": "① 목적물의 인도는 전세권의 성립요건이 아니다(대판 1995.2.10, 94다18508). ② 전세권이 존속하는 동안에는 전세권을 그대로 둔 채 전세금반환채권만을 분리하여 확정적으로 양도하는 것은 허용되지 않고, 다만 장래의 조건부 채권으로 양도할 수 있을 뿐이다(대판 2002.8.23, 2001다69122). 따라서 ②가 옳음. ③ 전세권이 성립한 후 목적물의 소유권이 이전되면 전세권은 신 소유자와의 사이에서 동일한 내용으로 존속하므로, 신 소유자가 권리·의무의 주체가 된다(대판 2006.5.11, 2006다6072). ④ 전세권을 목적으로 한 저당권이 설정된 경우에도 전세기간 만료로 전세권의 용익물권적 권능은 소멸하므로 저당권자는 더 이상 전세권 자체에 저당권을 실행할 수 없다(대판 2008.3.13, 2006다29372). ⑤ 전세권저당권이 설정된 경우에도 제3자의 압류 등이 없는 한 전세권설정자는 '전세권자'에 대하여만 전세금반환의무를 부담한다(대판 1999.9.17. 98다31301).", "2020-31-민법-38": "① 질권은 불가분성이 있어 질권자는 채권 전부의 변제를 받을 때까지 질물 전부에 대하여 권리를 행사할 수 있다(제343조, 제321조). ② 저당권으로 담보한 채권을 질권의 목적으로 한 때에는 그 저당권등기에 질권의 부기등기를 하여야 그 효력이 저당권에 미친다(제348조). ③ 채권의 목적물이 금전인 때에는 질권자는 자기채권의 한도에서 직접 청구할 수 있다(제353조). ④ 채무변제기 전 유질계약은 금지되나(제339조), 변제기 후의 유질계약은 대물변제로서 유효하다. ⑤ 금전채권의 채무자가 담보를 제공한 경우 채권자는 채무를 모두 변제받은 다음 담보를 반환하면 될 뿐이고, 채무자의 변제의무와 채권자의 담보반환의무가 동시이행관계에 있다고 볼 수 없다(대판 2019.10.31. 2019다247651). 따라서 '동시이행관계에 있다'는 ⑤는 틀림.", "2020-31-민법-39": "① 민법 제359조의 '과실'에는 천연과실뿐만 아니라 법정과실(차임채권 등)도 포함되므로, 저당부동산에 대한 압류가 있으면 압류 이후의 차임채권 등에도 저당권의 효력이 미친다(대판 2016.7.27. 2015다230020). ② 저당권과 함께 채권을 양수한 자는 저당권이전의 부기등기를 마치고 저당권실행 요건을 갖추면 채권양도의 대항요건을 갖추지 못하였더라도 경매를 신청할 수 있다(대판 2005.6.23. 2004다29279). ③ 후순위 근저당권자가 경매를 신청한 경우 선순위 근저당권의 피담보채권은 경락인이 경락대금을 완납한 때(근저당권 소멸 시)에 확정된다(대판 1999.9.21, 99다26085). ④ 저당권의 양도에 있어 물권적 합의는 양도인과 양수인 사이에 있으면 족하고, 채무자나 물상보증인(저당권설정자) 사이에까지 있어야 하는 것은 아니다(대판 2005.6.10. 2002다15412). 따라서 '저당권설정자 사이의 물권적 합의'가 필요하다는 ④는 틀림. ⑤ 공동저당관계의 등기는 공동저당권의 성립요건이나 대항요건이라고 할 수 없다(대판 2010.12.23. 2008다57746).", "2020-31-민법-40": "① 근저당권이 설정된 후 소유권이 제3자에게 이전된 경우, 종전 소유자(근저당권설정자)도 근저당권설정계약의 당사자로서 피담보채무의 소멸을 이유로 근저당권설정등기의 말소를 청구할 계약상 권리가 있다(대판(전) 1994.1.25, 93다16338). 따라서 ①이 옳음. ② 민법 제360조의 지연배상 1년분 제한은 저당권자의 제3자에 대한 관계에서의 제한이며 채무자나 저당권설정자에게 대항할 수 있는 것이 아니므로, 채무자가 아니나 저당권을 설정한 사람은 1년분에 제한되지 않고 전부를 배상하여야 한다(대판 1992.5.12, 90다8855). ③ 근저당권의 채무자가 피담보채권의 일부를 변제하여도 채권 전액의 변제가 있을 때까지 근저당의 효력은 잔존채무에 미치므로 채권최고액이 축소되지 않는다(대판 2010.5.13. 2010다3681). ④ 저당권자의 물상대위권 행사는 늦어도 배당요구의 종기까지 하여야 하며 그 이후에는 우선변제권을 행사할 수 없다(대판 2003.3.28. 2002다13539). ⑤ 대체물채권을 담보하기 위하여 저당권을 설정한 경우 피담보채권액은 '저당권설정등기를 신청할 때의 시가'로 산정한 금액이 된다(부동산등기법 제77조).", "2021-32-민법-1": "① 관습법이란 사회의 거듭된 관행으로 생성한 사회생활규범이 사회의 법적 확신과 인식에 의하 여 법적 규범으로 승인⋅강행되기에 이르른 것을 말하고, 그러한 관습법은 법원으로서 법령에 저촉되지 아니하는 한 법칙으로서의 효력이 있는 것이므로(대판(전) 2005.7.21. 2002다1178), 관 습법은 성문법에 대하여 보충적 효력을 갖는다. ② 종중이란 공동선조의 분묘수호와 제사 및 종원 상호 간의 친목 등을 목적으로 하여 구성되는 자연발생적인 종족집단이므로, 종중의 이러한 목적과 본질에 비추어 볼 때 공동선조와 성과 본 을 같이 하는 후손은 성별의 구별 없이 성년이 되면 당연히 그 구성원이 된다고 보는 것이 조 리에 합당하다(대판(전) 2005.7.21. 2002다1178). 따라서 공동선조와 성과 본을 같이 하더라도 미성년자인 후손은 종중의 구성원이 될 수 없다. ③ 사회의 거듭된 관행으로 생성된 사회생활규범이 관습법으로 승인되었다고 하더라도 사회 구성 원들이 그러한 관행의 법적 구속력에 대하여 확신을 갖지 않게 되었다거나, 사회를 지배하는 기본적 이념이나 사회질서의 변화로 인하여 그러한 관습법을 적용하여야 할 시점에 있어서의 전체 법질서에 부합하지 않게 되었다면 그러한 관습법은 법적 규범으로서의 효력이 부정될 수밖 에 없다(대판(전) 2005.7.21. 2002다1178). ④ 관습법이란 사회의 거된 관행으로 생성한 사회생활규범이 사회의 법적 확신과 인식에 의하여 법적 규범으로 승인⋅강행되기에 이른 것을 말하고, 사실인 관습은 사회의 관행에 의하여 발생 한 사회생활규범인 점에서 관습법과 같으나 사회의 법적 확신이나 인식에 의하여 법적 규범으 로서 승인된 정도에 이르지 않은 것을 말하는 바, 관습법은 바로 법원으로서 법령과 같은 효력 을 갖는 관습으로서 법령에 저촉되지 않는 한 법칙으로서의 효력이 있는 것이며, 이에 반하여 사실인 관습은 법령으로서의 효력이 없는 단순한 관행으로서 법률행위의 당사자의 의사를 보충함에 그치는 것이다(대판 1983.6.14. 80다3231). ⑤ 미등기 무허가건물의 양수인에게 소유권에 준하는 관습법상의 물권을 인정할 수 없다(대판 2006.10.7., 2006다49000). 비교 : 관습법상 물권 : 관습법상 법정지상권, 분묘기지권, 동산의 양도담보", "2021-32-민법-2": "ㄱ. (○) : 사정변경을 이유로 보증계약을 해지할 수 있는 것은 포괄근보증이나 한정근보증과 같 이 채무액이 불확정적이고 계속적인 거래로 인한 채무에 대하여 보증한 경우에 한하고, 회사의 이사로 재직하면서 보증 당시 그 채무가 특정되어 있는 확정채무에 대하여 보증을 한 후 이사 직을 사임하였다 하더라도 사정변경을 이유로 보증계약을 해지할 수 없는 것이다(대판 2006.7.27. 2004다30675 등). ㄴ. (○) : 채무자의 소멸시효에 기한 항변권의 행사도 우리 민법의 대원칙인 신의성실의 원칙과 권리남용금지의 원칙의 지배를 받는 것이어서, 채무자가 시효완성 전에 채권자의 권리행사나 시효중단을 불가능 또는 현저히 곤란하게 하였거나, 그러한 조치가 불필요하다고 믿게 하는 행 동을 하였거나, 객관적으로 채권자가 권리를 행사할 수 없는 장애사유가 있었거나, 또는 일단 시효완성 후에 채무자가 시효를 원용하지 아니할 것 같은 태도를 보여 권리자로 하여금 그와 같이 신뢰하게 하였거나, 채권자보호의 필요성이 크고 같은 조건의 다른 채권자가 채무의 변제 를 수령하는 등의 사정이 있어 채무이행의 거절을 인정함이 현저히 부당하거나 불공평하게 되 는 등의 특별한 사정이 있는 경우에는 채무자가 소멸시효의 완성을 주장하는 것이 신의성실의 원칙에 반하여 권리남용으로서 허용될 수 없다(대판 2011.7.28. 2009다92784). ㄷ. (×) : 강행법규를 위반한 자가 스스로 그 약정의 무효를 주장하는 것이 신의칙에 위배되는 권리 의 행사라는 이유로 그 주장을 배척한다면, 이는 오히려 강행법규에 의하여 배제하려는 결과를 실현시키는 셈이 되어 입법 취지를 완전히 몰각하게 되므로 달리 특별한 사정이 없는 한 위와 같은 주장은 신의칙에 반하는 것이라고 할 수 없다(대판 2007.11.29. 2005다64552).", "2021-32-민법-3": "①, ④ 제9조 제2항【성년후견개시의 심판】가정법원은 성년후견개시의 심판을 할 때 본인의 의사를 고려 하여야 한다. 제12조 제2항【한정후견개시의 심판】한정후견개시의 경우에 제9조 제2항을 준용한다. ※ 비교 : 제14조의2 제2항【특정후견의 심판】 특정후견은 본인의 의사에 반하여 할 수 없다. ② 피성년후견인이 행한 모든 재산법상의 법률행위는 취소할 수 있다(제10조 제1항). 그럼에도 가 정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있고(제10조 제2항), 또한 성년후견인의 청구에 의해 가정법원이 변경할 수 있다(제10조 제3항). 제10조【피성년후견인의 행위와 취소】 ① 피성년후견인의 법률행위는 취소할 수 있다. ② 제1항에도 불구하고 가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있다. ③ 가정법원은 본인, 배우자, 4촌 이내의 친족 성년후견인, 성년후견감독인, 검사 또는 지방자치단 체의 장의 청구에 의하여 제2항의 범위를 변경할 수 있다. ④ 제1항에도 불구하고 일용품의 구입 등 일상생활에 필요하고 그 대가가 과도하지 아니한 법률행위는 성년후견인이 취소할 수 없다. ③, ⑤ 피성년후견인이 행한 모든 재산법상의 법률행위는 성년후견인의 동의여부 불문하고 언제든 지 취소할 수 있다(제10조 제1항). 다만 일용품의 구입 등 일상생활에 필요하고 그 대가가 과도 하지 아니한 법률행위는 성년후견인이 취소할 수 없다(제10조 제4항).", "2021-32-민법-4": "① 호적부(현 가족관계등록부)의 기재사항은 이를 번복할 만한 명백한 반증이 없는 한 진실에 부 합하는 것으로 추정되고, 특히 호적부의 사망기재는 쉽게 번복할 수 있게 해서는 안 되며, 그 기재 내용을 뒤집기 위해서는 사망신고 당시에 첨부된 서류들이 위조 또는 허위조작된 문서임이 증명되거 나 신고인이 공정증서원본부실기재죄로 처단되었거나 또는 사망으로 기재된 본인이 현재 생존해 있다 는 사실이 증명되고 있을 때, 또는 이에 준하는 사유가 있을 때 등에 한해서 호적상의 사망기재의 추 정력을 뒤집을 수 있을 뿐이고, 그러한 정도에 미치지 못한 경우에는 그 추정력을 깰 수 없다 할 것이 므로, 호적상 이미 사망한 것으로 기재되어 있는 자는 그 호적상 사망기재의 추정력을 뒤집을 수 있는 자료가 없는 한 그 생사가 불분명한 자라고 볼 수 없어 실종선고를 할 수 없다(대판 1997.11.27. 97스4). ② 민법 제28조는 ʻʻ실종선고를 받은 자는 민법 제27조 제1항 소정의 생사불명기간이 만료된 때에 사망한 것으로 본다ʼʼ고 규정하고 있으므로 실종선고가 취소되지 않는 한 반증을 들어 실종선 고의 효과를 다툴 수는 없다(대판 1995.2.17, 94다52751). ③ 제29조 제1항【실종선고의 취소】실종자의 생존한 사실 또는 전조의 규정과 상이한 때에 사망한 사실의 증명이 있으면 법원은 본인, 이해관계인 또는 검사의 청구에 의하여 실종선고를 취소하여야 한다. 그러나 실종선고 후 그 취소 전에 선의로 한 행위의 효력에 영향을 미치지 아니한다. ④ 실종선고를 할 때에는 공시최고가 반드시 필요하나, 실종선고 취소를 할 때에는 공시최고를 요 하지 아니한다(가사소송규칙 제53조 참조). ⑤ 실종선고의 효력이 발생하기 전에는 실종기간이 만료된 실종자라 하여도 소송상 당사자능력을 상실하는 것은 아니므로 실종선고 확정 전에는 실종기간이 만료된 실종자를 상대로 하여 제기 된 소도 적법하고 실종자를 당사자로 하여 선고된 판결도 유효하며 그 판결이 확정되면 기판력 도 발생한다고 할 것이고, 이처럼 판결이 유효하게 확정되어 기판력이 발생한 경우에는 그 판 결이 해제조건부로 선고되었다는 등의 특별한 사정이 없는 한 그 효력이 유지되어 당사자로서 는 그 판결이 재심이나 추완항소 등에 의하여 취소되지 않는 한 그 기판력에 반하는 주장을 할 수 없는 것이 원칙이라 할 것이며, 비록 실종자를 당사자로 한 판결이 확정된 후에 실종선고가 확정되어 그 사망간주의 시점이 소 제기 전으로 소급하는 경우에도 위 판결 자체가 소급하여 당사자능력이 없는 사망한 사람을 상대로 한 판결로서 무효가 된다고는 볼 수 없다(대판 1992.7.14. 92다2455).", "2021-32-민법-5": "① 법인의 정관에 법인 대표권의 제한에 관한 규정이 있으나 그와 같은 취지가 등기되어 있지 않 다면 법인은 그와 같은 정관의 규정에 대하여 선의냐 악의냐에 관계없이 제3자에 대하여 대항할 수 없다(대판 1992.2.14. 91다24564). 제60조【이사의 대표권에 대한 제한의 대항요건】이사의 대표권에 대한 제한은 등기하지 아니하면 제3자에게 대항하지 못한다. ② 재단법인은 원칙적으로 정관변경이 인정되지 않으나, 예외적으로 정관변경이 인정되는 경우 제45조 제3항에서 사단법인의 정관변경 규정을 준용하고 있어, 법인의 정관은 모두 주무관청의 허가가 있어야 효력이 발생한다. 제45조【재단법인의 정관변경】 ① 재단법인의 정관은 그 변경방법을 정관에 정한 때에 한하여 변경할 수 있다. ③ 제42조 제2항의 규정은 전2항의 경우에 준용한다. 제42조【사단법인의 정관의 변경】 ① 사단법인의 정관은 총사원 3분의 2 이상의 동의가 있는 때에 한하여 이를 변경할 수 있다. 그러나 정수에 관하여 정관에 다른 규정이 있는 때에는 그 규정에 의한다. ② 정관의 변경은 주무관청의 허가를 얻지 아니하면 그 효력이 없다. ③ 민법상 재단법인의 기본재산에 관한 저당권 설정행위는 특별한 사정이 없는 한 정관의 기재사 항을 변경하여야 하는 경우에 해당하지 않으므로, 그에 관하여는 주무관청의 허가를 얻을 필요 가 없다(대결 2018.7.20. 2017마1565). ④ 재단법인의 기본재산에 관한 사항은 정관의 기재사항으로서 기본재산의 변경은 정관의 변경을 초래하기 때문에 주무장관의 허가를 받아야 하고, 따라서 기존의 기본재산을 처분하는 행위는 물론 새로이 기본재산으로 편입하는 행위도 주무장관의 허가가 있어야 유효하고, 또 일단 주무 장관의 허가를 얻어 기본재산에 편입하여 정관 기재사항의 일부가 된 경우에는 비록 그것이 명 의신탁관계에 있었던 것이라 하더라도 이것을 처분(반환)하는 것은 정관의 변경을 초래하는 점 에 있어서는 다를 바 없으므로 주무장관의 허가 없이 이를 이전등기할 수는 없다(대판 1991.5.28. 90다8558). ⑤ 법인이 소멸하는 것은 청산종결등기가 된 때가 아니고 청산사무가 사실상 종결된 때이다. 청산 종결의 등기가 종료한 후에도 청산사무가 종결되었다고 할 수 없는 경우에는 청산법인으로 계 속 존속한다(대판 1980.4.8. 79다2036).", "2021-32-민법-6": "① 법인이 그 대표자의 불법행위로 인하여 손해배상의무를 지는 것은 그 대표자의 직무에 관한 행위로 인하여 손해가 발생한 것임을 요한다 할 것이나, 그 직무에 관한 것이라는 의미는 행위 의 외형상 법인의 대표자의 직무행위라고 인정할 수 있는 것이라면 설사 그것이 대표자 개인의 사리를 도모하기 위한 것이었거나 혹은 법령의 규정에 위배된 것이었다 하더라도 위의 직무에 관한 행위에 해당한다고 보아야 한다.(대판 1969.8.26. 68다2320). 즉 외형상 직무행위로 인정 되는 대표자의 권한 남용행위에 대해서도 법인의 불법행위책임이 인정될 수 있다. ② 민법 제35조에서 말하는 ʻ법인의 대표자ʼ에는 그 명칭이나 직위 여하, 또는 대표자로 등기되었 는지 여부를 불문하고 당해 법인을 실질적으로 운영하면서 법인을 사실상 대표하여 법인의 사무를 집행하는 사람을 포함한다고 해석함이 상당하다(대판 2011.4.28. 2008다15438). ③ 법인의 대표자의 행위가 직무에 관한 행위에 해당하지 아니함을 피해자 자신이 알았거나 또는 중대한 과실로 인하여 알지 못한 경우에는 법인에게 손해배상책임을 물을 수 없다(대판 2004.3.26. 2003다34045). ④ 민법 제35조에서 말하는 ʻ이사 기타 대표자ʼ는 법인의 대표기관을 의미하는 것이고 대표권이 없 는 이사는 법인의 기관이기는 하지만 대표기관은 아니기 때문에 그들의 행위로 인하여 법인의 불법 행위는 성립하지 않는다(대판 2005.12.23. 2003다30159). ⑤ 법인의 대표자가 그 직무에 관하여 타인에게 손해를 가함으로써 법인에 손해배상책임이 인정되 는 경우에, 대표자의 행위가 제3자에 대한 불법행위를 구성한다면 그 대표자도 제3자에 대하여 손해배상책임을 면하지 못하며(민법 제35조 제1항), 또한 사원도 위 대표자와 공동으로 불법행 위를 저질렀거나 이에 가담하였다고 볼 만한 사정이 있으면 제3자에 대하여 위 대표자와 연대 하여 손해배상책임을 진다(대결 2009.1.30. 2006마930). 이사 기타 대표자도 그 자신의 제750 조의 손해배상책임을 면하지 못하며, 법인과 경합하여 피해자에게 배상책임을 진다. 양자의 관 계는 부진정연대채무이다.", "2021-32-민법-7": "① 비법인사단에 대하여는 사단법인에 관한 민법 규정 가운데서 법인격을 전제로 하는 것을 제외 하고는 이를 유추적용하여야 할 것인바, 민법 제62조의 규정에 비추어 보면 비법인사단의 대표 자는 정관 또는 총회의 결의로 금지하지 아니한 사항에 한하여 타인으로 하여금 특정한 행위를 대리하게 할 수 있을 뿐 비법인사단의 제반 업무처리를 포괄적으로 위임할 수는 없다 할 것이 므로, 비법인사단 대표자가 행한 타인에 대한 업무의 포괄적 위임과 그에 따른 포괄적 수임인 의 대행행위는 민법 제62조의 규정에 위반된 것이어서 비법인사단에 대하여는 그 효력이 미치 지 아니한다(대판 1996.9.6. 94다18522). ② 대표자를 선임하기 위하여 개최되는 종중총회의 소집권을 가지는 연고항존자를 확정함에 있어 서 여성을 제외할 아무런 이유가 없으므로, 여성을 포함한 전체 종원 중 항렬이 가장 높고 나 이가 가장 많은 사람이 연고항존자가 된다(대판 2010.12.9. 2009다26596). ③ 민법 제63조는 법인의 조직과 활동에 관한 것으로서 법인격을 전제로 하는 조항이 아니고, 법 인 아닌 사단이나 재단의 경우에도 이사가 없거나 결원이 생길 수 있으며, 통상의 절차에 따른 새로운 이사의 선임이 극히 곤란하고 종전 이사의 긴급처리권도 인정되지 아니하는 경우에는 사단이나 재단 또는 타인에게 손해가 생길 염려가 있을 수 있으므로, 민법 제63조는 법인 아닌 사단이나 재단에도 유추 적용할 수 있다(대판(전) 2009.11.19. 2008마699). ④ 우리 민법이 사단법인에 있어서 구성원의 탈퇴나 해산은 인정하지만 사단법인의 구성원들이 2 개의 법인으로 나뉘어 각각 독립한 법인으로 존속하면서 종전 사단법인에게 귀속되었던 재산을 소유하는 방식의 사단법인의 분열은 인정하지 아니한다. 그 법리는 법인 아닌 사단에 대하여도 동일하게 적용되며, 법인 아닌 사단의 구성원들의 집단적 탈퇴로써 사단이 2개로 분열되고 분 열되기 전 사단의 재산이 분열된 각 사단들의 구성원들에게 각각 총유적으로 귀속되는 결과를 초래하는 형태의 법인 아닌 사단의 분열은 허용되지 않는다. 교회가 법인 아닌 사단으로서 존 재하는 이상, 그 법률관계를 둘러싼 분쟁을 소송적인 방법으로 해결함에 있어서는 법인 아닌 사단에 관한 민법의 일반 이론에 따라 교회의 실체를 파악하고 교회의 재산 귀속에 대하여 판 단하여야 하고, 이에 따라 법인 아닌 사단의 재산관계와 그 재산에 대한 구성원의 권리 및 구 성원 탈퇴, 특히 집단적인 탈퇴의 효과 등에 관한 법리는 교회에 대하여도 동일하게 적용되어 야 한다(대판(전) 2006.4.20. 2004다37775). ⑤ 비법인사단인 피고 주택조합의 대표자가 조합총회의 결의를 거쳐야 하는 조합원 총유에 속하는 재산의 처분에 관하여는 조합원 총회의 결의를 거치지 아니하고는 이를 대리하여 결정할 권한이 없다 할 것이어서 피고 주택조합의 대표자가 행한 총유물인 이 사건 건물의 처분행위에 관하여 는 민법 제126조의 표현대리에 관한 규정이 준용될 여지가 없다 할 것이다(대판 2003.7.11. 2001다73626).", "2021-32-민법-8": "① 어느 건물이 주된 건물의 종물이기 위하여는 주물의 상용에 이바지하는 관계에 있어야 하고 이는 주물 자체의 경제적 효용을 다하게 하는 것을 말하는 것이므로, 주물의 소유자나 이용자 의 사용에 공여되고 있더라도 주물 자체의 효용과 관계없는 물건은 종물이 아니다(대판 2007.12.13. 2007도7247). 제100조【주물, 종물】 ① 물건의 소유자가 그 물건의 상용에 공하기 위하여 자기소유인 다른 물건을 이에 부속하게 한 때에는 그 부속물은 종물이다. ② 종물은 주물의 처분에 따른다. ② ʻʻ입목ʼʼ이란 토지에 부착된 수목의 집단으로서 그 소유자가 이 법에 따라 소유권보존의 등기를 받은 것을 말하며(입목에 관한 법률 제2조 제1항 1호), 입목의 소유자는 토지와 분리하여 입목 을 양도하거나 저당권의 목적으로 할 수 있다(동법 제3조 제2항). 비교: 명인방법에 의한 경우는 저당권을 설정할 수 없다. ③ 민법 제100조 제2항의 종물과 주물의 관계에 관한 법리는 물건 상호간의 관계뿐 아니라 권리 상호간에도 적용된다(대판 2006.10.26. 2006다29020). ④ 토지의 개수는 지적법에 의한 지적공부상의 토지의 필수를 표준으로 하여 결정되는 것이므로 토지의 일부는 분필절차를 밟기 전에 그것을 양도할 수 없고 저당권을 설정할 수 없으나, 지상 권ㆍ전세권 등의 용익물권은 분필절차를 밟지 않아도 1필의 토지 일부 위에 설정될 수 있다. ⑤ 부동산의 종물은 주물의 처분에 따르고, 저당권은 그 목적 부동산의 종물에 대하여도 그 효력 이 미치기 때문에, 저당권의 실행으로 개시된 경매절차에서 부동산을 경락받은 자와 그 승계인 은 종물의 소유권을 취득하고, 그 저당권이 설정된 이후에 종물에 대하여 강제집행을 한 자는 위와 같은 경락인과 그 승계인에게 강제집행의 효력을 주장할 수 없다(대판 1993.8.13. 92다 43142).", "2021-32-민법-9": "① 선량한 풍속 기타 사회질서는 부단히 변천하는 가치관념으로서 어느 법률행위가 이에 위반되어 민법 제103조에 의하여 무효인지 여부는 그 법률행위가 이루어진 때를 기준으로 판단하여야 하고, 또한 그 법률행위가 유효로 인정될 경우의 부작용, 거래자유의 보장 및 규제의 필요성, 사회적 비 난의 정도, 당사자 사이의 이익균형 등 제반 사정을 종합적으로 고려하여 사회통념에 따라 합리적 으로 판단하여야 한다(대판(전) 2015.7.23. 2015다200111). ② 강제집행을 면할 목적으로 부동산에 허위의 근저당권설정등기를 경료하는 행위는 민법 제103 조의 선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위로 볼 수 없다(대판 2004.5.28. 2003다70041). ③ 대리인이 부동산을 이중으로 매수한 경우, 그 매매계약이 반사회적 법률행위로서 무효인지 여부는 대리인을 기준으로 판단한다. 즉 대리인이 본인을 대리하여 매매계약을 체결함에 있어 서 매매대상 토지에 관한 저간의 사정을 잘 알고 그 배임행위에 가담하였다면, 대리행위의 하 자 유무는 대리인을 표준으로 판단하여야 하므로(제116조), 설사 본인이 미리 그러한 사정을 몰 랐거나 반사회성을 야기한 것이 아니라고 할지라도 그로 인하여 매매계약이 가지는 사회질서에 반한다는 장애사유가 부정되는 것은 아니다(대판 1998.2.27. 97다45532). ④ 법률행위의 성립과정에서 강박이라는 불법적 방법이 사용된데 불과한 때에는 강박에 의한 의 사표시의 하자나 의사의 흠결을 이유로 효력을 논의할 수는 있을지언정 반사회질서의 법률행위 로서 무효라고 할 수는 없다(대판 1992.11.27. 92다7719). ⑤ 반사회적 법률행위에 의한 무효는 절대적 무효이므로, 무효를 가지고 선의의 제3자에게도 대항 할 수 있다(대판 1996.10.25. 96다29151).", "2021-32-민법-10": "①, ③, ④, ⑤ 원시취득은 타인의 권리에 기초하지 않고 원시적으로 취득하는 것을 말한다. 이에 따르면 종전 권리에 대한 제한은 소멸하게 된다. 이에 해당하는 것이 ④ 건물의 신축, ① 무주물 선점(제252조)에 의한 소유권 취득, 취득시효(제252조), 선의취득(제249조) ⑤ 공용징수에 의한 토지 소 유권 취득, ③ 환지처분에 의한 국가의 소유권 취득 등이 이에 해당한다. ② 승계취득은 타인의 권리에 기초로 하여 권리를 취득하는 것을 말한다. 즉, 종전 권리에 대한 제한은 존속하고, 전주의 권리 범위 내에서만 취득이 가능하며, 무권리자로부터 취득할 수 없 다. 여기에는 이전적 승계( 구권리자에 속하고 있었던 권리가 동일성을 유지하면서 신권리자에게 이전되는 것)와 설정적 승 계( 구권리자는 그대로 그의 권리를 보유하면서, 그 권리에 기초하여 제약된 새로운 권리를 발생하게 하여 이를 신권리자에게 취득하게 하는 것)가 있고, 이전적 승계는 다시 특정승계와 포괄승계로 나뉜다. 매매(제563조), 증여(제554조) 등의 경우 와 같은 특정승계와 달리 포괄승계는 하나의 취득원인에 의하여 다수의 권리가 일괄해서 취득 되는 것을 말한다. 상속(제997조), 포괄유증(제1078조), 회사의 합병(상법 제235조) 등이 이에 해당한다. ○", "2021-32-민법-11": "① 실제로는 전세권설정계약이 없으면서도 임대차계약에 기한 임차보증금 반환채권을 담보할 목 적으로 임차인과 임대인 사이의 합의에 따라 임차인 명의로 전세권설정등기를 경료한 후 그 전 세권에 대하여 근저당권이 설정된 경우, 설령 위 전세권설정계약만 놓고 보아 그것이 통정허위 표시에 해당하여 무효라 하더라도 이로써 위 전세권설정계약에 의하여 형성된 법률관계를 토대 로 별개의 법률원인에 의하여 새로운 법률상 이해관계를 갖게 된 근저당권자에 대하여는 그와 같은 사정을 알고 있었던 경우에만 그 무효를 주장할 수 있다(대판 2008.3.13. 2006다29372). ② 채권양수인이 채권양도인으로부터 지명채권을 양도받았음을 이유로 채무자에 대하여 그 채권 을 행사하기 위하여는 지명채권 양도에 관한 합의 이외에 양도받은 당해 채권에 관하여 민법 제450조 소정의 대항요건을 갖추어야 하는 것이고, 이러한 법리는 채권양도인과 채무자 사이의 법률행위가 허위표시인 경우에도 마찬가지로 적용된다(대판 2011.4.28. 2010다100315). 따라서 채권양도인과 채무자사이의 소비대차가 가장행위에 해당하고, 가장소비대차에 기한 대여금채권 을 양수한 자는 가장행위에 기초하여 새로운 이해관계를 맺은 제3자에 해당한다. ③ 채권자와 채무자가 통모하여 허위의 의사표시로써 저당권설정 행위를 하고 채권자가 그 저당 권을 실행하여 경매절차가 적법히 진행된 결과 제3자가 경락으로 소유권을 취득하고 그 이전등 기를 종료한 경우에 선의의 제3자에게는 그 허위표시를 주장하여 대항할 수 없다(대판 1957.3.23. 4289민상580). ④ 민법 제108조 제2항에서 말하는 제3자는 허위표시의 당사자와 그의 포괄승계인 이외의 자 모 두를 가리키는 것이 아니고 그 가운데서 허위표시행위를 기초로 하여 새로운 이해관계를 맺은 자를 한정해서 가리키는 것으로 새겨야 할 것이므로 이 사건 퇴직금 채무자인 피고는 원채권자 인 소외(갑)이 소외(을)에게 퇴직금채권을 양도했다고 하더라도 그 퇴직금을 양수인에게 지급하 지 않고 있는 동안에 위 양도계약이 허위표시란 것이 밝혀진 이상 위 허위표시의 선의의 제3자 임을 내세워 진정한 퇴직금전부채권자인 원고에게 그 지급을 거절할 수 없다(대판 1983.1.18. 82다594). ⑤ 파산자가 상대방과 통정한 허위의 의사표시를 통하여 가장채권을 보유하고 있다가 파산이 선 고된 경우 그 가장채권도 일단 파산재단에 속하게 되고, 파산선고에 따라 파산자와는 독립한 지위에서 파산채권자 전체의 공동의 이익을 위하여 직무를 행하게 된 파산관재인은 그 허위표 시에 따라 외형상 형성된 법률관계를 토대로 실질적으로 새로운 법률상 이해관계를 가지게 된 민법 제108조 제2항의 제3자에 해당한다(대판 2003.6.24. 2002다48214).", "2021-32-민법-12": "① 토지매매에 있어서 특단의 사정이 없는 한 매수인에게 측량 또는 지적도와의 대조 등 방법으 로 매매목적물이 지적도상의 그것과 정확히 일치하는지의 여부를 미리 확인하여야 할 주의의무 가 있다고 볼 수 없으므로, 현장답사에서 매도인이 매매목적물이라고 제시하는 토지의 점유평 수가 매매계약상 매매목적물의 평수와 비슷하고 그 토지의 지적일부가 하천부지에 편입되어 있 음을 의심할만한 특별한 사정이 없었다면 매수인이 토지매매당시 매매목적물을 측량하지 아니 하거나 또는 현장답사에서 지적도와의 대조를 소홀히 하여 하천부지로 편입된 사실을 미리 발 견하지 못하였다고 하여도 여기에 매수인의 과실이 있다고 할 수 없을 것이다(대판 1985.11.12. 84다카2344). ② 상대방이 표의자의 진의에 동의한 경우에는 당사자의 일치하는 의사대로 효력이 생기므로 착 오의 문제는 발생하지 않는다. 그러므로 표의자는 착오를 이유로 의사표시를 취소할 수 없다. ③ 동기의 착오가 상대방에 의해 유발된 경우 동기가 표시되지 않더라도 의사표시의 취소 사유인 착오에 해당할 수 있다(대판 1990.7.10. 90다카7460). 따라서 상대방에 의해 유발된 동기의 착 오는 동기가 표시되지 않았더라도 내용상 착오가 되어 중요부분의 착오가 될 수 있다. ④ 민법 제109조 제1항 단서는 의사표시의 착오가 표의자의 중대한 과실로 인한 때에는 그 의사표 시를 취소하지 못한다고 규정하고 있는데, 위 단서 규정은 표의자의 상대방의 이익을 보호하기 위한 것이므로, 상대방이 표의자의 착오를 알고 이를 이용한 경우에는 착오가 표의자의 중대 한 과실로 인한 것이라고 하더라도 표의자는 의사표시를 취소할 수 있다(대판 2014.11.27. 2013다49794). ⑤ 사기에 의한 의사표시란 타인의 기망행위로 말미암아 착오에 빠지게 된 결과 어떠한 의사표시 를 하게 되는 경우이므로 거기에는 의사와 표시의 불일치가 있을 수 없고, 단지 의사의 형성과 정 즉 의사표시의 동기에 착오가 있는 것에 불과하며, 이 점에서 고유한 의미의 착오에 의한 의사표시와 구분되는데, 신원보증서류에 서명날인한다는 착각에 빠진 상태로 연대보증의 서면 에 서명날인한 경우, 결국 위와 같은 행위는 강학상 기명날인의 착오(또는 서명의 착오), 즉 어 떤 사람이 자신의 의사와 다른 법률효과를 발생시키는 내용의 서면에, 그것을 읽지 않거나 올 바르게 이해하지 못한 채 기명날인을 하는 이른바 표시상의 착오에 해당하므로, 비록 위와 같 은 착오가 제3자의 기망행위에 의하여 일어난 것이라 하더라도 그에 관하여는 사기에 의한 의 사표시에 관한 법리, 특히 상대방이 그러한 제3자의 기망행위 사실을 알았거나 알 수 있었을 경우가 아닌 한 의사표시자가 취소권을 행사할 수 없다는 민법 제110조 제2항의 규정을 적용할 것이 아니라, 착오에 의한 의사표시에 관한 법리만을 적용하여 취소권 행사의 가부를 가려야 한다. (대판 2005.5.27. 2004다43824).", "2021-32-민법-13": "① 일반적으로 교환계약을 체결하려는 당사자는 서로 자기가 소유하는 교환 목적물은 고가로 평 가하고 상대방이 소유하는 목적물은 염가로 평가하여 보다 유리한 조건으로 교환계약을 체결하 기를 희망하는 이해상반의 지위에 있고, 각자가 자신의 지식과 경험을 이용하여 최대한으로 자 신의 이익을 도모할 것이 예상되기 때문에, 당사자 일방이 알고 있는 정보를 상대방에게 사실 대로 고지하여야 할 신의칙상의 주의의무가 인정된다고 볼 만한 특별한 사정이 없는 한, 어느 일방이 교환 목적물의 시가나 그 가액 결정의 기초가 되는 사항에 관하여 상대방에게 설명 내 지 고지를 할 주의의무를 부담한다고 할 수 없고, 일방 당사자가 자기가 소유하는 목적물의 시 가를 묵비하여 상대방에게 고지하지 아니하거나 혹은 허위로 시가보다 높은 가액을 시가라고 고 지하였다 하더라도 이는 상대방의 의사결정에 불법적인 간섭을 한 것이라고 볼 수 없다(대판 2002.9.4. 2000다54406⋅54413). ② 강박에 의한 법률행위가 하자 있는 의사표시로서 취소되는 것에 그치지 않고 나아가 무효로 되기 위하여는, 강박의 정도가 단순한 불법적 해악의 고지로 상대방으로 하여금 공포를 느끼도 록 하는 정도가 아니고, 의사표시자로 하여금 의사결정을 스스로 할 수 있는 여지를 완전히 박탈한 상태에서 의사표시가 이루어져 단지 법률행위의 외형만이 만들어진 것에 불과한 정도 이어야 한다(대판 2003.5.13, 2002다73708⋅73715). ③ 국토이용관리법(현행 국토의 계획 및 이용에 관한 법률)상 규제구역 내에 속하는 토지거래에 관하여 관할 도지사로부터 거래허가를 받지 아니한 거래계약은 처음부터 위 허가를 배제하거나 잠탈하는 내용의 계약이 아닌 한 허가를 받기까지는 유동적 무효의 상태에 있고 거래 당사자는 거래허가를 받기 위하여 서로 협력할 의무가 있으나, 그 토지거래가 계약 당사자의 표시와 불 일치한 의사(비진의표시, 허위표시 또는 착오) 또는 사기, 강박과 같은 하자 있는 의사에 의하 여 이루어진 경우에는, 이들 사유에 의하여 그 거래의 무효 또는 취소를 주장할 수 있는 당사 자는 그러한 거래허가를 신청하기 전 단계에서 이러한 사유를 주장하여 거래허가신청 협력에 대한 거절의사를 일방적으로 명백히 함으로써 그 계약을 확정적으로 무효화시키고 자신의 거래 허가절차에 협력할 의무를 면할 수 있다(대판 1997.11.14. 97다36118). ④ 상대방 있는 의사표시에 관하여 제3자가 사기나 강박을 한 경우에는 상대방이 그 사실을 알았 거나 알 수 있었을 경우에 한하여 그 의사표시를 취소할 수 있으나, 상대방의 대리인 등 상대 방과 동일시할 수 있는 자의 사기나 강박은 제3자의 사기·강박에 해당하지 아니한다(대판 1999.2.23. 98다60828, 60835). 따라서 대리인의 기망행위로 계약을 체결한 상대방은 제110조 제1항이 적용되어 본인이 대리인의 기망행위에 대해 선의ㆍ무과실인지 여부와 상관없이 계약을 취소할 수 있다. ⑤ 일반적으로 부정행위에 대한 고소, 고발은 그것이 부정한 이익을 목적으로 하는 것이 아닌 때 에는 정당한 권리행사가 되어 위법하다고 할 수 없으나, 부정한 이익의 취득을 목적으로 하는 경우에는 위법한 강박행위가 되는 경우가 있고 목적이 정당하다 하더라도 행위나 수단 등이 부 당한 때에는 위법성이 있는 경우가 있을 수 있다(대판 1992.12.24. 92다25120).", "2021-32-민법-14": "① 채권양도의 통지와 같은 준법률행위의 도달은 의사표시와 마찬가지로 사회관념상 채무자가 통 지의 내용을 알 수 있는 객관적 상태에 놓여졌을 때를 지칭하고, 그 통지를 채무자가 현실적으 로 수령하였거나 그 통지의 내용을 알았을 것까지는 필요하지 않다(대판 1983.8.23. 82다카 439). 즉, 도달주의의 원칙은 채권양도의 통지와 같은 준법률행위에도 유추적용될 수 있다. ② 도달주의가 원칙이므로 의사표시가 도달되지 않거나 연착이 되면 그로 인한 불이익은 표의가 가 부담한다. ③ 의사표시자가 그 통지를 발송한 후 제한능력자가 되어도 의사표시의 효력에 영향이 없으므로 (제111조 제2항), 후에 의사표시가 도달하는 한 효력이 발생하여 그 의사표시는 취소할 수 없 다. 제111조【의사표시의 효력발생시기】 ② 의사표시자가 그 통지를 발송한 후 사망하거나 제한능력자가 되어도 의사표시의 효력에 영향을 미치지 아니한다. ④ 수령능력이란 타인의 의사표시의 내용을 이해할 수 있는 능력으로서 행위능력보다는 낮은 수 준이어도 될 것이나 민법은 제한능력자를 보호하기 위하여 모든 제한능력자를 의사표시의 수령 무능력자라고 규정하여 제한능력자를 보호하고 있다(제112조). 제112조【제한능력자에 대한 의사표시의 효력】의사표시의 상대방이 의사표시를 받은 때에 제한능력자인 경우에는 의사표시자는 그 의사표시로써 대항할 수 없다. 다만, 그 상대방의 법정대리인이 의사표시가 도달한 사실을 안 후에는 그러하지 아니하다. ⑤ 상대방이 정당한 사유 없이 통지의 수령을 거절한 경우에는 상대방이 그 통지의 내용을 알 수 있는 객관적 상태에 놓여 있는 때에 의사표시의 효력이 생기는 것으로 보아야 한다(대판 2008.6.12. 2008다19973).", "2021-32-민법-15": "① 제123조 제2항【복대리인의 권한】복대리인은 본인이나 제3자에 대하여 대리인과 동일한 권리의무가 있다. ② 임의대리인은 원칙적으로 복대리인을 선임할 수 없으나 예외적으로 본인의 승낙이나 부득이한 사유가 있는 경우 복대리인을 선임할 수 있다(제120조). 대리의 목적인 법률행위의 성질상 대리 인 자신에 의한 처리가 필요하지 아니한 경우에는 본인이 복대리 금지의 의사를 명시하지 아니 하는 한 복대리인의 선임에 관하여 묵시적인 승낙이 있는 것으로 보는 것이 타당하다(대판 1996.1.26. 94다30690). 제120조【임의대리인의 복임권】대리권이 법률행위에 의하여 부여된 경우에는 대리인은 본인의 승낙이 있거나 부득이한 사유가 있는 때가 아니면 복대리인을 선임하지 못한다. ③ 임의대리인은 원칙적으로 복대리인을 선임할 수 없으나 예외적으로 본인의 승낙이나 부득이한 사유가 있는 경우 복대리인을 선임할 수 있다(제120조). 제120조에 기해 대리인이 복대리인을 선 임한 때에는 본인에게 대하여 그 선임감독에 관한 책임이 있다(제121조 제1항). 제121조 【임의대리인의 복대리인선임의 책임】 ① 전조의 규정에 의하여 대리인이 복대리인을 선임한 때에는 본인에게 대하여 그 선임감독에 관한 책임이 있다. ④ 법정대리인이 그 자신의 이름으로 선임한 복대리인은 법정대리인의 대리인이 아니라, 본인의 대리인이다. ⑤ 표현대리에 관한 법리는 대리의 경우와 복대리와의 사이에 차이가 있는 것은 아니므로, 민법 제126조의 대리인에는 복대리인도 포함되고, 복대리인이 권한을 넘은 대리행위를 한 경우에도 표현대리가 인정된다(대판 1962.10.8. 62다508 등).", "2021-32-민법-16": "ㄱ. (×) : 판례는 제125조 대리권수여표시에 의한 표현대리만 임의대리문제라고 하고, 나머지의 표현대리는 임의대리, 법정대리 다 적용된다고 한다. 따라서 대리권 소멸 후의 표현대리에 관한 민법 제129조는 임의대리권이 소멸한 경우만이 아니라 법정대리인의 대리권 소멸한 경우에도 적용된다. ㄴ. (○) : 표현대리 제도는 대리권이 있는 것 같은 외관이 생긴데 대해 본인이 민법 제125조, 제 126조 및 제129조 소정의 원인을 주고 있는 경우에 그러한 외관을 신뢰한 선의·무과실의 제3 자를 보호하기 위하여 그 무권대리 행위에 대하여 본인이 책임을 지게 하려는 것이고 이와 같 은 문제는 무권대리인과 본인과의 관계, 무권대리인의 행위 당시의 여러가지 사정 등에 따라 결정되어야 할 것이므로 당사자가 표현대리를 주장함에는 무권대리인과 표현대리에 해당하는 무권대리 행위를 특정하여 주장하여야 한다 할 것이고 따라서 당사자의 표현대리의 항변은 특 정된 무권대리인의 행위에만 미치고 그 밖의 무권대리인이나 무권대리 행위에는 미치지 아니한 다(대판 1984.7.24. 83다카1819). ㄷ. (×) : 총유물의 관리, 처분은 사원총회의 결의에 의하고, 보존행위도 마찬가지이다(제276조 제1항). 대법원은 본 조항을 강행규정으로 파악하고 본 조항에 위배된 법률행위에 관하여 표현 대리에 의한 보호는 있을 수 없다고 한다(대판 2003.7.11. 2001다73626). ㄹ. (×) : 표현대리가 성립하면 그 본인은 표현대리행위에 대하여 전적인 책임을 져야 하고 상대 방에게 과실이 있다고 하더라도 과실상계의 법리를 유추적용하여 그의 책임을 감경할 수 없다 (대판 1996.7.12. 95다49554).", "2021-32-민법-17": "① 무권대리행위에 대한 본인의 추인은 원칙적으로 소급효를 갖는다. 여기의 예외가 1) 다른 의사 표시를 한 경우, 2) 제3자의 권리를 해하는 경우이다. 제133조【추인의 효력】추인은 다른 의사표시가 없는 때에는 계약시에 소급 하여 그 효력이 생긴다. 그러나 제3자의 권리를 해하지 못한다. ② 기한의 효력에는 소급효가 없으며, 당사자에 특약에 의해서도 소급효를 인정할 수 없다. 제152조【기한도래의 효과】 ① 시기 있는 법률행위는 기한이 도래한 때로부터 그 효력이 생긴다. ② 종기 있는 법률행위는 기한이 도래한 때로부터 그 효력을 잃는다. 비교: 조건은 당사자의 의사표시로 소급효를 인정하는 규정이 있다(제147조 제3항). 제147조【조건성취의 효과】 ③ 당사자가 조건성취의 효력을 그 성취 전에 소급하게 할 의사를 표시한 때에는 그 의사에 의한다. ③ 국토이용관리법상의 규제구역 내의 ‘토지등의 거래계약’ 허가에 관한 관계규정의 내용과 그 입법취지에 비추어 볼 때 토지의 소유권 등 권리를 이전 또는 설정하는 내용의 거래계약은 관 할 관청의 허가를 받아야만 그 효력이 발생하고 허가를 받기 전에는 물권적 효력은 물론 채권 적 효력도 발생하지 아니하여 무효라고 보아야 할 것이지만, 일단 허가를 받으면 그 계약은 소 급하여 유효한 계약이 되고 이와 달리 불허가가 된 때에는 무효로 확정되므로 허가를 받기까지 는 유동적 무효의 상태에 있다고 보는 것이 타당하므로 허가받을 것을 전제로 한 거래계약은 허가받기 전의 상태에서는 거래계약의 채권적 효력도 전혀 발생하지 않으므로 권리의 이전 또 는 설정에 관한 어떠한 내용의 이행청구도 할 수 없으나 일단 허가를 받으면 그 계약은 소급해 서 유효화되므로 허가 후에 새로이 거래계약을 체결할 필요는 없다(대판(전) 1991.12.24. 90다 12243). ④ 소멸시효가 완성되면 그로 인한 권리소멸의 효과는 그 기산일에 소급하여 효력이 생긴다(제167 조). 제167조【소멸시효의 소급효】소멸시효는 그 기산일에 소급 하여 효력이 생긴다. ⑤ 취소한 법률행위는 처음부터 무효인 것으로 본다(제141조 본문). 즉 소급적으로 효력이 없게 된다. 제141조【취소의 효과】취소된 법률행위는 처음부터 무효 인 것으로 본다. 다만, 제한능력자는 그 행위로 인하여 받은 이익이 현존하는 한도에서 상환할 책임이 있다.", "2021-32-민법-18": "① 법정조건은 법률이 명문으로 요구하는 조건이다. 따라서 당사자가의 임으로 부가한 것이 아니 기 때문에 법률행위의 부관으로서의 조건은 아니다. ② 단독행위인 취소, 해제, 해지, 추인, 상계 등은 원칙적으로 조건을 붙일 수 없으나, 1. 채무면 제, 유증과 같이 상대방에게 이익만을 주거나 상대방의 지위를 불안케 할 염려가 없는 행위이 거나, 2. 상대방의 동의가 있는 경우에는 허용된다. ③ 제153조 제1항【기한의 이익과 그 포기】기한은 채무자의 이익을 위한 것으로 추정한다. ④ 조건부 법률행위에 있어 조건의 내용 자체가 불법적인 것이어서 무효일 경우 또는 조건을 붙 이는 것이 허용되지 아니하는 법률행위에 조건을 붙인 경우 그 조건만을 분리하여 무효로 할 수 없고 전부무효가 된다(대결 2005.11.8, 2005마541). ⑤ 당사자가 불확정한 사실이 발생한 때를 이행기한으로 정한 경우에 있어서 그 사실이 발생한 때는 물론 그 사실의 발생이 불가능하게 된 때에도 이행기한은 도래한 것으로 보아야 한다(대판 1989.6.27. 88다카10579).", "2021-32-민법-19": "① 소멸시효는 권리를 행사할 수 있는 때로부터 진행하며 여기서 권리를 행사할 수 있는 때라 함 은 권리행사에 법률상의 장애가 없는 때를 말하므로 정지조건부권리의 경우에는 조건 미성취의 동안은 권리를 행사할 수 없는 것이어서 소멸시효가 진행되지 않는다(대판 1992.12.22. 92다 28822). ② 기한의 정함이 없는 채권은 언제나 행사가 가능하므로 그 발생시부터 법률상의 장애가 없기 때문에 그 권리가 발생한 때인 채권성립시부터 소멸시효가 진행한다. ③ 채무불이행으로 인한 손해배상청구권의 소멸시효는 채무불이행시로부터 진행한다(대판 2005.1.14. 2002다57119). ④ 부동산에 대한 매매대금 채권이 소유권이전등기청구권과 동시이행의 관계에 있다고 할지라도 매도인은 매매대금의 지급기일 이후 언제라도 그 대금의 지급을 청구할 수 있는 것이며, 다만 매수인은 매도인으로부터 그 이전등기에 관한 이행의 제공을 받기까지 그 지급을 거절할 수 있 는 데 지나지 아니하므로 매매대금 청구권은 그 지급기일 이후 시효의 진행에 걸린다(대판 1991.3.22. 90다9797). 즉 소멸시효의 기산점은 권리를 행사할 수 있는 때로부터 진행하기 때 문에 동시이행의 항변권이 붙어 있는 채권이라도 그 이행기로부터 진행한다. ⑤ 무권대리인이 대리권을 증명하지 못하고 본인의 추인도 얻지 못한 경우 상대방의 계약이행청 구권이나 손해배상청구권의 소멸시효는 그 선택권을 행사할 수 있을 때부터 진행한다(대판 1963.8.22. 63다323).", "2021-32-민법-20": "① 제184조【시효의 이익의 포기 기타】② 소멸시효는 법률행위에 의하여 이를 배제, 연장 또는 가중할 수 없으나 이를 단축 또는 경감할 수 있다. ② 시효의 중단은 원칙적으로 당사자 및 그 승계인 사이에서만 효력이 있다(제169조). 예외적으로 인적 범위는 확대된다(제176조, 제286조, 제440조 등). 제169조【시효중단의 효력】시효의 중단은 당사자 및 그 승계인간에만 효력이 있다. 제296조【소멸시효의 중단, 정지와 불가분성】요역지가 수인의 공유인 경우에 그 1인에 의한 지역권 소멸시 효의 중단 또는 정지는 다른 공유자를 위하여 효력이 있다. 제440조【시효중단의 보증인에 대한 효력】주채무자에 대한 시효의 중단은 보증인에 대하여 그 효력이 있다 ③ 소멸시효 중단사유가 되는 채무승인은 시효이익을 받는 당사자인 채무자가 소멸시효 완성으로 채권을 상실하게 될 상대방에 대하여 상대방의 권리 또는 자신의 채무가 있음을 알고 있다는 뜻을 표시함으로써 성립하는 이른바 관념의 통지로서, 시효 완성 후 시효이익의 포기와 달리 어떠한 효과의사가 필요하지 않다(대판 2018.2.13. 2017다265556). ④ 소멸시효의 이익은 시효가 완성되기 전에 미리 포기하지 못한다. 제184조【시효의 이익의 포기 기타】 ① 소멸시효의 이익은 미리 포기하지 못한다. ⑤ 채무자가 소멸시효 완성 후 채무를 일부 변제한 때에는 액수에 관하여 다툼이 없는 한 채무 전체를 묵시적으로 승인한 것으로 보아야 하고, 이 경우 시효완성의 사실을 알고 이익을 포기 한 것으로 추정되므로, 소멸시효가 완성된 채무를 피담보채무로 하는 근저당권이 실행되어 채 무자 소유의 부동산이 경락되고 대금이 배당되어 채무의 일부 변제에 충당될 때까지 채무자가 아무런 이의를 제기하지 아니하였다면, 경매절차의 진행을 채무자가 알지 못하였다는 등 다른 특별한 사정이 없는 한, 채무자는 시효완성의 사실을 알고 채무를 묵시적으로 승인하여 시효의 이익을 포기한 것으로 볼 수 있기는 하다(대판 2017.7.11. 2014다32458).", "2021-32-민법-21": "① 판례는 ʻ무효등기의 유용ʼ과 관련하여 표제부의 유용은 허용되지 않는다고 한다. 즉 판례는 ʻʻ멸 실된 건물과 신축된 건물이 위치나 기타 여러가지 면에서 서로 같다고 하더라도 그 두 건물이 동일한 건물이라고는 할 수 없으므로 신축건물의 물권변동에 관한 등기를 멸실건물의 등기부에 등재하여도 그 등기는 무효이고 가사 신축건물의 소유자가 멸실건물의 등기를 신축건물의 등기 로 전용할 의사로써 멸실건물의 등기부상 표시를 신축건물의 내용으로 표시 변경 등기를 하였 다고 하더라도 그 등기가 무효임에는 변함이 없다ʼʼ고 한다(대판 1980.11.11. 80다441). ② 등기는 물권의 효력 발생요건이고 효력 존속요건이 아니므로 물권에 관한 등기가 원인 없이 말소 된 경우에 그 물권의 효력에는 아무런 영향을 미치지 않는다고 봄이 타당한 바, 등기공무원이 관 할지방법원의 명령에 의하여 소유권이전등기를 직권으로 말소하였으나 그 후 동 명령이 취소 확정된 경우에는 말소등기는 결국 원인 없이 경료된 등기와 같이 되어 말소된 소유권이전등기 는 회복되어야 하고 회복등기를 마치기 전이라도 말소된 소유권이전등기의 최종명의인은 적법 한 권리자로 추정된다(대판 1982.9.14, 81다카923). ③ 소유권이전청구권 보전을 위한 가등기가 경료되어 있다하더라도 소유권이전등기를 청구할 어 떤 법률관계가 있다고 추정되지 아니한다(대판 1979.5.22. 79다239). ④ 부동산등기법 제92조 【가등기에 의하여 보전되는 권리를 침해하는 가등기 이후 등기의 직권말소】 ① 등기관은 가등 기에 의한 본등기를 하였을 때에는 대법원규칙으로 정하는 바에 따라 가등기 이후에 된 등기로 서 가등기에 의하여 보전되는 권리를 침해하는 등기를 직권으로 말소하여야 한다. ⑤ 이전등기명의자는 제3자뿐만 아니라, 그 전 소유자에 대하여는 적법한 등기원인에 의하여 소유 권을 취득한 것이라는 등기의 추정력을 주장할 수 있다(대판 1982.6.22. 81다792 등). 비교: 보존등기의 경우 당사자간의 추정력이 인정되지 않는다. 즉, 보존등기명의인은 양수했다고 주장하나 상대방은 양도사실을 부인하는 경우 보존등기의 추정력은 인정되지 않는다.", "2021-32-민법-22": "① 민법 제201조 제1항에 의하면 선의의 점유자는 점유물의 과실을 취득한다고 규정하고 있는바, 건물을 사용함으로써 얻는 이득은 그 건물의 과실에 준하는 것이므로, 선의의 점유자는 비록 법률상 원인 없이 타인의 건물을 점유⋅사용하고 이로 말미암아 그에게 손해를 입혔다고 하더 라도 그 점유⋅사용으로 인한 이득을 반환할 의무는 없다(대판 1996.1.26. 95다44290). ② 유치권은 법정담보물권이므로 유치권자에게는 원칙적으로 수익목적의 과실수취권이 인정되지 않는다. 다만 유치권자에 의한 유치물의 사용 · 임대 등에 소유자의 승낙이 있거나 그것이 보 존행위에 해당할 경우에는 민법 제323조에 의하여 유치권자는 유치물의 과실을 수취하여 다른 채권보다 먼저 자기 채권의 변제에 충당할 수 있다(대판 2018.1.25. 2015다57485). 제323조【과실수취권】 ① 유치권자는 유치물의 과실을 수취하여 다른 채권보다 먼저 그 채권의 변제에 충당할 수 있다. 그러나 과실이 금전이 아닌 때에는 경매하여야 한다. ② 과실은 먼저 채권의 이자에 충당하고 그 잉여가 있으면 원본에 충당한다. ③ 제202조【점유자의 회복자에 대한 책임】점유물이 점유자의 책임 있는 사유로 인하여 멸실 또는 훼손된 때에는 악의의 점유자는 그 손해의 전부를 배상하여야 하며 선의의 점유자는 이익이 현존하는 한도에서 배상하여야 한다. 소유의 의사가 없는 점유자는 선의인 경우에도 손해의 전부를 배 상하여야 한다. ④ 민법 제203조 제1항, 제2항에 의한 점유자의 필요비 또는 유익비상환청구권은 점유자가 회복 자로부터 점유물의 반환을 청구받거나 회복자에게 점유물을 반환한 때에 비로소 회복자에 대하 여 행사할 수 있다(대판 1994.9.9. 94다4592). ⑤ 민법 제203조 제2항에 의한 점유자의 회복자에 대한 유익비상환청구권은 점유자가 계약관계 등 적법하게 점유할 권리를 가지지 않아 소유자의 소유물반환청구에 응하여야 할 의무가 있는 경우에 성립되는 것으로서, 이 경우 점유자는 그 비용을 지출할 당시의 소유자가 누구이었는지 관계없이 점유회복 당시의 소유자 즉 회복자에 대하여 비용상환청구권을 행사할 수 있는 것이 나, 점유자가 유익비를 지출할 당시 계약관계 등 적법한 점유의 권원을 가진 경우에 그 지출비 용의 상환에 관하여는 그 계약관계를 규율하는 법조항이나 법리 등이 적용되는 것이어서, 점유 자는 그 계약관계 등의 상대방에 대하여 해당 법조항이나 법리에 따른 비용상환청구권을 행사 할 수 있을 뿐 계약관계 등의 상대방이 아닌 점유회복 당시의 소유자에 대하여 민법 제203조 제2항에 따른 지출비용의 상환을 구할 수는 없다(대판 2003.7.25. 2001다64752). ■ 점유자와 회복자 관계1) 점유자의 점유자의 과실2)취득 점유자의 비용상환청구권 멸실ㆍ훼손의 책임 ① 선의의 점유자 ① 원칙 : 전부 배상 ① 선의⋅악의 및 자주⋅타주 불문 : 선의(본권이 있다고 오신) + ② 예외 : 선의&자주 비용상환청구 가능 오신할 만한 정당한 근거가 有 〓 현존이익 배상 ② 계약관계가 존재한 경우 : → 과실수취권 인정3) 제203조는 적용 ×, ② 본권에 관한 소에서 패소한 때 ③ 필요비 : 과실을 취득한 경우(선의)에 소가 제기된 때부터 악의로 간주 통상의 필요비는 청구× 효과 (제197조 제2항). ④ 유익비 ⅰ) 가액의 증가가 현존 ③ 악의의 점유자의 구체적 반환범위 ⅱ) 회복자의 선택채권 제201조 제2항 × ⅲ) 상당기간 허여 가능 제748조 제2항 적용 ⑤ 필요비⋅유익비에 기한 유치권 인정4) (받은 이익 + 이자 + 지연손해금) ⑥ 필요비⋅유익비의 상환청구시기 : ④ 악의 점유자 = 폭력⋅은비의 점유자 반환하거나 반환청구 받은 때", "2021-32-민법-23": "① 비법인사단이 총유물에 관한 매매계약을 체결하는 행위는 총유물 그 자체의 처분이 따르는 채 무부담행위로서 총유물의 처분행위에 해당하나, 그 매매계약에 의하여 부담하고 있는 채무의 존재를 인식하고 있다는 뜻을 표시하는 데 불과한 소멸시효 중단사유로서의 승인은 총유물 그 자체의 관리·처분이 따르는 행위가 아니어서 총유물의 관리·처분행위라고 볼 수 없다(대판 2009.11.26. 2009다64383). ② 비법인사단이 타인 간의 금전채무를 보증하는 행위는 총유물 그 자체의 관리⋅처분이 따르지 아니하는 단순한 채무부담행위에 불과하여 이를 총유물의 관리⋅처분행위라고 볼 수는 없다(대판 (전) 2007.4.19. 2004다60072⋅60089). ③, ④ 총유재산에 관한 소송은 법인 아닌 사단이 그 명의로 사원총회의 결의를 거쳐 하거나 또는 그 구성원 전원이 당사자가 되어 필수적 공동소송의 형태로 할 수 있을 뿐 그 사단의 구성원은 설령 그가 사단의 대표자라거나 사원총회의 결의를 거쳤다 하더라도 그 소송의 당사자가 될 수 없 고, 이러한 법리는 총유재산의 보존행위로서 소를 제기하는 경우에도 마찬가지이다(대판(전) 2005.9.15. 2004다44971). ⑤ 무주택자들이 조합원이 되어 조합원들의 공동주택을 건립하기 위하여 설립한 주택조합이 공동 주택 건설사업이라는 단체 고유의 목적을 가지고 활동하며 규약 및 단체로서의 조직을 갖추고 집행기관인 대표자가 있고 의결이나 업무집행 방법이 총회의 다수결의 원칙에 따라 행해지며 구성원의 가입 탈퇴에 따른 변경에 관계 없이 단체 그 자체가 존속하는 등 단체로서의 중요사 항이 확정되어 있다면 조합이라는 명칭에 불구하고 비법인사단에 해당하므로(대판 2000.7.7. 2000다18271 참조), 주택조합이 주체가 되어 신축 완공한 건물로서 일반에게 분양되는 부분은 조합원 전원의 총유에 속하며, 총유물의 관리 및 처분에 관하여 주택조합의 정관이나 규약에 정한 바가 있으면 이에 따라야 하고, 그에 관한 정관이나 규약이 없으면 조합원 총회의 결의에 의하여야 할 것이며, 그와 같은 절차를 거치지 않은 행위는 무효라고 할 것이다(대판 2003.7.11. 2001다73626).", "2021-32-민법-24": "①, ④ 취득시효의 요건인 점유는 직접점유뿐만 아니라 간접점유도 포함하는 것이고, 점유매개 관 계는 법률의 규정, 국가행위 등에 의해서도 발생하는 것인데, 자연공원법의 개정으로 국립공원 관리공단이 설립되어 1987. 7. 1.부터 북한산 국립공원의 관리업무가 지방자치단체에서 그 공단 에 인계되어 그 후부터 그 공단이 당해 임야를 포함한 북한산 국립공원의 관리업무를 수행하였 다고 하더라도, 같은 법 제49조의16 제2항이 \"지방자치단체는 당해 행정구역 안에 있는 국립공 원의 관리에 사용된 토지, 건물 등의 부동산을 국립공원관리공단으로 하여금 무상으로 사용하 게 할 수 있다.\"고 규정하고 있음에 비추어 지방자치단체는 그 임야에 관하여 국립공원관리공단 에게 반환을 청구할 수 있는 지위에 있고 따라서 1987. 7. 1. 이후에는 그 임야에 대하여 간접 점유를 취득하였다고 할 것이다(대판 1998.2.24. 96다8888). ② 사기의 의사표시에 의해 건물을 명도해 준 것이라면 건물의 점유를 침탈당한 것이 아니므로 피해자는 점유회수의 소권을 가진다고 할 수 없다(대판 1992.2.28. 91다17443). ③ 사회통념상 건물은 그 부지를 떠나서는 존재할 수 없는 것이므로 건물의 부지가 된 토지는 그 건물의 소유자가 점유하는 것으로 볼 것이고, 이 경우 건물의 소유자가 현실적으로 건물이나 그 부지를 점거하고 있지 아니하고 있더라도 그 건물의 소유를 위하여 그 부지를 점유한다고 보아야 하며, 미등기건물을 양수하여 건물에 관한 사실의 처분권을 보유하게 된 양수인은 건물 부지 역시 아울러 점유하고 있다고 볼 수 있다(대판 2010.1.28. 2009다61193). ⑤ 상속에 의하여 점유권을 취득한 경우에는 상속인은 새로운 권원에 의하여 자기 고유의 점유를 개시하지 않는 한 피상속인의 점유를 떠나 자기만의 점유를 주장할 수 없다(대판 1995.1.12. 94다19884).", "2021-32-민법-25": "① 민법 제249조의 선의취득은 점유인도를 물권변동의 요건으로 하는 동산의 소유권취득에 관한 규정으로서(동법 제343조에 의하여 동산질권에도 준용) 저당권의 취득에는 적용될 수 없다(대판 1985.12.24. 84다카2428). ② 동산의 선의취득에 필요한 점유의 취득은 현실적 인도가 있어야 하고 점유개정에 의한 점유취 득만으로서는 그 요건을 충족할 수 없다(대판 1978.1.17, 77다1872). ③ 선의⋅무과실의 판단시점은 물권행위가 완성되는 때를 기준으로 한다. 양수인이 물권적 합의 시점에 선의⋅무과실이면, 이후 인도받을 때에 악의이거나 과실이 있더라도 선의취득이 인정되 는 것이 아니라, 인도받을 때에도, 즉 물권행위가 완성된때까지 선의⋅무과실이 계속되어야 한 다(대판 1991.3.22. 91다70). ④ 민법 제251조의 규정은 선의취득자에게 그가 지급한 댓가의 변상을 받을 때까지는 그 물건의 반환청구를 거부할 수 있는 항변권만을 인정한 것이 아니고 피해자가 그 물건의 반환을 청구하 거나 어떠한 원인으로 반환을 받은 경우에는 그 댓가변상의 청구권이 있다는 취지이다(대판 1972.5.23. 72다115). 제251조【도품, 유실물에 대한 특례】양수인이 도품 또는 유실물을 경매나 공개시장에서 또는 동종류의 물건을 판매하는 상인에게서 선의로 매수한 때에는 피해자 또는 유실자는 양수인이 지급한 대가를 변상하고 그 물건의 반환을 청구할 수 있다. ⑤ 선의취득에서 양수인의 점유취득에는 목적물 반환청구권의 양도에 의한 선의취득은 인정된다. 즉 양도인이 소유자로부터 보관을 위탁받은 동산을 제3자에게 보관시킨 경우에 양도인이 그 제 3자에 대한 반환청구권을 양수인에게 양도하고 지명채권 양도의 대항요건을 갖추었을 때에는 동산의 선의취득에 필요한 점유의 취득 요건을 충족한다(대판 1999.1.26. 97다48906).", "2021-32-민법-26": "① 상호명의신탁관계 내지 구분소유적 공유관계에서 건물의 특정 부분을 구분소유하는 자는 그 부분에 대하여 신탁적으로 지분등기를 가지고 있는 자를 상대로 하여 그 특정 부분에 대한 명 의신탁 해지를 원인으로 한 지분이전등기절차의 이행을 구할 수 있을 뿐 그 건물 전체에 대한 공유물분할을 구할 수는 없다(대판 2010.5.27, 2006다84171). ②, ④ 1필지의 토지 중 일부를 특정하여 매수하고 다만 그 소유권이전등기는 그 필지 전체에 관 하여 공유지분권이전등기를 한 경우에는 그 특정부분 이외의 부분에 관한 등기는 상호 명의신 탁을 하고 있는 것으로서, 그 지분권자는 내부관계에 있어서는 특정부분에 한하여 소유권을 취 득하고 이를 배타적으로 사용, 수익할 수 있고, 다른 구분소유자의 방해행위에 대하여는 소유권 에 터잡아 그 배제를 구할 수 있으나, 외부관계에 있어서는 1필지 전체에 관하여 공유관계가 성 립되고 공유자로서의 권리만을 주장할 수 있는 것이므로, 제3자의 방해행위가 있는 경우에는 자기의 구분소유 부분뿐 아니라 전체토지에 대하여 공유물의 보존행위로서 그 배제를 구할 수 있다(대판 1994.2.8. 93다42986). ③ 1필지의 토지의 위치와 면적을 특정하여 2인 이상이 구분소유하기로 하는 약정을 하고 그 구 분소유자의 공유로 등기하는 이른바 구분소유적 공유관계에 있어서, 각 구분소유적 공유자가 자신의 권리를 타인에게 처분하는 경우 중에는 구분소유의 목적인 특정 부분을 처분하면서 등 기부상의 공유지분을 그 특정 부분에 대한 표상으로서 이전하는 경우와 등기부의 기재대로 1필 지 전체에 대한 진정한 공유지분으로서 처분하는 경우가 있을 수 있고, 이 중 전자의 경우에는 그 제3자에 대하여 구분소유적 공유관계가 승계되나, 후자의 경우에는 제3자가 그 부동산 전체 에 대한 공유지분을 취득하고 구분소유적 공유관계는 소멸한다(대판 2008.2.15. 2006다68810, 68827). 구분소유적 공유지분을 매수한 자는 당연히 구분소유적 공유관계를 승계하는 것이 아 니라, 합의내용에 따라 구분소유적 공유관계를 승계할 수도 있고 1필지 전체에 대한 공유지분을 취득할 수도 있다. ⑤ 구분소유적 공유관계는 어떤 토지에 관하여 그 위치와 면적을 특정하여 여러 사람이 구분소유 하기로 하는 약정이 있어야만 적법하게 성립할 수 있고, 공유자들 사이에 그 공유물을 분할하 기로 약정하고 그 때부터 각자의 소유로 분할된 부분을 특정하여 각자 점유·사용하여 온 경우 에도 구분소유적 공유관계가 성립할 수 있지만, 공유자들 사이에서 특정 부분을 각각의 공유자 들에게 배타적으로 귀속시키려는 의사의 합치가 이루어지지 아니한 경우에는 이러한 관계가 성 립할 여지가 없다(대판 2005.4.29. 2004다71409).", "2021-32-민법-27": "① 등기부 취득시효와 달리 무과실은 점유취득시효의 요건이 아니다. 제245조【점유로 인한 부동산소유권의 취득기간】 ① 0년간 소유의 의사로 평온, 공연 2 점유하는 자는 등기 하게 부동산을 함으로써 그 소유권을 취득한다.⤑ ⋅ × 선의 무과실 ② 부동산의 소유자로등기한 자 10년간 소유의 의사로 평온, 공연 가 하게 선의이며 과실 없이 점유한 때 그 부동산을 에는 소유권을 취득한다. ② 성명불상자의 소유물에 대해서도 시효취득이 가능하다(대판 1992.2.25, 91다9312). ③ 민법은 취득시효의 경우 취득시효이익의 포기에 관한 규정은 두고 있지 않은데, 소멸시효 이익 의 사전 포기금지규정(제184조 제1항)을 유추적용하여 시효완성 전에는 포기할 수 없으나 시효완성 후에는 포기하는 것이 가능하다. ④ 행정목적을 위하여 공용되는 행정재산은 공용폐지가 되지 않는 한 사법상 거래의 대상이 될 수 없으므로 취득시효의 대상도 될 수 없다(대판 1983.6.14. 83다카181). ⑤ 민법 제247조 제2항은 ʻ소멸시효의 중단에 관한 규정은 점유로 인한 부동산소유권의 시효취득 기간에 준용한다.ʼ고 규정하고, 민법 제168조 제2호는 소멸시효 중단사유로 ʻ압류 또는 가압류, 가처분ʼ을 규정하고 있다. 점유로 인한 부동산소유권의 시효취득에 있어 취득시효의 중단사유 는 종래의 점유상태의 계속을 파괴하는 것으로 인정될 수 있는 사유이어야 하는데, 민법 제 168조 제2호에서 정하는 ʻ압류 또는 가압류ʼ는 금전채권의 강제집행을 위한 수단이거나 그 보전수 단에 불과하여 취득시효기간의 완성 전에 부동산에 압류 또는 가압류 조치가 이루어졌다고 하 더라도 이로써 종래의 점유상태의 계속이 파괴되었다고는 할 수 없으므로 이는 취득시효의 중단사 유가 될 수 없다(대판(전) 2009.7.16, 2007다15172⋅15189).", "2021-32-민법-28": "ㄱ. (×) : 중간생략등기의 합의가 있었다 하더라도 이러한 합의는 중간등기를 생략하여도 당사자 사이에 이의가 없겠고 또 그 등기의 효력에 영향을 미치지 않겠다는 의미가 있을 뿐이지 그러 한 합의가 있었다 하여 중간매수인의 소유권이전등기청구권이 소멸된다거나 첫 매도인의 그 매수인에 대한 소유권이전등기의무가 소멸되는 것은 아니라 할 것이다(대판 1991.12.13. 91다 18316). 따라서 甲, 乙, 丙 사이에 중간생략등기에 관한 합의가 있다 하더라도，甲의 乙에 대한 소유권이전등기의무는 소멸하는 것은 아니다. ㄴ. (×) : 부동산매매계약에서 매도인과 매수인은 서로 동시이행관계에 있는 일정한 의무를 부담 하므로 이행과정에 신뢰관계가 따른다. 특히 매
