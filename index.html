ec_no":"민법","curr_lecture":"","professor":"34회","stem":"부동산의 점유취득시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["집합건물의 공용부분은 취득시효에 의한 소유권 취득의 대상이 될 수 없다.","시효완성을 이유로 한 소유권취득의 효력은 점유를 개시한 때로 소급하지 않으며 등기를 함으로써 장래를 향하여 발생한다.","점유자가 점유 개시 당시에 소유권 취득의 원인이 될 수 있는 법률행위가 없다는 사실을 알면서 타인 소유의 토지를 무단점유한 것이 증명된 경우, 그 토지 소유권의 시효취득은 인정되지 않는다.","시효완성자는 취득시효의 기산점과 관련하여 점유기간을 통틀어 등기명의인이 동일한 경우에는 임의의 시점을 기산점으로 할 수 있다.","시효이익의 포기는 특별한 사정이 없는 한, 시효취득자가 취득시효완성 당시의 진정한 소유자에 대하여 하여야 한다."],"answer":[2],"image":null},{"id":"2023-34-민법-30","year":2023,"qnum":30,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"부합에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["부동산에의 부합 이외에 동산 상호간의 부합도 인정된다.","동산 이외에 부동산은 부합물이 될 수 없다.","동일인 소유의 부동산과 동산 상호간에는 원칙적으로 부합이 인정되지 않는다.","분리가 가능하지만 분리할 경우 상호 부착되거나 결합된 물건의 경제적 가치가 심하게 손상되는 경우에도 부합이 인정된다.","부동산의 소유자는 원칙적으로 그 부동산에 부합한 물건의 소유권을 취득한다."],"answer":[2],"image":null},{"id":"2023-34-민법-31","year":2023,"qnum":31,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"공동소유에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["공유자는 다른 공유자의 동의 없이 공유물을 처분하거나 변경하지 못한다.","합유는 수인이 조합체로서 물건을 소유하는 형태이고, 조합원은 자신의 지분을 조합원 전원의 동의 없이 처분할 수 없다.","합유물에 대한 보존행위는 합유자 전원의 동의를 요하지 않는다.","구조상·이용상 독립성이 있는 건물부분이라 하더라도 구분소유적 공유관계는 성립할 수 없다.","공유물분할 금지약정은 갱신할 수 있다."],"answer":[4],"image":null},{"id":"2023-34-민법-32","year":2023,"qnum":32,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"부동산 실권리자명의 등기에 관한 법률에 대한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["명의신탁자에게 법률효과를 직접 귀속시킬 의도의 매매계약을 체결한 사정이 인정되더라도, 부동산매매계약서에 명의수탁자가 매수인으로 기재되어 있다면 계약명의신탁으로 보아야 한다.","부동산소유권 또는 그 공유지분은 명의신탁 대상이 되지만, 용익물권은 명의신탁의 대상이 될 수 없다.","탈법적 목적이 없는 종중재산의 명의신탁에 있어서 종중은 명의신탁재산에 대한 불법점유자 내지 불법등기명의자에 대하여 직접 그 인도 또는 등기말소를 청구할 수 있다.","탈법적 목적이 없더라도 사실혼 배우자간의 명의신탁은 무효이다.","계약당사자인 매수인이 명의수탁자라는 사정을 매도인이 알지 못하였더라도, 매매로 인한 물권변동은 무효이다."],"answer":[4],"image":null},{"id":"2023-34-민법-33","year":2023,"qnum":33,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"지상권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["건물의 소유를 목적으로 하는 지상권의 양도는 토지소유자의 동의를 요한다.","지료합의가 없는 지상권 설정계약은 무효이다.","수목의 소유를 목적으로 하는 지상권의 최단존속기간은 10년이다.","지상권이 설정된 토지의 소유자는 그 지상권자의 승낙 없이 그 토지 위에 구분지상권을 설정할 수 있다.","「장사 등에 관한 법률」 시행 이전에 설치된 분묘에 관한 분묘기지권의 시효취득은 법적 규범으로 유지되고 있다."],"answer":[5],"image":null},{"id":"2023-34-민법-34","year":2023,"qnum":34,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"지역권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["지역권은 요역지의 사용가치를 높이기 위해 승역지를 이용하는 것을 내용으로 하는 물권이다.","요역지와 승역지는 서로 인접한 토지가 아니어도 된다.","요역지 공유자 중 1인에 대한 지역권 소멸시효의 정지는 다른 공유자를 위하여도 효력이 있다.","지역권자는 승역지의 점유침탈이 있는 경우, 지역권에 기하여 승역지 반환청구권을 행사할 수 있다.","지역권은 계속되고 표현된 것에 한하여 시효취득할 수 있다."],"answer":[4],"image":null},{"id":"2023-34-민법-35","year":2023,"qnum":35,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"전세권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["건물 일부의 전세권자는 나머지 건물 부분에 대해서도 경매신청권이 있다.","전세권 설정계약의 당사자는 전세권의 사용·수익권능을 배제하고 채권담보만을 위한 전세권을 설정할 수 있다.","전세권설정시 전세금 지급은 전세권 성립의 요소이다.","전세권자는 특별한 사정이 없는 한 전세권의 존속기간 내에서 전세목적물을 타인에게 전전세 할 수 없다.","전세권이 소멸된 경우, 전세권자의 전세목적물의 인도는 전세금의 반환보다 선이행되어야 한다."],"answer":[3],"image":null},{"id":"2023-34-민법-36","year":2023,"qnum":36,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"유치권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["유치물의 소유자가 변동된 후 유치권자가 유치물에 관하여 새로이 유익비를 지급하여 가격증가가 현존하는 경우, 유치권자는 그 유익비를 피보전채권으로 하여서도 유치권을 행사할 수 있다.","다세대주택의 창호공사를 완성한 하수급인이 공사대금채권 잔액을 변제받기 위하여 그 중 한 세대를 점유하는 유치권 행사는 인정되지 않는다.","수급인의 재료와 노력으로 건물을 신축한 경우, 특별한 사정이 없는 한 그 건물에 대한 수급인의 유치권은 인정되지 않는다.","유치권의 목적이 될 수 있는 것은 동산, 부동산 그리고 유가증권이다.","유치권자가 유치물에 대한 보존행위로서 목적물을 사용하는 것은 적법하다."],"answer":[2],"image":null},{"id":"2023-34-민법-37","year":2023,"qnum":37,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"질권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["점유개정에 의한 동산질권설정은 인정되지 않는다.","질권자는 채권 전부를 변제받을 때까지 질물 전부에 대하여 그 권리를 행사할 수 있다.","질물이 공용징수된 경우, 질권자는 질권설정자가 받을 수용보상금에 대하여도 질권을 행사할 수 있다.","전질은 질물소유자인 질권설정자의 승낙이 있어도 허용되지 않는다.","부동산의 사용, 수익을 내용으로 하는 질권은 물권법정주의에 반한다."],"answer":[4],"image":null},{"id":"2023-34-민법-38","year":2023,"qnum":38,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"저당권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["채권자와 제3자가 불가분적 채권자의 관계에 있다고 볼 수 있는 경우에는 그 제3자 명의의 저당권등기도 유효하다.","근저당권설정자가 적법하게 기본계약을 해지하면 피담보채권은 확정된다.","무효인 저당권등기의 유용은 그 유용의 합의 전에 등기상 이해관계가 있는 제3자가 없어야 한다.","저당부동산의 제3취득자는 부동산의 개량을 위해 지출한 유익비를 그 부동산의 경매대가에서 우선 변제받을 수 없다.","저당권자가 저당부동산을 압류한 이후에는 저당권설정자의 저당부동산에 관한 차임채권에도 저당권의 효력이 미친다."],"answer":[4],"image":null},{"id":"2023-34-민법-39","year":2023,"qnum":39,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"乙명의의 저당권이 설정되어 있는 甲소유의 X토지 위에 Y건물이 신축된 후, 乙의 저당권이 실행된 경우에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 甲이 Y건물을 신축한 경우, 乙은 Y건물에 대한 경매도 함께 신청할 수 있으나 Y건물의 경매대가에서 우선변제를 받을 수는 없다.\nㄴ. Y건물을 甲이 건축하였으나 경매 당시 제3자 소유로 된 경우, 乙은 Y건물에 대한 경매도 함께 신청할 수 있다.\nㄷ. Y건물이 X토지의 지상권자인 丙에 의해 건축되었다가 甲이 Y건물의 소유권을 취득하였다면 乙은 Y건물에 대한 경매도 함께 신청할 수 있다.","stem_table":null,"options":["ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[3],"image":null},{"id":"2023-34-민법-40","year":2023,"qnum":40,"curr_lec_no":"민법","curr_lecture":"","professor":"34회","stem":"법정지상권의 성립에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["토지에 저당권이 설정된 후에 저당권자의 동의를 얻어 건물이 신축된 경우라도 법정지상권은 성립한다.","토지의 정착물로 볼 수 없는 가설 건축물의 소유를 위한 법정지상권은 성립하지 않는다.","무허가건물이나 미등기건물을 위해서도 관습법상의 법정지상권이 인정될 수 있다.","토지공유자 중 1인이 다른 공유자의 동의를 얻어 그 지상에 건물을 소유하면서 자신의 토지지분에 저당권을 설정한 후 그 실행경매로 인하여 그 공유지분권자와 건물소유자가 달라진 경우에는 법정지상권이 성립하지 않는다.","동일인 소유의 토지와 건물 중 건물에 전세권이 설정된 후 토지소유자가 바뀐 경우, 건물소유자가 그 토지에 대하여 지상권을 취득한 것으로 본다."],"answer":[1],"image":null},{"id":"2024-35-민법-1","year":2024,"qnum":1,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"민법의 법원(法源)에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["민사에 관한 헌법재판소의 결정은 민법의 법원이 될 수 있다.","사적자치가 인정되는 분야의 제정법이 주로 임의규정인 경우, 사실인 관습은 법률행위 해석기준이 될 수 있다.","법원(法院)은 판례변경을 통해 기존 관습법의 효력을 부정할 수 있다.","관습법은 사회 구성원의 법적 확신으로 성립된 것이므로 제정법과 배치되는 경우에는 관습법이 우선한다.","법원(法院)은 관습법에 관한 당사자의 주장이 없더라도 직권으로 그 존재를 확정할 수 있다."],"answer":[4],"image":null},{"id":"2024-35-민법-2","year":2024,"qnum":2,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"신의성실의 원칙에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["숙박계약상 숙박업자는 투숙객의 안전을 배려하여야 할 신의칙상 보호의무를 부담한다.","입원계약상 병원은 입원환자에 대하여 휴대품 도난 방지를 위하여 필요한 적절한 조치를 할 신의칙상 보호의무가 있다.","기획여행계약상 여행업자는 여행객의 신체나 재산의 안전을 배려할 신의칙상 보호의무를 부담한다.","계약성립의 기초가 되지 않은 사정의 변경으로 일방당사자가 계약 당시 의도한 계약목적을 달성할 수 없게 되어 손해를 입은 경우, 그 계약의 효력을 그대로 유지하는 것은 특별한 사정이 없는 한 신의칙에 반한다.","토지거래허가구역 내의 토지에 관해 허가를 받지 않고 매매계약을 체결한 자가 허가가 없음을 이유로 그 계약의 무효를 주장하는 것은 특별한 사정이 없는 한 신의칙에 반하지 않는다."],"answer":[4],"image":null},{"id":"2024-35-민법-3","year":2024,"qnum":3,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"의사무능력자 甲은 乙 은행으로부터 5천만 원을 차용하는 대출거래약정을 체결하면서 그 담보로 자신의 X 부동산에 근저당권을 설정하고 乙명의로 그 설정등기를 마쳐주었다. 이에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 甲과 乙이 체결한 대출거래약정 및 근저당권설정계약은 무효이다.\nㄴ. 甲은 그 선의ㆍ악의를 묻지 않고 乙에 대하여 현존이익을 반환할 책임이 있다.\nㄷ. 만약 甲이 乙로부터 대출받은 금원을 곧바로 丙에게 다시 대여하였다면, 乙은 甲에게 丙에 대한 부당이득반환채권의 양도를 구할 수 있다.","stem_table":null,"options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄴ, ㄷ"],"answer":[5],"image":null},{"id":"2024-35-민법-4","year":2024,"qnum":4,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"제한능력자에 관한 설명으로 옳은 것은?","stem_table":null,"options":["미성년자가 법정대리인으로부터 허락을 얻은 특정한 영업에 관해서는 법정대리인의 대리권이 소멸한다.","제한능력을 이유로 하는 취소는 특별한 사정이 없는 한 선의의 제3자에게 대항할 수 없다.","제한능력자의 단독행위는 유효한 추인이 있은 후에도 상대방이 거절할 수 있다.","가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 없다.","가정법원은 정신적 제약으로 특정한 사무에 관해 후원이 필요한 사람에 대해서는 본인의 의사에 반하더라도 특정후견 심판을 할 수 있다."],"answer":[1],"image":null},{"id":"2024-35-민법-5","year":2024,"qnum":5,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"비법인사단 A의 유일한 대표자 甲은 乙에게 대표자로서의 모든 권한을 포괄적으로 위임하고 자신은 이사의 직무를 집행하지 않았다. 이에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 甲의 행위는 이사의 직무상 선량한 관리자의 주의의무를 위반한 행위이다.\nㄴ. 乙이 A의 사실상 대표자로서 丙과 금전소비대차계약을 체결한 경우, 그 계약의 효력은 원칙적으로 A에게 미친다.\nㄷ. 乙이 A의 사실상 대표자로서 사무를 집행하면서 그 직무에 관한 불법행위로 丁에게 손해를 입힌 경우, A는 丁에 대하여 법인의 불법행위로 인한 손해배상책임을 부담한다.","stem_table":null,"options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[3],"image":null},{"id":"2024-35-민법-6","year":2024,"qnum":6,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"사단법인 A의 대표이사 甲이 A를 대표하여 乙과 금전소비대차계약을 체결하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲이 A를 위하여 적법한 대표권 범위 내에서 계약을 체결한 경우, 그 계약의 효력은 A에게 미친다.","甲이 자신의 사익을 도모할 목적으로 대표권 범위 내에서 계약을 체결한 경우, 乙이 이 사실에 대해 알았다면 계약은 A에 대하여 효력이 없다.","A의 정관에 甲이 금전소비대차계약을 체결할 수 없다는 규정이 있었지만 이를 등기하지 않은 경우, 乙이 이 사실에 대해 알았다면 A는 그 정관 규정으로 乙에게 대항할 수 있다.","A의 乙에 대한 계약상 채무불이행책임 여부를 판단하는 경우, 원칙적으로 A의 고의·과실은 甲을 기준으로 결정한다.","만약 계약의 체결이 甲과 A의 이해가 상반하는 사항인 경우, 甲은 계약체결에 대해 대표권이 없다."],"answer":[3],"image":null},{"id":"2024-35-민법-7","year":2024,"qnum":7,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"민법상 사단법인에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["설립자가 법인의 해산사유를 정하는 경우에는 정관에 그 사유를 기재하여야 한다.","사원총회 결의에 의한 정관의 해석은 정관의 규범적 의미와 다르더라도 법인의 구성원을 구속하는 효력이 있다.","사원의 지위는 정관에 달리 정함이 없으면 양도할 수 없다.","정관에 이사의 해임사유에 관한 규정이 있는 경우, 법인은 특별한 사정이 없는 한 정관에서 정하지 않은 사유로 이사를 해임할 수 없다.","법원의 직무집행정지 가처분결정에 의해 권한이 정지된 대표이사가 그 정지기간 중 체결한 계약은 그 후 가처분신청이 취하되었더라도 무효이다."],"answer":[2],"image":null},{"id":"2024-35-민법-8","year":2024,"qnum":8,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"권리의 객체에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["토지의 개수는 공간정보의 구축 및 관리 등에 관한 법률에 의한 지적공부상 토지의 필수(筆數)를 표준으로 결정된다.","1필의 토지의 일부가 공간정보의 구축 및 관리 등에 관한 법률상 분할절차 없이 분필등기가 된 경우, 그 분필등기가 표상하는 부분에 대한 등기부취득시효가 인정될 수 있다.","주물에 대한 점유취득시효의 효력은 점유하지 않은 종물에 미치지 않는다.","주물의 상용에 제공된 X 동산이 타인 소유이더라도 주물에 대한 경매의 매수인이 선의취득 요건을 구비하는 경우, 그 매수인은 X의 소유권을 취득할 수 있다.","명인방법을 갖춘 미분리과실은 독립한 물건으로서 거래의 객체가 될 수 있다."],"answer":[2],"image":null},{"id":"2024-35-민법-9","year":2024,"qnum":9,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"불공정한 법률행위에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["불공정한 법률행위에 해당하는지는 원칙적으로 법률행위 시를 기준으로 판단한다.","대리인에 의한 법률행위의 경우, 궁박 상태의 여부는 본인을 기준으로 판단한다.","경매에는 불공정한 법률행위에 관한 민법 제104조가 적용되지 않는다.","불공정한 법률행위는 추인으로 유효로 될 수 없지만 법정추인은 인정된다.","불공정한 법률행위는 이를 기초로 새로운 이해관계를 맺은 선의의 제3자에 대해서도 무효이다."],"answer":[4],"image":null},{"id":"2024-35-민법-10","year":2024,"qnum":10,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"의사표시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["의사표시자가 통지를 발송한 후 사망하더라도 그 의사표시의 효력에 영향을 미치지 않는다.","통정허위표시의 경우, 통정의 동기나 목적은 허위표시의 성립에 영향이 없다.","통정허위표시로 무효인 경우, 당사자는 가장행위의 채무불이행이 있더라도 이를 이유로 하는 손해배상을 청구할 수 없다.","착오로 인하여 표의자가 경제적 불이익을 입지 않는 경우에는 특별한 사정이 없는 한 중요부분의 착오라고 할 수 없다.","상대방이 표의자의 착오를 알고 이용하였더라도 착오가 표의자의 중대한 과실로 인한 경우에는 표의자는 착오를 이유로 그 의사표시를 취소할 수 없다."],"answer":[5],"image":null},{"id":"2024-35-민법-11","year":2024,"qnum":11,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"사기ㆍ강박에 의한 의사표시에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["피기망자에게 손해를 가할 의사는 사기에 의한 의사표시의 성립요건이다.","상대방이 불법으로 어떤 해악을 고지하였다면, 표의자가 이로 말미암아 공포심을 느끼지 않았더라도 강박에 의한 의사표시에 해당한다.","상대방의 대리인이 한 사기는 제3자의 사기에 해당한다.","단순히 상대방의 피용자에 지나지 않는 사람이 한 강박은 제3자의 강박에 해당하지 않는다.","매도인을 기망하여 부동산을 매수한 자로부터 그 부동산을 다시 매수한 제3자는 특별한 사정이 없는 한 선의로 추정된다."],"answer":[5],"image":null},{"id":"2024-35-민법-12","year":2024,"qnum":12,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"甲은 乙의 임의대리인이다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲이 乙로부터 매매계약체결의 대리권을 수여 받아 매매계약을 체결하였더라도 특별한 사정이 없는 한 甲은 그 계약에서 정한 중도금과 잔금을 수령할 권한은 없다.","甲이 乙로부터 금전소비대차 계약을 체결할 대리권을 수여받은 경우, 특별한 사정이 없는 한 甲은 그 계약을 해제할 권한도 가진다.","乙이 사망하더라도 특별한 사정이 없는 한 甲의 대리권은 소멸하지 않는다.","미성년자인 甲이 乙로부터 매매계약체결의 대리권을 수여 받아 매매계약을 체결한 경우, 乙은 甲이 체결한 매매계약을 甲이 미성년자임을 이유로 취소할 수 없다.","甲이 부득이한 사유로 丙을 복대리인으로 선임한 경우, 丙은 甲의 대리인이다."],"answer":[4],"image":null},{"id":"2024-35-민법-13","year":2024,"qnum":13,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"표현대리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["표현대리행위가 성립하는 경우, 상대방에게 과실이 있더라도 과실상계의 법리를 유추적용하여 본인의 책임을 경감할 수 없다.","상대방의 유권대리 주장에는 표현대리의 주장이 포함되는 것은 아니므로 이 경우 법원은 표현대리의 성립여부까지 판단해야 하는 것은 아니다.","민법 제126조의 권한을 넘은 표현대리 규정은 법정대리에도 적용된다.","복대리인의 대리행위에 대해서는 표현대리가 성립할 수 없다.","수권행위가 무효인 경우, 민법 제129조의 대리권 소멸 후의 표현대리가 적용되지 않는다."],"answer":[4],"image":null},{"id":"2024-35-민법-14","year":2024,"qnum":14,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"乙은 대리권 없이 甲을 위하여 甲소유의 X토지를 丙에게 매도하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["乙이 丙으로부터 받은 매매대금을 甲이 수령한 경우, 특별한 사정이 없는 한 甲은 위 매매계약을 추인한 것으로 본다.","甲이 乙을 상대로 위 매매계약의 추인을 한 경우, 그 사실을 丙이 안 때에는 甲은 丙에게 추인의 효력을 주장할 수 있다.","甲을 단독상속한 乙이 자신의 매매행위가 무효임을 주장하는 것은 신의칙에 반하여 허용되지 않는다.","丙이 甲에게 기간을 정하여 그 추인 여부의 확답을 최고하였으나 甲이 기간 내에 확답을 발송하지 않으면 추인은 거절한 것으로 본다.","甲이 추인을 하더라도 丙은 乙을 상대로 무권대리인의 책임에 따른 손해배상을 청구할 수 있다."],"answer":[5],"image":null},{"id":"2024-35-민법-15","year":2024,"qnum":15,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"甲은 토지거래허가구역 내에 있는 자신의 X토지에 대해 허가를 받을 것을 전제로 乙에게 매도하는 계약을 체결하였으나 아직 허가는 받지 않은 상태이다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["乙은 甲에게 계약의 이행을 청구할 수 없다.","甲이 토지거래허가신청절차에 협력하지 않는 경우, 乙은 이를 이유로 계약을 해제할 수 있다.","토지거래허가구역 지정이 해제된 경우, 특별한 사정이 없는 한 위 매매계약은 확정적으로 유효하다.","甲과 乙이 토지거래허가를 받으면 위 매매계약은 소급해서 유효로 되므로 허가 후에 새로 매매계약을 체결할 필요는 없다.","甲의 사기에 의하여 위 매매계약이 체결된 경우, 乙은 토지거래허가를 신청하기 전이라도 甲의 사기를 이유로 매매계약을 취소할 수 있다."],"answer":[2],"image":null},{"id":"2024-35-민법-16","year":2024,"qnum":16,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"취소에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["매도인에 의해 매매계약이 적법하게 해제된 후에는 매수인은 그 매매계약을 착오를 이유로 취소할 수 없다.","법률행위의 취소를 전제로 한 이행거절 가운데는 특별한 사정이 없는 한 취소의 의사표시가 포함된 것으로 볼 수 있다.","취소할 수 있는 법률행위가 일단 취소된 후에는 취소할 수 있는 법률행위의 추인에 의하여 이를 다시 확정적으로 유효하게 할 수는 없다.","취소권은 추인할 수 있는 날로부터 3년 내에 법률행위를 한 날로부터 10년 내에 행사하여야 한다.","취소할 수 있는 법률행위의 취소권의 행사기간은 제척기간이다."],"answer":[1],"image":null},{"id":"2024-35-민법-17","year":2024,"qnum":17,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"조건과 기한에 관한 설명으로 옳지 않은 것은?","stem_table":null,"options":["기성조건이 정지조건이면 조건 없는 법률행위가 된다.","불능조건이 해제조건이면 조건 없는 법률행위가 된다.","불법조건은 그 조건만이 무효가 되고 그 법률행위는 조건 없는 법률행위로 된다.","기한은 당사자의 특약에 의해서도 소급효를 인정할 수 없다.","기한은 원칙적으로 채무자의 이익을 위한 것으로 추정한다."],"answer":[3],"image":null},{"id":"2024-35-민법-18","year":2024,"qnum":18,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"소멸시효의 기산점이 잘못 연결된 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["불확정기한부 채권 - 기한이 객관적으로 도래한 때","부당이득반환청구권 - 기한의 도래를 안 때","정지조건부 권리 - 조건이 성취된 때","부작위를 목적으로 하는 채권 - 위반행위를 한 때","선택채권 - 선택권을 행사할 수 있을 때"],"answer":[2],"image":null},{"id":"2024-35-민법-19","year":2024,"qnum":19,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"소멸시효의 중단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["응소행위로 인한 시효중단의 효력은 원고가 소를 제기한 때에 발생한다.","물상보증인이 제기한 저당권설정등기 말소등기청구의 소에 응소한 채권자 겸 저당권자의 행위는 시효중단사유가 아니다.","재판상의 청구로 중단된 시효는 재판이 확정된 때부터 새로이 진행한다.","가압류에 의한 시효중단의 효력은 가압류신청을 한 때에 소급한다.","채권의 양수인이 채권양도의 대항요건을 갖추지 못한 상태에서 채무자를 상대로 재판상의 청구를 하는 것은 소멸시효 중단사유에 해당한다."],"answer":[1],"image":null},{"id":"2024-35-민법-20","year":2024,"qnum":20,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"통정허위표시의 무효를 이유로 대항할 수 없는 '제3자'에 해당하지 않는 자는? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["가장소비대차의 계약상의 지위를 이전 받은 자","가장매매의 목적물에 대하여 저당권을 취득한 자","가장의 금전소비대차에 기한 대여금채권을 가압류한 자","가장매매에 의한 매수인으로부터 목적 부동산을 매수하여 소유권이전등기를 마친 자","가장의 전세권설정계약에 기하여 등기가 마쳐진 전세권에 관하여 저당권을 취득한 자"],"answer":[1],"image":null},{"id":"2024-35-민법-21","year":2024,"qnum":21,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"물권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["적법한 분할절차를 거치지 않은 채 토지 중 일부만에 관하여 소유권보존등기를 할 수 없다.","온천에 관한 권리는 관습법상의 물권이 아니다.","1필 토지의 일부도 점유취득시효의 대상이 될 수 있다.","부속건물로 등기된 창고건물은 분할등기 없이 원채인 주택과 분리하여 경매로 매각될 수 있다.","지상권은 저당권의 객체가 될 수 있다."],"answer":[4],"image":null},{"id":"2024-35-민법-22","year":2024,"qnum":22,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"甲이 乙소유 X토지에 권원없이 Y건물을 신축하여 소유하고 있다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["乙은 Y를 관리하는 甲의 직원 A에게 X의 반환청구를 할 수 있다.","甲이 법인인 경우 乙은 甲의 대표이사 B 개인에게 X의 반환청구를 할 수 있다.","乙이 甲에게 X의 반환청구를 하여 승소한 경우, 乙은 甲에게 Y에서 퇴거할 것을 청구할 수 있다.","미등기인 Y를 丙이 매수하여 인도받았다면 乙은 丙을 상대로 건물철거 청구를 할 수 있다.","乙은 甲에 대한 X의 반환청구권을 유보하고 X의 소유권을 丁에게 양도할 수 있다."],"answer":[4],"image":null},{"id":"2024-35-민법-23","year":2024,"qnum":23,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"등기에 의하여 추정되지 않는 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["환매특약등기 - 특약의 진정성립","대리인에 의한 소유권이전등기 - 적법한 대리행위의 존재","저당권등기 - 피담보채권의 존재","부적법하게 말소된 등기 - 말소된 등기상 권리의 존재","토지등기부의 표제부 - 등기부상 면적의 존재"],"answer":[5],"image":null},{"id":"2024-35-민법-24","year":2024,"qnum":24,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"甲이 乙소유 X도자기에 관해 무단으로 丙에게 질권을 설정해 주었고, 丙은 질권의 선의취득을 주장하고 있다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["丙은 평온ㆍ공연하게 X의 점유를 취득하였어야 한다.","丙은 甲이 소유자가 아니라는 사실에 대하여 그 자신이 선의이고 무과실이라는 사실을 증명하여야 한다.","丙이 甲과 질권설정계약을 체결할 당시 선의였다면 질물의 인도를 받을 때 악의라도 丙의 선의취득은 인정된다.","丙이 X에 대하여 甲이 직접점유를 취득하는 형태로 점유를 취득한 경우, 丙의 선의취득은 인정되지 아니한다.","만약 甲이 미성년자임을 이유로 丙과의 질권설정계약을 취소하면 丙은 선의취득을 할 수 없다."],"answer":[3],"image":null},{"id":"2024-35-민법-25","year":2024,"qnum":25,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"점유자와 회복자의 관계에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["지상권자는 선의점유자라도 자주점유자가 아니므로 과실수취권이 인정되지 아니한다.","타주점유자가 점유물을 반환하는 경우, 점유자는 특별한 사정이 없는 한 회복자에 대하여 점유물을 보존하기 위하여 지출한 금액의 상환을 청구할 수 있다.","악의의 점유자는 과실(過失)없이 과실(果實)을 수취하지 못한 경우에도 그 대가를 보상하여야 한다.","점유물이 점유자의 책임있는 사유로 멸실된 경우, 선의의 타주점유자는 이익이 현존하는 한도에서 배상하여야 한다.","점유자가 점유물에 유익비를 지출한 경우, 특별한 사정이 없는 한 점유자는 회복자에 대하여 그 가액의 증가가 현존한 경우에 한하여 점유자의 선택에 좇아 그 지출금액이나 증가액의 상환을 청구할 수 있다."],"answer":[2],"image":null},{"id":"2024-35-민법-26","year":2024,"qnum":26,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"상린관계에 관한 설명으로 옳지 않은 것은?","stem_table":null,"options":["경계에 설치된 담이 공유인 경우, 공유자는 그 분할을 청구할 수 있다.","인접하여 토지를 소유한 자는 다른 관습이 없으면 공동비용으로 통상의 경계표나 담을 설치할 수 있다.","경계표 설치를 위한 측량비용은 다른 관습이 없으면 토지의 면적에 비례하여 부담한다.","인접지의 수목뿌리가 경계를 넘은 경우, 토지소유자는 임의로 그 뿌리를 제거할 수 있다.","건물을 축조함에는 특별한 관습 또는 약정이 없으면 경계로부터 반미터 이상의 거리를 두어야 한다."],"answer":[1],"image":null},{"id":"2024-35-민법-27","year":2024,"qnum":27,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"시효취득의 대상이 아닌 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["지상권","저당권","소유권","계속되고 표현된 지역권","동산질권"],"answer":[2],"image":null},{"id":"2024-35-민법-28","year":2024,"qnum":28,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"부합에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["부동산에 부합되어 동산의 소유권이 소멸한 때에는 그 동산을 목적으로 한 다른 권리도 소멸한다.","부합한 동산 간의 주종을 구별할 수 없는 때에는 특약이 없는 한 동산의 소유자는 부합 당시 가액의 비율로 합성물을 공유한다.","X토지 소유자의 승낙 없이 토지임차인의 승낙만 받아 제3자가 X에 수목을 심은 경우, 그 수목은 X에 부합하지 않으므로 제3자가 식재한 수목임을 알지 못하는 X의 양수인은 그 수목을 벌채할 수 없다.","타인의 권원에 기하여 부동산에 부합된 물건이 부동산의 구성부분이 된 경우, 부동산의 소유자는 방해배제청구권에 기하여 부합물의 철거를 청구할 수 없다.","건물의 증축부분이 축조 당시 독립한 권리의 객체성을 상실하여 본건물에 부합된 후 구조의 변경 등으로 독립한 권리의 객체성을 취득하게 된 때에는 본건물과 독립하여 거래의 대상이 될 수 있다."],"answer":[3],"image":null},{"id":"2024-35-민법-29","year":2024,"qnum":29,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"물권의 소멸에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["X토지에 甲이 1번 저당권, 乙이 2번 저당권을 취득하고, 丙이 X토지를 가압류한 후 乙이 X토지를 매수하여 소유권을 취득한 경우 乙의 저당권은 혼동으로 소멸하지 않는다.","유치권자가 유치권 성립 후에 이를 포기하는 의사표시를 한 경우에도 점유를 반환하여야 유치권은 소멸한다.","점유권과 소유권은 혼동으로 소멸하지 아니한다.","지역권은 20년간 행사하지 않으면 시효로 소멸한다.","후순위 저당권이 존재하는 주택을 대항력을 갖춘 임차인이 경매절차에서 매수한 경우, 임차권은 혼동으로 소멸한다."],"answer":[2],"image":null},{"id":"2024-35-민법-30","year":2024,"qnum":30,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"甲은 그 소유 X토지에 대한 배타적 사용ㆍ수익권을 포기하고 타인(사인, 국가 등 일반 공중)의 통행을 위한 용도로 제공하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲은 그 타인에 대하여 X의 인도청구를 할 수 없다.","甲이 X에 대한 소유권을 보유한 채 사용ㆍ수익권을 대세적ㆍ영구적으로 포기하는 것은 허용되지 않는다.","甲은 일반 공중의 통행을 방해하지 않는 범위에서 X를 처분할 수 있다.","甲의 상속인의 X에 대한 배타적 사용ㆍ수익권도 제한된다.","만약 甲이 X를 일반 공중의 통행목적이 아니라 지상건물의 소유자만을 위하여 배타적 사용ㆍ수익권을 포기한 경우, 특별한 사정이 없는 한 X의 매수인의 배타적 사용ㆍ수익권 행사는 제한된다."],"answer":[5],"image":null},{"id":"2024-35-민법-31","year":2024,"qnum":31,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"X토지를 3분의 1씩 공유하는 甲, 乙, 丙의 법률관계에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲이 乙과 丙의 동의 없이 X토지 중 3분의 1을 배타적으로 사용하는 경우, 乙은 방해배제를 청구할 수 없다.","甲과 乙이 협의하여 X토지를 매도하면 그 효력은 丙의 지분에도 미친다.","丁이 X토지의 점유를 무단으로 침해하고 있는 경우, 甲은 X토지 중 자신의 지분에 한하여 반환을 청구할 수 있다.","甲이 자신의 지분을 포기하더라도 乙과 丙이 이전등기를 하여야 甲의 지분을 취득한다.","丙이 1년 이상 X토지의 관리비용을 부담하지 않은 경우, 甲과 乙은 丙의 지분을 무상으로 취득할 수 있다."],"answer":[4],"image":null},{"id":"2024-35-민법-32","year":2024,"qnum":32,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"X토지를 3분의 1씩 공유하는 甲, 乙, 丙의 공유물분할에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲은 乙과 丙의 동의를 얻지 않고서 공유물의 분할을 청구할 수 있다.","甲, 乙, 丙이 3년간 공유물을 분할하지 않기로 합의한 것은 유효하다.","공유물분할의 소에서 법원은 X를 甲의 단독소유로 하고 乙과 丙에게 지분에 대한 합리적인 가액을 지급하도록 할 수 있다.","甲의 지분 위에 설정된 근저당권은 공유물분할이 되어도 특단의 합의가 없는 한 X 전부에 관하여 종전의 지분대로 존속한다.","甲, 乙, 丙사이에 공유물분할에 관한 협의가 성립하였으나 분할협의에 따른 지분이전등기에 협조하지 않으면 공유물분할의 소를 제기할 수 있다."],"answer":[5],"image":null},{"id":"2024-35-민법-33","year":2024,"qnum":33,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"지상권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["저당물의 담보가치를 유지하기 위해 설정된 지상권은 피담보채권이 소멸하면 함께 소멸한다.","기존 건물의 사용을 목적으로 설정된 지상권은 그 존속기간을 30년 미만으로 정할 수 있다.","수목의 소유를 목적으로 하는 지상권이 존속기간의 만료로 소멸한 경우, 특약이 없는 한 지상권자가 존속기간 중 심은 수목의 소유권은 지상권설정자에게 귀속된다.","양도가 금지된 지상권의 양수인은 양수한 지상권으로 지상권설정자에게 대항할 수 있다.","토지양수인이 지상권자의 지료 지급이 2년 이상 연체되었음을 이유로 지상권소멸청구를 하는 경우, 종전 토지소유자에 대한 연체기간의 합산을 주장할 수 없다."],"answer":[3],"image":null},{"id":"2024-35-민법-34","year":2024,"qnum":34,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"토지전세권에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 전세권의 존속기간이 만료하면 전세권의 용익물권적 권능은 전세권설정등기의 말소 없이도 당연히 소멸한다.\nㄴ. 전세금의 지급은 전세권의 성립요소가 되는 것이므로 기존의 채권으로 전세금 지급을 대신할 수 없다.\nㄷ. 전세권 존속기간이 시작되기 전에 마친 전세권설정등기도 특별한 사정이 없는 한 유효한 것으로 추정된다.\nㄹ. 당사자가 채권담보의 목적으로 전세권을 설정하였으나 설정과 동시에 목적물을 인도하지 않았다면, 장차 전세권자가 목적물을 사용ㆍ수익하기로 하였더라도 그 전세권은 무효이다.","stem_table":null,"options":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄹ","ㄷ, ㄹ"],"answer":[2],"image":null},{"id":"2024-35-민법-35","year":2024,"qnum":35,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"유치권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["피담보채권이 존재한다면 타인의 물건에 대한 점유가 불법행위로 인한 것인 때에도 유치권이 성립한다.","유치권자가 유치물 소유자의 승낙 없이 유치물을 임대한 경우, 특별한 사정이 없는 한 유치물의 소유자는 유치권의 소멸을 청구할 수 없다.","목적물에 대한 점유를 상실한 경우, 유치권자가 점유회수의 소를 제기하여 점유를 회복할 수 있다는 것만으로는 유치권이 인정되지 않는다.","채무자를 직접점유자로 하여 채권자가 간접점유를 하였더라도 채권자는 유효하게 유치권을 취득할 수 있다.","저당물의 제3취득자가 저당물의 개량을 위하여 유익비를 지출한 때에는 민법 제367조에 의한 비용상환청구권을 피담보채권으로 삼아 유치권을 행사할 수 있다."],"answer":[3],"image":null},{"id":"2024-35-민법-36","year":2024,"qnum":36,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"유치권이 유효하게 성립할 수 있는 경우는? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["주택수선공사를 한 수급인이 공사대금채권을 담보하기 위하여 주택을 점유한 경우","임대인이 지급하기로 약정한 권리금의 반환청구권을 담보하기 위하여 임차인이 상가건물을 점유한 경우","매도인이 매수인에 대한 매매대금채권을 담보하기 위하여 매매목적물을 점유한 경우","주택신축을 위하여 수급인에게 공급한 건축자재에 대한 대금채권을 담보하기 위하여 그 공급자가 주택을 점유한 경우","임차인이 임차보증금반환채권을 담보하기 위하여 임차목적물을 점유한 경우"],"answer":[1],"image":null},{"id":"2024-35-민법-37","year":2024,"qnum":37,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"질권에 관한 설명으로 옳지 않은 것은?","stem_table":null,"options":["질물보다 다른 재산이 먼저 경매된 경우, 질권자는 그 매각대금으로부터 배당을 받을 수 없다.","질권자가 채권 일부를 변제받았더라도 질물 전부에 대하여 그 권리를 행사할 수 있다.","질물이 멸실된 경우에도 그로 인하여 질권설정자가 받을 금전을 압류하면 질권의 효력이 그 금전에 미친다.","정당한 이유있는 때에는 질권자는 채무자 및 질권설정자에게 통지하고 감정자의 평가에 의하여 질물로 직접 변제에 충당할 것을 법원에 청구할 수 있다.","질권자는 그 권리의 범위 내에서 자기의 책임으로 질물을 전질할 수 있다."],"answer":[1],"image":null},{"id":"2024-35-민법-38","year":2024,"qnum":38,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"저당권의 효력이 미치는 범위에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["담보권 실행을 위하여 저당부동산을 압류한 경우, 저당부동산의 압류 이후 발생한 차임채권에는 저당권의 효력이 미친다.","주물 그 자체의 효용과는 직접 관계없지만 주물 소유자의 상용에 공여되고 있는 물건이 경매목적물로 평가되었다면 경매의 매수인이 소유권을 취득한다.","구분건물의 전유부분에 대한 저당권의 효력은 특별한 사정이 없는 한 대지사용권에도 미친다.","기존건물에 부합된 증축부분이 기존건물에 대한 경매절차에서 경매목적물로 평가되지 아니하였더라도 경매의 매수인이 증축부분의 소유권을 취득한다.","특약이 없는 한 건물에 대한 저당권의 효력은 건물의 소유를 목적으로 하는 지상권에도 미친다."],"answer":[2],"image":null},{"id":"2024-35-민법-39","year":2024,"qnum":39,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"법정지상권이 성립하는 경우를 모두 고른 것은? (특별한 사정은 없고, 다툼이 있으면 판례에 따름)\nㄱ. X토지에 저당권을 설정한 甲이 저당권자 乙의 동의를 얻어 Y건물을 신축하였으나 저당권 실행 경매에서 丙이 X토지의 소유권을 취득한 경우\nㄴ. 甲소유의 X토지와 그 지상건물에 공동저당권이 설정된 후 지상건물을 철거하고 Y건물을 신축하였고 저당권의 실행으로 X토지의 소유자가 달라진 경우\nㄷ. X토지를 소유하는 甲이 乙과 함께 그 지상에 Y건물을 신축ㆍ공유하던 중 X토지에 저당권을 설정하였고 저당권 실행 경매에서 丙이 X토지의 소유권을 취득한 경우","stem_table":null,"options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[2],"image":null},{"id":"2024-35-민법-40","year":2024,"qnum":40,"curr_lec_no":"민법","curr_lecture":"","professor":"35회","stem":"甲은 乙에 대한 3억 원의 채권을 담보하기 위하여 乙소유 X토지와 丙소유 Y토지에 대하여 각각 1번 공동저당권을 취득하였고, 丁은 X에 대하여 피담보채권액 2억 원의 2번 저당권을 취득하였다. 그 후, 甲이 Y에 대한 경매를 신청하여 매각대금 2억 원을 배당받은 후 X에 대한 경매를 신청하여 X가 3억 원에 매각된 경우, 丁이 X의 매각대금에서 배당받을 수 있는 금액은? (경매비용ㆍ이자 등은 고려하지 않으며, 다툼이 있으면 판례에 따름)","stem_table":null,"options":["0원","5천만 원","1억 원","1억 5천만 원","2억 원"],"answer":[1],"image":null},{"id":"2026-37-민법-1","year":2026,"qnum":1,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민법의 법원(法源)에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["법률은 관습법에 대하여 열후적ㆍ보충적 성격을 가진다.","민사에 관한 대통령의 헌법상 긴급명령은 민법의 법원이 될 수 있다.","법원(法院)은 당사자의 주장이 없으면 직권으로 관습법의 존재를 확정할 수 없다.","법률행위 해석의 표준인 사실인 관습은 법령으로서의 효력을 가지므로 민법의 법원이다.","관습법이 그 적용 시점에서 전체 법질서에 부합하지 않게 되었더라도 그 법적 규범으로서의 효력이 부정되지 않는다."],"answer":[2],"image":null},{"id":"2026-37-민법-2","year":2026,"qnum":2,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"부재자의 재산관리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["법원이 선임한 재산관리인은 관리할 재산목록을 작성하여야 한다.","법원은 그 선임한 재산관리인에 대해 부재자의 재산으로 상당한 보수를 지급할 수 있다.","재산관리인의 부재자 재산의 처분행위에 대한 법원의 허가는 과거의 처분행위를 추인하는 방법으로는 할 수 없다.","부재자의 생사가 분명하지 아니한 경우, 부재자가 정한 재산관리인이 권한을 넘은 행위를 할 때에는 법원의 허가를 받아야 한다.","법원이 선임한 재산관리인이 그 선임 취소 전에 한 권한 내의 행위는 부재자에 대한 실종선고기간 만료 후에 이루어진 경우에도 유효하다."],"answer":[3],"image":null},{"id":"2026-37-민법-3","year":2026,"qnum":3,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"성년후견에 관한 설명으로 옳지 않은 것은?","stem_table":null,"options":["가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있다.","검사 또는 지방자치단체의 장도 특정후견심판의 청구권자에 포함된다.","가정법원은 특정후견의 심판을 하는 경우, 특정후견의 기간 또는 사무의 범위를 정하여야 한다.","가정법원은 본인의 복리상 필요한 경우에는 본인의 의사에 반하여 특정후견개시의 심판을 할 수 있다.","가정법원이 피한정후견인에 대하여 성년후견개시의 심판을 할 때에는 종전의 한정후견의 종료심판을 한다."],"answer":[4],"image":null},{"id":"2026-37-민법-4","year":2026,"qnum":4,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"甲이 생전처분으로 광주에 소재하는 그 소유 X부동산을 출연하여 서울에 주된 사무소를 두는 민법상 재단법인(A)을 설립하고자 한다. 이에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n㉠ A는 X부동산의 소재지인 광주에서 설립등기를 함으로써 성립한다.\n㉡ 甲은 사원자격의 득실에 관한 사항을 정관에 기재하고 이를 등기하여야 한다.\n㉢ 甲이 이사임면의 방법을 정하지 않고 사망한 경우, 이해관계인 또는 검사의 청구에 의하여 법원이 이를 정한다.\n㉣ 甲은 A가 성립한 이후에는 착오에 의한 의사표시의 취소 요건을 갖추더라도 이를 이유로 그 출연행위를 취소할 수 없다.","stem_table":null,"options":["㉢","㉠, ㉡","㉢, ㉣","㉠, ㉡, ㉣","㉠, ㉡, ㉢, ㉣"],"answer":[1],"image":null},{"id":"2026-37-민법-5","year":2026,"qnum":5,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민법상 법인의 기관에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["감사는 법인의 대표기관으로서 그 성명과 주소는 등기사항이다.","법인과 이사의 이익이 상반하는 경우, 임시이사를 선임하여야 한다.","이사는 주무관청의 허가가 없으면 사임할 수 없다.","정관에 이사의 해임사유에 관한 규정이 있는 경우, 특별한 사정이 없는 한 법인은 정관에서 정하지 아니한 사유로 이사를 해임할 수 없다.","법인은 대표권이 없는 이사의 불법행위에 대해서도 민법 제35조의 법인의 불법행위책임을 진다."],"answer":[4],"image":null},{"id":"2026-37-민법-6","year":2026,"qnum":6,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민법상 법인의 정관에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["정관변경은 주무관청의 허가를 얻어야 효력이 있다.","재단법인의 기본재산을 새로이 편입하는 경우에는 정관변경을 필요로 한다.","재단법인의 정관은 그 변경방법을 정관에서 정한 때에는 변경할 수 있다.","사원의 지위를 양도할 수 있다는 사단법인의 정관규정은 원칙적으로 유효하다.","사원총회의 결의로 정관의 규범적 의미와 다른 해석이 표명된 경우, 그 해석은 법원을 구속한다."],"answer":[5],"image":null},{"id":"2026-37-민법-7","year":2026,"qnum":7,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"비법인사단 甲과 그 대표자 乙에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n㉠ 甲이 총유물에 관한 매매계약을 체결한 경우, 乙이 그 계약에 따라 발생한 채무에 대해 소멸시효 중단의 효력이 있는 승인을 하는 것은 총유물의 관리ㆍ처분행위이다.\n㉡ 乙이 정관에서 정한 대표권 제한을 위반하여 丙과 거래행위를 한 경우, 丙이 그 대표권 제한사실을 알았거나 알 수 있었을 경우가 아니라면 그 거래행위는 유효하다.\n㉢ 乙로부터 대표자로서의 모든 권한을 포괄적으로 위임받은 丁이 甲을 대표하여 한 대행행위의 효력은 원칙적으로 甲에게 미치지 않는다.","stem_table":null,"options":["㉠","㉢","㉠, ㉡","㉡, ㉢","㉠, ㉡, ㉢"],"answer":[4],"image":null},{"id":"2026-37-민법-8","year":2026,"qnum":8,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"물건에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["국립공원의 입장료는 민법상 과실이다.","물건의 용법에 의하여 수취하는 산출물은 법정과실이다.","부동산은 종물이 될 수 없다.","주물의 효용과 직접 관계가 없더라도 주물 소유자의 사용에 공여되는 물건은 종물이다.","'종물은 주물의 처분에 따른다'는 법리는 압류와 같은 공법상 처분에도 적용된다."],"answer":[5],"image":null},{"id":"2026-37-민법-9","year":2026,"qnum":9,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"불공정한 법률행위에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["경매에도 불공정한 법률행위에 관한 민법 제104조가 적용된다.","불공정한 법률행위에는 무효행위의 전환에 관한 법리가 적용될 수 있다.","불공정한 법률행위의 무효는 선의의 제3자에게 대항할 수 없다.","대리인에 의한 법률행위에서 경솔과 무경험은 본인을 기준으로 판단한다.","불공정한 법률행위로 무효인 법률행위는 추인하면 그때부터 유효로 된다."],"answer":[2],"image":null},{"id":"2026-37-민법-10","year":2026,"qnum":10,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"권리의 작용에 따른 분류에 의할 경우 지상물매수청구권의 법적 성질은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["형성권","지배권","청구권","항변권","인격권"],"answer":[1],"image":null},{"id":"2026-37-민법-11","year":2026,"qnum":11,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"통정허위표시에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n㉠ 민법 제108조 제2항의 통정한 허위의 의사표시의 무효로 대항할 수 없는 제3자는 선의이면 족하고 무과실일 필요는 없다.\n㉡ 가장소비대차의 계약상의 지위를 이전받은 자는 통정허위표시에 따라 형성된 법률관계를 기초로 하여 새로운 법률상 이해관계를 가지게 된 민법 제108조 제2항의 제3자에 해당하지 않는다.\n㉢ 임대차보증금반환채권이 양도된 후 양수인의 채권자가 임대차보증금반환채권에 대하여 압류명령을 받았는데 임대차보증금반환채권 양도계약이 허위표시로서 무효인 경우, 압류채권자는 그로 인해 외형상 형성된 법률관계를 기초로 실질적으로 새로운 법률상 이해관계를 맺은 제3자에 해당한다.","stem_table":null,"options":["㉠","㉢","㉠, ㉡","㉡, ㉢","㉠, ㉡, ㉢"],"answer":[5],"image":null},{"id":"2026-37-민법-12","year":2026,"qnum":12,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"착오에 의한 의사표시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["소송행위에는 착오에 의한 의사표시의 취소가 인정되지 않는다.","대리인에 의해 계약이 체결된 경우, 착오의 유무는 대리인을 기준으로 판단하여야 한다.","매도인이 매수인의 채무불이행을 이유로 매매계약을 적법하게 해제한 경우, 착오를 이유로 한 매수인의 취소권은 소멸한다.","착오로 인하여 표의자가 경제적 불이익을 입지 않는 경우에는 특별한 사정이 없는 한 중요부분의 착오라고 할 수 없다.","매매계약 내용의 중요부분에 착오가 있는 경우, 매수인은 매도인의 하자담보책임이 성립하는지와 상관없이 착오를 이유로 그 매매계약을 취소할 수 있다."],"answer":[3],"image":null},{"id":"2026-37-민법-13","year":2026,"qnum":13,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"사기에 의한 의사표시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["기망행위로 인한 동기의 착오의 경우, 표의자는 자신의 의사표시를 사기에 의한 의사표시로서 취소할 수 있다.","사기에 의한 의사표시의 취소의 효과로 생기는 부당이득반환청구권과 불법행위로 인한 손해배상청구권이 경합하여 병존하는 경우, 채권자는 양 청구권을 중첩적으로 행사할 수 있다.","매수인이 목적물의 시가를 묵비하여 매도인에게 고지하지 않았더라도, 원칙적으로 위법한 기망행위가 되지 않는다.","매수인이 매도인을 기망하여 부동산을 매수한 후 제3자에게 저당권을 설정해 준 경우, 특별한 사정이 없는 한 그 제3자는 매수인의 기망사실에 대하여 선의인 것으로 추정된다.","대리인의 기망행위로 계약을 체결한 상대방은 본인이 대리인의 기망행위에 대해 선의ㆍ무과실이더라도 계약을 취소할 수 있다."],"answer":[2],"image":null},{"id":"2026-37-민법-14","year":2026,"qnum":14,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민법상 임의대리에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["피한정후견인은 임의대리인이 될 수 없다.","대리권의 범위가 불분명한 경우, 대리인은 본인을 대리하여 본인의 채권에 대한 소멸시효 중단행위를 할 수 없다.","법무사가 등기권리자와 등기의무자 쌍방을 대리하여 등기를 신청하는 것은 쌍방대리 금지행위에 해당하지 않는다.","복임권 없는 대리인이 선임한 복대리인의 권한은 민법 제126조의 권한을 넘은 표현대리의 기본대리권이 될 수 없다.","대리인의 능력에 따라 사업의 성공 여부가 결정되는 사무에 관하여 대리권을 수여받은 자라고 하더라도 본인의 묵시적 승낙이 있으면 복대리인을 선임할 수 있다."],"answer":[3],"image":null},{"id":"2026-37-민법-15","year":2026,"qnum":15,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"甲으로부터 甲 소유의 X건물을 매도하는 대리권을 수여 받은 乙이 丙과 매매계약을 체결한 경우에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n㉠ 乙의 대리권은 특별한 사정이 없는 한 丙과의 계약을 해제할 권한을 포함한다.\n㉡ 甲이 乙에게 대리권을 수여한 후 甲에 대하여 성년후견이 개시되면 乙의 대리권은 소멸한다.\n㉢ 乙이 丙으로부터 잔금을 수령한 경우, 특별한 사정이 없는 한 乙이 잔금을 甲에게 전달하지 않았더라도 丙의 잔금지급채무는 소멸한다.\n㉣ 丙이 이행불능을 이유로 매매계약을 해제한 경우, 특별한 사정이 없는 한 丙은 乙에게 채무불이행에 기한 손해배상을 청구할 수 없다.","stem_table":null,"options":["㉠, ㉡","㉠, ㉢","㉢, ㉣","㉠, ㉡, ㉣","㉡, ㉢, ㉣"],"answer":[1],"image":null},{"id":"2026-37-민법-16","year":2026,"qnum":16,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"법률행위의 무효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["무효인 법률행위의 추인은 묵시적인 방법으로도 할 수 있다.","의사무능력으로 인한 무효행위의 추인은 그 무효원인이 소멸한 후에 하여야 효력이 있다.","무효인 법률행위에 따른 법률효과를 침해하는 것처럼 보이는 위법행위가 있는 경우, 그 법률효과의 침해에 따른 손해배상을 청구할 수 있다.","무권리자의 처분이 계약으로 이루어진 경우에 권리자가 이를 추인하면 원칙적으로 계약의 효과가 계약을 체결하였을 때에 소급하여 권리자에게 귀속한다.","토지거래허가구역 내 토지에 관하여 허가를 잠탈하는 내용으로 체결된 매매계약은 그 후 허가구역 지정이 해제되더라도 유효로 되지 않는다."],"answer":[3],"image":null},{"id":"2026-37-민법-17","year":2026,"qnum":17,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민법 제145조 소정의 '법정추인사유'에 해당하지 않는 경우는?","stem_table":null,"options":["취소권자의 상대방이 취소권자에게 이행을 청구한 경우","취소권자가 채무자로서 저당권을 설정한 경우","취소권자가 채권자로서 강제집행을 한 경우","취소권자가 취소할 수 있는 매매행위에 의해 취득한 소유권을 양도한 경우","취소권자인 채무자가 취소할 수 있는 행위에 의해 성립된 채무를 소멸시키고 그 대신 다른 채무를 성립시키는 계약을 체결한 경우"],"answer":[1],"image":null},{"id":"2026-37-민법-18","year":2026,"qnum":18,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"법률행위의 부관에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["정지조건부 법률행위는 조건이 성취되었을 때 비로소 법률행위가 성립한다.","조건이 선량한 풍속 기타 사회질서에 위반한 것이면 그 법률행위는 무효이다.","법률행위에 조건이 붙어 있는지의 여부는 조건의 존재를 주장하는 자에게 증명책임이 있다.","조건이 법률행위 당시에 이미 성취할 수 없는 것인 경우, 그 조건이 해제조건이면 그 법률행위는 조건 없는 법률행위가 된다.","당사자가 불확정한 사실이 발생한 때를 이행기로 정한 경우에는 그 사실의 발생이 불가능하게 된 때에도 이행기가 도래한 것으로 보아야 한다."],"answer":[1],"image":null},{"id":"2026-37-민법-19","year":2026,"qnum":19,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"소멸시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["세무사의 직무에 관한 채권은 10년의 소멸시효에 걸린다.","채무자가 시효완성 후 채무를 승인한 경우에는 시효완성 사실을 알고 그 이익을 포기한 것으로 보아야 한다.","판결에 의하여 확정된 채권은 단기의 소멸시효에 해당한 것이라도 그 소멸시효는 10년으로 한다.","부작위를 목적으로 하는 채권의 소멸시효는 위반행위를 한 때로부터 진행한다.","후순위 담보권자는 선순위 담보권의 피담보채권 소멸로 직접 이익을 받는 자에 해당하지 않으므로 선순위 담보권의 피담보채권에 관한 소멸시효가 완성되었다고 주장할 수 없다."],"answer":[2],"image":null},{"id":"2026-37-민법-20","year":2026,"qnum":20,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"소멸시효의 중단에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n㉠ 여러 차례의 최고가 있은 후, 재판상 청구가 있더라도 그 시효중단의 효력은 항상 최초의 최고를 한 때에 발생한다.\n㉡ 소멸시효의 중단사유로서의 승인은 소멸시효의 진행이 개시된 이후에만 가능하고, 현존하지 아니하는 장래의 채권을 미리 승인하는 것은 채무자가 그 권리의 존재를 인식하고서 한 것이라고 볼 수 없어 허용되지 않는다.\n㉢ 물상보증인이 그 피담보채무의 소멸을 이유로 제기한 저당권설정등기 말소등기절차 이행청구소송에서 채권자 겸 저당권자가 청구기각의 판결을 구하고 피담보채권의 존재를 주장하였다고 하더라도 피담보채권의 소멸시효에 관하여 규정한 민법 제168조 제1호 소정의 '청구'에 해당하지 아니한다.","stem_table":null,"options":["㉠","㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"answer":[4],"image":null},{"id":"2026-37-민법-21","year":2026,"qnum":21,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"물권의 객체에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["건물의 개수는 공부상 등록의 개수에 의한다.","특정 양식장 내의 뱀장어일지라도 성장을 계속하는 한, 그 뱀장어 전부에 대한 양도담보계약은 그 담보목적물이 특정되지 않아 성립하지 않는다.","권원 없이 타인의 토지에 심은 수목은 독립한 물권의 객체가 될 수 없다.","물권의 객체는 물건에 한정된다.","토지의 소유권은 지표에 관하여 그 효력을 미칠 뿐 토지의 상하에 미치지 않는다."],"answer":[3],"image":null},{"id":"2026-37-민법-22","year":2026,"qnum":22,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"물권적 청구권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["소유권을 상실한 전(前)소유자는 물권적 청구권을 행사할 수 없다.","토지소유자는 그 소유 토지 위에 무단으로 건축된 건물을 임차하여 점유하고 있는 자를 상대로 건물철거를 청구할 수 있다.","지상권을 설정한 토지소유자도 불법점유자에 대하여 물권적 청구권을 행사할 수 있다.","미등기건물을 매수한 사람은 소유권이전등기를 갖출 때까지 그 건물의 불법점유자에게 직접 자신의 소유권에 기하여 인도를 청구하지 못한다.","민법은 물권적 청구권을 실현시키기 위한 비용부담의 주체에 관하여 규정하고 있지 않다."],"answer":[2],"image":null},{"id":"2026-37-민법-23","year":2026,"qnum":23,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"소유권이전등기청구권을 보전하기 위한 가등기를 한 경우에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["가등기된 권리의 이전등기는 가등기에 대한 부기등기의 형식으로 할 수 있다.","무효인 가등기의 유용은 등기상 이해관계인이 없는 한 허용된다.","소유권이전등기청구권 보전을 위한 가등기가 있다고 하여, 소유권이전등기를 청구할 어떤 법률관계가 있다고 추정되지 않는다.","가등기권리자는 무효인 중복소유권보존등기의 명의인을 상대로 그 보존등기의 말소를 구할 수 있다.","가등기에 기하여 본등기가 경료되더라도 본등기에 의한 물권변동의 효력이 가등기한 때로 소급하지 않는다."],"answer":[4],"image":null},{"id":"2026-37-민법-24","year":2026,"qnum":24,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"등기를 마치지 않더라도 물권변동의 효력이 발생하는 경우가 아닌 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["법정대위에 의해 저당권이 이전하는 경우","공유자 사이에 공유토지분할에 관한 조정이 성립한 경우","법정저당권을 취득한 경우","재결수용에 의해 부동산 소유권을 취득한 경우","부동산의 공경매에서 매수인이 매각대금을 완납한 경우"],"answer":[2],"image":null},{"id":"2026-37-민법-25","year":2026,"qnum":25,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"선의취득에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["저당권은 선의취득의 대상이 되지 않는다.","민법 제249조가 규정하는 선의취득의 요건인 선의ㆍ무과실의 기준시점은 물권행위가 완성되는 때이다.","채무자 이외의 자의 소유에 속하는 동산이 경매절차에서 매각된 경우, 매수인이 선의ㆍ무과실로 매수대금을 완납하더라도 매수인은 그 동산의 소유권을 선의취득할 수 없다.","동산의 선의취득은 양도인이 무권리자라고 하는 점을 제외하고는 아무런 흠이 없는 거래행위이어야 성립한다.","점유개정의 방법으로 양도담보를 설정한 동산소유자가 다시 제3자와 양도담보설정계약을 맺고 그 동산을 점유개정으로 인도한 경우, 그 제3자는 양도담보권을 선의취득하지 못한다."],"answer":[3],"image":null},{"id":"2026-37-민법-26","year":2026,"qnum":26,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"자주점유에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["자주점유가 되기 위해서는 점유자가 그 점유의 권원이 있다고 믿어야 한다.","점유자가 스스로 매매 또는 증여와 같은 자주점유의 권원을 주장하였으나 이것이 인정되지 않으면 이로써 자주점유의 추정은 번복된다.","매매목적물이 아닌 다른 토지를 인도받아 매매목적물로 믿고 점유한 토지매수인의 점유는 타주점유이다.","국가나 지방자치단체는 지적공부의 관리주체이므로 부동산을 점유하더라도 자주점유한 것으로 추정되지 않는다.","타주점유자가 그 명의로 소유권이전등기를 경료한 것만으로는 그 점유를 시킨 자에 대하여 소유의 의사를 표시함으로써 자주점유로 전환되었다고 볼 수 없다."],"answer":[5],"image":null},{"id":"2026-37-민법-27","year":2026,"qnum":27,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"점유자와 회복자의 관계에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n㉠ 선의의 점유자는 비록 법률상 원인 없이 타인의 건물을 점유ㆍ사용하고 이로 말미암아 그에게 손해를 입혔다고 하더라도 그 점유ㆍ사용으로 인한 이득을 반환할 의무는 없다.\n㉡ 농지매매계약이 무효가 되어 그 농지의 선의의 매수인이 매도인에게 농지를 반환하는 경우, 매수인이 그 농지를 경작하여 수확을 하였다면 매수인은 그 농지에 투입한 통상필요비인 비료비용을 매도인에게 상환청구할 수 없다.\n㉢ 점유자가 점유물의 현상을 유지하기 위하여 지출한 금액에 대하여 법원은 회복자의 청구에 의하여 상당한 상환기간을 허여하여야 한다.","stem_table":null,"options":["㉠","㉡","㉠, ㉡","㉡, ㉢","㉠, ㉡, ㉢"],"answer":[3],"image":null},{"id":"2026-37-민법-28","year":2026,"qnum":28,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"상린관계에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["이웃 거주자는 생활방해가 수인한도를 초과하는 경우, 그 침해자에게 방해사유의 제거 내지 예방조치를 할 것을 청구할 수 있다.","토지소유자는 타인의 토지를 통과하지 아니하면 필요한 수도관 등을 시설할 수 없거나 과다한 비용을 요하는 경우, 그 타인의 동의없이 타인의 토지를 통과하여 이를 시설할 수 있다.","인지소유자는 자기의 비용으로 담의 재료를 통상보다 양호한 것으로 할 수 있다.","건물을 축조함에는 특별한 관습이 없으면 경계로부터 건물의 가장 돌출된 부분까지 반미터 이상의 거리를 두어야 한다.","인접지의 수목의 가지가 경계를 넘은 경우, 경계를 침범당한 사람은 수목의 소유자에 대한 가지제거 청구 없이 임의로 그 가지를 제거할 수 있다."],"answer":[5],"image":null},{"id":"2026-37-민법-29","year":2026,"qnum":29,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"등기부취득시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["등기부취득시효의 요건으로서의 소유자로 등기한 자라 함은 적법ㆍ유효한 등기를 마친 자일 필요는 없고 중복등기가 아닌 한 무효인 등기라도 무방하다.","등기부시효취득에 있어서 무과실은 점유취득에 관한 것이고 등기에 관한 것이 아니다.","시효완성자의 선의ㆍ무과실은 시효기간 내내 계속되어야 하는 것은 아니다.","부동산의 소유자로 등기된 기간과 점유기간이 때를 같이 하여 10년을 경과하여야만 시효취득이 인정된다.","부동산 매수인이 매도인의 부동산 처분권한을 조사했더라면 그 처분권한이 없음을 알 수 있었음에도 이를 조사하지 않은 경우, 매수인의 등기부취득시효는 완성되지 않는다."],"answer":[4],"image":null},{"id":"2026-37-민법-30","year":2026,"qnum":30,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"공유관계에서 각 공유지분권자가 단독으로 할 수 없는 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["소수지분권자의 공유물보존행위","소수지분권자의 지분비율에 따른 공유물 전부의 사용","공유물 전부를 배타적으로 점유하는 소수지분권자에 대한 다른 소수지분권자의 공유물인도청구","과반수지분권자의 공유물 일부의 배타적 사용","소수지분권자의 그 지분에 대한 저당권설정"],"answer":[3],"image":null},{"id":"2026-37-민법-31","year":2026,"qnum":31,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"甲은 그 소유의 X토지 위에 Y건물을 신축하여 소유하고자 하는 乙과 X토지에 관하여 지상권 설정계약을 체결하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["X토지의 일부에 관하여도 범위를 특정하여 등기하면 지상권은 성립할 수 있다.","乙은 지상권을 유보한 채 신축된 Y건물의 소유권만을 양도할 수 있다.","甲과 乙의 지상권설정계약에서 지료의 지급에 대한 약정이 없었더라도 지상권의 성립에는 영향이 없다.","지상권의 존속기간이 만료되지 않았더라도 신축된 Y건물이 멸실되면 지상권은 소멸한다.","지상권이 소멸한 경우, 甲이 상당한 가액을 제공하여 현존하는 Y건물의 매수를 청구한 때에는 乙은 정당한 이유 없이 이를 거절하지 못한다."],"answer":[4],"image":null},{"id":"2026-37-민법-32","year":2026,"qnum":32,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"관습상의 법정지상권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["건물로서의 요건을 갖추었더라도 미등기의 무허가건물에 관해서는 관습상의 법정지상권이 인정될 수 없다.","관습상의 법정지상권이 성립한 후, 건물소유자가 토지소유자와 건물의 소유를 목적으로 하는 임대차계약을 체결하더라도 그 관습상의 법정지상권을 포기한 것으로 볼 수 없다.","타인의 토지 위에 그 토지소유자의 승낙을 얻어 신축한 건물을 매수한 경우, 매수인은 관습상의 법정지상권을 취득한다.","공유토지 위에 신축한 건물을 단독 소유하던 토지공유자 1인이 자신의 토지지분만을 양도하여 건물과 토지의 소유자가 달라진 경우에는 관습상의 법정지상권이 성립하지 않는다.","대지소유자가 그 지상건물을 다른 사람과 공유하면서 그 단독소유의 대지만을 제3자에게 매도한 경우, 건물공유자를 위한 관습상의 법정지상권은 인정되지 않는다."],"answer":[4],"image":null},{"id":"2026-37-민법-33","year":2026,"qnum":33,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"지역권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["지역권은 요역지와 분리하여 양도하거나 다른 권리의 목적으로 할 수 있다.","승역지 소유자는 지역권의 행사를 방해하지 않는 범위 내에서 지역권자가 지역권의 행사를 위하여 승역지에 설치한 공작물을 사용할 수 있다.","요역지 소유자가 승역지 소유자와 승역지상에 도로를 개설하여 영구히 사용하기로 약정하였다면, 존속기간을 정하지 않았으므로 지역권 설정에 관한 합의가 있었다고 볼 수 없다.","요역지 소유자는 통로의 개설 없이 승역지를 통행한 사실만으로도 지역권을 시효취득할 수 있다.","지역권자는 승역지의 점유침탈이 있는 경우, 지역권에 기하여 승역지 반환청구권을 행사할 수 있다."],"answer":[2],"image":null},{"id":"2026-37-민법-34","year":2026,"qnum":34,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민사유치권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["동산유치권은 선의취득의 대상이 될 수 없다.","피담보채권이 변제기에 이르지 않았다는 사정은 유치권의 행사를 방해하지 않는다.","유치권에는 우선변제적 효력이 인정되지 않으므로 유치권자는 채권의 변제를 받기 위하여 유치물을 경매할 수 없다.","저당권의 실행으로 부동산에 경매개시결정의 기입등기가 이루어지기 전에 유치권을 취득한 사람은 경매절차의 매수인에게 유치권으로 대항할 수 없다.","채무자의 소유에 속하지 않는 물건에 대해서는 유치권이 성립할 수 없다."],"answer":[1],"image":null},{"id":"2026-37-민법-35","year":2026,"qnum":35,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"甲 소유의 X토지를 임차하여 그 위에 Y건물을 소유하고 있는 乙은 丙과 Y건물에 관한 전세권 설정계약을 체결하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["丙 명의의 전세권의 효력은 Y건물의 소유를 목적으로 한 X토지의 임차권에는 미치지 않는다.","Y건물의 일부가 丙에게 책임 있는 사유로 멸실된 경우, 乙은 丙의 전세권이 소멸된 후 전세금으로써 손해의 배상에 충당할 수 있다.","丙 명의의 전세권 설정과 동시에 Y건물이 丙에게 인도되지 않았더라도 장차 丙이 Y건물을 사용ㆍ수익하는 것을 완전히 배제하지 않았다면, 그와 같은 丙 명의의 전세권의 효력을 부인할 수 없다.","丙 명의의 전세권이 설정된 이후에 乙이 丁에게 Y건물의 소유권을 이전한 경우, 丁은 丙에 대하여 전세권 설정자의 지위에서 전세금 반환의무를 부담하게 된다.","丙 명의의 전세권이 Y건물의 일부에 설정된 경우, 丙은 전세권의 목적물이 아닌 나머지 부분에 대해서는 경매를 신청할 수 없다."],"answer":[1],"image":null},{"id":"2026-37-민법-36","year":2026,"qnum":36,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"다음 중 약정담보물권에 해당하는 것은?","stem_table":null,"options":["지상권","지역권","점유권","유치권","채권질권"],"answer":[5],"image":null},{"id":"2026-37-민법-37","year":2026,"qnum":37,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민사유치권에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n㉠ 채권과 물건 사이에 견련관계가 인정되는 경우에는 그 채무불이행으로 인한 손해배상채권과 물건 사이에도 견련관계가 인정될 수 있다.\n㉡ 정당한 이유가 있는 때에는 유치권자가 유치물로 직접 변제에 충당할 것을 법원에 청구할 수 있으며, 이 경우 유치권자는 미리 채무자에게 통지하지 않아도 된다.\n㉢ 점유를 침탈당한 유치권자가 점유회수의 소를 제기하여 승소판결을 받았더라도 점유를 회복하지 않으면 유치권이 부활하지 않는다.\n㉣ 유치권자의 선관주의의무 위반을 이유로 한 유치권소멸청구권은 특별한 사정이 없는 한 유치권자의 선관주의의무 위반이 있은 이후에 유치물의 소유권을 취득한 제3자도 이를 행사할 수 있다.","stem_table":null,"options":["㉠, ㉡","㉠, ㉢","㉠, ㉡, ㉢","㉠, ㉢, ㉣","㉡, ㉢, ㉣"],"answer":[4],"image":null},{"id":"2026-37-민법-38","year":2026,"qnum":38,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"乙이 甲으로부터 100만 원을 차용하면서 그가 착용하고 있던 X시계에 관하여 甲에게 질권을 설정한 경우에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["甲은 선량한 관리자의 주의로 X시계를 점유하여야 한다.","乙에게 X시계에 관한 처분권한이 없었다는 점에 관하여 甲이 선의ㆍ무과실이었다면, 甲은 질권을 선의취득할 수 있다.","甲은 乙에 대한 채권의 일부를 변제받았더라도 X시계 전부에 대하여 그 권리를 행사할 수 있다.","甲은 乙에 대한 채권의 변제를 받을 때까지 X시계를 유치할 수 있으나, 자기보다 우선권이 있는 채권자에게 대항하지 못한다.","甲은 乙에 대한 채권의 변제를 받기 위하여 X시계를 경매할 수 있고, 그 매각대금으로부터 일반채권자와 동일한 순위로 변제받는다."],"answer":[5],"image":null},{"id":"2026-37-민법-39","year":2026,"qnum":39,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"민법상 저당권의 객체가 될 수 있는 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["질권","지역권","지상권","성숙한 농작물","등기되지 않은 선박"],"answer":[3],"image":null},{"id":"2026-37-민법-40","year":2026,"qnum":40,"curr_lec_no":"민법","curr_lecture":"","professor":"37회","stem":"근저당권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","stem_table":null,"options":["후순위담보권자가 경매를 신청한 경우, 선순위 근저당권의 피담보채권은 매수인이 매각대금을 완납하여 그 근저당권이 소멸하는 때에 확정된다.","근저당권설정자가 적법하게 기본계약을 해지하면 근저당권의 피담보채권은 확정된다.","확정된 피담보채권액이 채권최고액을 초과하는 경우, 물상보증인은 채권최고액만을 변제하더라도 근저당권의 말소를 청구할 수 있다.","근저당권을 설정한 후 피담보채무가 확정되기 전에 당사자의 합의로 채무자를 변경하고자 하는 경우에는 후순위저당권자 등 이해관계인의 승낙을 받아야 한다.","후순위 근저당권자는 민법 제364조에서 규정하는 제3취득자에 해당하지 않으므로 선순위 근저당권의 피담보채무가 확정된 경우, 후순위 근저당권자는 그 확정된 피담보채무 전부를 변제하여야 비로소 선순위 근저당권의 말소를 청구할 수 있다."],"answer":[4],"image":null}];

const EXPLANATIONS = /*EXPL_START*/{"2020-31-민법-1":"①, ⑤ 관습법은 법령에 저촉되지 아니하는 한 법칙으로서의 효력이 있고, 사회구성원들이 관행의 법적 구속력에 대한 확신을 갖지 않게 되었거나 전체 법질서에 부합하지 않게 되면 효력이 부정된다(대판(전) 2005.7.21, 2002다1178). ② 헌법상의 기본권은 사법관계에 직접 적용될 수 있는 예외적인 것을 제외하고는 민법 제2조, 제103조, 제750조, 제751조 등의 해석기준이 되어 간접적으로 사법관계에 효력을 미친다(대판(전) 2020.8.27. 2016다248998). 따라서 직접 적용되지 않는 것이 원칙이다(틀림). ③ 법령과 같은 효력을 갖는 관습법은 당사자의 주장 입증을 기다림이 없이 법원이 직권으로 확정하여야 한다(대판 1983.6.14, 80다3231). ④ 우리나라가 가입한 국제조약은 일반적으로 민법이나 상법 또는 국제사법보다 우선적으로 적용된다(대판 2016.3.24. 2013다81514).","2020-31-민법-2":"① 제한능력자제도는 거래의 안전을 희생시키더라도 미성년자 개인의 이익을 보호하는 제도이다. ② 전 등기명의인이 미성년자이고 당해 부동산을 친권자에게 증여하는 행위가 이해상반행위라 하더라도 일단 친권자에게 이전등기가 경료된 이상 특별한 사정이 없는 한 적법한 절차를 거친 것으로 추정된다(대판 2002.2.5. 2001다72029). ③ 법정대리인이 미성년자 본인 이름으로 법률행위를 한 경우에도 그 효과가 미성년자에게 발생하므로 미성년임을 이유로 취소할 수 없다(대판 1962.9.20. 62다333). ④ 친권자가 그의 친구의 제3자에 대한 채무를 담보하기 위하여 미성년 자(子) 소유의 부동산에 담보를 설정하는 행위는 이해상반행위에 해당하지 않는다(대판 1996.11.22. 96다10270). ⑤ 대리인은 행위능력자임을 요하지 아니하므로(제117조) 미성년자도 법정대리인의 동의 없이 단독으로 유효하게 대리행위를 할 수 있다.","2020-31-민법-3":"①, ② 의사능력이란 자신의 행위의 의미나 결과를 정상적인 인식력과 예기력을 바탕으로 합리적으로 판단할 수 있는 정신적 능력으로, 특별한 법률적 의미나 효과가 부여된 경우 그에 대한 이해도 요하며 개별적·구체적으로 판단된다(대판 2006.9.22, 2006다29358). ③, ④ 민법은 태아의 권리능력에 관하여 개별주의(개별적 보호주의)를 취하여 손해배상청구권·상속 등 특별한 경우에 한하여 제한된 권리능력을 인정한다. 따라서 일반적 보호주의를 취한다는 ③은 틀림. 또 태아의 수증능력은 부정되며 태아인 동안 법정대리인이 없으므로 법정대리인에 의한 수증행위도 할 수 없다(대판 1982.2.9, 81다534). ⑤ 동시사망으로 추정되는 경우에도 대습상속이 인정된다(대판 2001.3.9. 99다13157).","2020-31-민법-4":"① 부재자 스스로 위임한 재산관리인에게 재산처분권까지 위임된 경우에는 재산을 처분함에 있어 법원의 허가를 요하지 않는다(대판 1973.7.24. 72다2136). 따라서 허가를 얻어야 한다는 ①은 틀림. ② 법원의 초과행위허가결정은 장래의 처분행위뿐만 아니라 기왕의 처분행위를 추인하는 행위로도 할 수 있다(대판 1982.9.14, 80다3063). ③ 부재자 본인에 대한 실종선고가 확정되면 재산관리인의 지위는 종료된다(대판 1987.3.24. 85다카1151). ④, ⑤ 법원이 선임한 재산관리인은 부재자의 사망을 확인했더라도 선임결정이 취소되지 않는 한 계속 권한을 행사할 수 있고, 그 처분행위에 기한 등기는 적법하게 경료된 것으로 추정된다(대판 1991.11.26. 91다11810).","2020-31-민법-5":"① 법인은 그 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다(제33조). ② 어느 사단법인과 다른 사단법인이 동일한 것인지 여부는 그 구성원인 사원이 동일한지 여부에 따라 결정됨이 원칙이다(대판 2008.9.25. 2006다37021). ③ 민법 제35조의 '법인의 대표자'에는 명칭이나 직위 여하, 대표자로 등기되었는지 여부를 불문하고 법인을 실질적으로 운영하면서 사실상 대표하여 사무를 집행하는 사람을 포함한다(대판 2011.4.28, 2008다15438). 따라서 법인등기를 기준으로 엄격하게 확정한다는 ③은 틀림. ④ 외형상 직무행위로 인정되면 대표자 개인의 사리를 도모한 것이거나 법령에 위반한 것이라도 직무행위에 해당한다(대판 1969.8.26, 68다2320). ⑤ 직무에 관한 행위가 아님을 피해자가 알았거나 중대한 과실로 알지 못한 경우에는 법인에게 손해배상책임을 물을 수 없다(대판 2004.3.26, 2003다34045).","2020-31-민법-6":"① 법인이 대표기관을 통하여 법률행위를 한 때에는 대리에 관한 규정이 준용되어(제59조 제2항) 그 효과 및 채무불이행으로 인한 손해배상책임도 법인에 귀속된다(대판 2019.5.30. 2017다53265). ② 교회가 아직 실체를 갖추지 못하여 법인 아닌 사단으로 성립하기 전에 설립주체인 개인이 취득한 권리의무는 바로 법인 아닌 사단에 귀속될 수 없다(대판 2008.2.28. 2007다37394). 따라서 ②는 틀림. ③ 비법인사단의 대표권 제한은 등기할 방법이 없어 거래상대방이 그 제한 사실을 알았거나 알 수 있었을 경우가 아니라면 그 거래행위는 유효하다(대판 2003.7.22, 2002다64780). ④ 법인과 이사의 관계는 위임자와 수임자의 법률관계와 같다(대판 1996.1.26. 95다40915). ⑤ 사단법인의 하부조직이라도 스스로 단체로서의 실체를 갖추고 독자적 활동을 하면 별개의 독립된 비법인사단으로 볼 수 있다(대판 2009.1.30. 2006다60908).","2020-31-민법-7":"ㄱ. (○) 타인의 생명보험에서 피보험자의 서면동의는 강행규정으로 이를 위반한 보험계약은 무효이다(대판 1994.12.9, 94다25025). ㄴ. (×) 임차인의 비용상환청구권 포기 약정은 임의규정인 민법 제626조에 관한 것으로 유효하다(제652조 참조). ㄷ. (×) 사단법인 사원의 지위는 양도·상속할 수 없다는 민법 제56조는 강행규정이 아니므로 정관으로 양도·상속을 인정할 수 있다(대판 1992.4.14, 91다26850). ㄹ. (○) 변호사 아닌 자와 소송당사자 사이의 소송물 일부 양도 약정은 강행법규인 변호사법 위반의 반사회적 법률행위로서 무효이다(대판 1990.5.11. 89다카10514). 따라서 무효인 것은 ㄱ, ㄹ.","2020-31-민법-8":"① 종물은 '주물 자체의 상용(경제적 효용)에 이바지하는' 물건을 말하며, 주물의 소유자나 이용자의 사용에 공여되더라도 주물 자체의 효용과 관계없는 물건은 종물이 아니다(대판 2007.12.13. 2007도7247). 따라서 '주물소유자의 상용에 공여된 물건'이라는 ①은 틀림. ② 종물은 자기 소유의 다른 물건이어야 하므로 다른 사람 소유의 물건은 종물이 될 수 없다(대판 2008.5.8. 2007다36933). ③ 종물과 주물의 관계에 관한 법리는 권리 상호간에도 적용된다(대판 2006.10.26, 2006다29020). ④ 저당권의 효력이 미치는 종물은 민법 제100조의 종물과 같은 의미이다(대결 2000.11.2. 2000마3530). ⑤ 토지의 개수는 지적공부상 토지의 필수를 표준으로 결정된다(대판 1990.12.7. 90다카25208).","2020-31-민법-9":"① 불공정한 법률행위로 무효인 경우에도 무효행위의 전환에 관한 민법 제138조가 적용될 수 있다(대판 2010.7.15. 2009다50308). ② 불공정한 법률행위는 무효행위의 추인에 의하여 유효로 될 수 없고 법정추인도 적용되지 않는다(대판 1994.6.24, 94다10900). ③ 불공정한 법률행위에 해당하는지는 법률행위 시를 기준으로 판단한다(대판(전) 2013.9.26, 2013다26746). ④ 불공정한 법률행위에 해당하지 않더라도 반사회질서행위(제103조)는 성립할 수 있다(대판 2001.2.9, 99다38613). ⑤ 증여와 같이 일방의 급부만 있는 무상행위에는 급부와 반대급부 사이의 불균형 문제가 발생하지 않으므로 불공정한 법률행위가 될 수 없다(대판 1993.7.16, 92다41528).","2020-31-민법-10":"① 본인 乙이 상대방 丙에게 추인하면 유동적 무효였던 매매계약은 확정적으로 유효가 된다. ② 본인이 무권대리인 甲에게 추인하더라도 상대방이 이를 알지 못하는 동안 선의의 상대방 丙은 철회할 수 있다(제132조, 대판 1981.4.14, 80다2314). ③ 무권대리인의 책임은 무권대리인이 제한능력자(미성년자)일 때에는 적용되지 않으며(제135조 제2항), 또한 그 선택권은 무권대리인이 아니라 상대방에게 있다. 따라서 '甲은 자신의 선택으로'라는 ③은 틀림. ④ 상대방은 대리권 없음을 알았더라도 본인에게 추인 여부의 확답을 최고할 수 있다(제131조). ⑤ 본인이 추인하면 계약은 소급하여 효력이 생기며, 무권대리인 甲은 미성년자임을 이유로 취소하지 못한다(제133조).","2020-31-민법-11":"① 계약체결에 관한 대리권을 수여받은 대리인이 수권된 법률행위를 하면 대리권의 원인된 법률관계는 종료하므로, 그 대리인이 체결한 계약의 해제 등 처분권까지 가진다고 볼 수 없다(대판 2008.6.12. 2008다11276). 따라서 ①은 틀림. ② 본인이 무권대리행위를 장시간 방치하였다고 하여 추인으로 볼 수 없다(대판 1990.3.27. 88다카181). ③ 매매계약의 체결과 이행에 관하여 포괄적 대리권을 수여받은 대리인은 매매대금 지급기일을 연기할 권한도 가진다(대판 1992.4.14, 91다43107). ④ 대리권을 추단할 수 있는 직함·명칭 등의 사용을 승낙·묵인한 경우 대리권 수여의 표시가 있은 것으로 볼 수 있다(제125조, 대판 1998.6.12. 97다53762). ⑤ 무권대리인의 책임은 무과실책임으로 제3자의 위법행위로 야기된 경우에도 부정되지 않는다(대판 2014.2.27. 2013다213038).","2020-31-민법-12":"① 매도인이 매수인의 채무불이행을 이유로 매매계약을 적법하게 해제한 후라도 매수인은 착오를 이유로 취소권을 행사할 수 있다(대판 1996.12.6. 95다24982). ② 보험회사의 설명의무 위반으로 중요사항을 이해하지 못한 채 착오에 빠져 계약을 체결한 경우 이를 이유로 취소할 수 있다(대판 2018.4.12. 2017다229536). ③ 쌍방이 甲 토지를 목적물로 삼았으나 계약서에 乙 토지로 표시한 경우, 의사 합치가 있은 甲 토지(Y토지)에 관하여 계약이 성립한다(오표시 무해)(대판 1993.10.26, 93다2629). ④ 법률에 관한 착오라도 법률행위 내용의 중요부분에 관한 것이면 취소할 수 있어 착오 규정이 적용된다(대판 1981.11.10. 80다2475). 따라서 '적용되지 않는다'는 ④는 틀림. ⑤ 취소의 의사표시는 착오를 이유로 법률행위의 효력을 처음부터 배제하려는 의사가 드러나면 족하다(대판 2005.5.27. 2004다43824).","2020-31-민법-13":"①, ② 상대방 있는 의사표시는 도달한 때에 효력이 생기고, 통지 발송 후 표의자가 사망하거나 제한능력자가 되어도 효력에 영향이 없다(제111조). ③ 의사표시의 도달이란 상대방이 통지의 내용을 알 수 있는 객관적 상태에 놓여졌다고 인정되는 것을 말하며, 현실적으로 수령하였거나 내용을 알았을 것까지는 필요로 하지 않는다(대판 2008.6.12. 2008다19973). 따라서 '현실적으로 수령하거나 내용을 안 때'라는 ③은 틀림. ④ 정당한 사유 없이 수령을 거절한 경우 상대방이 그 내용을 알 수 있는 객관적 상태에 놓인 때에 효력이 생긴다(대판 2008.6.12. 2008다19973). ⑤ 내용증명우편이나 등기우편은 상당기간 내에 도달한 것으로 추정된다(보통우편과 달리)(대판 2002.7.26, 2000다25002).","2020-31-민법-14":"① 제3자 乙의 사기이므로 甲은 상대방 丙이 그 사실을 알았거나 알 수 있었을 경우에 한하여 취소할 수 있다(제110조 제2항). 즉 丙이 기망사실을 몰랐고 모른 데 과실이 없으면 취소할 수 없으므로, '丙이 잘못없이 몰랐을 때에만 취소할 수 있다'는 ①은 (반대로 서술되어) 틀림. ② 제3자 사기를 이유로 취소하려면 표의자 甲이 상대방 丙의 악의 또는 과실을 증명하여야 한다. ③ 제3자의 사기행위 자체가 불법행위를 구성하므로 甲은 매매계약을 취소하지 않고도 乙에게 불법행위책임을 물을 수 있다(대판 1998.3.10. 97다55829). ④ 사기에 의한 의사표시에서 권리를 취득한 제3자 丁의 선의는 추정된다(대판 1970.11.24. 70다2155). ⑤ 제110조 제3항의 선의의 제3자는 과실 유무를 불문하므로, 丁이 선의이면 과실이 있더라도 취소에 대항할 수 있어 甲은 근저당권설정등기의 말소를 청구할 수 없다. 따라서 ⑤도 틀림. (복수정답 ①, ⑤)","2020-31-민법-15":"ㄱ. (○) 양도소득세 일부를 회피할 목적으로 매매대금을 낮게 기재한 것만으로는 반사회질서 법률행위로서 무효가 되지 않는다(대판 2007.6.14, 2007다3285). ㄴ. (○) 경매에는 불공정한 법률행위에 관한 민법 제104조, 제608조가 적용될 여지가 없으므로 경매목적물과 매각대금이 현저하게 공정을 잃어도 불공정한 법률행위에 해당하지 않는다(대결 1980.3.21. 80마77). ㄷ. (○) 도박자금 대여채권을 담보하기 위한 근저당권은 불법원인급여로 인한 이익이 종국적인 것이 아니므로 설정자는 무효인 근저당권설정등기의 말소를 구할 수 있다(대판 1995.8.11. 94다54108). 따라서 옳은 것은 ㄱ, ㄴ, ㄷ 모두.","2020-31-민법-16":"① 어느 법률행위에 어떤 조건이 붙어 있었는지는 사실인정의 문제로서 그 조건의 존재를 주장하는 자가 입증하여야 한다(대판 2006.11.24. 2006다35766). ② 정지조건부 법률행위에 해당한다는 사실은 법률효과의 발생을 다투려는 자에게 주장입증책임이 있고, 조건의 성취 사실은 조건 성취로 권리를 취득하는 자가 증명한다(대판 1993.9.28. 93다20832). ③ 조건이 법률행위 당시 이미 성취할 수 없는 불능조건인 경우, 정지조건이면 그 법률행위는 무효로 한다(제151조 제3항). ④ 조건의 성취로 불이익을 받을 당사자가 신의성실에 반하여 조건 성취를 방해한 때에는 상대방은 '그 조건이 성취한 것으로 주장'할 수 있다(제150조 제1항). 따라서 '처음부터 조건없는 법률행위로 본다'는 ④는 틀림. ⑤ 기한이익 상실의 특약은 특별한 사정이 없는 한 형성권적 기한이익 상실의 특약으로 추정한다(대판 2002.9.4. 2002다28340).","2020-31-민법-17":"ㄱ. (○) 형성권은 권리자의 일방적 의사표시에 의하여 법률관계의 변동을 일으키는 권리로, 상대방의 동의나 승낙이 필요 없다. ㄴ. (○) 형성권 행사의 의사표시에는 상대방의 지위를 불안하게 하므로 원칙적으로 조건을 붙일 수 없다. ㄷ. (×) 형성권은 상대방의 동의가 없는 한 그 일부만을 행사할 수 없고 전부를 행사하여야 한다. ㄹ. (○) 형성권은 제척기간의 적용을 받는다. 따라서 옳은 것은 ㄱ, ㄴ, ㄹ.","2020-31-민법-18":"① 부동산 매수인이 인도받아 사용·수익하다가 제3자에게 처분·인도한 경우에도 그 이전등기청구권의 소멸시효는 진행하지 않는다(대판 1999.3.18. 98다32175). ② 채무불이행으로 인한 손해배상청구권의 소멸시효는 '채무불이행시'로부터 진행한다(대판 2005.1.14. 2002다57119). 따라서 '손해배상을 청구한 때부터'라는 ②는 틀림. ③ 주채무의 시효소멸을 이유로 보증인은 보증채무의 소멸을 주장할 수 있다(대판 2012.7.12. 2010다51192). ④ 동시이행관계에 있는 매매대금채권도 그 지급기일 이후 시효의 진행에 걸린다(대판 1991.3.22. 90다9797). ⑤ 취득시효 완성 점유자가 점유를 상실하면 그때부터 10년간 등기청구권을 행사하지 않으면 소멸시효가 완성한다(대판 1996.3.8. 95다34866).","2020-31-민법-19":"① 소멸시효의 이익은 미리 포기하지 못한다(제184조 제1항). ② 금전채무와 같은 가분채무의 일부에 대해서도 시효이익의 포기는 가능하다(대판 2012.5.10. 2011다109500). 따라서 '채무 전부에 대하여 하여야 한다'는 ②는 틀림. ③ 시효완성 후 채무를 승인하여 시효이익을 포기한 경우 그때부터 새로이 소멸시효가 진행한다(대판 2009.7.9. 2009다14340). ④ 시효이익 포기의 의사표시가 상대방에게 도달한 경우에는 철회하지 못한다(대판 2008.11.27. 2006다18129). ⑤ 시효이익의 포기는 상대적 효과만 있으므로 채권자와 채무자의 관계에서만 효력이 생긴다.","2020-31-민법-20":"① 취득시효기간 중 등기명의자가 동일한 경우에는 전 점유자가 점유를 개시한 이후의 임의의 시점을 기산점으로 삼을 수 있다(대판 1998.5.12, 97다8496). 따라서 '반드시 점유를 개시한 때를 기산점으로'라는 ①은 틀림. ② 전 점유자의 점유를 아울러 주장하는 경우에는 그 점유의 개시 시기를 어느 점유자의 점유기간 중의 임의의 시점으로 선택할 수 '없다'(대판 1998.4.10. 97다56822). ③ 채무자에 대한 일반 채권자는 채무자를 대위하여 소멸시효를 주장할 수 있을 뿐 채권자의 지위에서 독자적·직접 원용할 수 없다(대판 1997.12.26. 97다22676). ④ 압류·가압류는 소멸시효의 중단사유이나, 종래의 점유상태의 계속을 파괴하는 것이 아니므로 취득시효의 중단사유가 될 수 없다(대판(전) 2009.7.16, 2007다15172). ⑤ 취득시효의 중단사유는 종래의 점유상태의 계속을 파괴하는 것으로 인정될 수 있는 사유이어야 한다(옳음).","2020-31-민법-21":"① 일물일권주의가 지배하므로 특별한 사정이 없는 한 물건의 일부는 물권의 객체가 될 수 없다. ② 권원 없이 타인의 토지에 심은 수목은 토지에 부합하여 토지소유자에게 귀속되므로 독립한 물권의 객체가 될 수 없다(대판 1980.9.30. 80도1874). ③ 종류·장소·수량지정 등의 방법으로 특정되면 증감 변동하는 집합동산도 하나의 물권의 객체가 될 수 있다(대판 1990.12.26. 88다카20224). ④ 소유권·점유권은 소멸시효의 대상이 아니나, 용익물권인 지상권·지역권 등은 소멸시효의 대상이 된다. 따라서 '소유권을 비롯한 물권은 소멸시효의 적용을 받지 않는다'는 ④는 틀림. ⑤ 소유권을 상실한 전소유자는 제3자인 불법점유자에 대하여 물권적 청구권에 의한 방해배제를 청구할 수 없다(대판(전) 1969.5.27. 68다725).","2020-31-민법-22":"① 물권적 청구권(물상청구권)은 소유권과 분리하여 양도할 수 없다(대판(전) 1969.5.27. 68다725). ② 가등기의 대상인 청구권은 물권 또는 부동산임차권의 변동을 목적으로 하는 청구권을 말하므로 물권적 청구권을 보전하기 위한 가등기는 인정되지 않는다(채권적 청구권 보전을 위한 가등기만 인정). 따라서 ②는 틀림. ③ 미등기건물 매수인은 소유권이전등기 전까지 자신의 소유권에 기하여 불법점유자에게 직접 인도를 청구하지 못한다. ④ 건물을 매수하여 점유하는 자는 등기명의가 없더라도 법률상·사실상 처분권한이 있으므로 토지소유자는 그에게 건물철거를 청구할 수 있다(대판 1986.12.23. 86다카1751). ⑤ 소유권에 기한 말소등기청구권은 물권적 청구권이므로 소멸시효의 대상이 아니다(대판 1991.11.26, 91다34387).","2020-31-민법-23":"① 소유권이전등기명의자는 제3자뿐만 아니라 그 전 소유자에 대하여도 적법한 등기원인에 의하여 소유권을 취득한 것이라는 등기의 추정력을 주장할 수 있다(대판 1982.6.22. 81다792). 따라서 '전소유자에 대하여는 그렇지 않다'는 ①은 틀림(보존등기와 달리). ② 원시취득자와 승계취득자의 합치된 의사에 따라 승계취득자 명의로 직접 소유권보존등기를 한 경우 실체관계에 부합하여 적법한 등기로서의 효력을 가진다(대판 1995.12.26. 94다44675). ③ 등기는 물권의 효력발생요건이고 존속요건은 아니므로 원인 없이 말소되어도 물권의 효력에는 변동이 없다(대판 1988.12.27. 87다카2431). ④ 대지에 관하여만 매수인 앞으로 이전등기가 경료된 경우 매도인에게 관습상 법정지상권은 인정되지 않는다(대판(전) 2002.6.20. 2002다9660). ⑤ 근저당권설정등기가 원인 없이 말소된 후 경매절차에서 경락대금이 완납되면 원인 없이 말소된 근저당권도 소멸한다(대판 1998.10.2. 98다27197).","2020-31-민법-24":"① 경정등기는 착오나 원시적으로 진실한 권리관계와 등기가 일부 어긋나는 경우 이를 바로잡는 등기이다(대판 1962.1.13, 4294민상445). ②, ③ 진정명의회복을 위한 소유권이전등기청구는 진정한 소유자가 현재의 등기명의인을 상대로 하는 것이므로, 진정한 소유자가 아닌 경우에는 청구할 수 없다(대판 1997.3.11. 96다47142). ④ 부동산 등기는 현실의 권리관계에 부합하는 한 권리취득의 경위·방법이 사실과 다르더라도 효력에 영향이 없으므로, 증여로 취득하였으나 등기원인을 매매로 기재하여도 그 등기는 유효하다(대판 1980.7.22. 80다791). 따라서 '무효등기'라는 ④는 틀림. ⑤ 어떤 이유이건 당사자가 자발적으로 말소등기를 한 경우에는 말소회복등기를 할 수 없다(대판 1990.6.26. 89다카5673).","2020-31-민법-25":"① 가등기된 소유권이전청구권은 양도될 수 있는 재산권이고 가등기로 공시되므로, 양도인과 양수인의 공동신청으로 가등기에 대한 부기등기의 형식으로 그 권리의 이전등기를 경료할 수 있다(대판 1998.11.19, 98다24105). ② 가등기가 경료되어 있다 하더라도 소유권이전등기를 청구할 어떤 법률관계가 있다고 추정되지 아니한다(대판 1979.5.22, 79다239). ③ 가등기는 순위보전의 효력만 있으므로 본등기 시 순위가 가등기한 때로 소급할 뿐 물권변동의 효력은 본등기한 때부터 발생한다(대판 1992.9.25, 92다21258). ④ 가등기에 기한 본등기를 마치면 중간처분인 丙의 저당권은 직권 말소되므로 乙은 丙에게 어떠한 책임도 없다(물상보증인의 지위 부정)(대판 1975.12.27. 74마100). ⑤ 가등기에 기한 본등기청구와 단순한 소유권이전등기청구는 서로 다른 청구이므로, 乙이 별도의 원인으로 소유권을 취득해도 가등기로 보전된 소유권이전청구권은 소멸하지 않는다(대판 1994.4.26., 92다34100). 따라서 옳은 것은 ⑤.","2020-31-민법-26":"① 선의취득의 대상은 소유권과 질권에 한하며 점유권·유치권은 선의취득할 수 없다. ② 점유개정의 방법으로는 선의취득이 인정되지 않으므로, 다시 제3자와 양도담보설정계약을 체결하고 점유개정으로 인도하여도 제3자는 양도담보권을 선의취득하지 못한다(대판 2005.2.18. 2004다37430). ③ 선의·무과실의 기준시점은 물권행위가 완성되는 때이므로, 인도가 물권적 합의보다 먼저 이루어지면 '물권적 합의가 이루어진 때'를 기준으로 한다(대판 1991.3.22, 91다70). 따라서 '인도를 기준으로 한다'는 ③은 틀림. ④ 선의취득은 원시취득이므로 선의취득자는 임의로 그 효과를 거부할 수 없다(대판 1998.6.12, 98다6800). ⑤ 선의취득이 인정되면 이익 보유의 법률상 원인이 되므로 선의취득자는 본래의 권리자에게 부당이득반환의무를 부담하지 않는다(대판 1998.6.12, 98다6800).","2020-31-민법-27":"① 선의의 점유자는 점유물의 과실을 취득한다(제201조 제1항). ② 천연과실 수취권자 판단을 위한 점유자의 선·악의는 원물로부터 분리할 때를 기준으로 한다(제102조). ③ 악의의 점유자는 수취한 과실을 반환하여야 하며 소비하였거나 과실로 훼손·수취하지 못한 경우 그 대가를 보상하여야 한다(제201조 제2항). ④ 타주점유자는 그의 책임 있는 사유로 점유물을 멸실·훼손한 때에는 선의라도 손해의 전부를 배상하여야 한다(제202조). ⑤ 점유자가 과실을 취득한 경우에는 통상의 필요비는 청구하지 못한다(제203조 제1항 단서). 따라서 '비용 전부를 청구할 수 있다'는 ⑤는 틀림.","2020-31-민법-28":"① 지상권자·전세권자·임차인·수치인·질권자 등 점유매개자의 점유는 타인이 소유자임을 전제하는 점유이므로 타주점유이다. 따라서 '자주점유'라는 ①은 틀림. ② 물건에 대한 점유는 사회관념상 사실상의 지배에 있다고 할 수 있는 객관적 관계로 성립한다(대판 2012.1.27. 2011다74949, 제192조). ③ 건물의 소유자는 현실로 점거하지 않더라도 그 건물의 소유를 위하여 부지를 점유한다고 보아야 한다(대판 1991.6.25. 91다10329). ④ 점유매개관계가 소멸하면 간접점유자는 직접점유자에게 점유물의 반환을 청구하여 점유권을 회복한다. ⑤ 점유자는 소유의 의사로 선의·평온·공연하게 점유한 것으로 추정한다(제197조 제1항).","2020-31-민법-29":"ㄱ. (×) 시효취득을 주장하며 소유권이전등기청구소송을 제기하여 입증까지 마친 후 소유자가 제3자에게 처분하여 이전등기의무가 이행불능에 빠지면 불법행위가 성립한다. 이미 甲이 乙에게 소유권이전등기를 청구한 후이므로 乙은 甲에게 불법행위책임을 진다(대판 1993.2.9. 92다47892). 따라서 ㄱ은 옳지 않음. ㄴ. (×) 취득시효 완성 전에 마친 가등기에 기하여 본등기를 한 경우, 본등기의 순위가 가등기한 때로 소급할 뿐 물권변동의 효력이 소급하지 않으나, 시효완성 후 소유권을 취득한 제3자 丙에 대하여 甲은 시효취득을 주장할 수 없다(대판 1992.9.25. 92다21258). 따라서 ㄴ은 옳지 않음. ㄷ. (○) 점유를 승계한 현 점유자는 전 점유자의 취득시효 완성의 효과를 주장하여 직접 자기에게 소유권이전등기를 청구할 권원이 없다(대판(전) 1995.3.8. 93다47745). 따라서 옳지 않은 것은 ㄱ, ㄴ.","2020-31-민법-30":"① 부동산 매수인이 매매계약의 이행으로 부동산을 인도받은 때에는 이를 점유·사용할 권리가 생기므로 그 점유·사용은 법률상 원인 없는 이득이 아니어서 매도인은 부당이득반환청구를 할 수 없다(대판 1996.6.25. 95다12682). 따라서 '청구할 수 있다'는 ①은 틀림. ② 지적공부에 일필의 토지로 등록되면 그 경계는 등록으로 확정된다(다만 기술적 착오가 있는 경우 실제 경계에 의함)(대판 1990.12.21, 88다카19712). ③ 토지가 포락되어 원상복구가 어려워 효용을 상실하면 그 소유권은 소멸하며 그 여부는 포락 당시를 기준으로 한다(대판 1992.4.10, 91다31562). ④ 신축집합건물의 각 전유부분 소유권이 누구에게 원시적으로 귀속되는지는 공동 건축주들의 약정에 따른다(대판 2005.11.25. 2004다36352). ⑤ 방해배제청구권의 '방해'는 현재에도 지속되고 있는 침해를 의미하며 이미 종결된 '손해'와 구별된다(대판 2003.3.28. 2003다5917).","2020-31-민법-31":"공유물분할청구는 건물을 구분소유하는 경우의 공용부분(제215조), 경계에 설치된 경계표·담·구거 등(제239조)에 대하여 법률상 분할이 금지된다(제268조 제3항). 따라서 명문으로 분할청구가 금지되는 경우는 ① 구분소유하는 건물의 공용부분이다. 나머지 ②~⑤는 첨부·매장물 발견·유실물 습득·무주물 선점에 따른 공유관계로 분할청구가 금지되지 않는다.","2020-31-민법-32":"① 타인이 권원에 의하여 부속한 물건이라도 분리하여 경제적 가치가 없는 경우에는 부동산 소유자의 소유에 귀속된다(민법 제256조 단서, 대판 2017.7.18. 2016다38290). ② 저당권의 효력은 저당부동산에 부합된 물건과 종물에 미친다(제358조). ③ 부합은 소유자를 달리하는 여러 물건이 결합하는 것이므로 동일인 소유의 여러 동산이 결합하는 것은 부합이 아니다. ④ 부합의 원인은 인공적인 경우도 포함하므로 인위적이든 자연적이든 불문한다(대판 2012.1.26. 2009다76546). ⑤ 타인의 동산에 가공한 때에는 그 물건의 소유권은 '원재료의 소유자'에게 속하고, 다만 가공으로 인한 가액의 증가가 원재료의 가액보다 현저히 다액인 때에 한하여 가공자의 소유로 한다(제259조). 따라서 무조건 '가공자의 소유로 한다'는 ⑤는 틀림.","2020-31-민법-33":"① 종중재산이 여러 사람에게 명의신탁된 경우 수탁인들 상호간에는 형식상 공유관계가 성립한다(대판 1992.9.8. 92다18184). ② 3자간 등기명의신탁의 경우 명의신탁약정이 무효이므로 명의신탁자는 수탁자에게 직접 소유권이전등기를 청구하지 못하고, 매도인을 대위하여 말소를 구할 수 있을 뿐이다(대판 2002.3.15, 2001다61654). ③ 채권담보 목적의 양도담보로서 채권자에게 소유권이전등기를 할 수 있다(가등기담보법상 청산절차 적용). ④ 부부간 명의신탁이 유효한 경우 배우자 일방의 사망으로 부부관계가 해소되어도 사망한 배우자의 다른 상속인과의 관계에서 여전히 유효하게 존속한다(대판 2013.1.24. 2011다99498). 따라서 '효력을 잃는다'는 ④는 틀림. ⑤ 명의신탁의 무효는 제3자에게 대항할 수 없으므로(부실법 제4조 제3항), 수탁자임을 알면서 매매계약을 체결하고 이에 기해 소유권이전등기를 받은 사람은 악의라도 소유권을 취득한다(대판 2000.3.28, 99다56529).","2020-31-민법-34":"ㄱ. (○) 건물 소유를 위한 법정지상권을 취득한 자로부터 경매로 건물 소유권을 이전받은 매수인은 건물 철거 매각조건 등 특별한 사정이 없는 한 위 지상권도 당연히 취득한다(대판 2014.12.24, 2012다73158). ㄴ. (×) 건물공유자의 1인이 토지를 단독 소유하면서 그 토지에만 저당권을 설정하였다가 경매로 소유자가 달라진 경우, 건물공유자들은 민법 제366조에 의하여 토지 전부에 관하여 법정지상권을 취득한다(대판 2011.1.13, 2010다67159). ㄷ. (×) 토지와 지상 건물에 공동저당권 설정 후 건물을 철거하고 신축한 경우, 신축건물에 토지와 동일순위의 공동저당권을 설정해 주는 등 특별한 사정이 없는 한 신축건물을 위한 법정지상권은 성립하지 않는다(대판(전) 2003.12.18, 98다43601). ㄹ. (×) 건물이 없는 토지에 저당권 설정 당시 근저당권자가 건물 건축에 동의하였더라도 공시할 수 없는 주관적 사항이므로 법정지상권은 성립하지 않는다(대판 2000.12.8. 2000다14934). 따라서 옳지 않은 것은 ㄴ, ㄷ, ㄹ.","2020-31-민법-35":"① 지역권은 승역지를 전면적으로 사용하는 지상권·전세권과 달리 점유를 요건으로 하지 않는 물권이다. ② 지역권은 요역지를 위한 종된 권리이므로 요역지와 분리하여 양도하거나 다른 권리의 목적으로 하지 못한다(제292조). ③ 통행지역권의 경우 지료는 그 요건이 아니다(대판 2015.3.20, 2012다17479). ④ 지역권 취득시효를 위해서는 요역지 소유자가 승역지상에 통로를 개설하여 항시 사용하는 객관적 상태가 계속되어야 한다(대판 1966.9.6, 65다2305, 제294조). 따라서 '통로를 개설할 필요가 없다'는 ④는 틀림. ⑤ 통행지역권을 시효취득한 경우에도 종전 사용이 무상이었다는 등 특별한 사정이 없다면 요역지 소유자는 승역지 소유자가 입은 손해를 보상하여야 한다(대판 2015.3.20, 2012다17479). 따라서 옳은 것은 ⑤.","2020-31-민법-36":"① 수급인의 재료와 노력으로 건축되어 독립한 건물에 해당하는 기성부분은 수급인의 소유이므로 수급인은 이에 대하여 유치권을 가질 수 없다(대판 1993.3.26. 91다14116). ② 점유물에 대한 유치권 주장을 배척하려면 점유가 불법행위로 개시되었거나 비용지출 당시 점유권원이 없음을 알았거나 중대한 과실로 알지 못하였음을 상대방이 주장·입증하여야 한다(대판 1966.6.7. 66다600). ③ 채무불이행에 의한 손해배상청구권은 원채권의 연장이므로, 물건과 원채권 사이에 견련관계가 있으면 그 손해배상채권과 물건 사이에도 견련관계가 있다(대판 1976.9.28. 76다582). 따라서 '견련관계가 인정되지 않는다'는 ③은 틀림. ④ 경매개시결정의 기입등기(압류) 전에 유치권을 취득한 사람은 경매절차의 매수인에게 유치권을 행사(대항)할 수 있다(대판 2009.1.15, 2008다70763). ⑤ 거래상 분할이 가능한 물건의 경우 그 일부를 목적으로 하는 유치권이 성립할 수 있다(대판 1968.3.5. 67다2786).","2020-31-민법-37":"① 목적물의 인도는 전세권의 성립요건이 아니다(대판 1995.2.10, 94다18508). ② 전세권이 존속하는 동안에는 전세권을 그대로 둔 채 전세금반환채권만을 분리하여 확정적으로 양도하는 것은 허용되지 않고, 다만 장래의 조건부 채권으로 양도할 수 있을 뿐이다(대판 2002.8.23, 2001다69122). 따라서 ②가 옳음. ③ 전세권이 성립한 후 목적물의 소유권이 이전되면 전세권은 신 소유자와의 사이에서 동일한 내용으로 존속하므로, 신 소유자가 권리·의무의 주체가 된다(대판 2006.5.11, 2006다6072). ④ 전세권을 목적으로 한 저당권이 설정된 경우에도 전세기간 만료로 전세권의 용익물권적 권능은 소멸하므로 저당권자는 더 이상 전세권 자체에 저당권을 실행할 수 없다(대판 2008.3.13, 2006다29372). ⑤ 전세권저당권이 설정된 경우에도 제3자의 압류 등이 없는 한 전세권설정자는 '전세권자'에 대하여만 전세금반환의무를 부담한다(대판 1999.9.17. 98다31301).","2020-31-민법-38":"① 질권은 불가분성이 있어 질권자는 채권 전부의 변제를 받을 때까지 질물 전부에 대하여 권리를 행사할 수 있다(제343조, 제321조). ② 저당권으로 담보한 채권을 질권의 목적으로 한 때에는 그 저당권등기에 질권의 부기등기를 하여야 그 효력이 저당권에 미친다(제348조). ③ 채권의 목적물이 금전인 때에는 질권자는 자기채권의 한도에서 직접 청구할 수 있다(제353조). ④ 채무변제기 전 유질계약은 금지되나(제339조), 변제기 후의 유질계약은 대물변제로서 유효하다. ⑤ 금전채권의 채무자가 담보를 제공한 경우 채권자는 채무를 모두 변제받은 다음 담보를 반환하면 될 뿐이고, 채무자의 변제의무와 채권자의 담보반환의무가 동시이행관계에 있다고 볼 수 없다(대판 2019.10.31. 2019다247651). 따라서 '동시이행관계에 있다'는 ⑤는 틀림.","2020-31-민법-39":"① 민법 제359조의 '과실'에는 천연과실뿐만 아니라 법정과실(차임채권 등)도 포함되므로, 저당부동산에 대한 압류가 있으면 압류 이후의 차임채권 등에도 저당권의 효력이 미친다(대판 2016.7.27. 2015다230020). ② 저당권과 함께 채권을 양수한 자는 저당권이전의 부기등기를 마치고 저당권실행 요건을 갖추면 채권양도의 대항요건을 갖추지 못하였더라도 경매를 신청할 수 있다(대판 2005.6.23. 2004다29279). ③ 후순위 근저당권자가 경매를 신청한 경우 선순위 근저당권의 피담보채권은 경락인이 경락대금을 완납한 때(근저당권 소멸 시)에 확정된다(대판 1999.9.21, 99다26085). ④ 저당권의 양도에 있어 물권적 합의는 양도인과 양수인 사이에 있으면 족하고, 채무자나 물상보증인(저당권설정자) 사이에까지 있어야 하는 것은 아니다(대판 2005.6.10. 2002다15412). 따라서 '저당권설정자 사이의 물권적 합의'가 필요하다는 ④는 틀림. ⑤ 공동저당관계의 등기는 공동저당권의 성립요건이나 대항요건이라고 할 수 없다(대판 2010.12.23. 2008다57746).","2020-31-민법-40":"① 근저당권이 설정된 후 소유권이 제3자에게 이전된 경우, 종전 소유자(근저당권설정자)도 근저당권설정계약의 당사자로서 피담보채무의 소멸을 이유로 근저당권설정등기의 말소를 청구할 계약상 권리가 있다(대판(전) 1994.1.25, 93다16338). 따라서 ①이 옳음. ② 민법 제360조의 지연배상 1년분 제한은 저당권자의 제3자에 대한 관계에서의 제한이며 채무자나 저당권설정자에게 대항할 수 있는 것이 아니므로, 채무자가 아니나 저당권을 설정한 사람은 1년분에 제한되지 않고 전부를 배상하여야 한다(대판 1992.5.12, 90다8855). ③ 근저당권의 채무자가 피담보채권의 일부를 변제하여도 채권 전액의 변제가 있을 때까지 근저당의 효력은 잔존채무에 미치므로 채권최고액이 축소되지 않는다(대판 2010.5.13. 2010다3681). ④ 저당권자의 물상대위권 행사는 늦어도 배당요구의 종기까지 하여야 하며 그 이후에는 우선변제권을 행사할 수 없다(대판 2003.3.28. 2002다13539). ⑤ 대체물채권을 담보하기 위하여 저당권을 설정한 경우 피담보채권액은 '저당권설정등기를 신청할 때의 시가'로 산정한 금액이 된다(부동산등기법 제77조).","2021-32-민법-1":"① 관습법이란 사회의 거듭된 관행으로 생성한 사회생활규범이 사회의 법적 확신과 인식에 의하 여 법적 규범으로 승인⋅강행되기에 이르른 것을 말하고, 그러한 관습법은 법원으로서 법령에 저촉되지 아니하는 한 법칙으로서의 효력이 있는 것이므로(대판(전) 2005.7.21. 2002다1178), 관 습법은 성문법에 대하여 보충적 효력을 갖는다. ② 종중이란 공동선조의 분묘수호와 제사 및 종원 상호 간의 친목 등을 목적으로 하여 구성되는 자연발생적인 종족집단이므로, 종중의 이러한 목적과 본질에 비추어 볼 때 공동선조와 성과 본 을 같이 하는 후손은 성별의 구별 없이 성년이 되면 당연히 그 구성원이 된다고 보는 것이 조 리에 합당하다(대판(전) 2005.7.21. 2002다1178). 따라서 공동선조와 성과 본을 같이 하더라도 미성년자인 후손은 종중의 구성원이 될 수 없다. ③ 사회의 거듭된 관행으로 생성된 사회생활규범이 관습법으로 승인되었다고 하더라도 사회 구성 원들이 그러한 관행의 법적 구속력에 대하여 확신을 갖지 않게 되었다거나, 사회를 지배하는 기본적 이념이나 사회질서의 변화로 인하여 그러한 관습법을 적용하여야 할 시점에 있어서의 전체 법질서에 부합하지 않게 되었다면 그러한 관습법은 법적 규범으로서의 효력이 부정될 수밖 에 없다(대판(전) 2005.7.21. 2002다1178). ④ 관습법이란 사회의 거된 관행으로 생성한 사회생활규범이 사회의 법적 확신과 인식에 의하여 법적 규범으로 승인⋅강행되기에 이른 것을 말하고, 사실인 관습은 사회의 관행에 의하여 발생 한 사회생활규범인 점에서 관습법과 같으나 사회의 법적 확신이나 인식에 의하여 법적 규범으 로서 승인된 정도에 이르지 않은 것을 말하는 바, 관습법은 바로 법원으로서 법령과 같은 효력 을 갖는 관습으로서 법령에 저촉되지 않는 한 법칙으로서의 효력이 있는 것이며, 이에 반하여 사실인 관습은 법령으로서의 효력이 없는 단순한 관행으로서 법률행위의 당사자의 의사를 보충함에 그치는 것이다(대판 1983.6.14. 80다3231). ⑤ 미등기 무허가건물의 양수인에게 소유권에 준하는 관습법상의 물권을 인정할 수 없다(대판 2006.10.7., 2006다49000). 비교 : 관습법상 물권 : 관습법상 법정지상권, 분묘기지권, 동산의 양도담보","2021-32-민법-2":"ㄱ. (○) : 사정변경을 이유로 보증계약을 해지할 수 있는 것은 포괄근보증이나 한정근보증과 같 이 채무액이 불확정적이고 계속적인 거래로 인한 채무에 대하여 보증한 경우에 한하고, 회사의 이사로 재직하면서 보증 당시 그 채무가 특정되어 있는 확정채무에 대하여 보증을 한 후 이사 직을 사임하였다 하더라도 사정변경을 이유로 보증계약을 해지할 수 없는 것이다(대판 2006.7.27. 2004다30675 등). ㄴ. (○) : 채무자의 소멸시효에 기한 항변권의 행사도 우리 민법의 대원칙인 신의성실의 원칙과 권리남용금지의 원칙의 지배를 받는 것이어서, 채무자가 시효완성 전에 채권자의 권리행사나 시효중단을 불가능 또는 현저히 곤란하게 하였거나, 그러한 조치가 불필요하다고 믿게 하는 행 동을 하였거나, 객관적으로 채권자가 권리를 행사할 수 없는 장애사유가 있었거나, 또는 일단 시효완성 후에 채무자가 시효를 원용하지 아니할 것 같은 태도를 보여 권리자로 하여금 그와 같이 신뢰하게 하였거나, 채권자보호의 필요성이 크고 같은 조건의 다른 채권자가 채무의 변제 를 수령하는 등의 사정이 있어 채무이행의 거절을 인정함이 현저히 부당하거나 불공평하게 되 는 등의 특별한 사정이 있는 경우에는 채무자가 소멸시효의 완성을 주장하는 것이 신의성실의 원칙에 반하여 권리남용으로서 허용될 수 없다(대판 2011.7.28. 2009다92784). ㄷ. (×) : 강행법규를 위반한 자가 스스로 그 약정의 무효를 주장하는 것이 신의칙에 위배되는 권리 의 행사라는 이유로 그 주장을 배척한다면, 이는 오히려 강행법규에 의하여 배제하려는 결과를 실현시키는 셈이 되어 입법 취지를 완전히 몰각하게 되므로 달리 특별한 사정이 없는 한 위와 같은 주장은 신의칙에 반하는 것이라고 할 수 없다(대판 2007.11.29. 2005다64552).","2021-32-민법-3":"①, ④ 제9조 제2항【성년후견개시의 심판】가정법원은 성년후견개시의 심판을 할 때 본인의 의사를 고려 하여야 한다. 제12조 제2항【한정후견개시의 심판】한정후견개시의 경우에 제9조 제2항을 준용한다. ※ 비교 : 제14조의2 제2항【특정후견의 심판】 특정후견은 본인의 의사에 반하여 할 수 없다. ② 피성년후견인이 행한 모든 재산법상의 법률행위는 취소할 수 있다(제10조 제1항). 그럼에도 가 정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있고(제10조 제2항), 또한 성년후견인의 청구에 의해 가정법원이 변경할 수 있다(제10조 제3항). 제10조【피성년후견인의 행위와 취소】 ① 피성년후견인의 법률행위는 취소할 수 있다. ② 제1항에도 불구하고 가정법원은 취소할 수 없는 피성년후견인의 법률행위의 범위를 정할 수 있다. ③ 가정법원은 본인, 배우자, 4촌 이내의 친족 성년후견인, 성년후견감독인, 검사 또는 지방자치단 체의 장의 청구에 의하여 제2항의 범위를 변경할 수 있다. ④ 제1항에도 불구하고 일용품의 구입 등 일상생활에 필요하고 그 대가가 과도하지 아니한 법률행위는 성년후견인이 취소할 수 없다. ③, ⑤ 피성년후견인이 행한 모든 재산법상의 법률행위는 성년후견인의 동의여부 불문하고 언제든 지 취소할 수 있다(제10조 제1항). 다만 일용품의 구입 등 일상생활에 필요하고 그 대가가 과도 하지 아니한 법률행위는 성년후견인이 취소할 수 없다(제10조 제4항).","2021-32-민법-4":"① 호적부(현 가족관계등록부)의 기재사항은 이를 번복할 만한 명백한 반증이 없는 한 진실에 부 합하는 것으로 추정되고, 특히 호적부의 사망기재는 쉽게 번복할 수 있게 해서는 안 되며, 그 기재 내용을 뒤집기 위해서는 사망신고 당시에 첨부된 서류들이 위조 또는 허위조작된 문서임이 증명되거 나 신고인이 공정증서원본부실기재죄로 처단되었거나 또는 사망으로 기재된 본인이 현재 생존해 있다 는 사실이 증명되고 있을 때, 또는 이에 준하는 사유가 있을 때 등에 한해서 호적상의 사망기재의 추 정력을 뒤집을 수 있을 뿐이고, 그러한 정도에 미치지 못한 경우에는 그 추정력을 깰 수 없다 할 것이 므로, 호적상 이미 사망한 것으로 기재되어 있는 자는 그 호적상 사망기재의 추정력을 뒤집을 수 있는 자료가 없는 한 그 생사가 불분명한 자라고 볼 수 없어 실종선고를 할 수 없다(대판 1997.11.27. 97스4). ② 민법 제28조는 ʻʻ실종선고를 받은 자는 민법 제27조 제1항 소정의 생사불명기간이 만료된 때에 사망한 것으로 본다ʼʼ고 규정하고 있으므로 실종선고가 취소되지 않는 한 반증을 들어 실종선 고의 효과를 다툴 수는 없다(대판 1995.2.17, 94다52751). ③ 제29조 제1항【실종선고의 취소】실종자의 생존한 사실 또는 전조의 규정과 상이한 때에 사망한 사실의 증명이 있으면 법원은 본인, 이해관계인 또는 검사의 청구에 의하여 실종선고를 취소하여야 한다. 그러나 실종선고 후 그 취소 전에 선의로 한 행위의 효력에 영향을 미치지 아니한다. ④ 실종선고를 할 때에는 공시최고가 반드시 필요하나, 실종선고 취소를 할 때에는 공시최고를 요 하지 아니한다(가사소송규칙 제53조 참조). ⑤ 실종선고의 효력이 발생하기 전에는 실종기간이 만료된 실종자라 하여도 소송상 당사자능력을 상실하는 것은 아니므로 실종선고 확정 전에는 실종기간이 만료된 실종자를 상대로 하여 제기 된 소도 적법하고 실종자를 당사자로 하여 선고된 판결도 유효하며 그 판결이 확정되면 기판력 도 발생한다고 할 것이고, 이처럼 판결이 유효하게 확정되어 기판력이 발생한 경우에는 그 판 결이 해제조건부로 선고되었다는 등의 특별한 사정이 없는 한 그 효력이 유지되어 당사자로서 는 그 판결이 재심이나 추완항소 등에 의하여 취소되지 않는 한 그 기판력에 반하는 주장을 할 수 없는 것이 원칙이라 할 것이며, 비록 실종자를 당사자로 한 판결이 확정된 후에 실종선고가 확정되어 그 사망간주의 시점이 소 제기 전으로 소급하는 경우에도 위 판결 자체가 소급하여 당사자능력이 없는 사망한 사람을 상대로 한 판결로서 무효가 된다고는 볼 수 없다(대판 1992.7.14. 92다2455).","2021-32-민법-5":"① 법인의 정관에 법인 대표권의 제한에 관한 규정이 있으나 그와 같은 취지가 등기되어 있지 않 다면 법인은 그와 같은 정관의 규정에 대하여 선의냐 악의냐에 관계없이 제3자에 대하여 대항할 수 없다(대판 1992.2.14. 91다24564). 제60조【이사의 대표권에 대한 제한의 대항요건】이사의 대표권에 대한 제한은 등기하지 아니하면 제3자에게 대항하지 못한다. ② 재단법인은 원칙적으로 정관변경이 인정되지 않으나, 예외적으로 정관변경이 인정되는 경우 제45조 제3항에서 사단법인의 정관변경 규정을 준용하고 있어, 법인의 정관은 모두 주무관청의 허가가 있어야 효력이 발생한다. 제45조【재단법인의 정관변경】 ① 재단법인의 정관은 그 변경방법을 정관에 정한 때에 한하여 변경할 수 있다. ③ 제42조 제2항의 규정은 전2항의 경우에 준용한다. 제42조【사단법인의 정관의 변경】 ① 사단법인의 정관은 총사원 3분의 2 이상의 동의가 있는 때에 한하여 이를 변경할 수 있다. 그러나 정수에 관하여 정관에 다른 규정이 있는 때에는 그 규정에 의한다. ② 정관의 변경은 주무관청의 허가를 얻지 아니하면 그 효력이 없다. ③ 민법상 재단법인의 기본재산에 관한 저당권 설정행위는 특별한 사정이 없는 한 정관의 기재사 항을 변경하여야 하는 경우에 해당하지 않으므로, 그에 관하여는 주무관청의 허가를 얻을 필요 가 없다(대결 2018.7.20. 2017마1565). ④ 재단법인의 기본재산에 관한 사항은 정관의 기재사항으로서 기본재산의 변경은 정관의 변경을 초래하기 때문에 주무장관의 허가를 받아야 하고, 따라서 기존의 기본재산을 처분하는 행위는 물론 새로이 기본재산으로 편입하는 행위도 주무장관의 허가가 있어야 유효하고, 또 일단 주무 장관의 허가를 얻어 기본재산에 편입하여 정관 기재사항의 일부가 된 경우에는 비록 그것이 명 의신탁관계에 있었던 것이라 하더라도 이것을 처분(반환)하는 것은 정관의 변경을 초래하는 점 에 있어서는 다를 바 없으므로 주무장관의 허가 없이 이를 이전등기할 수는 없다(대판 1991.5.28. 90다8558). ⑤ 법인이 소멸하는 것은 청산종결등기가 된 때가 아니고 청산사무가 사실상 종결된 때이다. 청산 종결의 등기가 종료한 후에도 청산사무가 종결되었다고 할 수 없는 경우에는 청산법인으로 계 속 존속한다(대판 1980.4.8. 79다2036).","2021-32-민법-6":"① 법인이 그 대표자의 불법행위로 인하여 손해배상의무를 지는 것은 그 대표자의 직무에 관한 행위로 인하여 손해가 발생한 것임을 요한다 할 것이나, 그 직무에 관한 것이라는 의미는 행위 의 외형상 법인의 대표자의 직무행위라고 인정할 수 있는 것이라면 설사 그것이 대표자 개인의 사리를 도모하기 위한 것이었거나 혹은 법령의 규정에 위배된 것이었다 하더라도 위의 직무에 관한 행위에 해당한다고 보아야 한다.(대판 1969.8.26. 68다2320). 즉 외형상 직무행위로 인정 되는 대표자의 권한 남용행위에 대해서도 법인의 불법행위책임이 인정될 수 있다. ② 민법 제35조에서 말하는 ʻ법인의 대표자ʼ에는 그 명칭이나 직위 여하, 또는 대표자로 등기되었 는지 여부를 불문하고 당해 법인을 실질적으로 운영하면서 법인을 사실상 대표하여 법인의 사무를 집행하는 사람을 포함한다고 해석함이 상당하다(대판 2011.4.28. 2008다15438). ③ 법인의 대표자의 행위가 직무에 관한 행위에 해당하지 아니함을 피해자 자신이 알았거나 또는 중대한 과실로 인하여 알지 못한 경우에는 법인에게 손해배상책임을 물을 수 없다(대판 2004.3.26. 2003다34045). ④ 민법 제35조에서 말하는 ʻ이사 기타 대표자ʼ는 법인의 대표기관을 의미하는 것이고 대표권이 없 는 이사는 법인의 기관이기는 하지만 대표기관은 아니기 때문에 그들의 행위로 인하여 법인의 불법 행위는 성립하지 않는다(대판 2005.12.23. 2003다30159). ⑤ 법인의 대표자가 그 직무에 관하여 타인에게 손해를 가함으로써 법인에 손해배상책임이 인정되 는 경우에, 대표자의 행위가 제3자에 대한 불법행위를 구성한다면 그 대표자도 제3자에 대하여 손해배상책임을 면하지 못하며(민법 제35조 제1항), 또한 사원도 위 대표자와 공동으로 불법행 위를 저질렀거나 이에 가담하였다고 볼 만한 사정이 있으면 제3자에 대하여 위 대표자와 연대 하여 손해배상책임을 진다(대결 2009.1.30. 2006마930). 이사 기타 대표자도 그 자신의 제750 조의 손해배상책임을 면하지 못하며, 법인과 경합하여 피해자에게 배상책임을 진다. 양자의 관 계는 부진정연대채무이다.","2021-32-민법-7":"① 비법인사단에 대하여는 사단법인에 관한 민법 규정 가운데서 법인격을 전제로 하는 것을 제외 하고는 이를 유추적용하여야 할 것인바, 민법 제62조의 규정에 비추어 보면 비법인사단의 대표 자는 정관 또는 총회의 결의로 금지하지 아니한 사항에 한하여 타인으로 하여금 특정한 행위를 대리하게 할 수 있을 뿐 비법인사단의 제반 업무처리를 포괄적으로 위임할 수는 없다 할 것이 므로, 비법인사단 대표자가 행한 타인에 대한 업무의 포괄적 위임과 그에 따른 포괄적 수임인 의 대행행위는 민법 제62조의 규정에 위반된 것이어서 비법인사단에 대하여는 그 효력이 미치 지 아니한다(대판 1996.9.6. 94다18522). ② 대표자를 선임하기 위하여 개최되는 종중총회의 소집권을 가지는 연고항존자를 확정함에 있어 서 여성을 제외할 아무런 이유가 없으므로, 여성을 포함한 전체 종원 중 항렬이 가장 높고 나 이가 가장 많은 사람이 연고항존자가 된다(대판 2010.12.9. 2009다26596). ③ 민법 제63조는 법인의 조직과 활동에 관한 것으로서 법인격을 전제로 하는 조항이 아니고, 법 인 아닌 사단이나 재단의 경우에도 이사가 없거나 결원이 생길 수 있으며, 통상의 절차에 따른 새로운 이사의 선임이 극히 곤란하고 종전 이사의 긴급처리권도 인정되지 아니하는 경우에는 사단이나 재단 또는 타인에게 손해가 생길 염려가 있을 수 있으므로, 민법 제63조는 법인 아닌 사단이나 재단에도 유추 적용할 수 있다(대판(전) 2009.11.19. 2008마699). ④ 우리 민법이 사단법인에 있어서 구성원의 탈퇴나 해산은 인정하지만 사단법인의 구성원들이 2 개의 법인으로 나뉘어 각각 독립한 법인으로 존속하면서 종전 사단법인에게 귀속되었던 재산을 소유하는 방식의 사단법인의 분열은 인정하지 아니한다. 그 법리는 법인 아닌 사단에 대하여도 동일하게 적용되며, 법인 아닌 사단의 구성원들의 집단적 탈퇴로써 사단이 2개로 분열되고 분 열되기 전 사단의 재산이 분열된 각 사단들의 구성원들에게 각각 총유적으로 귀속되는 결과를 초래하는 형태의 법인 아닌 사단의 분열은 허용되지 않는다. 교회가 법인 아닌 사단으로서 존 재하는 이상, 그 법률관계를 둘러싼 분쟁을 소송적인 방법으로 해결함에 있어서는 법인 아닌 사단에 관한 민법의 일반 이론에 따라 교회의 실체를 파악하고 교회의 재산 귀속에 대하여 판 단하여야 하고, 이에 따라 법인 아닌 사단의 재산관계와 그 재산에 대한 구성원의 권리 및 구 성원 탈퇴, 특히 집단적인 탈퇴의 효과 등에 관한 법리는 교회에 대하여도 동일하게 적용되어 야 한다(대판(전) 2006.4.20. 2004다37775). ⑤ 비법인사단인 피고 주택조합의 대표자가 조합총회의 결의를 거쳐야 하는 조합원 총유에 속하는 재산의 처분에 관하여는 조합원 총회의 결의를 거치지 아니하고는 이를 대리하여 결정할 권한이 없다 할 것이어서 피고 주택조합의 대표자가 행한 총유물인 이 사건 건물의 처분행위에 관하여 는 민법 제126조의 표현대리에 관한 규정이 준용될 여지가 없다 할 것이다(대판 2003.7.11. 2001다73626).","2021-32-민법-8":"① 어느 건물이 주된 건물의 종물이기 위하여는 주물의 상용에 이바지하는 관계에 있어야 하고 이는 주물 자체의 경제적 효용을 다하게 하는 것을 말하는 것이므로, 주물의 소유자나 이용자 의 사용에 공여되고 있더라도 주물 자체의 효용과 관계없는 물건은 종물이 아니다(대판 2007.12.13. 2007도7247). 제100조【주물, 종물】 ① 물건의 소유자가 그 물건의 상용에 공하기 위하여 자기소유인 다른 물건을 이에 부속하게 한 때에는 그 부속물은 종물이다. ② 종물은 주물의 처분에 따른다. ② ʻʻ입목ʼʼ이란 토지에 부착된 수목의 집단으로서 그 소유자가 이 법에 따라 소유권보존의 등기를 받은 것을 말하며(입목에 관한 법률 제2조 제1항 1호), 입목의 소유자는 토지와 분리하여 입목 을 양도하거나 저당권의 목적으로 할 수 있다(동법 제3조 제2항). 비교: 명인방법에 의한 경우는 저당권을 설정할 수 없다. ③ 민법 제100조 제2항의 종물과 주물의 관계에 관한 법리는 물건 상호간의 관계뿐 아니라 권리 상호간에도 적용된다(대판 2006.10.26. 2006다29020). ④ 토지의 개수는 지적법에 의한 지적공부상의 토지의 필수를 표준으로 하여 결정되는 것이므로 토지의 일부는 분필절차를 밟기 전에 그것을 양도할 수 없고 저당권을 설정할 수 없으나, 지상 권ㆍ전세권 등의 용익물권은 분필절차를 밟지 않아도 1필의 토지 일부 위에 설정될 수 있다. ⑤ 부동산의 종물은 주물의 처분에 따르고, 저당권은 그 목적 부동산의 종물에 대하여도 그 효력 이 미치기 때문에, 저당권의 실행으로 개시된 경매절차에서 부동산을 경락받은 자와 그 승계인 은 종물의 소유권을 취득하고, 그 저당권이 설정된 이후에 종물에 대하여 강제집행을 한 자는 위와 같은 경락인과 그 승계인에게 강제집행의 효력을 주장할 수 없다(대판 1993.8.13. 92다 43142).","2021-32-민법-9":"① 선량한 풍속 기타 사회질서는 부단히 변천하는 가치관념으로서 어느 법률행위가 이에 위반되어 민법 제103조에 의하여 무효인지 여부는 그 법률행위가 이루어진 때를 기준으로 판단하여야 하고, 또한 그 법률행위가 유효로 인정될 경우의 부작용, 거래자유의 보장 및 규제의 필요성, 사회적 비 난의 정도, 당사자 사이의 이익균형 등 제반 사정을 종합적으로 고려하여 사회통념에 따라 합리적 으로 판단하여야 한다(대판(전) 2015.7.23. 2015다200111). ② 강제집행을 면할 목적으로 부동산에 허위의 근저당권설정등기를 경료하는 행위는 민법 제103 조의 선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위로 볼 수 없다(대판 2004.5.28. 2003다70041). ③ 대리인이 부동산을 이중으로 매수한 경우, 그 매매계약이 반사회적 법률행위로서 무효인지 여부는 대리인을 기준으로 판단한다. 즉 대리인이 본인을 대리하여 매매계약을 체결함에 있어 서 매매대상 토지에 관한 저간의 사정을 잘 알고 그 배임행위에 가담하였다면, 대리행위의 하 자 유무는 대리인을 표준으로 판단하여야 하므로(제116조), 설사 본인이 미리 그러한 사정을 몰 랐거나 반사회성을 야기한 것이 아니라고 할지라도 그로 인하여 매매계약이 가지는 사회질서에 반한다는 장애사유가 부정되는 것은 아니다(대판 1998.2.27. 97다45532). ④ 법률행위의 성립과정에서 강박이라는 불법적 방법이 사용된데 불과한 때에는 강박에 의한 의 사표시의 하자나 의사의 흠결을 이유로 효력을 논의할 수는 있을지언정 반사회질서의 법률행위 로서 무효라고 할 수는 없다(대판 1992.11.27. 92다7719). ⑤ 반사회적 법률행위에 의한 무효는 절대적 무효이므로, 무효를 가지고 선의의 제3자에게도 대항 할 수 있다(대판 1996.10.25. 96다29151).","2021-32-민법-10":"①, ③, ④, ⑤ 원시취득은 타인의 권리에 기초하지 않고 원시적으로 취득하는 것을 말한다. 이에 따르면 종전 권리에 대한 제한은 소멸하게 된다. 이에 해당하는 것이 ④ 건물의 신축, ① 무주물 선점(제252조)에 의한 소유권 취득, 취득시효(제252조), 선의취득(제249조) ⑤ 공용징수에 의한 토지 소 유권 취득, ③ 환지처분에 의한 국가의 소유권 취득 등이 이에 해당한다. ② 승계취득은 타인의 권리에 기초로 하여 권리를 취득하는 것을 말한다. 즉, 종전 권리에 대한 제한은 존속하고, 전주의 권리 범위 내에서만 취득이 가능하며, 무권리자로부터 취득할 수 없 다. 여기에는 이전적 승계( 구권리자에 속하고 있었던 권리가 동일성을 유지하면서 신권리자에게 이전되는 것)와 설정적 승 계( 구권리자는 그대로 그의 권리를 보유하면서, 그 권리에 기초하여 제약된 새로운 권리를 발생하게 하여 이를 신권리자에게 취득하게 하는 것)가 있고, 이전적 승계는 다시 특정승계와 포괄승계로 나뉜다. 매매(제563조), 증여(제554조) 등의 경우 와 같은 특정승계와 달리 포괄승계는 하나의 취득원인에 의하여 다수의 권리가 일괄해서 취득 되는 것을 말한다. 상속(제997조), 포괄유증(제1078조), 회사의 합병(상법 제235조) 등이 이에 해당한다. ○","2021-32-민법-11":"① 실제로는 전세권설정계약이 없으면서도 임대차계약에 기한 임차보증금 반환채권을 담보할 목 적으로 임차인과 임대인 사이의 합의에 따라 임차인 명의로 전세권설정등기를 경료한 후 그 전 세권에 대하여 근저당권이 설정된 경우, 설령 위 전세권설정계약만 놓고 보아 그것이 통정허위 표시에 해당하여 무효라 하더라도 이로써 위 전세권설정계약에 의하여 형성된 법률관계를 토대 로 별개의 법률원인에 의하여 새로운 법률상 이해관계를 갖게 된 근저당권자에 대하여는 그와 같은 사정을 알고 있었던 경우에만 그 무효를 주장할 수 있다(대판 2008.3.13. 2006다29372). ② 채권양수인이 채권양도인으로부터 지명채권을 양도받았음을 이유로 채무자에 대하여 그 채권 을 행사하기 위하여는 지명채권 양도에 관한 합의 이외에 양도받은 당해 채권에 관하여 민법 제450조 소정의 대항요건을 갖추어야 하는 것이고, 이러한 법리는 채권양도인과 채무자 사이의 법률행위가 허위표시인 경우에도 마찬가지로 적용된다(대판 2011.4.28. 2010다100315). 따라서 채권양도인과 채무자사이의 소비대차가 가장행위에 해당하고, 가장소비대차에 기한 대여금채권 을 양수한 자는 가장행위에 기초하여 새로운 이해관계를 맺은 제3자에 해당한다. ③ 채권자와 채무자가 통모하여 허위의 의사표시로써 저당권설정 행위를 하고 채권자가 그 저당 권을 실행하여 경매절차가 적법히 진행된 결과 제3자가 경락으로 소유권을 취득하고 그 이전등 기를 종료한 경우에 선의의 제3자에게는 그 허위표시를 주장하여 대항할 수 없다(대판 1957.3.23. 4289민상580). ④ 민법 제108조 제2항에서 말하는 제3자는 허위표시의 당사자와 그의 포괄승계인 이외의 자 모 두를 가리키는 것이 아니고 그 가운데서 허위표시행위를 기초로 하여 새로운 이해관계를 맺은 자를 한정해서 가리키는 것으로 새겨야 할 것이므로 이 사건 퇴직금 채무자인 피고는 원채권자 인 소외(갑)이 소외(을)에게 퇴직금채권을 양도했다고 하더라도 그 퇴직금을 양수인에게 지급하 지 않고 있는 동안에 위 양도계약이 허위표시란 것이 밝혀진 이상 위 허위표시의 선의의 제3자 임을 내세워 진정한 퇴직금전부채권자인 원고에게 그 지급을 거절할 수 없다(대판 1983.1.18. 82다594). ⑤ 파산자가 상대방과 통정한 허위의 의사표시를 통하여 가장채권을 보유하고 있다가 파산이 선 고된 경우 그 가장채권도 일단 파산재단에 속하게 되고, 파산선고에 따라 파산자와는 독립한 지위에서 파산채권자 전체의 공동의 이익을 위하여 직무를 행하게 된 파산관재인은 그 허위표 시에 따라 외형상 형성된 법률관계를 토대로 실질적으로 새로운 법률상 이해관계를 가지게 된 민법 제108조 제2항의 제3자에 해당한다(대판 2003.6.24. 2002다48214).","2021-32-민법-12":"① 토지매매에 있어서 특단의 사정이 없는 한 매수인에게 측량 또는 지적도와의 대조 등 방법으 로 매매목적물이 지적도상의 그것과 정확히 일치하는지의 여부를 미리 확인하여야 할 주의의무 가 있다고 볼 수 없으므로, 현장답사에서 매도인이 매매목적물이라고 제시하는 토지의 점유평 수가 매매계약상 매매목적물의 평수와 비슷하고 그 토지의 지적일부가 하천부지에 편입되어 있 음을 의심할만한 특별한 사정이 없었다면 매수인이 토지매매당시 매매목적물을 측량하지 아니 하거나 또는 현장답사에서 지적도와의 대조를 소홀히 하여 하천부지로 편입된 사실을 미리 발 견하지 못하였다고 하여도 여기에 매수인의 과실이 있다고 할 수 없을 것이다(대판 1985.11.12. 84다카2344). ② 상대방이 표의자의 진의에 동의한 경우에는 당사자의 일치하는 의사대로 효력이 생기므로 착 오의 문제는 발생하지 않는다. 그러므로 표의자는 착오를 이유로 의사표시를 취소할 수 없다. ③ 동기의 착오가 상대방에 의해 유발된 경우 동기가 표시되지 않더라도 의사표시의 취소 사유인 착오에 해당할 수 있다(대판 1990.7.10. 90다카7460). 따라서 상대방에 의해 유발된 동기의 착 오는 동기가 표시되지 않았더라도 내용상 착오가 되어 중요부분의 착오가 될 수 있다. ④ 민법 제109조 제1항 단서는 의사표시의 착오가 표의자의 중대한 과실로 인한 때에는 그 의사표 시를 취소하지 못한다고 규정하고 있는데, 위 단서 규정은 표의자의 상대방의 이익을 보호하기 위한 것이므로, 상대방이 표의자의 착오를 알고 이를 이용한 경우에는 착오가 표의자의 중대 한 과실로 인한 것이라고 하더라도 표의자는 의사표시를 취소할 수 있다(대판 2014.11.27. 2013다49794). ⑤ 사기에 의한 의사표시란 타인의 기망행위로 말미암아 착오에 빠지게 된 결과 어떠한 의사표시 를 하게 되는 경우이므로 거기에는 의사와 표시의 불일치가 있을 수 없고, 단지 의사의 형성과 정 즉 의사표시의 동기에 착오가 있는 것에 불과하며, 이 점에서 고유한 의미의 착오에 의한 의사표시와 구분되는데, 신원보증서류에 서명날인한다는 착각에 빠진 상태로 연대보증의 서면 에 서명날인한 경우, 결국 위와 같은 행위는 강학상 기명날인의 착오(또는 서명의 착오), 즉 어 떤 사람이 자신의 의사와 다른 법률효과를 발생시키는 내용의 서면에, 그것을 읽지 않거나 올 바르게 이해하지 못한 채 기명날인을 하는 이른바 표시상의 착오에 해당하므로, 비록 위와 같 은 착오가 제3자의 기망행위에 의하여 일어난 것이라 하더라도 그에 관하여는 사기에 의한 의 사표시에 관한 법리, 특히 상대방이 그러한 제3자의 기망행위 사실을 알았거나 알 수 있었을 경우가 아닌 한 의사표시자가 취소권을 행사할 수 없다는 민법 제110조 제2항의 규정을 적용할 것이 아니라, 착오에 의한 의사표시에 관한 법리만을 적용하여 취소권 행사의 가부를 가려야 한다. (대판 2005.5.27. 2004다43824).","2021-32-민법-13":"① 일반적으로 교환계약을 체결하려는 당사자는 서로 자기가 소유하는 교환 목적물은 고가로 평 가하고 상대방이 소유하는 목적물은 염가로 평가하여 보다 유리한 조건으로 교환계약을 체결하 기를 희망하는 이해상반의 지위에 있고, 각자가 자신의 지식과 경험을 이용하여 최대한으로 자 신의 이익을 도모할 것이 예상되기 때문에, 당사자 일방이 알고 있는 정보를 상대방에게 사실 대로 고지하여야 할 신의칙상의 주의의무가 인정된다고 볼 만한 특별한 사정이 없는 한, 어느 일방이 교환 목적물의 시가나 그 가액 결정의 기초가 되는 사항에 관하여 상대방에게 설명 내 지 고지를 할 주의의무를 부담한다고 할 수 없고, 일방 당사자가 자기가 소유하는 목적물의 시 가를 묵비하여 상대방에게 고지하지 아니하거나 혹은 허위로 시가보다 높은 가액을 시가라고 고 지하였다 하더라도 이는 상대방의 의사결정에 불법적인 간섭을 한 것이라고 볼 수 없다(대판 2002.9.4. 2000다54406⋅54413). ② 강박에 의한 법률행위가 하자 있는 의사표시로서 취소되는 것에 그치지 않고 나아가 무효로 되기 위하여는, 강박의 정도가 단순한 불법적 해악의 고지로 상대방으로 하여금 공포를 느끼도 록 하는 정도가 아니고, 의사표시자로 하여금 의사결정을 스스로 할 수 있는 여지를 완전히 박탈한 상태에서 의사표시가 이루어져 단지 법률행위의 외형만이 만들어진 것에 불과한 정도 이어야 한다(대판 2003.5.13, 2002다73708⋅73715). ③ 국토이용관리법(현행 국토의 계획 및 이용에 관한 법률)상 규제구역 내에 속하는 토지거래에 관하여 관할 도지사로부터 거래허가를 받지 아니한 거래계약은 처음부터 위 허가를 배제하거나 잠탈하는 내용의 계약이 아닌 한 허가를 받기까지는 유동적 무효의 상태에 있고 거래 당사자는 거래허가를 받기 위하여 서로 협력할 의무가 있으나, 그 토지거래가 계약 당사자의 표시와 불 일치한 의사(비진의표시, 허위표시 또는 착오) 또는 사기, 강박과 같은 하자 있는 의사에 의하 여 이루어진 경우에는, 이들 사유에 의하여 그 거래의 무효 또는 취소를 주장할 수 있는 당사 자는 그러한 거래허가를 신청하기 전 단계에서 이러한 사유를 주장하여 거래허가신청 협력에 대한 거절의사를 일방적으로 명백히 함으로써 그 계약을 확정적으로 무효화시키고 자신의 거래 허가절차에 협력할 의무를 면할 수 있다(대판 1997.11.14. 97다36118). ④ 상대방 있는 의사표시에 관하여 제3자가 사기나 강박을 한 경우에는 상대방이 그 사실을 알았 거나 알 수 있었을 경우에 한하여 그 의사표시를 취소할 수 있으나, 상대방의 대리인 등 상대 방과 동일시할 수 있는 자의 사기나 강박은 제3자의 사기·강박에 해당하지 아니한다(대판 1999.2.23. 98다60828, 60835). 따라서 대리인의 기망행위로 계약을 체결한 상대방은 제110조 제1항이 적용되어 본인이 대리인의 기망행위에 대해 선의ㆍ무과실인지 여부와 상관없이 계약을 취소할 수 있다. ⑤ 일반적으로 부정행위에 대한 고소, 고발은 그것이 부정한 이익을 목적으로 하는 것이 아닌 때 에는 정당한 권리행사가 되어 위법하다고 할 수 없으나, 부정한 이익의 취득을 목적으로 하는 경우에는 위법한 강박행위가 되는 경우가 있고 목적이 정당하다 하더라도 행위나 수단 등이 부 당한 때에는 위법성이 있는 경우가 있을 수 있다(대판 1992.12.24. 92다25120).","2021-32-민법-14":"① 채권양도의 통지와 같은 준법률행위의 도달은 의사표시와 마찬가지로 사회관념상 채무자가 통 지의 내용을 알 수 있는 객관적 상태에 놓여졌을 때를 지칭하고, 그 통지를 채무자가 현실적으 로 수령하였거나 그 통지의 내용을 알았을 것까지는 필요하지 않다(대판 1983.8.23. 82다카 439). 즉, 도달주의의 원칙은 채권양도의 통지와 같은 준법률행위에도 유추적용될 수 있다. ② 도달주의가 원칙이므로 의사표시가 도달되지 않거나 연착이 되면 그로 인한 불이익은 표의가 가 부담한다. ③ 의사표시자가 그 통지를 발송한 후 제한능력자가 되어도 의사표시의 효력에 영향이 없으므로 (제111조 제2항), 후에 의사표시가 도달하는 한 효력이 발생하여 그 의사표시는 취소할 수 없 다. 제111조【의사표시의 효력발생시기】 ② 의사표시자가 그 통지를 발송한 후 사망하거나 제한능력자가 되어도 의사표시의 효력에 영향을 미치지 아니한다. ④ 수령능력이란 타인의 의사표시의 내용을 이해할 수 있는 능력으로서 행위능력보다는 낮은 수 준이어도 될 것이나 민법은 제한능력자를 보호하기 위하여 모든 제한능력자를 의사표시의 수령 무능력자라고 규정하여 제한능력자를 보호하고 있다(제112조). 제112조【제한능력자에 대한 의사표시의 효력】의사표시의 상대방이 의사표시를 받은 때에 제한능력자인 경우에는 의사표시자는 그 의사표시로써 대항할 수 없다. 다만, 그 상대방의 법정대리인이 의사표시가 도달한 사실을 안 후에는 그러하지 아니하다. ⑤ 상대방이 정당한 사유 없이 통지의 수령을 거절한 경우에는 상대방이 그 통지의 내용
